name: Test

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - id: list
        name: List checks
        run: |
          checks=$(nix eval .#checks.x86_64-linux --apply 'cs: builtins.toJSON (builtins.attrNames cs)' --raw)
          echo "tests=$checks" >> "$GITHUB_OUTPUT"

  build-braid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      braid_out: ${{ steps.build.outputs.braid_out }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main
      - id: build
        name: Build braid and export closure
        run: |
          # Build braid once and export its closure as an artifact so each matrix
          # job can import it directly, without relying only on cache availability.
          out=$(nix build .#packages.x86_64-linux.braid --no-link --print-out-paths -L)
          echo "braid_out=$out" >> "$GITHUB_OUTPUT"
          nix-store --export $(nix-store --query --requisites "$out") | zstd -T0 -19 > braid-closure.nar.zst
      - name: Upload braid closure artifact
        uses: actions/upload-artifact@v4
        with:
          name: braid-closure
          path: braid-closure.nar.zst
          if-no-files-found: error

  test:
    needs: [discover, build-braid]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Keep fan-out moderate: 20-way parallelism hit cache API rate limits (HTTP 418/ResourceExhausted),
      # which disabled the cache and forced large source rebuilds.
      max-parallel: 10
      matrix:
        test: ${{ fromJson(needs.discover.outputs.tests) }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Download prebuilt braid closure
        uses: actions/download-artifact@v4
        with:
          name: braid-closure

      - name: Import prebuilt braid closure
        run: |
          zstd -dc braid-closure.nar.zst | nix-store --import
          nix path-info "${{ needs.build-braid.outputs.braid_out }}"

      - name: Run test (${{ matrix.test }})
        run: nix build .#checks.x86_64-linux.${{ matrix.test }} -L
