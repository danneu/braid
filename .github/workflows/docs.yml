name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'flake.nix'
      - 'flake.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Check docs
        run: nix develop .#docs -c just check-docs

      - name: Check source frontmatter
        run: nix develop .#docs -c just check-docs-frontmatter

      - name: Build
        run: nix develop .#docs -c mdbook build docs

      - name: Check rendered frontmatter
        run: nix develop .#docs -c just check-docs-rendered-frontmatter

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/book/html

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: docs/book/html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book/html
      - id: deployment
        uses: actions/deploy-pages@v4
