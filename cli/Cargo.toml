[package]
name = "braid-cli"
version = "0.0.2"
edition = "2024"
license = "MIT"
publish = false # Cargo-level guard: a direct `cargo publish` refuses outright, independent of cargo-release

[[bin]]
name = "braid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
nom = "8"
nix = { version = "0.31.3", features = ["fs", "user", "term", "signal", "ioctl"] }
serde_json = "1"
ratatui = "0.30"
shell-words = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "local-offset"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
zeroize = "1"

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true
