[package]
name = "braid-cli"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "braid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
nom = "8"
serde_json = "1"
ratatui = "0.30"
rpassword = "5"
shell-words = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "local-offset"] }
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
insta = { version = "1", features = ["redactions"] }
pretty_assertions = "1"
tempfile = "3"
