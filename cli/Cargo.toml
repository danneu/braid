[package]
name = "braid-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "braid"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
crossterm = "0.28"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
nom = "7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
signal-hook = "0.3"
shell-words = "1"
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
insta = "1"
pretty_assertions = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros"] }
