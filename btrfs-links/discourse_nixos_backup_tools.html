xos/modules/system/btrbk.nix\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003edramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix\\u003c/a\\u003e\\u003c/h4\\u003e\\n\\n\\n      \\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-nix\\\&quot;\\u003e{ config, pkgs, lib, ... }:\\n\\n{\\n  environment.systemPackages = [ pkgs.btrbk ];\\n\\n  systemd.services.btrbk = {\\n    description = \\\&quot;btrbk backup\\\&quot;;\\n    serviceConfig = {\\n      Type = \\\&quot;oneshot\\\&quot;;\\n      ExecStart = \\\&quot;${pkgs.btrbk}/bin/btrbk run\\\&quot;;\\n    };\\n  };\\n\\n  systemd.timers.btrbk = {\\n    description = \\\&quot;btrbk backup periodic\\\&quot;;\\n    wantedBy = [ \\\&quot;multi-user.target\\\&quot; ];\\n    timerConfig = {\\n      OnUnitInactiveSec = \\\&quot;15min\\\&quot;;\\n      OnBootSec = \\\&quot;15min\\\&quot;;\\n    };\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\n\\n\\n  This file has been truncated. \\u003ca href=\\\&quot;https://github.com/dramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003eshow original\\u003c/a\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eThe configuration is written to \\u003ccode\\u003e/etc\\u003c/code\\u003e so that command \\u003ccode\\u003ebtrbk\\u003c/code\\u003e also finds it.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:9,\&quot;updated_at\&quot;:\&quot;2021-02-03T07:58:35.592Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:21,\&quot;reads\&quot;:142,\&quot;readers_count\&quot;:141,\&quot;score\&quot;:178.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:11364,\&quot;topic_slug\&quot;:\&quot;btrfs-backup-tools-in-nixos\&quot;,\&quot;display_username\&quot;:\&quot;dramforever\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/dramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;config/btrbk.nix at 163c7a092027c6bdda050ffae91f12afef50d72c · dramforever/config · GitHub\&quot;,\&quot;clicks\&quot;:98}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:643,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:\&quot;Github link was replaced with a permanent link\&quot;,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-backup-tools-in-nixos/11364/2\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:40229,\&quot;name\&quot;:\&quot;Symphorien\&quot;,\&quot;username\&quot;:\&quot;symphorien\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/symphorien/{size}/546_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-02-03T08:21:56.863Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI have a module for btrbk, including ssh archiving. I have been using it for long but never took the time to upstream it.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-nix\\\&quot;\\u003e{ config, pkgs, lib, ... }:\\nlet\\n  cfg = config.services.btrbk;\\n  sshEnabled = cfg.sshAccess != [];\\n  serviceEnabled = cfg.instances != {};\\n  attr2Lines = attr: let\\n    pairs = lib.attrsets.mapAttrsToList (name: value: { inherit name value; }) attr;\\n    isSubsection = value: if builtins.isAttrs value then true else if builtins.isString value then false else\\n      throw \\\&quot;invalid type in btrbk config ${builtins.typeOf value}\\\&quot;;\\n    sortedPairs = lib.lists.partition (x: isSubsection x.value) pairs;\\n  in\\n    lib.flatten (\\n      # non subsections go first\\n      (\\n        map (pair: [ \\\&quot;${pair.name} ${pair.value}\\\&quot; ]) sortedPairs.wrong\\n      )\\n      ++ # subsections go last\\n      (\\n        map (\\n          pair:\\n            lib.mapAttrsToList (\\n              childname: value:\\n                [ \\\&quot;${pair.name} ${childname}\\\&quot; ] ++ (map (x: \\\&quot; \\\&quot; + x) (attr2Lines value))\\n            ) pair.value\\n        ) sortedPairs.right\\n      )\\n    )\\n  ;\\n  addDefaults = settings: { backend = \\\&quot;btrfs-progs-sudo\\\&quot;; } // settings;\\n  mkConfigFile = settings: lib.concatStringsSep \\\&quot;\\\\n\\\&quot; (attr2Lines (addDefaults settings));\\n  configTest = name: settings: let\\n    configFile = pkgs.writeText \\\&quot;btrbk-${name}.conf\\\&quot; (mkConfigFile settings);\\n  in\\n    pkgs.runCommand \\\&quot;btrbk-${name}-config-test\\\&quot; {} &#39;&#39;\\n      mkdir foo\\n      if (set +o pipefail; ${pkgs.btrbk}/bin/btrbk -c ${configFile} ls foo 2\\u0026gt;\\u0026amp;1 | grep ${configFile});\\n      then\\n      echo btrbk configuration is invalid\\n      cat ${configFile}\\n      exit 1\\n      fi;\\n      touch $out\\n    &#39;&#39;;\\nin\\n{\\n  options = {\\n    services.btrbk = {\\n      extraPackages = lib.mkOption {\\n        description = \\\&quot;Extra packages for btrbk, like compression utilities for \\u0026lt;literal\\u0026gt;stream_compress\\u0026lt;/literal\\u0026gt;\\\&quot;;\\n        type = lib.types.listOf lib.types.package;\\n        default = [];\\n        example = lib.literalExample \\\&quot;[ pkgs.xz ]\\\&quot;;\\n      };\\n      niceness = lib.mkOption {\\n        description = \\\&quot;Niceness for local instances of btrbk. Also applies to remote ones connecting via ssh when positive.\\\&quot;;\\n        type = lib.types.ints.between (-20) 19;\\n        default = 10;\\n      };\\n      ioSchedulingClass = lib.mkOption {\\n        description = \\\&quot;IO scheduling class for btrbk (see ionice(1) for a quick description). Applies to local instances, and remote ones connecting by ssh if set to idle.\\\&quot;;\\n        type = lib.types.enum [ \\\&quot;idle\\\&quot; \\\&quot;best-effort\\\&quot; \\\&quot;realtime\\\&quot; ];\\n        default = \\\&quot;idle\\\&quot;;\\n      };\\n      instances = lib.mkOption {\\n        description = \\\&quot;Set of btrbk instances. The instance named \\u0026lt;literal\\u0026gt;btrbk\\u0026lt;/literal\\u0026gt; is the default one.\\\&quot;;\\n        type = with lib.types;\\n          attrsOf (\\n            submodule {\\n              options = {\\n                onCalendar = lib.mkOption {\\n                  type = lib.types.str;\\n                  default = \\\&quot;daily\\\&quot;; # every 3 minutes\\n                  description = \\\&quot;How often this btrbk instance is started. See systemd.time(7) for more information about the format.\\\&quot;;\\n                };\\n                settings = lib.mkOption {\\n                  type = let t = lib.types.attrsOf (lib.types.either lib.types.str t); in t;\\n                  default = {};\\n                  example = {\\n                    snapshot_preserve_min = \\\&quot;2d\\\&quot;;\\n                    snapshot_preserve = \\\&quot;14d\\\&quot;;\\n                    volume = {\\n                      \\\&quot;/mnt/btr_pool\\\&quot; = {\\n                        target = \\\&quot;/mnt/btr_backup/mylaptop\\\&quot;;\\n                        subvolume = {\\n                          \\\&quot;rootfs\\\&quot; = {};\\n                          \\\&quot;home\\\&quot; = { snapshot_create = \\\&quot;always\\\&quot;; };\\n                        };\\n                      };\\n                    };\\n                  };\\n                  description = \\\&quot;configuration options for btrbk. Nested attrsets translate to subsections.\\\&quot;;\\n                };\\n              };\\n            }\\n          );\\n        default = {};\\n      };\\n      sshAccess = lib.mkOption {\\n        type = with lib.types; listOf (\\n          submodule {\\n            options = {\\n              key = lib.mkOption {\\n                type = str;\\n                description = \\\&quot;SSH public key allowed to login as user \\u0026lt;literal\\u0026gt;btrbk\\u0026lt;/literal\\u0026gt; to run remote backups.\\\&quot;;\\n              };\\n              roles = lib.mkOption {\\n                type = listOf (enum [ \\\&quot;info\\\&quot; \\\&quot;source\\\&quot; \\\&quot;target\\\&quot; \\\&quot;delete\\\&quot; \\\&quot;snapshot\\\&quot; \\\&quot;send\\\&quot; \\\&quot;receive\\\&quot; ]);\\n                example = [ \\\&quot;source\\\&quot; \\\&quot;info\\\&quot; \\\&quot;send\\\&quot; ];\\n                description = \\\&quot;What actions can be performed with this SSH key. See ssh_filter_btrbk(1) for details\\\&quot;;\\n              };\\n            };\\n          }\\n        );\\n        default = [];\\n      };\\n    };\\n\\n  };\\n  config = lib.mkIf (sshEnabled || serviceEnabled) {\\n    environment.systemPackages = [ pkgs.btrbk ] ++ cfg.extraPackages;\\n    security.sudo.extraRules = [\\n      {\\n        users = [ \\\&quot;btrbk\\\&quot; ];\\n        commands = [\\n          { command = \\\&quot;${pkgs.btrfs-progs}/bin/btrfs\\\&quot;; options = [ \\\&quot;NOPASSWD\\\&quot; ]; }\\n          { command = \\\&quot;${pkgs.coreutils}/bin/mkdir\\\&quot;; options = [ \\\&quot;NOPASSWD\\\&quot; ]; }\\n          { command = \\\&quot;${pkgs.coreutils}/bin/readlink\\\&quot;; options = [ \\\&quot;NOPASSWD\\\&quot; ]; }\\n          # for ssh, they are not the same than the one hard coded in ${pkgs.btrbk}\\n          { command = \\\&quot;/run/current-system/bin/btrfs\\\&quot;; options = [ \\\&quot;NOPASSWD\\\&quot; ]; }\\n          { command = \\\&quot;/run/current-system/sw/bin/mkdir\\\&quot;; options = [ \\\&quot;NOPASSWD\\\&quot; ]; }\\n          { command = \\\&quot;/run/current-system/sw/bin/readlink\\\&quot;; options = [ \\\&quot;NOPASSWD\\\&quot; ]; }\\n        ];\\n      }\\n    ];\\n    users.users.btrbk = {\\n      isSystemUser = true;\\n      # ssh needs a home directory\\n      home = \\\&quot;/var/lib/btrbk\\\&quot;;\\n      createHome = true;\\n      shell = \\\&quot;${pkgs.bash}/bin/bash\\\&quot;;\\n      group = \\\&quot;btrbk\\\&quot;;\\n      openssh.authorizedKeys.keys = map (\\n        v:\\n          let\\n            options = lib.concatMapStringsSep \\\&quot; \\\&quot; (x: \\\&quot;--\\\&quot; + x) v.roles;\\n            ioniceClass = {\\n              \\\&quot;idle\\\&quot; = 3;\\n              \\\&quot;best-effort\\\&quot; = 2;\\n              \\\&quot;realtime\\\&quot; = 1;\\n            }.${cfg.ioSchedulingClass};\\n          in\\n            &#39;&#39;command=\\\&quot;${pkgs.utillinux}/bin/ionice -t -c ${toString ioniceClass} ${lib.optionalString (cfg.niceness \\u0026gt;= 1) \\\&quot;${pkgs.coreutils}/bin/nice -n ${toString cfg.niceness}\\\&quot;} ${pkgs.btrbk}/share/btrbk/scripts/ssh_filter_btrbk.sh --sudo ${options}\\\&quot; ${v.key}&#39;&#39;\\n      ) cfg.sshAccess;\\n    };\\n    users.groups.btrbk = {};\\n    systemd.tmpfiles.rules = [\\n      \\\&quot;d /var/lib/btrbk 0750 btrbk btrbk\\\&quot;\\n      \\\&quot;d /var/lib/btrbk/.ssh 0700 btrbk btrbk\\\&quot;\\n      \\\&quot;f /var/lib/btrbk/.ssh/config 0700 btrbk btrbk - StrictHostKeyChecking=accept-new\\\&quot;\\n    ];\\n    system.extraDependencies = lib.mapAttrsToList (name: instance: configTest name instance.settings) cfg.instances;\\n    environment.etc = lib.mapAttrs&#39; (\\n      name: instance: {\\n        name = \\\&quot;btrbk/${name}.conf\\\&quot;;\\n        value.text = mkConfigFile instance.settings;\\n      }\\n    ) cfg.instances;\\n    systemd.services = lib.mapAttrs&#39; (\\n      name: _: {\\n        name = \\\&quot;btrbk-${name}\\\&quot;;\\n        value = {\\n          description = \\\&quot;Takes BTRFS snapshots and maintains retention policies.\\\&quot;;\\n          unitConfig.Documentation = \\\&quot;man:btrbk(1)\\\&quot;;\\n          path = [ \\\&quot;/run/wrappers\\\&quot; ] ++ cfg.extraPackages;\\n          serviceConfig = {\\n            User = \\\&quot;btrbk\\\&quot;;\\n            Group = \\\&quot;btrbk\\\&quot;;\\n            Type = \\\&quot;oneshot\\\&quot;;\\n            ExecStart = \\\&quot;${pkgs.btrbk}/bin/btrbk -c /etc/btrbk/${name}.conf run\\\&quot;;\\n            Nice = cfg.niceness;\\n            IOSchedulingClass = cfg.ioSchedulingClass;\\n            StateDirectory = \\\&quot;btrbk\\\&quot;;\\n          };\\n        };\\n      }\\n    ) cfg.instances;\\n\\n    systemd.timers = lib.mapAttrs&#39; (\\n      name: instance: {\\n        name = \\\&quot;btrbk-${name}\\\&quot;;\\n        value = {\\n          description = \\\&quot;Timer to take BTRFS snapshots and maintain retention policies.\\\&quot;;\\n          wantedBy = [ \\\&quot;timers.target\\\&quot; ];\\n          timerConfig = {\\n            OnCalendar = instance.onCalendar;\\n            AccuracySec = \\\&quot;10min\\\&quot;;\\n            Persistent = true;\\n          };\\n        };\\n      }\\n    ) cfg.instances;\\n  };\\n\\n}\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:9,\&quot;updated_at\&quot;:\&quot;2021-02-03T08:21:56.863Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:33,\&quot;reads\&quot;:134,\&quot;readers_count\&quot;:133,\&quot;score\&quot;:271.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:11364,\&quot;topic_slug\&quot;:\&quot;btrfs-backup-tools-in-nixos\&quot;,\&quot;display_username\&quot;:\&quot;Symphorien\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://discourse.nixos.org/t/why-does-ssh-require-different-paths-for-binaries-sudo-without-password/17159\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;Why does SSH require different paths for binaries (sudo without password)?\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Great contributor\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:5}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:474,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-backup-tool             <div class='post' itemprop='text'>
              <p>There are a bunch of <a href="https://btrfs.wiki.kernel.org/index.php/Incremental_Backup" rel="noopener nofollow ugc">tools for backing up btrfs filesystems</a>. I couldn’t find any NixOS modules on this topic. What are you using for btrfs incremental backups?</p>

          <div id='post_2' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discourse.nixos.org/u/dramforever'><span itemprop='name'>dramforever</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2021-02-03T07:53:18Z' class='post-time'>
                    February 3, 2021,  7:53am
                  </time>

              </span>

            <div class='post' itemprop='text'>
              <p>I personally use btrbk, but only the snapshot feature. I did a bit of manual configuration here:</p>
<aside class="onebox githubblob" data-onebox-src="https://github.com/dramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix">
  <header class="source">

      <a href="https://github.com/dramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix" target="_blank" rel="noopener">github.com</a>
  </header>

  <article class="onebox-body">
    <h4><a href="https://github.com/dramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix" target="_blank" rel="noopener">dramforever/config/blob/163c7a092027c6bdda050ffae91f12afef50d72c/nixos/modules/system/btrbk.nix</a></h4>


      <pre><code class="lang-nix">{ config, pkgs, lib, ... }:

{
  environment.systemPackages = [ pkgs.btrbk ];

  systemd.services.btrbk = {
    description = "btrbk backup";
    serviceConfig = {
      Type = "oneshot";
      ExecStart = "${pkgs.btrbk}/bin/btrbk run";
    };
  };

  systemd.timers.btrbk = {
    description = "btrbk backup periodic";
    wantedBy = [ "multi-user.target" ];
    timerConfig = {
      OnUnitInactiveSec = "15min";
      OnBootSec = "15min";
    };
</code></pre>

</aside>

<p>The configuration is written to <code>/etc</code> so that command <code>btrbk</code> also finds it.</p>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">

          <div id='post_3' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discourse.nixos.org/u/symphorien'><span itemprop='name'>symphorien</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2021-02-03T08:21:56Z' class='post-time'>
                    February 3, 2021,  8:21am
                  </time>
                  <meta itemprop='dateModified' content='2021-02-03T08:21:56Z'>
              <span itemprop='position'>3</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>I have a module for btrbk, including ssh archiving. I have been using it for long but never took the time to upstream it.</p>
<pre><code class="lang-nix">{ config, pkgs, lib, ... }:
let
  cfg = config.services.btrbk;
  sshEnabled = cfg.sshAccess != [];
  serviceEnabled = cfg.instances != {};
  attr2Lines = attr: let
    pairs = lib.attrsets.mapAttrsToList (name: value: { inherit name value; }) attr;
    isSubsection = value: if builtins.isAttrs value then true else if builtins.isString value then false else
      throw "invalid type in btrbk config ${builtins.typeOf value}";
    sortedPairs = lib.lists.partition (x: isSubsection x.value) pairs;
  in
    lib.flatten (
      # non subsections go first
      (
        map (pair: [ "${pair.name} ${pair.value}" ]) sortedPairs.wrong
      )
      ++ # subsections go last
      (
        map (
          pair:
            lib.mapAttrsToList (
              childname: value:
                [ "${pair.name} ${childname}" ] ++ (map (x: " " + x) (attr2Lines value))
            ) pair.value
        ) sortedPairs.right
      )
    )
  ;
  addDefaults = settings: { backend = "btrfs-progs-sudo"; } // settings;
  mkConfigFile = settings: lib.concatStringsSep "\n" (attr2Lines (addDefaults settings));
  configTest = name: settings: let
    configFile = pkgs.writeText "btrbk-${name}.conf" (mkConfigFile settings);
  in
    pkgs.runCommand "btrbk-${name}-config-test" {} ''
      mkdir foo
      if (set +o pipefail; ${pkgs.btrbk}/bin/btrbk -c ${configFile} ls foo 2&gt;&amp;1 | grep ${configFile});
      then
      echo btrbk configuration is invalid
      cat ${configFile}
      exit 1
      fi;
      touch $out
    '';
in
{
  options = {
    services.btrbk = {
      extraPackages = lib.mkOption {
        description = "Extra packages for btrbk, like compression utilities for &lt;literal&gt;stream_compress&lt;/literal&gt;";
        type = lib.types.listOf lib.types.package;
        default = [];
        example = lib.literalExample "[ pkgs.xz ]";
      };
      niceness = lib.mkOption {
        description = "Niceness for local instances of btrbk. Also applies to remote ones connecting via ssh when positive.";
        type = lib.types.ints.between (-20) 19;
        default = 10;
      };
      ioSchedulingClass = lib.mkOption {
        description = "IO scheduling class for btrbk (see ionice(1) for a quick description). Applies to local instances, and remote ones connecting by ssh if set to idle.";
        type = lib.types.enum [ "idle" "best-effort" "realtime" ];
        default = "idle";
      };
      instances = lib.mkOption {
        description = "Set of btrbk instances. The instance named &lt;literal&gt;btrbk&lt;/literal&gt; is the default one.";
        type = with lib.types;
          attrsOf (
            submodule {
              options = {
                onCalendar = lib.mkOption {
                  type = lib.types.str;
                  default = "daily"; # every 3 minutes
                  description = "How often this btrbk instance is started. See systemd.time(7) for more information about the format.";
                };
                settings = lib.mkOption {
                  type = let t = lib.types.attrsOf (lib.types.either lib.types.str t); in t;
                  default = {};
                  example = {
                    snapshot_preserve_min = "2d";
                    snapshot_preserve = "14d";
                    volume = {
                      "/mnt/btr_pool" = {
                        target = "/mnt/btr_backup/mylaptop";
                        subvolume = {
                          "rootfs" = {};
                          "home" = { snapshot_create = "always"; };
                        };
                      };
                    };
                  };
                  description = "configuration options for btrbk. Nested attrsets translate to subsections.";
                };
              };
            }
          );
        default = {};
      };
      sshAccess = lib.mkOption {
        type = with lib.types; listOf (
          submodule {
            options = {
              key = lib.mkOption {
                type = str;
                description = "SSH public key allowed to login as user &lt;literal&gt;btrbk&lt;/literal&gt; to run remote backups.";
              };
              roles = lib.mkOption {
                type = listOf (enum [ "info" "source" "target" "delete" "snapshot" "send" "receive" ]);
                example = [ "source" "info" "send" ];
                description = "What actions can be performed with this SSH key. See ssh_filter_btrbk(1) for details";
              };
            };
          }
        );
        default = [];
      };
    };

  };
  config = lib.mkIf (sshEnabled || serviceEnabled) {
    environment.systemPackages = [ pkgs.btrbk ] ++ cfg.extraPackages;
    security.sudo.extraRules = [
      {
        users = [ "btrbk" ];
        commands = [
          { command = "${pkgs.btrfs-progs}/bin/btrfs"; options = [ "NOPASSWD" ]; }
          { command = "${pkgs.coreutils}/bin/mkdir"; options = [ "NOPASSWD" ]; }
          { command = "${pkgs.coreutils}/bin/readlink"; options = [ "NOPASSWD" ]; }
          # for ssh, they are not the same than the one hard coded in ${pkgs.btrbk}
          { command = "/run/current-system/bin/btrfs"; options = [ "NOPASSWD" ]; }
          { command = "/run/current-system/sw/bin/mkdir"; options = [ "NOPASSWD" ]; }
          { command = "/run/current-system/sw/bin/readlink"; options = [ "NOPASSWD" ]; }
        ];
      }
    ];
    users.users.btrbk = {
      isSystemUser = true;
      # ssh needs a home directory
      home = "/var/lib/btrbk";
      createHome = true;
      shell = "${pkgs.bash}/bin/bash";
      group = "btrbk";
      openssh.authorizedKeys.keys = map (
        v:
          let
            options = lib.concatMapStringsSep " " (x: "--" + x) v.roles;
            ioniceClass = {
              "idle" = 3;
              "best-effort" = 2;
              "realtime" = 1;
            }.${cfg.ioSchedulingClass};
          in
            ''command="${pkgs.utillinux}/bin/ionice -t -c ${toString ioniceClass} ${lib.optionalString (cfg.niceness &gt;= 1) "${pkgs.coreutils}/bin/nice -n ${toString cfg.niceness}"} ${pkgs.btrbk}/share/btrbk/scripts/ssh_filter_btrbk.sh --sudo ${options}" ${v.key}''
      ) cfg.sshAccess;
    };
    users.groups.btrbk = {};
    systemd.tmpfiles.rules = [
      "d /var/lib/btrbk 0750 btrbk btrbk"
      "d /var/lib/btrbk/.ssh 0700 btrbk btrbk"
      "f /var/lib/btrbk/.ssh/config 0700 btrbk btrbk - StrictHostKeyChecking=accept-new"
    ];
    system.extraDependencies = lib.mapAttrsToList (name: instance: configTest name instance.settings) cfg.instances;
    environment.etc = lib.mapAttrs' (
      name: instance: {
        name = "btrbk/${name}.conf";
        value.text = mkConfigFile instance.settings;
      }
    ) cfg.instances;
    systemd.services = lib.mapAttrs' (
      name: _: {
        name = "btrbk-${name}";
        value = {
          description = "Takes BTRFS snapshots and maintains retention policies.";
          unitConfig.Documentation = "man:btrbk(1)";
          path = [ "/run/wrappers" ] ++ cfg.extraPackages;
          serviceConfig = {
            User = "btrbk";
            Group = "btrbk";
            Type = "oneshot";
            ExecStart = "${pkgs.btrbk}/bin/btrbk -c /etc/btrbk/${name}.conf run";
            Nice = cfg.niceness;
            IOSchedulingClass = cfg.ioSchedulingClass;
            StateDirectory = "btrbk";
          };
        };
      }
    ) cfg.instances;

    systemd.timers = lib.mapAttrs' (
      name: instance: {
        name = "btrbk-${name}";
        value = {
          description = "Timer to take BTRFS snapshots and maintain retention policies.";
          wantedBy = [ "timers.target" ];
          timerConfig = {
            OnCalendar = instance.onCalendar;
            AccuracySec = "10min";
            Persistent = true;
          };
        };
      }
    ) cfg.instances;
  };

}
</code></pre>
