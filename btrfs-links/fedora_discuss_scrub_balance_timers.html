t;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2781,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/how-to-enable-scrub-and-balance-timers/77336/2\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:138682,\&quot;name\&quot;:\&quot;dalto\&quot;,\&quot;username\&quot;:\&quot;dalto\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discussion.fedoraproject.org/dalto/{size}/5564_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-16T20:41:35.920Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;scottytrees\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;77336\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://sea1.discourse-cdn.com/fedoraproject/user_avatar/discussion.fedoraproject.org/scottytrees/48/29989_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e scottytrees:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI was using EndeavourOS Gnome before this and on my old Arch-based setup I used a package from the AUR called \\u003ccode\\u003ebtrfsmaintenance\\u003c/code\\u003e that more or less ran on it’s own once installed. I see this package is also in the Fedora repos too which is nice, but reading about \\u003ccode\\u003ebtrfsmaintenance\\u003c/code\\u003e on Fedora, it seems the consensus is better not to use it, but rather timers for scrubbing and balancing.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThere is no significant difference btrfsmaintenance on Arch and btrfsmaintenance on Fedora.\\u003c/p\\u003e\\n\\u003cp\\u003ebtrfsmaintenance also uses timers.  However, it adds a bunch of convenient funcitionality so you don’t have to enable them one at a time for each filesystem and/or subvolume.\\u003c/p\\u003e\\n\\u003cp\\u003eI can’t imagine why the “consensus” would be to not use btrfsmaintenance.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2023-03-08T22:36:42.119Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:20,\&quot;reads\&quot;:40,\&quot;readers_count\&quot;:39,\&quot;score\&quot;:138.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:77336,\&quot;topic_slug\&quot;:\&quot;how-to-enable-scrub-and-balance-timers\&quot;,\&quot;display_username\&quot;:\&quot;dalto\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:3609,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/how-to-enable-scrub-and-balance-timers/77336/3\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:2}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:2,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:179831,\&quot;name\&quot;:\&quot;Yosuke\&quot;,\&quot;username\&quot;:\&quot;guiltydoggy\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discussion.fedoraproject.org/guiltydoggy/{size}/3068_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-16T20:43:01.512Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI just wrote my own systemd service and timer. E.g.:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e──────┬───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────\\n       │ File: btrfs-scrub.service\\n───────┼───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────\\n   1   │ [Unit]\\n   2   │ Description=Runs the btrfs scrub on the root mount point periodically\\n   3   │ \\n   4   │ [Service]\\n   5   │ Type=simple\\n   6   │ ExecStart=/usr/sbin/btrfs scrub start -B /\\n───────┴───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────\\n\\n───────┬───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────\\n       │ File: btrfs-scrub.timer\\n───────┼───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────\\n   1   │ [Unit]\\n   2   │ Description=Runs the btrfs scrub on the root mount point periodically\\n   3   │ \\n   4   │ [Timer]\\n   5   │ OnCalendar=monthly\\n   6   │ AccuracySec=12h\\n   7   │ Persistent=true\\n   8   │ \\n   9   │ [Install]\\n  10   │ WantedBy=timers.target\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2022-11-16T20:43:01.512Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:21,\&quot;reads\&quot;:39,\&quot;readers_count\&quot;:38,\&quot;score\&quot;:142.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:77336,\&quot;topic_slug\&quot;:\&quot;how-to-enable-scrub-and-balance-timers\&quot;,\&quot;display_username\&quot;:\&quot;Yosuke\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2674,\&quot;hidden\ ccode class=\\\&quot;lang-auto\\\&quot;\\u003e# systemctl enable --now btrfs-scrub@-.timer\\n# systemctl enable --now btrfs-scrub@home.timer\\n# systemctl enable --now btrfs-scrub@mnt-backup.timer\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:5,\&quot;updated_at\&quot;:\&quot;2022-11-17T01:07:00.085Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:39,\&quot;reads\&quot;:35,\&quot;readers_count\&quot;:34,\&quot;score\&quot;:232.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:77336,\&quot;topic_slug\&quot;:\&quot;how-to-enable-scrub-and-balance-timers\&quot;,\&quot;display_username\&quot;:\&quot;Scott Hansen\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2438,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/how-to-enable-scrub-and-balance-timers/77336/5\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:2}],\&quot;current_user_reaction\&quot;:nu c/span\\u003eCommon Issues\\u003c/span\\u003e\\u003c/a\\u003e category.\&quot;,\&quot;topic_url\&quot;:\&quot;/t/about-the-proposed-common-issues-category/69491\&quot;,\&quot;read_restricted\&quot;:false,\&quot;permission\&quot;:null,\&quot;parent_category_id\&quot;:82,\&quot;notification_level\&quot;:0,\&quot;topic_template\&quot;:\&quot;\\u003c!--\\nThis is NOT a place to report bugs. If you want to discuss a problem with other Fedora users, select the \\\&quot;Ask Fedora\\\&quot; category (without any subcategory) in the drop-down list above. Or close (discard) this draft and open a new topic in here:\\nhttps://discussion.fedoraproject.org/c/ask\\nIf you want to report a bug to Fedora package maintainers, follow this guide:\\nhttps://docs.fedoraproject.org/en-US/quick-docs/bugzilla-file-a-bug/\\n\\nThis category is for proposing a new Common Issue. Read about Common Issues here:\\nhttps://discussion.fedoraproject.org/t/about-the-common-issues-category/74711\\nand detailed instructions on proposing here:\\nhttps://discussion.fedoraproject.org/t/about-the-proposed-common-issues-category/69491\\n\\nIf you really intend to propose a new Common Issue documenting a problem that&#39;s serious and affects a lot of people, please fill out the template below. Look at other published Common Issues and write your description in the same style:\\nhttps://discussion.fedoraproject.org/c/ask/common-issues/\\n--\\u003e\\n\\n\\u003c!-- Please give the topic a succinct title which describes the issue and which will be easy to search for. Also, attach some meaningful tags. --\\u003e\\n\\nProblem\\n-------\\n\\u003c!-- Describe briefly how the problem appears to a user, in simple terms. Attach screenshots, if it helps to illustrate the issue. --\\u003e\\n\\nCause\\n-----\\n\\u003c!-- If we know what causes the issue, describe that in a few lines, without getting deeply technical. Link to other posts explaining technical details if it seems useful. --\\u003e\\n\\nNot yet known.\\n\\nRelated Issues\\n--------------\\n\\u003c!-- Replace both instances of NNNN with the bugzilla bug ID in the Bugzilla line below. If there are more than one related bug, put each one to a separate line.  Please make sure that there&#39;s always either a RH Bugzilla report or an upstream tracker report (below), because that&#39;s essential to get the problem fixed. --\\u003e\\nBugzilla report: [#NNNN](https://bugzilla.redhat.com/NNNN)\\n\\n\\u003c!-- If there are upstream trackers covering this issue, you could link them here too. You may also want to link to related discussions on Ask Fedora. You can also link to similar problems that are NOT this one. --\\u003e\\n\\n\\nWorkarounds \\u003c!-- When the issue is solved, change this to \\\&quot;Solution\\\&quot;, remove the workaround text, and mark a reply, below, with that solution. --\\u003e\\n-----------\\n\\n\\u003c!-- If there are steps users can take to mitigate the problem, list those here. --\\u003e\\n\\nNone yet.\\n\&quot;,\&quot;has_children\&quot;:false,\&quot;subcategory_count\&quot;:null,\&quot;sort_order\&quot;:\&quot;created\&quot;,\&quot;sort_ascending\&quot;:false,\&quot;show_subcategory_list\&quot;:false,\&quot;num_featured_topics\&quot;:3,\&quot;default_view\&quot;:\&quot;latest\&quot;,\&quot;subcategory_list_style\&quot;:\&quot;rows_with_featured_topics\&quot;,\&quot;default_top_period\&quot;:\&quot;quarterly\&quot;,\&quot;default_list_filter\&quot;:\&quot;all\&quot;,\&quot;minimum_required_tags\&quot;:0,\&quot;navigate_to_first_post_after_read\&quot;:true,\&quot;custom_fields\&quot;:{\&quot;has_chat_enabled\&quot;:null,\&quot;enable_unassigned_filter\&quot;:null,\&quot;sort_topics_by_event_start_date\&quot;:null,\&quot;disable_topic_resorting\&quot;:null,\&quot;create_as_post_voting_default\&quot;:null,\&quot;only_post_voting_in_this_category\&quot;:null,\&quot;enable_topic_voting\&quot;:null,\&quot;enable_accepted_answers\&quot;:\&quot;true\&quot;},\&quot;allowed_tags\&quot;:[],\&quot;allowed_tag_g             <div class='post' itemprop='text'>
              <p>Greetings Fedora community,</p>
<p>I recently installed Fedora 36 and had a few questions regarding btrs maintenance. I was using EndeavourOS Gnome before this and on my old Arch-based setup I used a package from the AUR called <code>btrfsmaintenance</code> that more or less ran on it’s own once installed. I see this package is also in the Fedora repos too which is nice, but reading about <code>btrfsmaintenance</code> on Fedora, it seems the consensus is better not to use it, but rather timers for scrubbing and balancing. I’m curious if anyone can tell me what exactly the commands I need to activate systemd timers for these two? Is it a good idea to use both or just one of them? I know fstrm timer is on by default and I do have an SSD in my Acer laptop. I have a very simple setup, just one SSD in my laptop.</p>
<p>Here’s my <code>/etc/fstab</code> details below if that’s helpful:</p>
<pre><code class="lang-auto">UUID=06fb8d29-d255-4b98-aa4f-a3fa0416ede9 /                       btrfs   subvol=root,compress=zstd:1 0 0
UUID=a5c65a7b-d274-4d97-9a5b-38aa8817829f /boot                   ext4    defaults        1 2
UUID=CC4E-4FA7          /boot/efi               vfat    umask=0077,shortname=winnt 0 2
UUID=06fb8d29-d255-4b98-aa4f-a3fa0416ede9 /home                   btrfs   subvol=home,compress=zstd:1 0 0
</code></pre>
<p>Appreciate any help!</p>

              <aside class="quote no-group" data-username="scottytrees" data-post="1" data-topic="77336">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://sea1.discourse-cdn.com/fedoraproject/user_avatar/discussion.fedoraproject.org/scottytrees/48/29989_2.png" class="avatar"> scottytrees:</div>
<blockquote>
<p>I was using EndeavourOS Gnome before this and on my old Arch-based setup I used a package from the AUR called <code>btrfsmaintenance</code> that more or less ran on it’s own once installed. I see this package is also in the Fedora repos too which is nice, but reading about <code>btrfsmaintenance</code> on Fedora, it seems the consensus is better not to use it, but rather timers for scrubbing and balancing.</p>
</blockquote>
</aside>
<p>There is no significant difference btrfsmaintenance on Arch and btrfsmaintenance on Fedora.</p>
<p>btrfsmaintenance also uses timers.  However, it adds a bunch of convenient funcitionality so you don’t have to enable them one at a time for each filesystem and/or subvolume.</p>
<p>I can’t imagine why the “consensus” would be to not use btrfsmaintenance.</p>

          <div id='post_4' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discussion.fedoraproject.org/u/guiltydoggy'><span itemprop='name'>guiltydoggy</span></a>

              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-11-16T20:43:01Z' class='post-time'>
                    November 16, 2022,  8:43pm

              <span itemprop='position'>4</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>I just wrote my own systemd service and timer. E.g.:</p>
<pre><code class="lang-auto">──────┬───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
       │ File: btrfs-scrub.service
───────┼───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
   1   │ [Unit]
   2   │ Description=Runs the btrfs scrub on the root mount point periodically
   3   │ 
   4   │ [Service]
   5   │ Type=simple
   6   │ ExecStart=/usr/sbin/btrfs scrub start -B /
───────┴───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────

───────┬───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
       │ File: btrfs-scrub.timer
───────┼───────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────────
   1   │ [Unit]
   2   │ Description=Runs the btrfs scrub on the root mount point periodically
   3   │ 
   4   │ [Timer]
   5   │ OnCalendar=monthly
   6   │ AccuracySec=12h
   7   │ Persistent=true
   8   │ 
   9   │ [Install]
  10   │ WantedBy=timers.target
</code></pre>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">

          <div id='post_5' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discussion.fedoraproject.org/u/firecat53'><span itemprop='name'>firecat53</span></a>
                (Scott Hansen)
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-11-17T01:07:00Z' class='post-time'>
                    November 17, 2022,  1:07am
                  </time>
                  <meta itemprop='dateModified' content='2022-11-17T01:07:00Z'>
              <span itemprop='position'>5</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>If you have multiple btrfs volumes, you can generalize the service file like:</p>
<pre><code class="lang-auto">#    /etc/systemd/system/btrfs-scrub@.service
[Unit]
Description=Btrfs scrub on %f
Requires=%i.mount
After=%i.mount

[Service]
Nice=19
IOSchedulingClass=idle
KillSignal=SIGINT
ExecStart=btrfs scrub start -B %f
</code></pre>
<pre><code class="lang-auto"># /etc/systemd/system/btrfs-scrub@.timer
[Unit]
Description=Monthly Btrfs scrub on %f

[Timer]
OnCalendar=monthly
AccuracySec=7d
RandomizedDelaySec=7d
Persistent=true

[Install]
WantedBy=timers.target
</code></pre>
<p>And then enable with (different disks mounted at /, /home and /mnt/backup):</p>
<pre><code class="lang-auto"># systemctl enable --now btrfs-scrub@-.timer
# systemctl enable --now btrfs-scrub@home.timer
# systemctl enable --now btrfs-scrub@mnt-backup.timer
</code></pre>
            </div>
