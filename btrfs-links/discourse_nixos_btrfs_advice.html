uot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6874,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-seeking-installation-advice/40826/1\&quot;,\&quot;event\&quot;:null,\&quot;calendar_details\&quot;:[],\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:140246,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;TLATER\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/tlater/{size}/4257_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-05T13:32:46.016Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shmu26\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;40826\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shmu26:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIs it recommended to manually create \\u003cspan class=\\\&quot;mention\\\&quot;\\u003e@home\\u003c/span\\u003e, or possibly other subvolumes? Or maybe I should put home on a separate partition?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt’s entirely up to how you intend to use the filesystem. The graphical installer isn’t opinionated, it just makes sure to get you a basic btrfs that you can adjust to your needs.\\u003c/p\\u003e\\n\\u003cp\\u003eObviously if you intend to snapshot \\u003ccode\\u003e@home\\u003c/code\\u003e and not everything else you’ll need a separate subvolume for that. Snapshotting \\u003ccode\\u003e/nix\\u003c/code\\u003e is pretty pointless in general too, so you probably want a subvolume for that. \\u003cs\\u003eThat’ll also let you set \\u003ccode\\u003enoacl\\u003c/code\\u003e (which is totally useless on the nix store) for performance and better SSD wear.\\u003c/s\\u003e Nope, I misread those docs.\\u003c/p\\u003e\\n\\u003cp\\u003ePersonally I like a separate volume for at least \\u003ccode\\u003e/var/log\\u003c/code\\u003e too, due to some PTSD from a poorly configured log file. Then you can set a quota so it doesn’t blow up accidentally (and probably set a ~15G quota for \\u003ccode\\u003e/nix\\u003c/code\\u003e too so you remember to collect garbage) - though be aware of the limitations of using quotas and snapshots.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003e/var\\u003c/code\\u003e usually gets a subvolume for me, because it’s the dedicated data directory for most system services, and therefore worth snapshotting. I’ll typically make specific subvolumes for directories in \\u003ccode\\u003e/var\\u003c/code\\u003e rather than grabbing the whole thing.\\u003c/p\\u003e\\n\\u003cp\\u003eAnything else in \\u003ccode\\u003e/\\u003c/code\\u003e is usually not snapshotted on NixOS because it should only contain configuration that comes from my NixOS config.\\u003c/p\\u003e\\n\\u003cp\\u003eThat’s just me throwing around my opinions. \\u003ca href=\\\&quot;https://wiki.gentoo.org/wiki/Handbook:AMD64/Full/Installation#Designing_a_partition_scheme\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eGentoo\\u003c/a\\u003e has some good advice for generic distro use too (designed around ext4 and fhs-based systems, so doesn’t fully apply).\\u003c/p\\u003e\\n\\u003cp\\u003eUltimately it comes down to personal preference and experience. btrfs lets you change this stuff very easily without data loss, so don’t worry too much about getting it right immediately - that’s my favorite thing about it compared to older filesystems.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shmu26\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;40826\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shmu26:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eTo that end, what is a recommended GUI tool for snapshot management? I understand that Timeshift is not exactly tailor-suited to a standard NixOS installation. What about Snapper, or BTRFS-Assistant, or others?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eNo experience with that, sorry.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-05-05T17:37:54.038Z\&quot;,\&quot;reply_count\&quot;:3,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:93,\&quot;reads\&quot;:257,\&quot;readers_count\&quot;:256,\&quot;score\&quot;:651.2,\&quot;yours\&quot;:false,\&quot;topic n_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true},{\&quot;id\&quot;:140715,\&quot;name\&quot;:\&quot;Shmu26\&quot;,\&quot;username\&quot;:\&quot;shmu26\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/shmu26/{size}/13143_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-08T10:00:22.455Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eSo the Wiki on BTRFS installation kind of leaves you \\u003cs\\u003ehanging over a cliff\\u003c/s\\u003e puzzled what to do\\u003cbr\\u003e\\n\\u003ca href=\\\&quot;https://nixos.wiki/wiki/Btrfs\\\&quot; class=\\\&quot;onebox\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003ehttps://nixos.wiki/wiki/Btrfs\\u003c/a\\u003e\\u003cbr\\u003e\\nbecause after you created and mounted your subvolumes (so far, so good) it then says “manually add mount options”, but it doesn’t tell you how, and then it tells you to run \\u003ccode\\u003enixos-install\\u003c/code\\u003e, which will create an installation without a user account or other essentials, because it doesn’t ask any questions. It just does.\\u003cbr\\u003e\\nAny advice on how to “manually add mount options” and taking it from there on?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-03-09T17:29:57.782Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:56,\&quot;reads\&quot;:176,\&quot;readers_count\&quot;:175,\&quot;score\&quot;:325.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:40826,\&quot;topic_slug\&quot;:\&quot;btrfs-seeking-installation-advice\&quot;,\&quot;display_username\&quot;:\&quot;Shmu26\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://nixos.wiki/wiki/Btrfs\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Btrfs - NixOS Wiki\&quot;,\&quot;clicks\&quot;:301}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6874,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-seeking-installation-advice/40826/5\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true},{\&quot;id\&quot;:140736,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;TLATER\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/tlater/{size}/4257_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-08T13:02:32.374Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThe wiki is unofficial and large parts of it, if they were ever of any quality, have bitrotted to hell. There’s an official wiki on the way, we’ll see if it ends up better, but NixOS kind of incentivizes upstream fixes over documenting stuff in a wiki, and the userbase is generally a bit too advanced to write helpful newbie docs, so you end up with this kind of tutorial quite often.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shmu26\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;40826\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shmu26:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eit then says “manually add mount options”, but it doesn’t tell you how\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYou would use \\u003ca href=\\\&quot;https://search.nixos.org/options?channel=23.11\\u0026amp;show=fileSystems.%3Cname%3E.options\\u0026amp;from=0\\u0026amp;size=50\\u0026amp;sort=relevance\\u0026amp;type=packages\\u0026amp;query=fileSystems\\\&quot;\\u003e\\u003ccode\\u003efileSystems.options\\u003c/code\\u003e\\u003c/a\\u003e for that.\\u003c/p\\u003e\\n\\u003cp\\u003eNote that btrfs has a \\u003ccode\\u003esubvol\\u003c/code\\u003e option if you want to mount specific subvolumes.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shmu26\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;40826\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shmu26:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ethen it tells you to run nixos-install, which will create an installation without a user account or other essentials, because it doesn’t ask any questions. It just does.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes, the non-graphical installer doesn’t hold your hands. The idea is that you have your declarative configuration ready to go and configure everything before you run that command.\\u003c/p\\u003e\\n\\u003cp\\u003eI’d suggest you either use the graphical installer, which adds a few sane defaults (though I believe you still need to log in as root initially? Never used it myself), or you follow the manual’s installation docs: \\u003ca href=\\\&quot;https://nixos.org/manual/nixos/stable/#sec-installation-manual-installing\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eNixOS Manual\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eEither will give you far more context than the wiki. You’ve got the btrfs part down, at least, so picking up from here with the manual shouldn’t be too hard.\\u003c/p\\u003e\\n\\u003cp\\u003eAnd feel free to fix the wiki! It should at least hand you over to the official guide once the btrfs bit is done.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-03-08T13:08:43.157Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:5,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:90,\&quot;reads\&quot;:166,\&quot;readers_count\&quot;:165,\&quot;score\&quot;:488.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:40826,\&quot;topic_slug\&quot;:\&quot;btrfs-seeking-installation-advice\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;l uot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/tlater/48/4257_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e TLATER:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eYou would use \\u003ca href=\\\&quot;https://search.nixos.org/options?channel=23.11\\u0026amp;show=fileSystems.%3Cname%3E.options\\u0026amp;from=0\\u0026amp;size=50\\u0026amp;sort=relevance\\u0026amp;type=packages\\u0026amp;query=fileSystems\\\&quot;\\u003e\\u003ccode\\u003efileSystems.options\\u003c/code\\u003e \\u003c/a\\u003e for that.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eOkay so what will that look like, if I did like this:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e# btrfs subvolume create /mnt/root\\n# btrfs subvolume create /mnt/home\\n# btrfs subvolume create /mnt/nix\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-03-08T13:19:11.278Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:6,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:27,\&quot;reads\&quot;:149,\&quot;readers_count\&quot;:148,\&quot;score\&quot;:169.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:40826,\&quot;topic_slug\&quot;:\&quot;btrfs-seeking-installation-advice\&quot;,\&quot;display_username\&quot;:\&quot;Shmu26\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6874,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-seeking-installation-advice/40826/7\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true},{\&quot;id\&quot;:140740,\&quot;name\&quot;:\&quot;sir phobos\&quot;,\&quot;username\&quot;:\&quot;sirphobos\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/sirphobos/{size}/9195_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-08T13:35:46.538Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eJust wanted to note, that after you create subvolumes and mount them following the wiki, doing \\u003ccode\\u003enixos-generate-config --root /mnt\\u003c/code\\u003e will generate basic configuration for mounted filesystems, so after that you can go in and adjust mount options if needed.\\u003c/p\\u003e\\n\\u003cp\\u003eSo technically, if you follow that wiki to the letter - you should end up with a working configuration\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-03-08T13:35:46.538Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:5,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:74,\&quot;reads\&quot;:140,\&quot;readers_count\&quot;:139,\&quot;score\&quot;:417.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:40826,\&quot;topic_slug\&quot;:\&quot;btrfs-seeking-installation-advice\&quot;,\&quot;display_username\&quot;:\&quot;sir phobos\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&q rue,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-seeking-installation-advice/40826/16\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true},{\&quot;id\&quot;:141148,\&quot;name\&quot;:\&quot;Shmu26\&quot;,\&quot;username\&quot;:\&quot;shmu26\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/shmu26/{size}/13143_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-10T14:19:03.405Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eLet’s say you choose the BTRFS option in the GUI installer, and allow it to give you a single subvolume called “/”\\u003c/p\\u003e\\n\\u003cp\\u003e1 What happens if you restore a snapshot? Is it able to remove all those read-only Nix files, and restore the entire system to its former state?\\u003c/p\\u003e\\n\\u003cp\\u003e2 If you get tired of such a simplistic setup, can you add subvolumes after installation, simply by defining them in configuration.nix?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:17,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-03-10T14:23:02.086Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:112,\&quot;readers_count\&quot;:111,\&quot;score\&quot;:57.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:40826,\&quot;topic_slug\&quot;:\&quot;btrfs-seeking-installation-advice\&quot;,\&quot;display_username\&quot;:\&quot;Shmu26\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:6874,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-seeking-installation-advice/40826/17\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true},{\&quot;id\&quot;:141202,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Atemu\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/atemu/{size}/10383_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-10T19:25:25.034Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shmu26\\\&quot; data-post=\\\&quot;17\\\&quot; data-topic=\\\&quot;40826\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shmu26:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e1 What happens if you restore a snapshot? Is it able to remove all those read-only Nix files, and restore the entire system to its former state?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eDepends on how exactly you plan on restoring the snapshot.\\u003c/p\\u003e\\n\\u003cp\\u003eI am not aware of any filesystem-native method of overwriting the btrfs root subvolume (id=5) with another subvolume under it; you’d have to copy each file one-by-one.\\u003c/p\\u003e\\n\\u003cp\\u003ePopular snapshotting frameworks assume certain subvolume layouts \\u003cem\\u003ebelow\\u003c/em\\u003e the root subvolume for a reason.\\u003c/p\\u003e\\n\\u003cp\\u003eSnapshotting \\u003ccode\\u003e/nix\\u003c/code\\u003e is quite useless though and rolling back its state can easily prevent you from booting your system. Don’t do it unless you know exactly what you are doing.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIf you get tired of such a simplistic setup, can you add subvolumes after installation, simply by defining them in configuration.nix?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eYou could technically “add subvolumes by defining them in configuration.nix” in the sense that you can tell systemd-tmpfilesd to create \\u003cem\\u003eempty\\u003c/em\\u003e subvolumes wherever you like.\\u003c/p\\u003e\\n\\u003cp\\u003eYou cannot make it automatically switch subvolume layouts for you though. You can tell NixOS to mount any subvolume layout you like but it won’t create or populate that layout for you; that’s up to you.\\u003c/p\\u003e\\n\\u003cp\\u003eIt is certainly possible to change the subvolume layout of an existing btrfs even while a live system is running on it. I’ve done it a few times. It’s also easy to mess this up though. Have a live distro at hand when attempting this.\\u003c/p\\u003e\\n\\u003cp\\u003eYour best option is to manually create the subvolume layout you want and then install NixOS manually. I promise you that both of these are doable by mere mortals and not actually too hard.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2024-03-10T19:26:16.831Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:17,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:22,\&quot;reads\&quot;:112,\&quot;readers_count\&quot;:111,\&quot;score\&quot;:172.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:40826,\&quot;topic_slug\&quot;:\&quot;btrfs-seeking-installation-advice\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1651,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-seeking-installation-advice/40826/18\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:true},{\&quot;id\&quot;:141314,\&quot;name\&quot;:\&quot;Shmu26\&quot;,\&quot;username\&quot;:\&quot;shmu26\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/shmu26/{size}/13143_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-03-11T11:27:59.205Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Atemu\\\&quot; data-post=\\\&quot;18\\\&quot; data-topic=\\\&quot;40826\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003             <div class='post' itemprop='text'>
              <p>I noticed that if you choose BTRFS for root partition, using the graphical installer, it creates only one subvolume, which is for root. It does not create <span class="mention">@home</span>.<br>
Is it recommended to manually create <span class="mention">@home</span>, or possibly other subvolumes? Or maybe I should put home on a separate partition?</p>
<p>My main objective in choosing BTRFS is to make snapshots of the home directory, or including the home directory.</p>
<p>To that end, what is a recommended GUI tool for snapshot management? I understand that Timeshift is not exactly tailor-suited to a standard NixOS installation. What about Snapper, or BTRFS-Assistant, or others?</p>
            </div>

<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png" class="avatar"> shmu26:</div>
<blockquote>
<p>Is it recommended to manually create <span class="mention">@home</span>, or possibly other subvolumes? Or maybe I should put home on a separate partition?</p>
</blockquote>
</aside>
<p>It’s entirely up to how you intend to use the filesystem. The graphical installer isn’t opinionated, it just makes sure to get you a basic btrfs that you can adjust to your needs.</p>
<p>Obviously if you intend to snapshot <code>@home</code> and not everything else you’ll need a separate subvolume for that. Snapshotting <code>/nix</code> is pretty pointless in general too, so you probably want a subvolume for that. <s>That’ll also let you set <code>noacl</code> (which is totally useless on the nix store) for performance and better SSD wear.</s> Nope, I misread those docs.</p>
<p>Personally I like a separate volume for at least <code>/var/log</code> too, due to some PTSD from a poorly configured log file. Then you can set a quota so it doesn’t blow up accidentally (and probably set a ~15G quota for <code>/nix</code> too so you remember to collect garbage) - though be aware of the limitations of using quotas and snapshots.</p>
<p><code>/var</code> usually gets a subvolume for me, because it’s the dedicated data directory for most system services, and therefore worth snapshotting. I’ll typically make specific subvolumes for directories in <code>/var</code> rather than grabbing the whole thing.</p>
<p>Anything else in <code>/</code> is usually not snapshotted on NixOS because it should only contain configuration that comes from my NixOS config.</p>
<p>That’s just me throwing around my opinions. <a href="https://wiki.gentoo.org/wiki/Handbook:AMD64/Full/Installation#Designing_a_partition_scheme" rel="noopener nofollow ugc">Gentoo</a> has some good advice for generic distro use too (designed around ext4 and fhs-based systems, so doesn’t fully apply).</p>
<p>Ultimately it comes down to personal preference and experience. btrfs lets you change this stuff very easily without data loss, so don’t worry too much about getting it right immediately - that’s my favorite thing about it compared to older filesystems.</p>

<p>No experience with that, sorry.</p>

            <div class='post' itemprop='text'>
              <p>So the Wiki on BTRFS installation kind of leaves you <s>hanging over a cliff</s> puzzled what to do<br>
<a href="https://nixos.wiki/wiki/Btrfs" class="onebox" target="_blank" rel="noopener">https://nixos.wiki/wiki/Btrfs</a><br>
because after you created and mounted your subvolumes (so far, so good) it then says “manually add mount options”, but it doesn’t tell you how, and then it tells you to run <code>nixos-install</code>, which will create an installation without a user account or other essentials, because it doesn’t ask any questions. It just does.<br>
Any advice on how to “manually add mount options” and taking it from there on?</p>
            </div>

              <span itemprop='position'>6</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>The wiki is unofficial and large parts of it, if they were ever of any quality, have bitrotted to hell. There’s an official wiki on the way, we’ll see if it ends up better, but NixOS kind of incentivizes upstream fixes over documenting stuff in a wiki, and the userbase is generally a bit too advanced to write helpful newbie docs, so you end up with this kind of tutorial quite often.</p>
<aside class="quote no-group" data-username="shmu26" data-post="5" data-topic="40826">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png" class="avatar"> shmu26:</div>
<blockquote>
<p>it then says “manually add mount options”, but it doesn’t tell you how</p>
</blockquote>
</aside>
<p>You would use <a href="https://search.nixos.org/options?channel=23.11&amp;show=fileSystems.%3Cname%3E.options&amp;from=0&amp;size=50&amp;sort=relevance&amp;type=packages&amp;query=fileSystems"><code>fileSystems.options</code></a> for that.</p>
<p>Note that btrfs has a <code>subvol</code> option if you want to mount specific subvolumes.</p>
<aside class="quote no-group" data-username="shmu26" data-post="5" data-topic="40826">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png" class="avatar"> shmu26:</div>
<blockquote>
<p>then it tells you to run nixos-install, which will create an installation without a user account or other essentials, because it doesn’t ask any questions. It just does.</p>
</blockquote>
</aside>
<p>Yes, the non-graphical installer doesn’t hold your hands. The idea is that you have your declarative configuration ready to go and configure everything before you run that command.</p>
<p>I’d suggest you either use the graphical installer, which adds a few sane defaults (though I believe you still need to log in as root initially? Never used it myself), or you follow the manual’s installation docs: <a href="https://nixos.org/manual/nixos/stable/#sec-installation-manual-installing" class="inline-onebox">NixOS Manual</a></p>
<p>Either will give you far more context than the wiki. You’ve got the btrfs part down, at least, so picking up from here with the manual shouldn’t be too hard.</p>
<p>And feel free to fix the wiki! It should at least hand you over to the official guide once the btrfs bit is done.</p>
            </div>

              <span class="crawler-post-infos">

            <div class='post' itemprop='text'>
              <p>Let’s say you choose the BTRFS option in the GUI installer, and allow it to give you a single subvolume called “/”</p>
<p>1 What happens if you restore a snapshot? Is it able to remove all those read-only Nix files, and restore the entire system to its former state?</p>
<p>2 If you get tired of such a simplistic setup, can you add subvolumes after installation, simply by defining them in configuration.nix?</p>
            </div>

          <div id='post_18' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discourse.nixos.org/u/Atemu'><span itemprop='name'>Atemu</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-03-10T19:25:25Z' class='post-time'>
                    March 10, 2024,  7:25pm
                  </time>
                  <meta itemprop='dateModified' content='2024-03-10T19:25:25Z'>

            <div class='post' itemprop='text'>
              <aside class="quote no-group" data-username="shmu26" data-post="17" data-topic="40826">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/shmu26/48/13143_2.png" class="avatar"> shmu26:</div>
<blockquote>
<p>1 What happens if you restore a snapshot? Is it able to remove all those read-only Nix files, and restore the entire system to its former state?</p>
</blockquote>
</aside>
<p>Depends on how exactly you plan on restoring the snapshot.</p>
<p>I am not aware of any filesystem-native method of overwriting the btrfs root subvolume (id=5) with another subvolume under it; you’d have to copy each file one-by-one.</p>
<p>Popular snapshotting frameworks assume certain subvolume layouts <em>below</em> the root subvolume for a reason.</p>
<p>Snapshotting <code>/nix</code> is quite useless though and rolling back its state can easily prevent you from booting your system. Don’t do it unless you know exactly what you are doing.</p>
<blockquote>
<p>If you get tired of such a simplistic setup, can you add subvolumes after installation, simply by defining them in configuration.nix?</p>
</blockquote>
<p>You could technically “add subvolumes by defining them in configuration.nix” in the sense that you can tell systemd-tmpfilesd to create <em>empty</em> subvolumes wherever you like.</p>
<p>You cannot make it automatically switch subvolume layouts for you though. You can tell NixOS to mount any subvolume layout you like but it won’t create or populate that layout for you; that’s up to you.</p>
<p>It is certainly possible to change the subvolume layout of an existing btrfs even while a live system is running on it. I’ve done it a few times. It’s also easy to mess this up though. Have a live distro at hand when attempting this.</p>
<p>Your best option is to manually create the subvolume layout you want and then install NixOS manually. I promise you that both of these are doable by mere mortals and not actually too hard.</p>
            </div>

              <aside class="quote no-group" data-username="Atemu" data-post="18" data-topic="40826">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/atemu/48/10383_2.png" class="avatar"> Atemu:</div>
<blockquote>
<p>I am not aware of any filesystem-native method of overwriting the btrfs root subvolume (id=5) with another subvolume under it; you’d have to copy each file one-by-one.</p>
</blockquote>
</aside>
<p>Sorry for the bump but I remembered something which invalidates this statement: What gets mounted by default when no subvolume is specified for the mount is the default subvolume, not the root subvol, and it can be changed.</p>
<p>So what you’d do is create a writeable snapshot of the snapshot you wish to restore and make it the default subvolume. If your Nix store mount is not separate, you’d have to copy over the Nix store from root subvol though as its state must match the state in /boot.</p>
            </div>
