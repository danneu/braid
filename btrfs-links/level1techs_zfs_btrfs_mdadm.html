        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_237345&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:4007832,\&quot;username\&quot;:\&quot;felix920506\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/felix920506/{size}/401407_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T06:11:24.779Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI recently purchased a mini pc, specifically a HP 800 G4 Mini, to run some services, as an upgrade from my current N100 box.\\u003c/p\\u003e\\n\\u003cp\\u003eI would like to have some storage redundancy in my setup, and my system will take 2 m.2 Nvme SSDs and a 2.5 sata ssd.\\u003c/p\\u003e\\n\\u003cp\\u003eI plan to use the 2 Nvme SSDs in a mirror / raid1 array for applications and the 2.5 sata ssd for my OS.\\u003c/p\\u003e\\n\\u003cp\\u003eI plan to use this storage for applications only, as I have a separate NAS.\\u003c/p\\u003e\\n\\u003cp\\u003eApplications I would like to move to this box are mainly Pterodactyl panel for game servers, and LibreNMS, both of which use MySQL as their database. Services will run in docker.\\u003c/p\\u003e\\n\\u003cp\\u003eMy questions:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eShould I use ZFS mirror, BTRFS Raid 1 or mdadm with Ext4 on top? People keep telling me that running databases on CoW file systems are bad but I like the checksumming and snapshots that ZFS and BTRFS provide.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eHow do I setup notifications in case a drive fails? I have a SNMP system setup via LibreNMS and would like notifications to preferably go through that.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eFor my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ol\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T06:11:24.779Z\&quot;,\&quot;reply_count\&quot;:4,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1446,\&quot;reads\&quot;:170,\&quot;readers_count\&quot;:169,\&quot;score\&quot;:7009.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:141520,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/1\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:4007851,\&quot;username\&quot;:\&quot;EfPe\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/efpe/{size}/249880_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T08:23:17.705Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eShould I use ZFS mirror, BTRFS Raid 1 or mdadm with Ext4 on top? People keep telling me that running databases on CoW file systems are bad but I like the checksumming and snapshots that ZFS and BTRFS provide.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI haven’t used BTRFS for a long time, but IIRC there were problems with multi-dev support / stability.\\u003cbr\\u003e\\nCoW vs DBs - this is more of a problem in case of HDDs - with COW, after a time, everything becomes “random read”.\\u003cbr\\u003e\\nIn case of ZFS, be sure to read relevant perf guides (for both ZFS and MySQL settings) in order to void write amplification and free space fragmentation.\\u003c/p\\u003e\\n\\u003cp\\u003emdadm+ext4 should also be OK, as long as backups are up to date. This is the simplest setup.\\u003cbr\\u003e\\nI’d recommend it if you do not want to spend time learning ZFS.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI have a SNMP system setup via LibreNMS and would like notifications to preferably go through that.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI have no exp connecting anything custom to SNMP, so can’t help here.\\u003cbr\\u003e\\nHowever ZFS can log to system log and also has its own notification model (see: \\u003ccode\\u003ezed\\u003c/code\\u003e, \\u003ccode\\u003ezedlets\\u003c/code\\u003e)\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eFor my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI always try to get different manufactures, but try to get “comparable” models.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;RagdollMeow\\\&quot; data-post=\\\&quot;2\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/letter_avatar_proxy/v4/letter/r/22d042/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e RagdollMeow:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eHave you considered Proxmox VE?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThis will just add an extra blockdev, kernel, pagecache and FS to the mix.\\u003cbr\\u003e\\nCan be desirable if one intends to move this VM around independent of host, but for such a small system - I wouldn’t go this way.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T08:23:17.705Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:2,\&quot;incoming_link_count\&quot;:12,\&quot;reads\&quot;:162,\&quot;readers_count\&quot;:161,\&quot;score\&quot;:97.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:\&quot;Patrons\&quot;,\&quot;flair_name\&quot;:\&quot;Patrons\&quot;,\&quot;flair_url\&quot;:\&quot;square-check\&quot;,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:\&quot;0cc\&quot;,\&quot;flair_group_id\&quot;:43,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:125181,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/3\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4007856,\&quot;username\&quot;:\&quot;djsumdog\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/djsumdog/{size}/152113_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T08:40:12.117Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eMy questions:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eShould I use ZFS mirror, BTRFS Raid 1 or mdadm with Ext4 on top? People keep telling me that running databases on CoW file systems are bad but I like the checksumming and snapshots that ZFS and BTRFS provide.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt’s really a personal preference. I really like ZFS-on-Linux and the command line tools are sooo much better than btrfs. ZFS is so easy to work with once you get use to pools, snapshots, etc. I never got use to the way btrfs did subvolumes or snapshots and I’ve since abandoned it on everything after running it for years. (Yes, I even have a natively encrypted ZFS root + ZFSBootMenu).\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003col start=\\\&quot;2\\\&quot;\\u003e\\n\\u003cli\\u003eHow do I setup notifications in case a drive fails? I have a SNMP system setup via LibreNMS and would like notifications to preferably go through that.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI really want to see answers to this myself. I have little to no monitoring on my home infrastructure and I really need to get around to fixing that. I started setting up Telegraf + Grafana but haven’t made progress on it in a while. I have grafana-loki running for a lot of my side-project application logs.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003col start=\\\&quot;3\\\&quot;\\u003e\\n\\u003cli\\u003eFor my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt’s difficult to make sure you have the exact same number of blocks when you use different models. I would personally just buy identical drives.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T08:40:12.117Z\&quot;,\&quot;reply_count\&quot;:3,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:21,\&quot;reads\&quot;:140,\&quot;readers_count\&quot;:139,\&quot;score\&quot;:158.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:118805,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4007857,\&quot;username\&quot;:\&quot;mietzen\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/mietzen/{size}/525365_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T08:53:36.810Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;djsumdog\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/djsumdog/48/152113_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e djsumdog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI really like ZFS-on-Linux and the command line tools are sooo much better than btrfs. ZFS is so easy to work with once you get use to pools, snapshots, etc. I never got use to the way btrfs did subvolumes or snapshots\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI running zfs on linux for the first time since 3 months and I can confirm this. I took me one afternoon to understand the basics and setup at debian install with zfs boot. The CLI tools are good and it was way less complicated than I expected. To me btrfs never felt production ready with the whole raid 5/6 troubles.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you don’t need the system right away I would recommend to just try out your different options, it’s the best way to learn in my opinion.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T08:53:36.810Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:121,\&quot;readers_count\&quot;:120,\&quot;score\&quot;:49.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Regular\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:146838,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/5\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4007869,\&quot;username\&quot;:\&quot;EfPe\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/efpe/{size}/249880_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T09:45:55.595Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;djsumdog\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/djsumdog/48/152113_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e djsumdog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIt’s difficult to make sure you have the exact same number of blocks when you use different models. I would personally just buy identical drives.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eNumber of blocks does not matter. ZFS will just use smaller capacity as mirror vdev cap.\\u003cbr\\u003e\\nSo if one has 2048 GB drive and 2049 GB and puts them in a mirror, then 2048 GB will be available for use.\\u003cbr\\u003e\\nWhen both will get replaced with bigger drives: more capacity will be available.\\u003c/p\\u003e\\n\\u003cp\\u003eIMHO it is much important to limit the risk of faulty NAND, faulty controllers, firmware bugs etc.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;djsumdog\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/djsumdog/48/152113_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e djsumdog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI never got use to the way btrfs did subvolumes or snapshots\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eSame \\u003cimg src=\\\&quot;https://forum.level1techs.com/images/emoji/twitter/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T09:46:22.790Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:121,\&quot;readers_count\&quot;:120,\&quot;score\&quot;:29.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:\&quot;Patrons\&quot;,\&quot;flair_name\&quot;:\&quot;Patrons\&quot;,\&quot;flair_url\&quot;:\&quot;square-check\&quot;,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:\&quot;0cc\&quot;,\&quot;flair_group_id\&quot;:43,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:125181,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/6\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4007873,\&quot;username\&quot;:\&quot;thro\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/22d042/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T10:12:50.788Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI wouldn’t be too concerned trying to put DBs on ZFS, oracle literally use ZFS for this and SSD will mitigate this somewhat.\\u003c/p\\u003e\\n\\u003cp\\u003eEither way, hardware sounds overkill for home DB use whatever filesystem you run.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS will give you snapshots, fast rebuilds, data integrity checking, and can read different data from both sides of the mirror at the same time for improved speed (as it doesn’t need to compare both sides as checksums do the data integrity checking).\\u003c/p\\u003e\\n\\u003cp\\u003eTraditional raid can’t do that.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T10:13:14.668Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:114,\&quot;readers_count\&quot;:113,\&quot;score\&quot;:52.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:118612,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/7\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4007874,\&quot;username\&quot;:\&quot;IgorDe\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/igorde/{size}/318647_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T11:06:22.214Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eWhat might be noteworthy in the context of ZFS vs mdadm is, that while ZFS provides protection against bitrot (albeit it requires I think CoW and ECC memory to ensure your source is correct as well as the data on a target volume is), you (or I) usually need it only for data, that’s lying around a lot.\\u003c/p\\u003e\\n\\u003cp\\u003emdadm is usually faster though, especially on NVMe drives, than ZFS, but if it comes to rebuilding the array, it’s often slower than ZFS, because it rebuilds the entire array while ZFS resilvers only the data.\\u003c/p\\u003e\\n\\u003cp\\u003eThat said I also went with ZFS on my 4 U.2 NVMe SSDs.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T13:10:14.345Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:7,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:111,\&quot;readers_count\&quot;:110,\&quot;score\&quot;:52.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:118612,\&quot;username\&quot;:\&quot;thro\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/22d042/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:133436,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/8\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4007904,\&quot;username\&quot;:\&quot;MikeGrok\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/mikegrok/{size}/393272_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-21T14:44:45.766Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eAlso remember that raid (and zfs and btrfs) is not backup. Also confiture your mysql to backup and write transaction logs to an independent device. When the primary drive dies, and you restore your daily snapshot, you then need to roll back the database transaction log to current. And you should be able to get up to the transaction where the db died from your transaction log. Or if you had a bad transaction, like root dropping an auth table, you can remove that from the transaction log and still get all of the other transactions.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T14:44:45.766Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:95,\&quot;readers_count\&quot;:94,\&quot;score\&quot;:29.0,\&quot;yours\&quot;:false,\&qu c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI haven’t used BTRFS for a long time, but IIRC there were problems with multi-dev support / stability.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThe problems are with parity raid (RAID5/6). Other modes are absolutely fine and production-ready (0/1/10/etc.). The btrfs tools will also give very scary warnings if you do something not recommended. BTRFS nowadays is well-tested and safe to use IMO.\\u003c/p\\u003e\\n\\u003cp\\u003eFor OP, given that he/she just wants a simple mirror, I’d recommend BTRFS. The big advantage of ZFS IMO is the availability of parity raid. if you only need a mirror BTRFS is the best option. The big drawback of ZFS is that it’s not in-tree and IMO should only be used on select distributions where you can be sure there’s out of the box support to avoid issues (especially if it’s for root).\\u003c/p\\u003e\\n\\u003cp\\u003emdadm mirrors have the big drawback vs. BTRFS or ZFS that you lose the self-healing properties. For a file system with ‘native’ raid support I’d always prefer that.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:10,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-21T21:14:37.336Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:3,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:4,\&quot;reads\&quot;:91,\&quot;readers_count\&quot;:90,\&quot;score\&quot;:68.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false, uot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/1o0g3cvm/48/514765_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e 1o0g3cvm:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWould this be true of SATA SSDs as well?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eSATA will be the bottleneck. In this case, ZFS/BTRFS/MDADM doesn’t matter much.\\u003c/p\\u003e\\n\\u003cp\\u003eIn practice, you will also have compression + encryption. Max throughput is not that important.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:15,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-22T14:26:59.065Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:13,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:78,\&quot;readers_count\&quot;:77,\&quot;score\&quot;:25.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:141769,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/15\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4008159,\&quot;username\&quot;:\&quot;Exard3k\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/exard3k/{size}/330060_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-22T15:33:19.994Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;djsumdog\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/djsumdog/48/152113_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e djsumdog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eZFS is so easy to work with once you get use to pools, snapshots, etc. I never got use to the way btrfs did subvolumes or snapshots\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI agree. Datasets in ZFS are way easier to  work with and CLI is way more intuitive in that regard. Working with BTRFS over the years mitigated that on my side just by having practice and using it often. It’s way more intuitive than e.g. Ceph CLI is, or  LVM and mdadm  which should be easier because simpler.\\u003c/p\\u003e\\n\\u003cp\\u003eOne stop shop \\u003ccode\\u003ebtrfs\\u003c/code\\u003e command is not bad once you figured out the method and design and structure of the “submenues” \\u003cimg src=\\\&quot;https://forum.level1techs.com/images/emoji/twitter/wink.png?v=12\\\&quot; title=\\\&quot;:wink:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:wink:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eI have BTRFS in use on several FS. But if  I have the choice of just-works FS and I’m presented with ZFS, I run ZFS.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;jxdking\\\&quot; data-post=\\\&quot;15\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/letter_avatar_proxy/v4/letter/j/e495f1/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e jxdking:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eSATA will be the bottleneck\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt always is. But the nature of bottlenecks is…there is always the next bottleneck waiting after you eliminate the present one. And after you fixed storage hardware and networking, memory bandwidth, kernel and generally software ,built for ages past, quickly take their place.\\u003cbr\\u003e\\nIn the end it’s about being happy with the stuff you do and not waiting for storage more than necessary.\\u003c/p\\u003e\\n\\u003cp\\u003eUse the stuff you’re familiar  with and probably will stay with you for the next 10 years. Important to me is how it feels and whether it provides the utility that makes my stuff more easy and care-free to run. Storage just needs to work and not slow things down.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:16,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-22T15:37:10.000Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:2,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:83,\&quot;readers_count\&quot;:82,\&quot;score\&quot;:36.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:134801,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/16\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4008232,\&quot;username\&quot;:\&quot;mattlach\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/mattlach/{size}/469208_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-22T19:19:47.577Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI tend to prefer ZFS.   Its protection against silent corruption is second to none, and its snapshots and command line management interface are amazing. Backups are also really convenient using the zfs send/recv function and sending stuff to another ZFS box.  But it is not the right application for everything.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS likes lots of RAM to perform well, and it is generally a good idea to use ECC for it.   It also does use some CPU (though this is less of a big deal today with our modern CPU’s than it was years ago)\\u003c/p\\u003e\\n\\u003cp\\u003eYou would also not want to use ZFS for swap space, as it can create a race condition if you do.   (RAM gets low, → greater need for swap space → ZFS ARC in RAM grows to accommodate more use → RAM is even lower → greater need for swap space → etc.)\\u003c/p\\u003e\\n\\u003cp\\u003eBTRFS is much like ZFS, but I honestly don’t have much personal experience with it.   I keep reading up on it to see where it stands, and keep hearing of people having problems.\\u003c/p\\u003e\\n\\u003cp\\u003eMDADM is an OK traditional software RAID solution.   CLI management is so-so, and can be a little counter-intuitive.   I have a two way MDADM mirror on my all in one NAS/VM server that only does swap (because of the ZFS issue mentioned above) but honestly it sits empty most of the time.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS can be hit or miss in the performance department.    It tends to perform \\u003cem\\u003ereally\\u003c/em\\u003e well on hard drives and SATA SSD’s.   Essentially any drive that is slow enough to allow for CPU operations while waiting for the drive will perform amazing on ZFS.  This is especially true for traditional hard drives, where its copy on write block based design helps overcome the seek limited random reads of drives, by essentially converting everything into sequential reads.   It was created in an era where traditional spinning hard drives were the norm, so the code kind of expects it to have ample time to do CPU computation while it waits for the drive.\\u003c/p\\u003e\\n\\u003cp\\u003eThis means that when NVMe drives are used as data drives, ZFS does not perform as well as expected.   While it will still be faster than on hard drives or SATA SSD’s, oftentimes, even on slower Gen3 NVMe drives, if these drives are used in the main data pool, you can get performance \\u003cem\\u003ebelow\\u003c/em\\u003e what you’d expect from a standalone drive.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS can - however - utilize NVMe drives as caches and so called “special” vdevs (for metadata and small file storage) very well.   These appear to be implemented in a way that is aware of modern high speed storage, and thus don’t appear to be held back as much by the problem where the CPU expects to be able to take its time while waiting for the drive.\\u003c/p\\u003e\\n\\u003cp\\u003eWrites can also be sped up a lot by using special purpose low latency devices as SLOG/LOG/ZIL devices.\\u003c/p\\u003e\\n\\u003cp\\u003eBut this tends to mean that ZFS is best when used in larger more complex pools, that have large amounts of RAM, mass storage over SATA or SAS, some dedicated special devices that are NVMe for metadata and small files,  some low latency devices (like Optane or battery backed RAM devices) for SLOG/LOG/ZIL and maybe even some read cache devices (which could also be NVMe) to speed up reads of frequently accessed files, while offloading the main data pool to do other stuff.\\u003c/p\\u003e\\n\\u003cp\\u003eThat said, you don’t \\u003cem\\u003ehave to\\u003c/em\\u003e have a large and complex ZFS pool to make use of ZFS.   I have plenty of systems that boot off of simple two-way mirrors.    Just don’t expect it to be a high performance solution with two NVMe drives.    Many people have the expectation that a basic two-way mirror is going to have twice the read speeds of a standalone drive, and with NVMe in ZFS this will simply not be the case.   Write speeds will also be comparatively slow (at least if they contain sync writes, which they likely should if you are using any kind of database)\\u003c/p\\u003e\\n\\u003cp\\u003eSo why do I still use ZFS this way?   Easy.  In those applications, performance is not the priority, and I love the reliability, flexibility and management of my ZFS pools.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat would I use instead if performance \\u003cem\\u003ewere\\u003c/em\\u003e a priority?   Not sure.   MDADM is not a performance screamer either.   I simply don’t know enough about how BTRFS performs in this situation but from what I read there are enough issues that I am not ready to use it.  At least not yet.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS decked out to the nines with special devices, gobs of RAM, SLOG devices and cache devices can have \\u003cem\\u003egreat\\u003c/em\\u003e performance for things like databases and the like, but in a basic two-way mirror form, you will not be impressed by the performance.    It won’t be \\u003cem\\u003eterrible\\u003c/em\\u003e.  It is totally usable, but it also won’t impress.\\u003c/p\\u003e\\n\\u003cp\\u003eI think in applications where high performance is crucial out of a simple two drive pool, I’d probably just use standalone drives to be honest, and just have something set up to do regular backups.\\u003c/p\\u003e\\n\\u003cp\\u003eThe thing is, RAID is not backup.  It helps you keep a greater uptime if something goes wrong, but it is never intended to replace the need for backups.    You should be backing up either way.\\u003c/p\\u003e\\n\\u003cp\\u003eWhich brings me back to the advantage of ZFS send/recv.\\u003c/p\\u003e\\n\\u003cp\\u003eIf your other NAS you mention runs on ZFS it would be stupidly easy to set up backups from any ZFS based pool anywhere on the network to just send incremental block-for-block backups to the main NAS.\\u003c/p\\u003e\\n\\u003cp\\u003eAnyway, I hope this helps.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:17,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-26T19:37:45.998Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:12,\&quot;reads\&quot;:78,\&quot;readers_count\&quot;:77,\&quot;score\&quot;:135.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:7,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:4}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:144143,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/17\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4009348,\&quot;username\&quot;:\&quot;ack\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/85f322/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-26T23:44:37.965Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI plan to use the 2 Nvme SSDs in a mirror / raid1 array for applications and the 2.5 sata ssd for my OS.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eRAID1 gets you enhanced read speed, which often doesn’t matter given how high fast reading is on a decent NVMe.\\u003c/p\\u003e\\n\\u003cp\\u003eThe typical reason to use RAID1 is to have no downtime in the case of one drive failure, that is - you get better availability.\\u003c/p\\u003e\\n\\u003cp\\u003eHowever if your OS still sits on a single drive then you won’t get that benefit - with one drive failure you will be offline while you reinstall and reconfigure the OS could take a few minutes, or a few hours.\\u003c/p\\u003e\\n\\u003cp\\u003ezfs, btrfs, mdadm will all work fine.\\u003c/p\\u003e\\n\\u003cp\\u003eAt home I tend not to bother thinking about mirroring, and focus on backups instead. As a general rule, human error remains a greater cause of outages than hardware faults, and has been the most common cause of loss data for me.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you do go with mirroring I’d suggest mirroring your OS filesystems too. Beware of how the UEFI interacts with software mirroring and your ESP partition.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-26T23:51:17.522Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:5,\&quot;reads\&quot;:62,\&quot;readers_count\&quot;:61,\&quot;score\&quot;:52.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:237345,\&quot;topic_slug\&quot;:\&quot;zfs-vs-btrfs-vs-mdadm\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:140313,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/zfs-vs-btrfs-vs-mdadm/237345/18\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:4009355,\&quot;username\&quot;:\&quot;Janos\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/j/ad7895/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-09-27T00:09:55.150Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;felix920506\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;237345\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e felix920506:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eFor my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eAvoiding bad batches can be an topic, either buy from two different retailers and hope the disks are from different batches, or use two NVMe drives from different manufacturers that are as similar as possible and create partitions of the same size.\\u003cbr\\u003e\\nThis isn’t a problem under Linux.\\u003c/p\\u003e\\n\\u003cp\\u003eWhole disks vs partitions\\u003c/p\\u003e\\n\\u003cp\\u003eZFS will behave differently on different platforms when given a whole disk.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS will also attempt minor tweaks on various platforms when whole disks are provided. On Illumos, ZFS will enable the disk cache for performance. It will not do this when given partitions to protect other filesystems sharing the disks that might not be tolerant of the disk cache, such as UFS. On Linux, the IO elevator will be set to noop to reduce CPU overhead. ZFS has its own internal IO elevator, which renders the Linux elevator redundant. The Performance Tuning page explains this behavior in more detail.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://openzfs.readthedocs.io/en/latest/performance-tuning.html\\\&quot; class=\\\&quot;onebox\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehttps://openzfs.readthedocs.io/en/latest/performance-tuning.html\\u003c/a\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:19,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:20,\&quot;updated_at\&quot;:\&quot;2025-09-27T00:09:55.150Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:8,\&quot;reads\&quot;:61,\&quot;readers_count\&quot;:60,\&quot;score\&quot;:52.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;                 <link itemprop="mainEntityOfPage" href="https://forum.level1techs.com/t/zfs-vs-btrfs-vs-mdadm/237345">


              <span class="crawler-post-infos">
                  <time  datetime='2025-09-21T06:11:24Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>I recently purchased a mini pc, specifically a HP 800 G4 Mini, to run some services, as an upgrade from my current N100 box.</p>
<p>I would like to have some storage redundancy in my setup, and my system will take 2 m.2 Nvme SSDs and a 2.5 sata ssd.</p>
<p>I plan to use the 2 Nvme SSDs in a mirror / raid1 array for applications and the 2.5 sata ssd for my OS.</p>
<p>I plan to use this storage for applications only, as I have a separate NAS.</p>
<p>Applications I would like to move to this box are mainly Pterodactyl panel for game servers, and LibreNMS, both of which use MySQL as their database. Services will run in docker.</p>
<p>My questions:</p>
<ol>
<li>
<p>Should I use ZFS mirror, BTRFS Raid 1 or mdadm with Ext4 on top? People keep telling me that running databases on CoW file systems are bad but I like the checksumming and snapshots that ZFS and BTRFS provide.</p>
</li>
<li>
<p>How do I setup notifications in case a drive fails? I have a SNMP system setup via LibreNMS and would like notifications to preferably go through that.</p>
</li>
<li>
<p>For my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?</p>
</li>
</ol>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">

          <div id='post_3' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>

              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/EfPe'><span itemprop='name'>EfPe</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-09-21T08:23:17Z' class='post-time'>
                    September 21, 2025,  8:23am
                  </time>
                  <meta itemprop='dateModified' content='2025-09-21T08:23:17Z'>

            <div class='post' itemprop='text'>
              <aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<p>Should I use ZFS mirror, BTRFS Raid 1 or mdadm with Ext4 on top? People keep telling me that running databases on CoW file systems are bad but I like the checksumming and snapshots that ZFS and BTRFS provide.</p>
</blockquote>
</aside>
<p>I haven’t used BTRFS for a long time, but IIRC there were problems with multi-dev support / stability.<br>
CoW vs DBs - this is more of a problem in case of HDDs - with COW, after a time, everything becomes “random read”.<br>
In case of ZFS, be sure to read relevant perf guides (for both ZFS and MySQL settings) in order to void write amplification and free space fragmentation.</p>
<p>mdadm+ext4 should also be OK, as long as backups are up to date. This is the simplest setup.<br>
I’d recommend it if you do not want to spend time learning ZFS.</p>
<aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<p>I have a SNMP system setup via LibreNMS and would like notifications to preferably go through that.</p>
</blockquote>
</aside>
<p>I have no exp connecting anything custom to SNMP, so can’t help here.<br>
However ZFS can log to system log and also has its own notification model (see: <code>zed</code>, <code>zedlets</code>)</p>
<aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<p>For my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?</p>
</blockquote>
</aside>
<p>I always try to get different manufactures, but try to get “comparable” models.</p>
<aside class="quote no-group" data-username="RagdollMeow" data-post="2" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/letter_avatar_proxy/v4/letter/r/22d042/48.png" class="avatar"> RagdollMeow:</div>
<blockquote>
<p>Have you considered Proxmox VE?</p>
</blockquote>
</aside>
<p>This will just add an extra blockdev, kernel, pagecache and FS to the mix.<br>
Can be desirable if one intends to move this VM around independent of host, but for such a small system - I wouldn’t go this way.</p>

              <aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<p>My questions:</p>
<ol>
<li>Should I use ZFS mirror, BTRFS Raid 1 or mdadm with Ext4 on top? People keep telling me that running databases on CoW file systems are bad but I like the checksumming and snapshots that ZFS and BTRFS provide.</li>
</ol>
</blockquote>
</aside>
<p>It’s really a personal preference. I really like ZFS-on-Linux and the command line tools are sooo much better than btrfs. ZFS is so easy to work with once you get use to pools, snapshots, etc. I never got use to the way btrfs did subvolumes or snapshots and I’ve since abandoned it on everything after running it for years. (Yes, I even have a natively encrypted ZFS root + ZFSBootMenu).</p>
<aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<ol start="2">
<li>How do I setup notifications in case a drive fails? I have a SNMP system setup via LibreNMS and would like notifications to preferably go through that.</li>
</ol>
</blockquote>
</aside>
<p>I really want to see answers to this myself. I have little to no monitoring on my home infrastructure and I really need to get around to fixing that. I started setting up Telegraf + Grafana but haven’t made progress on it in a while. I have grafana-loki running for a lot of my side-project application logs.</p>
<aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<ol start="3">
<li>For my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?</li>
</ol>
</blockquote>
</aside>
<p>It’s difficult to make sure you have the exact same number of blocks when you use different models. I would personally just buy identical drives.</p>

<p>I really like ZFS-on-Linux and the command line tools are sooo much better than btrfs. ZFS is so easy to work with once you get use to pools, snapshots, etc. I never got use to the way btrfs did subvolumes or snapshots</p>

<p>I running zfs on linux for the first time since 3 months and I can confirm this. I took me one afternoon to understand the basics and setup at debian install with zfs boot. The CLI tools are good and it was way less complicated than I expected. To me btrfs never felt production ready with the whole raid 5/6 troubles.</p>

<blockquote>
<p>It’s difficult to make sure you have the exact same number of blocks when you use different models. I would personally just buy identical drives.</p>
</blockquote>
</aside>
<p>Number of blocks does not matter. ZFS will just use smaller capacity as mirror vdev cap.<br>
So if one has 2048 GB drive and 2049 GB and puts them in a mirror, then 2048 GB will be available for use.<br>
When both will get replaced with bigger drives: more capacity will be available.</p>
<p>IMHO it is much important to limit the risk of faulty NAND, faulty controllers, firmware bugs etc.</p>

            <div class='post' itemprop='text'>
              <p>I wouldn’t be too concerned trying to put DBs on ZFS, oracle literally use ZFS for this and SSD will mitigate this somewhat.</p>
<p>Either way, hardware sounds overkill for home DB use whatever filesystem you run.</p>
<p>ZFS will give you snapshots, fast rebuilds, data integrity checking, and can read different data from both sides of the mirror at the same time for improved speed (as it doesn’t need to compare both sides as checksums do the data integrity checking).</p>
<p>Traditional raid can’t do that.</p>
            </div>

          <div id='post_8' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/IgorDe'><span itemprop='name'>IgorDe</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-09-21T11:06:22Z' class='post-time'>
                    September 21, 2025, 11:06am
                  </time>
                  <meta itemprop='dateModified' content='2025-09-21T13:10:14Z'>
              <span itemprop='position'>8</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>What might be noteworthy in the context of ZFS vs mdadm is, that while ZFS provides protection against bitrot (albeit it requires I think CoW and ECC memory to ensure your source is correct as well as the data on a target volume is), you (or I) usually need it only for data, that’s lying around a lot.</p>
<p>mdadm is usually faster though, especially on NVMe drives, than ZFS, but if it comes to rebuilding the array, it’s often slower than ZFS, because it rebuilds the entire array while ZFS resilvers only the data.</p>
<p>That said I also went with ZFS on my 4 U.2 NVMe SSDs.</p>
            </div>

          <div id='post_9' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>

                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/MikeGrok'><span itemprop='name'>MikeGrok</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-09-21T14:44:45Z' class='post-time'>
                    September 21, 2025,  2:44pm
                  </time>
                  <meta itemprop='dateModified' content='2025-09-21T14:44:45Z'>
              <span itemprop='position'>9</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Also remember that raid (and zfs and btrfs) is not backup. Also confiture your mysql to backup and write transaction logs to an independent device. When the primary drive dies, and you restore your daily snapshot, you then need to roll back the database transaction log to current. And you should be able to get up to the transaction where the db died from your transaction log. Or if you had a bad transaction, like root dropping an auth table, you can remove that from the transaction log and still get all of the other transactions.</p>
            </div>

<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/efpe/48/249880_2.png" class="avatar"> EfPe:</div>
<blockquote>
<p>I haven’t used BTRFS for a long time, but IIRC there were problems with multi-dev support / stability.</p>
</blockquote>
</aside>
<p>The problems are with parity raid (RAID5/6). Other modes are absolutely fine and production-ready (0/1/10/etc.). The btrfs tools will also give very scary warnings if you do something not recommended. BTRFS nowadays is well-tested and safe to use IMO.</p>
<p>For OP, given that he/she just wants a simple mirror, I’d recommend BTRFS. The big advantage of ZFS IMO is the availability of parity raid. if you only need a mirror BTRFS is the best option. The big drawback of ZFS is that it’s not in-tree and IMO should only be used on select distributions where you can be sure there’s out of the box support to avoid issues (especially if it’s for root).</p>
<p>mdadm mirrors have the big drawback vs. BTRFS or ZFS that you lose the self-healing properties. For a file system with ‘native’ raid support I’d always prefer that.</p>
            </div>

<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/djsumdog/48/152113_2.png" class="avatar"> djsumdog:</div>
<blockquote>
<p>ZFS is so easy to work with once you get use to pools, snapshots, etc. I never got use to the way btrfs did subvolumes or snapshots</p>
</blockquote>
</aside>
<p>I agree. Datasets in ZFS are way easier to  work with and CLI is way more intuitive in that regard. Working with BTRFS over the years mitigated that on my side just by having practice and using it often. It’s way more intuitive than e.g. Ceph CLI is, or  LVM and mdadm  which should be easier because simpler.</p>
<p>One stop shop <code>btrfs</code> command is not bad once you figured out the method and design and structure of the “submenues” <img src="https://forum.level1techs.com/images/emoji/twitter/wink.png?v=12" title=":wink:" class="emoji" alt=":wink:" loading="lazy" width="20" height="20"></p>
<p>I have BTRFS in use on several FS. But if  I have the choice of just-works FS and I’m presented with ZFS, I run ZFS.</p>
<aside class="quote no-group" data-username="jxdking" data-post="15" data-topic="237345">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/letter_avatar_proxy/v4/letter/j/e495f1/48.png" class="avatar"> jxdking:</div>
<blockquote>
<p>SATA will be the bottleneck</p>
</blockquote>
</aside>
<p>It always is. But the nature of bottlenecks is…there is always the next bottleneck waiting after you eliminate the present one. And after you fixed storage hardware and networking, memory bandwidth, kernel and generally software ,built for ages past, quickly take their place.<br>
In the end it’s about being happy with the stuff you do and not waiting for storage more than necessary.</p>
<p>Use the stuff you’re familiar  with and probably will stay with you for the next 10 years. Important to me is how it feels and whether it provides the utility that makes my stuff more easy and care-free to run. Storage just needs to work and not slow things down.</p>
            </div>

              <span class="crawler-post-infos">

              </span>

            <div class='post' itemprop='text'>
              <p>I tend to prefer ZFS.   Its protection against silent corruption is second to none, and its snapshots and command line management interface are amazing. Backups are also really convenient using the zfs send/recv function and sending stuff to another ZFS box.  But it is not the right application for everything.</p>
<p>ZFS likes lots of RAM to perform well, and it is generally a good idea to use ECC for it.   It also does use some CPU (though this is less of a big deal today with our modern CPU’s than it was years ago)</p>
<p>You would also not want to use ZFS for swap space, as it can create a race condition if you do.   (RAM gets low, → greater need for swap space → ZFS ARC in RAM grows to accommodate more use → RAM is even lower → greater need for swap space → etc.)</p>
<p>BTRFS is much like ZFS, but I honestly don’t have much personal experience with it.   I keep reading up on it to see where it stands, and keep hearing of people having problems.</p>
<p>MDADM is an OK traditional software RAID solution.   CLI management is so-so, and can be a little counter-intuitive.   I have a two way MDADM mirror on my all in one NAS/VM server that only does swap (because of the ZFS issue mentioned above) but honestly it sits empty most of the time.</p>
<p>ZFS can be hit or miss in the performance department.    It tends to perform <em>really</em> well on hard drives and SATA SSD’s.   Essentially any drive that is slow enough to allow for CPU operations while waiting for the drive will perform amazing on ZFS.  This is especially true for traditional hard drives, where its copy on write block based design helps overcome the seek limited random reads of drives, by essentially converting everything into sequential reads.   It was created in an era where traditional spinning hard drives were the norm, so the code kind of expects it to have ample time to do CPU computation while it waits for the drive.</p>
<p>This means that when NVMe drives are used as data drives, ZFS does not perform as well as expected.   While it will still be faster than on hard drives or SATA SSD’s, oftentimes, even on slower Gen3 NVMe drives, if these drives are used in the main data pool, you can get performance <em>below</em> what you’d expect from a standalone drive.</p>
<p>ZFS can - however - utilize NVMe drives as caches and so called “special” vdevs (for metadata and small file storage) very well.   These appear to be implemented in a way that is aware of modern high speed storage, and thus don’t appear to be held back as much by the problem where the CPU expects to be able to take its time while waiting for the drive.</p>
<p>Writes can also be sped up a lot by using special purpose low latency devices as SLOG/LOG/ZIL devices.</p>
<p>But this tends to mean that ZFS is best when used in larger more complex pools, that have large amounts of RAM, mass storage over SATA or SAS, some dedicated special devices that are NVMe for metadata and small files,  some low latency devices (like Optane or battery backed RAM devices) for SLOG/LOG/ZIL and maybe even some read cache devices (which could also be NVMe) to speed up reads of frequently accessed files, while offloading the main data pool to do other stuff.</p>
<p>That said, you don’t <em>have to</em> have a large and complex ZFS pool to make use of ZFS.   I have plenty of systems that boot off of simple two-way mirrors.    Just don’t expect it to be a high performance solution with two NVMe drives.    Many people have the expectation that a basic two-way mirror is going to have twice the read speeds of a standalone drive, and with NVMe in ZFS this will simply not be the case.   Write speeds will also be comparatively slow (at least if they contain sync writes, which they likely should if you are using any kind of database)</p>
<p>So why do I still use ZFS this way?   Easy.  In those applications, performance is not the priority, and I love the reliability, flexibility and management of my ZFS pools.</p>
<p>What would I use instead if performance <em>were</em> a priority?   Not sure.   MDADM is not a performance screamer either.   I simply don’t know enough about how BTRFS performs in this situation but from what I read there are enough issues that I am not ready to use it.  At least not yet.</p>
<p>ZFS decked out to the nines with special devices, gobs of RAM, SLOG devices and cache devices can have <em>great</em> performance for things like databases and the like, but in a basic two-way mirror form, you will not be impressed by the performance.    It won’t be <em>terrible</em>.  It is totally usable, but it also won’t impress.</p>
<p>I think in applications where high performance is crucial out of a simple two drive pool, I’d probably just use standalone drives to be honest, and just have something set up to do regular backups.</p>
<p>The thing is, RAID is not backup.  It helps you keep a greater uptime if something goes wrong, but it is never intended to replace the need for backups.    You should be backing up either way.</p>
<p>Which brings me back to the advantage of ZFS send/recv.</p>
<p>If your other NAS you mention runs on ZFS it would be stupidly easy to set up backups from any ZFS based pool anywhere on the network to just send incremental block-for-block backups to the main NAS.</p>
<p>Anyway, I hope this helps.</p>
            </div>

              <aside class="quote no-group" data-username="felix920506" data-post="1" data-topic="237345">

<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/felix920506/48/401407_2.png" class="avatar"> felix920506:</div>
<blockquote>
<p>I plan to use the 2 Nvme SSDs in a mirror / raid1 array for applications and the 2.5 sata ssd for my OS.</p>
</blockquote>
</aside>
<p>RAID1 gets you enhanced read speed, which often doesn’t matter given how high fast reading is on a decent NVMe.</p>
<p>The typical reason to use RAID1 is to have no downtime in the case of one drive failure, that is - you get better availability.</p>
<p>However if your OS still sits on a single drive then you won’t get that benefit - with one drive failure you will be offline while you reinstall and reconfigure the OS could take a few minutes, or a few hours.</p>
<p>zfs, btrfs, mdadm will all work fine.</p>
<p>At home I tend not to bother thinking about mirroring, and focus on backups instead. As a general rule, human error remains a greater cause of outages than hardware faults, and has been the most common cause of loss data for me.</p>
<p>If you do go with mirroring I’d suggest mirroring your OS filesystems too. Beware of how the UEFI interacts with software mirroring and your ESP partition.</p>

<blockquote>
<p>For my 2 Nvme drives in the raid array, should I get 2 different models from different manufacturers or is having 2 of the same drives fine?</p>
</blockquote>
</aside>
<p>Avoiding bad batches can be an topic, either buy from two different retailers and hope the disks are from different batches, or use two NVMe drives from different manufacturers that are as similar as possible and create partitions of the same size.<br>
This isn’t a problem under Linux.</p>
<p>Whole disks vs partitions</p>
<p>ZFS will behave differently on different platforms when given a whole disk.</p>
<p>ZFS will also attempt minor tweaks on various platforms when whole disks are provided. On Illumos, ZFS will enable the disk cache for performance. It will not do this when given partitions to protect other filesystems sharing the disks that might not be tolerant of the disk cache, such as UFS. On Linux, the IO elevator will be set to noop to reduce CPU overhead. ZFS has its own internal IO elevator, which renders the Linux elevator redundant. The Performance Tuning page explains this behavior in more detail.</p>
<p><a href="https://openzfs.readthedocs.io/en/latest/performance-tuning.html" class="onebox" target="_blank" rel="noopener nofollow ugc">https://openzfs.readthedocs.io/en/latest/performance-tuning.html</a></p>
