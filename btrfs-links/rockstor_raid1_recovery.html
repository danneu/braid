        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_9642&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:30041,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;stitch10925\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/stitch10925/{size}/4163_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-08-08T20:09:45.955Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;first-off-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#first-off-1\\\&quot;\\u003e\\u003c/a\\u003eFirst off\\u003c/h3\\u003e\\n\\u003cp\\u003eHey everyone! I hope everyone is doing well. Still loving Rockstor and still recommending it whenever I can (also hooked my dad up with Rockstor). Sorry that I kind of disappeared on you guys, but you know how that goes. I guess, no news is good news, right? \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/wink.png?v=12\\\&quot; title=\\\&quot;:wink:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:wink:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;description-of-the-problem-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#description-of-the-problem-2\\\&quot;\\u003e\\u003c/a\\u003eDescription of the problem\\u003c/h3\\u003e\\n\\u003cp\\u003eI have a pool containing 2 drives in raid1 configuration. One of the drives failed and the pool is now in read-only mode. I removed the broken drive and added a new one, however, I am unsure on how to rebuild the pool.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;what-i-tried-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#what-i-tried-3\\\&quot;\\u003e\\u003c/a\\u003eWhat I tried\\u003c/h3\\u003e\\n\\u003cp\\u003eI went through the documentation but I’m unsure on what to do. I tried making the pool a “single” pool, but this fails when balancing. According to my research that could mean that there were stripes on the other drive that are now missing.\\u003c/p\\u003e\\n\\u003cp\\u003eI tried going through the Re-raid process to add the new drive to the pool, but also this fails because the remaining drive is in read-only mode.\\u003c/p\\u003e\\n\\u003cp\\u003eI did read something about having to restart to make the pool read-write again (I’m not clear on when this can be done. When the failing drive has been removed?)\\u003c/p\\u003e\\n\\u003cp\\u003eI’m a bit surprised that getting the pool back in order seems to be a tedious process. In my mind it should be as simple as sticking in a new drive and re-replicating the data. Clearly I’m not completely understanding the process or how btrfs works.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;further-questions-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#further-questions-4\\\&quot;\\u003e\\u003c/a\\u003eFurther questions\\u003c/h3\\u003e\\n\\u003cp\\u003eWhile doing research I read about raid1c3 and raid1c4. I’m not sure if they are available in Rockstor, but what I am wondering about these raid levels is the following:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIn raid1 at least 2 copies of the data are kept, allowing 1 drive to fail. In raid1c3, 3 copies of data are kept, so I assume 2 drives are allowed to fail. And by extension raid1c4 would allow for 3 drives to fail. Is this correct?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWhen you put your drives in raid1, but add more drives, what happens to those drives? For example, let’s say you set up raid1 with 3 drives, then 2 copies are maintained. What happens with the 3rd drive? Is it just there as hot-spare? Is it used for striping? Or … ?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:7,\&quot;updated_at\&quot;:\&quot;2024-08-12T22:20:37.465Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:393,\&quot;reads\&quot;:18,\&quot;readers_count\&quot;:17,\&quot;score\&quot;:1953.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:9642,\&quot;topic_slug\&quot;:\&quot;solved-not-sure-how-to-recover-from-raid1-drive-failure\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4294,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/solved-not-sure-how-to-recover-from-raid1-drive-failure/9642/1\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:30042,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;stitch10925\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/stitch10925/{size}/4163_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-08-09T08:33:31.651Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eIn the logs of my backup I noticed that some files could not be copied because of “Input/Output Errors”. So I’m surely looking at some data-loss.\\u003c/p\\u003e\\n\\u003cp\\u003ePartly my fault of course, since I didn’t have backups before. But that’s why I had raid1, to have a copy of the data in case a drive goes bad. I guess that wasn’t enough.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:7,\&quot;updated_at\&quot;:\&quot;2024-08-09T08:33:31.651Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:17,\&quot;readers_count\&quot;:16,\&quot;score\&quot;:8.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:9642,\&quot;topic_slug\&quot;:\&quot;solved-not-sure-how-to-recover-from-raid1-drive-failure\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4294,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/solved-not-sure-how-to-recover-from-raid1-drive-failure/9642/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:30058,\&quot;name\&quot;:\&quot;Kilroy\&quot;,\&quot;username\&quot;:\&quot;KilroyLichking\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/k/85e7bf/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-08-10T05:34:35.626Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003ehowdy stitch.\\u003c/p\\u003e\\n\\u003cp\\u003eSorry to hear about your hardware failure. This forum post talks about replacing drives \\u003ca href=\\\&quot;https://forum.rockstor.com/t/what-is-the-process-for-replacing-a-bad-drive/7741\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eWhat is the process for replacing a bad drive?\\u003c/a\\u003e. TLDR\\u003c/p\\u003e\\n\\u003cp\\u003eI believe you should be able to replace the drive in cli\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ebtrfs replace [drive id] [new drive] /mnt2/pool-name\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eThe data that is corrupted you should be able to run scrub and either replace the bad sectors from a snapshot or remove the bad files and replace from a cold storage.\\u003c/p\\u003e\\n\\u003cp\\u003eWiki says that when you place a third drive in raid 1 (mirror) you don’t increase the total striped volume of the pool you just add yet another spare of the data that is maintained across the array essentially giving you 2 failure before you lose everything.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:7,\&quot;updated_at\&quot;:\&quot;2024-08-10T05:34:35.626Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:17,\&quot;readers_count\&quot;:16,\&quot;score\&quot;:83.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:9642,\&quot;topic_slug\&quot;:\&quot;solved-not-sure-how-to-recover-from-raid1-drive-failure\&quot;,\&quot;display_username\&quot;:\&quot;Kilroy\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.rockstor.com/t/what-is-the-process-for-replacing-a-bad-drive/7741\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;What is the process for replacing a bad drive?\&quot;,\&quot;clicks\&quot;:8}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:4294,\&quot;username\&quot;:\&quot;stitch10925\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/stitch10925/{size}/4163_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4664,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/solved-not-sure-how-to-recover-from-raid1-drive-failure/9642/3\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:30061,\&quot;name\&quot;:\&quot;Philip Guyton\&quot;,\&quot;username\&quot;:\&quot;phillxnet\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/phillxnet/{size}/15_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-08-10T12:00:54.214Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/stitch10925\\\&quot;\\u003e@stitch10925\\u003c/a\\u003e Hello again, nice to hear you are still around.\\u003cbr\\u003e\\nRe:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI have a pool containing 2 drives in raid1 configuration. One of the drives failed and the pool is now in read-only mode.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes, btrfs will mostly go read-only on significant issues to avoid cascade failure. In your case, if the drive died, then you have a btrfs-raid1 (2 drive minimum) with only one drive. So the defined by btrfs profile 2 copies across 2 independent drives can’t be met. So a read-only stance ensures no more data is written with only one copy. But all original data/metadata now exists only on one drive (Pool member). And as the pool is now read-only; you are unable to modify it: which includes adding a drive to it.\\u003c/p\\u003e\\n\\u003cp\\u003eLikely what you need is a \\u003ccode\\u003edegraded\\u003c/code\\u003e mount option: this normally allows for a Pool to be mounted read-write (rw) even when it is in a degraded state (missing a prior member). You should then, via the rw access, be able to use the \\u003ccode\\u003eResize/ReRaid Pool\\u003c/code\\u003e option within the Pool’s detail view. I.e. add a drive to the Pool so that it can again meet it’s goal of storing 2 copies of data or metadata on 2 independent drives.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you are running a more recent Rockstor version (last few years) the Web-UI should advise you on these steps. Take a look at the following doc section, specifically the reference to our \\u003cstrong\\u003eMaintenance required\\u003c/strong\\u003e Web-UI element:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://rockstor.com/docs/data_loss.html#pool-degraded-indicators\\\&quot; class=\\\&quot;onebox\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003ehttps://rockstor.com/docs/data_loss.html#pool-degraded-indicators\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/kilroylichking\\\&quot;\\u003e@KilroyLichking\\u003c/a\\u003e Thanks for chipping in on this one. We should keep in mind that if a btrfs-raid1 Pool has more than 2 drives: it still only keeps 2 copies on two different drives. It can just spread the use of the drives out: but there is still only two copies. Which leads into:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWhile doing research I read about raid1c3 and raid1c4.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThese profiles are basic extension of btrfs-raid1 but the c3 means 3 copies across 3 different drives: again irrispective of actual drive count. And the c4 qualifier similarly means a minimum of 4 copies on 4 different drives, irrispective of total Pool drive count.\\u003c/p\\u003e\\n\\u003cp\\u003eExactly as you have indicated in your synopsis.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIn raid1 at least 2 copies of the data are kept, allowing 1 drive to fail. In raid1c3, 3 copies of data are kept, so I assume 2 drives are allowed to fail. And by extension raid1c4 would allow for 3 drives to fail. Is this correct?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWhen you put your drives in raid1, but add more drives, what happens to those drives?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThe add to available space, and spread the read-write load of the Pool.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eFor example, let’s say you set up raid1 with 3 drives, then 2 copies are maintained.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes.\\u003c/p\\u003e\\n\\u003cp\\u003eBut on every write 2 different drives may be chosen, i.e. write1 to drive 1\\u0026amp;2, write2 to drive 1\\u0026amp;3. The key here is that btrfs raid is chunk based, not drive based. But is drive aware in order to maintain independent drive use. See our:\\u003cbr\\u003e\\n\\u003cstrong\\u003eThe nature of btrfs\\u003c/strong\\u003e: \\u003ca href=\\\&quot;https://rockstor.com/docs/data_loss.html#btrfsnature\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eData loss - prevention and recovery in Rockstor — Rockstor documentation\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWe have an explanation, along with redundancy capabilities in the following doc section:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eRedundancy Profiles\\u003c/strong\\u003e: \\u003ca href=\\\&quot;https://rockstor.com/docs/interface/storage/pools-btrfs.html#redundancyprofiles\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003ePools — Rockstor documentation\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAnd to answer:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI read about raid1c3 and raid1c4. I’m not sure if they are available in Rockstor\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eWe use to require a Kernel backport as they are newer profiles based on the older btrfs-raid1. But if your install is “Build on openSUSE Leap 15.6 …” then it has a new-enough kernel to accomodate. Plus our docs need updating on the following how-to: \\u003ca href=\\\&quot;https://rockstor.com/docs/howtos/stable_kernel_backport.html\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eInstalling the Stable Kernel Backport — Rockstor documentation\\u003c/a\\u003e as we have supported btrfs-raid1c3 and btrfs-raid1c4 and many of the sane combinations of mixed raid involving these newer more robust profiles since 4.5.9-1 via:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox githubpullrequest\\\&quot; data-onebox-src=\\\&quot;https://github.com/rockstor/rockstor-core/pull/2524\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/2524\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003egithub.com/rockstor/rockstor-core\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;github-row\\\&quot; data-github-private-repo=\\\&quot;false\\\&quot;\\u003e\\n\\n\\n\\n    \\u003cdiv class=\\\&quot;github-icon-container\\\&quot; title=\\\&quot;Pull Request\\\&quot;\\u003e\\n      \\u003csvg width=\\\&quot;60\\\&quot; height=\\\&quot;60\\\&quot; class=\\\&quot;github-icon\\\&quot; viewBox=\\\&quot;0 0 12 16\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cpath fill-rule=\\\&quot;evenodd\\\&quot; d=\\\&quot;M11 11.28V5c-.03-.78-.34-1.47-.94-2.06C9.46 2.35 8.78 2.03 8 2H7V0L4 3l3 3V4h1c.27.02.48.11.69.31.21.2.3.42.31.69v6.28A1.993 1.993 0 0 0 10 15a1.993 1.993 0 0 0 1-3.72zm-1 2.92c-.66 0-1.2-.55-1.2-1.2 0-.65.55-1.2 1.2-1.2.65 0 1.2.55 1.2 1.2 0 .65-.55 1.2-1.2 1.2zM4 3c0-1.11-.89-2-2-2a1.993 1.993 0 0 0-1 3.72v6.56A1.993 1.993 0 0 0 2 15a1.993 1.993 0 0 0 1-3.72V4.72c.59-.34 1-.98 1-1.72zm-.8 10c0 .66-.55 1.2-1.2 1.2-.65 0-1.2-.55-1.2-1.2 0-.65.55-1.2 1.2-1.2.65 0 1.2.55 1.2 1.2zM2 4.2C1.34 4.2.8 3.65.8 3c0-.65.55-1.2 1.2-1.2.65 0 1.2.55 1.2 1.2 0 .65-.55 1.2-1.2 1.2z\\\&quot;\\u003e\\u003c/path\\u003e\\u003c/svg\\u003e\\n    \\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-info-container\\\&quot;\\u003e\\n\\n\\n\\n      \\u003ch4\\u003e\\n        \\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/2524\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003eAdd mixed raid levels #2520\\u003c/a\\u003e\\n      \\u003c/h4\\u003e\\n\\n    \\u003cdiv class=\\\&quot;branches\\\&quot;\\u003e\\n      \\u003ccode\\u003erockstor:testing\\u003c/code\\u003e ← \\u003ccode\\u003ephillxnet:2520_Add_mixed_raid_levels\\u003c/code\\u003e\\n    \\u003c/div\\u003e\\n\\n      \\u003cdiv class=\\\&quot;github-info\\\&quot;\\u003e\\n        \\u003cdiv class=\\\&quot;date\\\&quot;\\u003e\\n          opened \\u003cspan class=\\\&quot;discourse-local-date\\\&quot; data-format=\\\&quot;ll\\\&quot; data-date=\\\&quot;2023-03-25\\\&quot; data-time=\\\&quot;18:54:40\\\&quot; data-timezone=\\\&quot;UTC\\\&quot;\\u003e06:54PM - 25 Mar 23 UTC\\u003c/span\\u003e\\n        \\u003c/div\\u003e\\n\\n        \\u003cdiv class=\\\&quot;user\\\&quot;\\u003e\\n          \\u003ca href=\\\&quot;https://github.com/phillxnet\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003e\\n            \\u003cimg alt=\\\&quot;phillxnet\\\&quot; src=\\\&quot;https://forum.rockstor.com/uploads/default/original/2X/8/8375db6301c454e02c1ab6c65c0358977ab9ecfb.jpg\\\&quot; class=\\\&quot;onebox-avatar-inline\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot; data-dominant-color=\\\&quot;7D6755\\\&quot;\\u003e\\n            phillxnet\\n          \\u003c/a\\u003e\\n        \\u003c/div\\u003e\\n\\n        \\u003cdiv class=\\\&quot;lines\\\&quot; title=\\\&quot;1 commits changed 17 files with 295 additions and 65 deletions\\\&quot;\\u003e\\n          \\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/2524/files\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003e\\n            \\u003cspan class=\\\&quot;added\\\&quot;\\u003e+295\\u003c/span\\u003e\\n            \\u003cspan class=\\\&quot;removed\\\&quot;\\u003e-65\\u003c/span\\u003e\\n          \\u003c/a\\u003e\\n        \\u003c/div\\u003e\\n      \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n\\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-row\\\&quot;\\u003e\\n    \\u003cp class=\\\&quot;github-body-container\\\&quot;\\u003eExtend our existing raid levels to include:\\nraid1c3 and raid1c4, introduced in \\u003cspan class=\\\&quot;show-more-container\\\&quot;\\u003e\\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/2524\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot; class=\\\&quot;show-more\\\&quot;\\u003e…\\u003c/a\\u003e\\u003c/span\\u003e\\u003cspan class=\\\&quot;excerpt hidden\\\&quot;\\u003ekernel 5.5.\\nAdditionally add mixed raid capability.\\nWe artificially reduce mixed raid profile options to assist with usability.\\n\\nFixes #2520 \\n\\nAdds abstraction, with tests, to generate a profile from our existing pool raid levels mechanism.\\nIncludes:\\n- Minor rename-refactor from prior TODO.\\n- Enable distinguishing between single \\u0026amp; single-dup.\\n- Add an \\\&quot;unknown\\\&quot; profile as fail-through catch-all.\\n- Enable easy Web-UI access to data/metadata via additional Pool object properties as thin PROFILE look-ups.\\n- Surface data-metadata in pool details Web-UI page.\\n- Remove now redundant single raid designator for data, if metadata = single. As we now have data-metadata surfaced we no longer need this.\\n- Refactor supported profiles var for test use. SUPPORTED_PROFILES was a class variable without requirement to be this way. Move to module level and use in test_pool.py unsupported profile test case.\\u003c/span\\u003e\\u003c/p\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eRegarding:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;stitch10925\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;9642\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e stitch10925:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIs it just there as hot-spare?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThere is currently no hot (online) spare capability in btrfs: but I think there are moves to introduce this in the future. I think there are development moves in this direction however.\\u003c/p\\u003e\\n\\u003cp\\u003eSo I think the key to your question re approach to enable rw (to add a drive or change raid level) is the degraded mount option: intended to inforce maintenance attention to what is a degraded situation. I.e. stop all writes as they can no-longer be redundant to the indicated profile: or prior drive count in many cases also. I.e. as \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/kilroylichking\\\&quot;\\u003e@KilroyLichking\\u003c/a\\u003e indicated if a btrfs-raid1 pool has 3 drives, you can loose (full function or entirely) one of the pool members and still mount degraded and remove (Pool knowledge wise) the fault or entirely \\u003ccode\\u003emissing\\u003c/code\\u003e drive. As the remaining members (2 in this case) can still sustain that btrfs-raid profile. But if one runs at the bare minimum drive count: you would have to ReRaid to a lower redundancy. Or add a drive to the Pool to return to the minimum level.\\u003c/p\\u003e\\n\\u003cp\\u003eErgo it is generally advised that Pools in more important settings are not maintained at the minimum drive count for the desired btrfs-raid level: as you then face fewer recovery options when a drive does ultimately fail/become-fault. I.e. you loose the option to just mount degraded and remove the problem drive and be on your way again (post removing the degraded option of course).\\u003c/p\\u003e\\n\\u003cp\\u003eSo to be clear here: no btrfs-raid1 pool (irrespective of drive count) can handle more than one drive failure. There are, after all, still only 2 copies. Hence the addition of the c2 and c3 variants.\\u003c/p\\u003e\\n\\u003cp\\u003eHope that helps and do ask further as I’ve here just fielded a few of the questions. The Web-UI however should guide you appropriately in such settings. And yes, we still do not have a drive replacement capability within the Web-UI but we can online ReRaid and add/remove Pool members.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:7,\&quot;updated_at\&quot;:\&quot;2024-08-10T12:00:54.214Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:17,\&quot;readers_count\&quot;:16,\&quot;score\&quot;:178.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:9642,\&quot;topic_slug\&quot;:\&quot;solved-not-sure-how-to-recover-from-raid1-drive-failure\&quot;,\&quot;display_username\&quot;:\&quot;Philip Guyton\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://rockstor.com/docs/data_loss.html#btrfsnature\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Data loss - prevention and recovery in Rockstor — Rockstor documentation\&quot;,\&quot;clicks\&quot;:3},{\&quot;url\&quot;:\&quot;https://rockstor.com/docs/data_loss.html#pool-degraded-indicators\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Data loss - prevention and recovery in Rockstor — Rockstor documentation\&quot;,\&quot;clicks\&quot;:3},{\&quot;url\&quot;:\&quot;https://rockstor.com/docs/interface/storage/pools-btrfs.html#redundancyprofiles\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Pools — Rockstor documentation\&quot;,\&quot;clicks\&quot;:1},{\&quot;url\&quot;:\&quot;https://github.com/rockstor/rockstor-core/pull/2524\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Add mixed raid levels #2520 by phillxnet · Pull Request #2524 · rockstor/rockstor-core · GitHub\&quot;,\&quot;clicks\&quot;:0},{\&quot;url\&quot;:\&quot;https://rockstor.com/docs/howtos/stable_kernel_backport.html\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Installing the Stable Kernel Backport — Rockstor documentation\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:4}],\&quot;moderator\&quot;:true,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:1196,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/solved-not-sure-how-to-recover-from-raid1-drive-failure/9642/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:30078,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;stitch10925\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/stitch10925/{size}/4163_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-08-12T22:20:15.784Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHey \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/phillxnet\\\&quot;\\u003e@phillxnet\\u003c/a\\u003e,\\u003c/p\\u003e\\n\\u003cp\\u003eThanks for the extensive reply. The Web-UI did indeed advise me on the steps to take. The problem was that I didn’t know HOW to take those steps. So I have been doing some research and testing over the last couple of days.\\u003c/p\\u003e\\n\\u003cp\\u003eI managed to fix the problem… or at least, everything seems to be working and files that I could not access correctly anymore are now working again.\\u003c/p\\u003e\\n\\u003cp\\u003eHere is what I did:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eI removed the physical drive and then removed it from Rockstor\\u003c/li\\u003e\\n\\u003cli\\u003eI added a new physical drive to the server\\u003c/li\\u003e\\n\\u003cli\\u003eI then rebooted the system after which Rockstor showed me the pool was “unmounted”\\u003c/li\\u003e\\n\\u003cli\\u003eIn the UI I went to the newly added disk and told Rockstor to use the whole disk\\u003c/li\\u003e\\n\\u003cli\\u003eVia CLI I mounted the pool with the “degraded” option\\u003c/li\\u003e\\n\\u003cli\\u003eUsing the Rockstor UI I added the new disk to the pool\\u003c/li\\u003e\\n\\u003cli\\u003eUsing the CLI I then checked “btrfs filesystem show” which showed me 2 drives in the pool (the original first disk and the newly added 2nd disk), but it gave the error “Device missing”\\u003c/li\\u003e\\n\\u003cli\\u003eIn the UI, in the pool configuration, I found a link that allowed me to remove missing devices. I clicked that and the pool was happy again (I found the btrfs command to do the same thing, but I somehow could not get it to work? Luckily I found the UI link)\\u003c/li\\u003e\\n\\u003cli\\u003eRebooted again to check if the Pool would mount by itself again, which it did\\u003c/li\\u003e\\n\\u003cli\\u003eDid a scrub and balance which took quite a while, but now everything seems to be up and running\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eI did have to recreate the NFS and Samba shared for the pool, which was a bit of a bummer. Especially since I used a custom NFS command.\\u003c/p\\u003e\\n\\u003cp\\u003eI hope this can be of use for other users in the future. I hope I listed everything correctly since I tried out A LOT of things.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:7,\&quot;updated_at\&quot;:\&quot;2024-08-12T22:20:15.784Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:0,\&quot;reads\&quot;:10,\&quot;readers_count\&quot;:9,\&quot;score\&quot;:142.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:9642,\&quot;topic_slug\&quot;:\&quot;solved-not-sure-how-to-recover-from-raid1-drive-failure\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1196,\&quot;username\&quot;:\&quot;phillxnet\&quot;,\&quot;name\&quot;:\&quot;Philip Guyton\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/phillxnet/{size}/15_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4294,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/solved-not-sure-how-to-recover-from-raid1-drive-failure/9642/5\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:30079,\&quot;name\&quot;:\&quot;Dan W.\&quot;,\&quot;username\&quot;:\&quot;Hooverdan\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/h/8               <h3>
<a name="first-off-1" class="anchor" href="#first-off-1"></a>First off</h3>
<p>Hey everyone! I hope everyone is doing well. Still loving Rockstor and still recommending it whenever I can (also hooked my dad up with Rockstor). Sorry that I kind of disappeared on you guys, but you know how that goes. I guess, no news is good news, right? <img src="https://forum.rockstor.com/images/emoji/twitter/wink.png?v=12" title=":wink:" class="emoji" alt=":wink:" loading="lazy" width="20" height="20"></p>
<h3>
<a name="description-of-the-problem-2" class="anchor" href="#description-of-the-problem-2"></a>Description of the problem</h3>
<p>I have a pool containing 2 drives in raid1 configuration. One of the drives failed and the pool is now in read-only mode. I removed the broken drive and added a new one, however, I am unsure on how to rebuild the pool.</p>
<h3>
<a name="what-i-tried-3" class="anchor" href="#what-i-tried-3"></a>What I tried</h3>
<p>I went through the documentation but I’m unsure on what to do. I tried making the pool a “single” pool, but this fails when balancing. According to my research that could mean that there were stripes on the other drive that are now missing.</p>
<p>I tried going through the Re-raid process to add the new drive to the pool, but also this fails because the remaining drive is in read-only mode.</p>
<p>I did read something about having to restart to make the pool read-write again (I’m not clear on when this can be done. When the failing drive has been removed?)</p>
<p>I’m a bit surprised that getting the pool back in order seems to be a tedious process. In my mind it should be as simple as sticking in a new drive and re-replicating the data. Clearly I’m not completely understanding the process or how btrfs works.</p>
<h3>
<a name="further-questions-4" class="anchor" href="#further-questions-4"></a>Further questions</h3>
<p>While doing research I read about raid1c3 and raid1c4. I’m not sure if they are available in Rockstor, but what I am wondering about these raid levels is the following:</p>
<ul>
<li>
<p>In raid1 at least 2 copies of the data are kept, allowing 1 drive to fail. In raid1c3, 3 copies of data are kept, so I assume 2 drives are allowed to fail. And by extension raid1c4 would allow for 3 drives to fail. Is this correct?</p>
</li>
<li>
<p>When you put your drives in raid1, but add more drives, what happens to those drives? For example, let’s say you set up raid1 with 3 drives, then 2 copies are maintained. What happens with the 3rd drive? Is it just there as hot-spare? Is it used for striping? Or … ?</p>
</li>
</ul>

              <p>In the logs of my backup I noticed that some files could not be copied because of “Input/Output Errors”. So I’m surely looking at some data-loss.</p>
<p>Partly my fault of course, since I didn’t have backups before. But that’s why I had raid1, to have a copy of the data in case a drive goes bad. I guess that wasn’t enough.</p>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-08-10T05:34:35Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>howdy stitch.</p>
<p>Sorry to hear about your hardware failure. This forum post talks about replacing drives <a href="https://forum.rockstor.com/t/what-is-the-process-for-replacing-a-bad-drive/7741" class="inline-onebox">What is the process for replacing a bad drive?</a>. TLDR</p>
<p>I believe you should be able to replace the drive in cli</p>
<blockquote>
<p>btrfs replace [drive id] [new drive] /mnt2/pool-name</p>
</blockquote>
<p>The data that is corrupted you should be able to run scrub and either replace the bad sectors from a snapshot or remove the bad files and replace from a cold storage.</p>
<p>Wiki says that when you place a third drive in raid 1 (mirror) you don’t increase the total striped volume of the pool you just add yet another spare of the data that is maintained across the array essentially giving you 2 failure before you lose everything.</p>
            </div>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-08-10T12:00:54Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p><a class="mention" href="/u/stitch10925">@stitch10925</a> Hello again, nice to hear you are still around.<br>
Re:</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>I have a pool containing 2 drives in raid1 configuration. One of the drives failed and the pool is now in read-only mode.</p>
</blockquote>
</aside>
<p>Yes, btrfs will mostly go read-only on significant issues to avoid cascade failure. In your case, if the drive died, then you have a btrfs-raid1 (2 drive minimum) with only one drive. So the defined by btrfs profile 2 copies across 2 independent drives can’t be met. So a read-only stance ensures no more data is written with only one copy. But all original data/metadata now exists only on one drive (Pool member). And as the pool is now read-only; you are unable to modify it: which includes adding a drive to it.</p>
<p>Likely what you need is a <code>degraded</code> mount option: this normally allows for a Pool to be mounted read-write (rw) even when it is in a degraded state (missing a prior member). You should then, via the rw access, be able to use the <code>Resize/ReRaid Pool</code> option within the Pool’s detail view. I.e. add a drive to the Pool so that it can again meet it’s goal of storing 2 copies of data or metadata on 2 independent drives.</p>
<p>If you are running a more recent Rockstor version (last few years) the Web-UI should advise you on these steps. Take a look at the following doc section, specifically the reference to our <strong>Maintenance required</strong> Web-UI element:</p>
<p><a href="https://rockstor.com/docs/data_loss.html#pool-degraded-indicators" class="onebox" target="_blank" rel="noopener">https://rockstor.com/docs/data_loss.html#pool-degraded-indicators</a></p>
<p><a class="mention" href="/u/kilroylichking">@KilroyLichking</a> Thanks for chipping in on this one. We should keep in mind that if a btrfs-raid1 Pool has more than 2 drives: it still only keeps 2 copies on two different drives. It can just spread the use of the drives out: but there is still only two copies. Which leads into:</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>While doing research I read about raid1c3 and raid1c4.</p>
</blockquote>
</aside>
<p>These profiles are basic extension of btrfs-raid1 but the c3 means 3 copies across 3 different drives: again irrispective of actual drive count. And the c4 qualifier similarly means a minimum of 4 copies on 4 different drives, irrispective of total Pool drive count.</p>
<p>Exactly as you have indicated in your synopsis.</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>In raid1 at least 2 copies of the data are kept, allowing 1 drive to fail. In raid1c3, 3 copies of data are kept, so I assume 2 drives are allowed to fail. And by extension raid1c4 would allow for 3 drives to fail. Is this correct?</p>
</blockquote>
</aside>
<p>Yes.</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>When you put your drives in raid1, but add more drives, what happens to those drives?</p>
</blockquote>
</aside>
<p>The add to available space, and spread the read-write load of the Pool.</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>For example, let’s say you set up raid1 with 3 drives, then 2 copies are maintained.</p>
</blockquote>
</aside>
<p>Yes.</p>
<p>But on every write 2 different drives may be chosen, i.e. write1 to drive 1&amp;2, write2 to drive 1&amp;3. The key here is that btrfs raid is chunk based, not drive based. But is drive aware in order to maintain independent drive use. See our:<br>
<strong>The nature of btrfs</strong>: <a href="https://rockstor.com/docs/data_loss.html#btrfsnature" class="inline-onebox">Data loss - prevention and recovery in Rockstor — Rockstor documentation</a></p>
<p>We have an explanation, along with redundancy capabilities in the following doc section:</p>
<p><strong>Redundancy Profiles</strong>: <a href="https://rockstor.com/docs/interface/storage/pools-btrfs.html#redundancyprofiles" class="inline-onebox">Pools — Rockstor documentation</a></p>
<p>And to answer:</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>I read about raid1c3 and raid1c4. I’m not sure if they are available in Rockstor</p>
</blockquote>
</aside>
<p>We use to require a Kernel backport as they are newer profiles based on the older btrfs-raid1. But if your install is “Build on openSUSE Leap 15.6 …” then it has a new-enough kernel to accomodate. Plus our docs need updating on the following how-to: <a href="https://rockstor.com/docs/howtos/stable_kernel_backport.html" class="inline-onebox">Installing the Stable Kernel Backport — Rockstor documentation</a> as we have supported btrfs-raid1c3 and btrfs-raid1c4 and many of the sane combinations of mixed raid involving these newer more robust profiles since 4.5.9-1 via:</p>

<p>Regarding:</p>
<aside class="quote no-group" data-username="stitch10925" data-post="1" data-topic="9642">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/stitch10925/48/4163_2.png" class="avatar"> stitch10925:</div>
<blockquote>
<p>Is it just there as hot-spare?</p>
</blockquote>
</aside>
<p>There is currently no hot (online) spare capability in btrfs: but I think there are moves to introduce this in the future. I think there are development moves in this direction however.</p>
<p>So I think the key to your question re approach to enable rw (to add a drive or change raid level) is the degraded mount option: intended to inforce maintenance attention to what is a degraded situation. I.e. stop all writes as they can no-longer be redundant to the indicated profile: or prior drive count in many cases also. I.e. as <a class="mention" href="/u/kilroylichking">@KilroyLichking</a> indicated if a btrfs-raid1 pool has 3 drives, you can loose (full function or entirely) one of the pool members and still mount degraded and remove (Pool knowledge wise) the fault or entirely <code>missing</code> drive. As the remaining members (2 in this case) can still sustain that btrfs-raid profile. But if one runs at the bare minimum drive count: you would have to ReRaid to a lower redundancy. Or add a drive to the Pool to return to the minimum level.</p>
<p>Ergo it is generally advised that Pools in more important settings are not maintained at the minimum drive count for the desired btrfs-raid level: as you then face fewer recovery options when a drive does ultimately fail/become-fault. I.e. you loose the option to just mount degraded and remove the problem drive and be on your way again (post removing the degraded option of course).</p>
<p>So to be clear here: no btrfs-raid1 pool (irrespective of drive count) can handle more than one drive failure. There are, after all, still only 2 copies. Hence the addition of the c2 and c3 variants.</p>
<p>Hope that helps and do ask further as I’ve here just fielded a few of the questions. The Web-UI however should guide you appropriately in such settings. And yes, we still do not have a drive replacement capability within the Web-UI but we can online ReRaid and add/remove Pool members.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>Hey <a class="mention" href="/u/phillxnet">@phillxnet</a>,</p>
<p>Thanks for the extensive reply. The Web-UI did indeed advise me on the steps to take. The problem was that I didn’t know HOW to take those steps. So I have been doing some research and testing over the last couple of days.</p>
<p>I managed to fix the problem… or at least, everything seems to be working and files that I could not access correctly anymore are now working again.</p>
<p>Here is what I did:</p>
<ol>
<li>I removed the physical drive and then removed it from Rockstor</li>
<li>I added a new physical drive to the server</li>
<li>I then rebooted the system after which Rockstor showed me the pool was “unmounted”</li>
<li>In the UI I went to the newly added disk and told Rockstor to use the whole disk</li>
<li>Via CLI I mounted the pool with the “degraded” option</li>
<li>Using the Rockstor UI I added the new disk to the pool</li>
<li>Using the CLI I then checked “btrfs filesystem show” which showed me 2 drives in the pool (the original first disk and the newly added 2nd disk), but it gave the error “Device missing”</li>
<li>In the UI, in the pool configuration, I found a link that allowed me to remove missing devices. I clicked that and the pool was happy again (I found the btrfs command to do the same thing, but I somehow could not get it to work? Luckily I found the UI link)</li>
<li>Rebooted again to check if the Pool would mount by itself again, which it did</li>
<li>Did a scrub and balance which took quite a while, but now everything seems to be up and running</li>
</ol>
<p>I did have to recreate the NFS and Samba shared for the pool, which was a bit of a bummer. Especially since I used a custom NFS command.</p>
<p>I hope this can be of use for other users in the future. I hope I listed everything correctly since I tried out A LOT of things.</p>
            </div>
