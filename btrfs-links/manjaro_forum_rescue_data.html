        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_79414&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:282437,\&quot;name\&quot;:\&quot;Andreas Kielkopf\&quot;,\&quot;username\&quot;:\&quot;andreas85\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.manjaro.org/andreas85/{size}/19298_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-08-22T17:02:57.237Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003cstrong\\u003eDifficulty: ★★☆☆☆\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\&quot;https://forum.manjaro.org/images/emoji/twemoji/uk.png?v=12\\\&quot; title=\\\&quot;:uk:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:uk:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e \\u003ca href=\\\&quot;https://forum.manjaro.org/t/howto-daten-von-einem-beschadigten-btrfs-volume-retten/79400\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://forum.manjaro.org/images/emoji/twemoji/de.png?v=12\\\&quot; title=\\\&quot;:de:\\\&quot; class=\\\&quot;emoji only-emoji\\\&quot; alt=\\\&quot;:de:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eYou used btrfs. Now it’s paying off. \\u003cstrong\\u003eThere is an easy way out\\u003c/strong\\u003e (I’ve already done this myself):\\u003c/p\\u003e\\n\\u003cdetails\\u003e\\n\\u003csummary\\u003e\\nIn most cases, when a btrfs volume breaks, it is possible to recover the data\\u003c/summary\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eThis is because btrfs works with copy on write. This means that new changes are always appended at the end, so to speak. The previously existing data is not actually overwritten. (In reality this is a bit more complicated, but for us here this simplified view is sufficient).\\u003c/li\\u003e\\n\\u003cli\\u003eIf the file system gets corrupted, then the corruption is at the very end. When \\u003cstrong\\u003ero-mount\\u003c/strong\\u003e, btrfs can find the corruption and hide this last damaged part. We then see the file system in the state shortly (possibly 5 seconds) before the corruption. You can get this undamaged data with the following actions:\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/details\\u003e\\n\\u003cp\\u003eIn contrast to other file systems, no special programs are required for this. On the contrary the best way to rescue the data from a btrfs volume is to use \\u003cstrong\\u003ebtrfs-tools\\u003c/strong\\u003e !\\u003c/p\\u003e\\n\\u003cp\\u003eAbove all: \\u003cstrong\\u003eUnder no circumstances try to mount the damaged volume rw as long as the data has not been\\u003c/strong\\u003e \\u003cstrong\\u003erescued.\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003cdetails\\u003e\\n\\u003csummary\\u003e\\nRecover data from damaged btrfs volume\\u003c/summary\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eBoot into a recovery system (DVD or USB …) if possible with a \\u003cstrong\\u003ecurrent LTS kernel (e.g. 5.10)\\u003c/strong\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003emount\\u003c/strong\\u003e your damaged btrfs volume as \\u003cstrong\\u003ero\\u003c/strong\\u003e (read only). This mount corresponds to a snapshot of the last working state of the volume\\u003c/li\\u003e\\n\\u003cli\\u003eNow you can take one of 2 ways:\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003erescue entire volume with all subvolumes and snapshots (my recommendation!)\\u003c/strong\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003erescue a specific subvolume or a specific snapshot\\n\\u003cul\\u003e\\n\\u003cli\\u003eView all subvolumes. With a file manager (e.g. mc) search for the subvolume on which the desired data is located. The subvolumes can have completely different layouts. You can find more information if you google for \\u003cstrong\\u003e“btrfs-layout”\\u003c/strong\\u003e.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003emount\\u003c/strong\\u003e an (empty) btrfs volume with plenty of space \\u003cstrong\\u003erw\\u003c/strong\\u003e. It does not have to be the same size as the damaged one, but it must be large enough to hold the contents of the volume to be rescued (including the suvolumes / snapshots).\\u003c/li\\u003e\\n\\u003cli\\u003eUse \\u003cstrong\\u003ebtrfs send\\u003c/strong\\u003e to transfer the entire contents of the damaged volume to the new backup volume\\u003c/li\\u003e\\n\\u003cli\\u003eCheck the data on the backup volume. Is everything there? Then \\u003cstrong\\u003eumount\\u003c/strong\\u003e the backup volume\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/details\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eIf you see a chance to fix the damaged btrfs “in place”, you can try now. Otherwise, \\u003cstrong\\u003ejust continue here\\u003c/strong\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cdetails\\u003e\\n\\u003csummary\\u003e\\nRestore the volume\\u003c/summary\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003eumount\\u003c/strong\\u003e the damaged btrfs volume and reformat it as btrfs, e.g. with \\u003cstrong\\u003egparted\\u003c/strong\\u003e (we do have a backup)\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003cstrong\\u003emount\\u003c/strong\\u003e the backup \\u003cstrong\\u003ero\\u003c/strong\\u003e (readonly) (better safe than sorry)\\u003c/li\\u003e\\n\\u003cli\\u003eUse \\u003cstrong\\u003ebtrfs send\\u003c/strong\\u003e to restore the data to the newly created volume\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eIf that worked you will not only get all the data of the last status, but also all subvolumes and all snapshots that you had.\\u003c/p\\u003e\\n\\u003c/details\\u003e\\n\\u003cdetails\\u003e\\n\\u003csummary\\u003e\\nTips for the future:\\u003c/summary\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eIf you are worried that the data on a btrfs volume has been corrupted, test it with \\u003cstrong\\u003ebtrfs scrub\\u003c/strong\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003ePlease use \\u003cstrong\\u003ebtrfs balance\\u003c/strong\\u003e sparingly. Most of the time it is unnecessary and only burdens the system. And if so, \\u003cstrong\\u003eplease always use it with limits\\u003c/strong\\u003e (e.g. 75% or 50%)\\u003c/li\\u003e\\n\\u003cli\\u003eTake \\u003cstrong\\u003eautomatic snapshots\\u003c/strong\\u003e (e.g. with \\u003cstrong\\u003esnapper\\u003c/strong\\u003e ). If possible every hour. With btrfs it doesn’t cost anything. Snapper can also \\u003cstrong\\u003eautomatically free these snapshots\\u003c/strong\\u003e after a set time. (delete seems the wrong term here)\\u003c/li\\u003e\\n\\u003cli\\u003eIf you have several (2, 3 or 4) devices and can combine them into one btrfs volume, then \\u003cstrong\\u003euse RAID1\\u003c/strong\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003eDon’t forget to make good backups of your data. \\u003cstrong\\u003ebtrfs send\\u003c/strong\\u003e is your friend\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/details\\u003e\\n\\u003cp\\u003eYou can find good information about btrfs in the \\u003ca href=\\\&quot;https://btrfs.wiki.kernel.org/index.php/SysadminGuide\\\&quot;\\u003ebtrfs-wiki at kernel.org\\u003c/a\\u003e and in the \\u003ca href=\\\&quot;https://wiki.archlinux.org/title/Btrfs\\\&quot;\\u003earch-wiki\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eViel Erfolg ! \\u003cimg src=\\\&quot;https://forum.manjaro.org/images/emoji/twemoji/sunglasses.png?v=12\\\&quot; title=\\\&quot;:sunglasses:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:sunglasses:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cimg src=\\\&quot;https://forum.manjaro.org/images/emoji/twemoji/uk.png?v=12\\\&quot; title=\\\&quot;:uk:\\\&quot; class=\\\&quot;emoji only-emoji\\\&quot; alt=\\\&quot;:uk:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\u003caside class=\\\&quot;quote quote-modified\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;79400\\\&quot;\\u003e\\n  \\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.manjaro.org/user_avatar/forum.manjaro.org/andreas85/48/19298_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e\\n    \\u003ca href=\\\&quot;https://forum.manjaro.org/t/howto-daten-von-einem-beschadigten-btrfs-volume-retten/79400\\\&quot;\\u003e[how to] Daten von einem beschädigten btrfs-volume retten\\u003c/a\\u003e \\u003ca class=\\\&quot;badge-category__wrapper \\\&quot; href=\\\&quot;/c/languages/deutsch/64\\\&quot;\\u003e\\u003cspan data-category-id=\\\&quot;64\\\&quot; style=\\\&quot;--category-badge-color: #F1592A; --category-badge-text-color: #FFFFFF; --parent-category-badge-color: #231F20;\\\&quot; data-parent-category-id=\\\&quot;37\\\&quot; data-drop-close=\\\&quot;true\\\&quot; class=\\\&quot;badge-category --has-parent\\\&quot; title=\\\&quot;Willkommen bei Manjaro\\\&quot;\\u003e\\u003cspan class=\\\&quot;badge-category__name\\\&quot;\\u003eDeutsch\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Difficulty: ★★☆☆☆ \\n\\u003ca href=\\\&quot;https://forum.manjaro.org/t/howto-rescue-data-from-a-damaged-btrfs-volume/79414\\\&quot;\\u003e\\u003cimg width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot; src=\\\&quot;https://forum.manjaro.org/images/emoji/twemoji/uk.png?v=12\\\&quot; title=\\\&quot;uk\\\&quot; alt=\\\&quot;uk\\\&quot; class=\\\&quot;emoji\\\&quot;\\u003e \\u003c/a\\u003e \\u003cimg width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&qu               <span class="crawler-post-infos">

            <div class='post' itemprop='text'>
              <p><strong>Difficulty: ★★☆☆☆</strong></p>
<p><img src="https://forum.manjaro.org/images/emoji/twemoji/uk.png?v=12" title=":uk:" class="emoji" alt=":uk:" loading="lazy" width="20" height="20"> <a href="https://forum.manjaro.org/t/howto-daten-von-einem-beschadigten-btrfs-volume-retten/79400"><img src="https://forum.manjaro.org/images/emoji/twemoji/de.png?v=12" title=":de:" class="emoji only-emoji" alt=":de:" loading="lazy" width="20" height="20"></a></p>
<p>You used btrfs. Now it’s paying off. <strong>There is an easy way out</strong> (I’ve already done this myself):</p>
<details>
<summary>
In most cases, when a btrfs volume breaks, it is possible to recover the data</summary>
<ul>
<li>This is because btrfs works with copy on write. This means that new changes are always appended at the end, so to speak. The previously existing data is not actually overwritten. (In reality this is a bit more complicated, but for us here this simplified view is sufficient).</li>
<li>If the file system gets corrupted, then the corruption is at the very end. When <strong>ro-mount</strong>, btrfs can find the corruption and hide this last damaged part. We then see the file system in the state shortly (possibly 5 seconds) before the corruption. You can get this undamaged data with the following actions:</li>
</ul>
</details>
<p>In contrast to other file systems, no special programs are required for this. On the contrary the best way to rescue the data from a btrfs volume is to use <strong>btrfs-tools</strong> !</p>
<p>Above all: <strong>Under no circumstances try to mount the damaged volume rw as long as the data has not been</strong> <strong>rescued.</strong></p>
<details>
<summary>
Recover data from damaged btrfs volume</summary>
<ul>
<li>Boot into a recovery system (DVD or USB …) if possible with a <strong>current LTS kernel (e.g. 5.10)</strong></li>
<li><strong>mount</strong> your damaged btrfs volume as <strong>ro</strong> (read only). This mount corresponds to a snapshot of the last working state of the volume</li>
<li>Now you can take one of 2 ways:
<ul>
<li><strong>rescue entire volume with all subvolumes and snapshots (my recommendation!)</strong></li>
<li>rescue a specific subvolume or a specific snapshot
<ul>
<li>View all subvolumes. With a file manager (e.g. mc) search for the subvolume on which the desired data is located. The subvolumes can have completely different layouts. You can find more information if you google for <strong>“btrfs-layout”</strong>.</li>
</ul>
</li>
</ul>
</li>
<li><strong>mount</strong> an (empty) btrfs volume with plenty of space <strong>rw</strong>. It does not have to be the same size as the damaged one, but it must be large enough to hold the contents of the volume to be rescued (including the suvolumes / snapshots).</li>
<li>Use <strong>btrfs send</strong> to transfer the entire contents of the damaged volume to the new backup volume</li>
<li>Check the data on the backup volume. Is everything there? Then <strong>umount</strong> the backup volume</li>
</ul>
</details>
<ul>
<li>If you see a chance to fix the damaged btrfs “in place”, you can try now. Otherwise, <strong>just continue here</strong></li>
</ul>
<details>
<summary>
Restore the volume</summary>
<ul>
<li><strong>umount</strong> the damaged btrfs volume and reformat it as btrfs, e.g. with <strong>gparted</strong> (we do have a backup)</li>
<li><strong>mount</strong> the backup <strong>ro</strong> (readonly) (better safe than sorry)</li>
<li>Use <strong>btrfs send</strong> to restore the data to the newly created volume</li>
</ul>
<p>If that worked you will not only get all the data of the last status, but also all subvolumes and all snapshots that you had.</p>
</details>
<details>
<summary>
Tips for the future:</summary>
<ul>
<li>If you are worried that the data on a btrfs volume has been corrupted, test it with <strong>btrfs scrub</strong></li>
<li>Please use <strong>btrfs balance</strong> sparingly. Most of the time it is unnecessary and only burdens the system. And if so, <strong>please always use it with limits</strong> (e.g. 75% or 50%)</li>
<li>Take <strong>automatic snapshots</strong> (e.g. with <strong>snapper</strong> ). If possible every hour. With btrfs it doesn’t cost anything. Snapper can also <strong>automatically free these snapshots</strong> after a set time. (delete seems the wrong term here)</li>
<li>If you have several (2, 3 or 4) devices and can combine them into one btrfs volume, then <strong>use RAID1</strong></li>
<li>Don’t forget to make good backups of your data. <strong>btrfs send</strong> is your friend</li>
</ul>
</details>
<p>You can find good information about btrfs in the <a href="https://btrfs.wiki.kernel.org/index.php/SysadminGuide">btrfs-wiki at kernel.org</a> and in the <a href="https://wiki.archlinux.org/title/Btrfs">arch-wiki</a></p>
