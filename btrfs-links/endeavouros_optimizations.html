        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_27025&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:289671,\&quot;name\&quot;:\&quot;They Call Me Mister Trees!\&quot;,\&quot;username\&quot;:\&quot;Scotty_Trees\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.endeavouros.com/scotty_trees/{size}/29792_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-05-12T22:57:58.534Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings lovely community,\\u003c/p\\u003e\\n\\u003cp\\u003eI’ve only ever known ext4, but switched to btrfs earlier this year. I’ve seen different distros/users optimize btrfs in slightly different ways. When I installed btrfs using Calamares from the Apollo 22-1 iso, I just used the default settings for btrfs with a 8GB (no hibernate) swap partition for my 256GB SSD. I’ve been wondering though if I should/need to add any optimizations for my btrfs. or if the defaults that EndeavourOS used from the latest iso are enough for the average user.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003esudo nano /etc/fstab\\n# /etc/fstab: static file system information.\\n#\\n# Use &#39;blkid&#39; to print the universally unique identifier for a device; this may\\n# be used with UUID= as a more robust way to name devices that works even if\\n# disks are added and removed. See fstab(5).\\n#\\n# \\u0026lt;file system\\u0026gt;             \\u0026lt;mount point\\u0026gt;  \\u0026lt;type\\u0026gt;  \\u0026lt;options\\u0026gt;  \\u0026lt;dump\\u0026gt;  \\u0026lt;pass\\u0026gt;\\nUUID=EC97-73E1                            /boot/efi      vfat    defaults,noatime 0 2\\nUUID=112e02fc-dd9b-419a-a575-bc79354c86ab /              btrfs   subvol=/@,defaults,noatime,compress=zstd 0 0\\nUUID=112e02fc-dd9b-419a-a575-bc79354c86ab /home          btrfs   subvol=/@home,defaults,noatime,compress=zstd 0 0\\nUUID=112e02fc-dd9b-419a-a575-bc79354c86ab /var/cache     btrfs   subvol=/@cache,defaults,noatime,compress=zstd 0 0\\nUUID=112e02fc-dd9b-419a-a575-bc79354c86ab /var/log       btrfs   subvol=/@log,defaults,noatime,compress=zstd 0 0\\nUUID=b479a7af-fa4d-4bb8-98df-2ab4ae7a9b78 swap           swap    defaults   0 0\\ntmpfs                                     /tmp           tmpfs   defaults,noatime,mode=1777 0 0\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003essd, noatime, space_cache, commit=120, compress=zstd, discard=async, nodatacow, and autodefrag are the optimizations that I know of. As you can see from my \\u003ccode\\u003efstab\\u003c/code\\u003e above, I’m using defaults, noatime, and compression=zstd already for the btrfs volumes. Calamares also created swap, vfat, and tmpfs volumes, but I do not know if I need/should have to add optimizations to them as well or if the optimizations are meant for btrfs only.\\u003c/p\\u003e\\n\\u003cp\\u003eI’ve got an SSD so I’ve already enabled the SSD Trim timer via \\u003ccode\\u003esystemctl enable fstrim.timer\\u003c/code\\u003e, so I’m wondering if I should/need to add the ssd optimization option to my btrfs as well or if that’s some sort of overkill I’m not sure so feel free to clarify anything for me.\\u003c/p\\u003e\\n\\u003cp\\u003eI understand a lot of this may be subjective and depend on the user, I’m just looking for practical options to consider, keeping things lean, smooth, and fast; if something is a good idea or good practice, I’d like to enable it. If something is not really needed or won’t notice any difference (or causes decrease in performance for example), then I can take it or leave it is my philosophy.\\u003c/p\\u003e\\n\\u003cp\\u003eAt the very least I’m probably going to want to add sdd and space_cache, but I’m wondering how many of these optimizations I should/need to really add, so I’d appreciate any thoughtful guidance into the matter and thanks for taking the time to read and reply, any responses are always appreciated very much.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:74,\&quot;updated_at\&quot;:\&quot;2022-05-12T22:57:58.534Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:4771,\&quot;reads\&quot;:141,\&quot;readers_count\&quot;:140,\&quot;score\&quot;:23853.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:27025,\&quot;topic_slug\&quot;:\&quot;considering-some-btrfs-optimizations\&quot;,\&quot;display_username\&quot;:\&quot;They Call Me Mister Trees!\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.endeavouros.com/t/is-btrfs-good-for-my-ssd/27432/22\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;Is btrfs good for my ssd\&quot;,\&quot;clicks\&quot;:15},{\&quot;url\&quot;:\&quot;https://forum.endeavouros.com/t/freezes-a-couple-of-seconds-minute-after-updates/27223/45\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;Freezes a couple of seconds/minute after updates\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2934,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot; 3caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;sradjoker\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;27025\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/sradjoker/48/64224_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e sradjoker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIs there a way to modify the zstd compression level after setting it during the install?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYou can change the compression rate on new data by changing the mount options in fstab.  For existing data you can \\u003ccode\\u003ebtrfs filesystem defrag\\u003c/code\\u003e but be aware that will literally decompress and recompress the data so it will be time consuming if you have a lot of data.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;sradjoker\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;27025\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/sradjoker/48/64224_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e sradjoker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI think that the default level is 3. What level do you recommend?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt depends on the speed of cpu and your storage.  The faster the cpu, the more compression you can support.  On modern CPUs, I use the default zstd. When CPU cycles are at a premium, I use zstd:1 or lzo\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;sradjoker\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;27025\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/sradjoker/48/64224_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e sradjoker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWhat about the commit=120 option?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThat is the interval at which data is written to the disk.  Personally, I would not be comfortable setting it as high as 120.  That is 2 minutes.  I usually leave it at the default of 30 seconds.  Of course, it is up to your use case what is appropriate for you.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:74,\&quot;updated_at\&quot;:\&quot;2022-05-13T00:16:18.502Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:34,\&quot;reads\&quot;:106,\&quot;readers_count\&quot;:105,\&quot;score\&quot;:271.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:27025,\&quot;topic_slug\&quot;:\&quot;considering-some-btrfs-optimizations\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_ ;user_id\&quot;:1318,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;user_custom_fields\&quot;:{\&quot;nationalflag_iso\&quot;:\&quot;none\&quot;},\&quot;post_url\&quot;:\&quot;/t/considering-some-btrfs-optimizations/27025/6\&quot;,\&quot;reactions\&quot;:[],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:289807,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;EOS\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.endeavouros.com/eos/{size}/121414_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-05-13T10:59:14.771Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;pebcak\\\&quot; data-post=\\\&quot;6\\\&quot; data-topic=\\\&quot;27025\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/pebcak/48/100472_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e pebcak:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI have \\u003ccode\\u003ediscard=async\\u003c/code\\u003e among the mount options for my subvolumes. Do I need to remove that if I run fstrim manually or with the service?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eNote:\\u003c/strong\\u003e There is no need to enable continuous TRIM if you run \\u003ccode\\u003efstrim\\u003c/code\\u003e periodically. If you want to use TRIM, use either periodic TRIM or continuous TRIM.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eNote:\\u003c/strong\\u003e Continuous TRIM is not the most preferred way to issue TRIM commands among the Linux community. For example, Ubuntu enables periodic TRIM by default \\u003ca href=\\\&quot;https://askubuntu.com/questions/1034169/is-trim-enabled-on-my-ubuntu-18-04-installation\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003e[7]\\u003c/a\\u003e, Debian does not recommend using \\u003ca href=\\\&quot;https://wiki.debian.org/SSDOptimization#Mounting_SSD_filesystems\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003econtinuous TRIM\\u003c/a\\u003e and Red Hat recommends using periodic TRIM over using continuous TRIM if feasible \\u003ca href=\\\&quot;https://web.archive.org/web/20160917183831/https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Storage_Administration_Guide/ch02s04.html\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003e[8]\\u003c/a\\u003e.\\u003cbr\\u003e\\n\\u003ca href=\\\&quot;https://wiki.archlinux.org/title/Solid_state_drive#Periodic_TRIM\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehttps://wiki.archlinux.org/title/Solid_state_drive#Periodic_TRIM\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:74,\&quot;updated_at\&quot;:\&quot;2022-05-13T10:59:14.771Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:6,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:17,\&quot;reads\&quot;:90,\&quot;readers_count\&quot;:89,\&quot;score\&quot;:138.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:27025,\&quot;topic_slug\&quot;:\&quot;considering-some-btrfs-optimizations\&quot;,\&quot;display_username\&q c\\\&quot;\\u003elinuxhint.com\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;aspect-image\\\&quot; style=\\\&quot;--aspect-ratio:495/268;\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://forum.endeavouros.com/uploads/default/original/3X/6/2/62177d231ebf2b3181736c158c5d1d1d1fb8feaf.jpeg\\\&quot; class=\\\&quot;thumbnail\\\&quot; data-dominant-color=\\\&quot;E0E0E0\\\&quot; width=\\\&quot;495\\\&quot; height=\\\&quot;268\\\&quot;\\u003e\\u003c/div\\u003e\\n\\n\\u003ch3\\u003e\\u003ca href=\\\&quot;https://linuxhint.com/defragment-btrfs-filesystem/\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eHow to Defragment a Btrfs Filesystem\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n  \\u003cp\\u003eTo solve the problem of large file fragmentation, it is necessary to defragment the Btrfs filesystem every once in a while. This article shows you how to defragment the Btrfs filesystem.\\u003c/p\\u003e\\n\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cblockquote\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eDefragmenting files move Btrfs data extents and attempt to align them, one after the other. So, the Copy-on-Write links between the copies of the file breaks. This will increase redundant data extents, as well as the disk usage of a Btrfs filesystem that was previously saved by sharing data extents between identical (or nearly identical) copies of the file.\\u003c/li\\u003e\\n\\u003cli\\u003eIf a Btrfs subvolume has multiple snapshots, defragmenting the subvolume will break the Copy-on-Write links between the subvolume and the snapshots. This will increase disk usage of a Btrfs filesystem.\\u003c/li\\u003e\\n\\u003cli\\u003eIf you are using the Btrfs filesystem for large databases or virtual machine images (for storing VM data/disks), defragmenting the filesystem will also negatively impact the performance of the filesystem.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:74,\&quot;updated_at\&quot;:\&quot;2022-05-13T13:50:01.844Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:65,\&quot;readers_count\&quot;:64,\&quot;score\&quot;:68.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:27025,\&quot;topic_slug\&quot;:\&quot;considering-some-btrfs-optimizations\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://linuxhint.com/defragment-btrfs-filesystem/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;How to Defragment a Btrfs Filesystem\&quot;,\&quot;clicks\&quot;:13}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:3811,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;user_custom_fields\&quot;:{\&quot;nationalflag_iso\&quot;:\&quot;fi\&quot;},\&quo te\u003e\\n\u003cp\u003eWith \u003ccode\u003e20250613.12fe085f-5\\u003C/code\u003e, we split our firmware into several vendor-focused packages. \u003ccode\u003elinux-firmware\\u003C/code\u003e is now an empty package depending on our default set of firmware.\\u003C/p\u003e\\n\u003cp\u003eUnfortunately, this coincided with upstream reorganizing the symlink layout of the NVIDIA firmware, resulting in a situation that Pacman cannot handle. When attempting to upgrade from \u003ccode\u003e20250508.788aadc8-2\\u003C/code\u003e or earlier, you will see the following errors:\\u003C/p\u003e\\n\u003cpre\u003e\u003ccode\u003elinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad103 exists in filesystem\\nlinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad104 exists in filesystem\\nlinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad106 exists in filesystem\\nlinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad107 exists in filesystem\\n\\u003C/code\u003e\\u003C/pre\u003e\\n\u003cp\u003eTo progress with the system upgrade, first remove \u003ccode\u003elinux-firmware\\u003C/code\u003e, then reinstall it as part of the upgrade:\\u003C/p\u003e\\n\u003cpre\u003e\u003ccode\u003e# pacman -Rdd linux-firmware\\n# pacman -Syu linux-firmware\\n\\u003C/code\u003e\\u003C/pre\u003e\\n\u003cp\u003eURL: \u003ca href=\\\&quot;https://archlinux.org/news/linux-firmware-2025061312fe085f-5-upgrade-requires-manual-intervention/\\\&quot;\u003ehttps://archlinux.org/news/linux-firmware-2025061312fe085f-5-upgrade-requires-manual-intervention/\\u003C/a\u003e\\u003C/p\u003e\\n\\u003C/blockquote\u003e\\n\u003cp\u003eUpdate with care!\\u003C/p\u003e\&quot;,\&quot;key\&quot;:72761,\&quot;url\&quot;:\&quot;https://forum.endeavouros.com/t/linux-firmware-20250613-12fe085f-5-upgrade-requires-manual-intervention/72761\&quot;}&quot;,&quot;customEmoji&quot;:&quot;[{\&quot;name\&quot;:\&quot;enos\&quot;,\&quot;url\&quot;:\&quot;/uploads/default/original/2X/3/36f51695b46b047f7673b2859d14bd85d94d064c.png\&quot;,\&quot;group\&             <div class='post' itemprop='text'>
              <p>Greetings lovely community,</p>
<p>I’ve only ever known ext4, but switched to btrfs earlier this year. I’ve seen different distros/users optimize btrfs in slightly different ways. When I installed btrfs using Calamares from the Apollo 22-1 iso, I just used the default settings for btrfs with a 8GB (no hibernate) swap partition for my 256GB SSD. I’ve been wondering though if I should/need to add any optimizations for my btrfs. or if the defaults that EndeavourOS used from the latest iso are enough for the average user.</p>
<pre><code class="lang-auto">sudo nano /etc/fstab
# /etc/fstab: static file system information.
#
# Use 'blkid' to print the universally unique identifier for a device; this may
# be used with UUID= as a more robust way to name devices that works even if
# disks are added and removed. See fstab(5).
#
# &lt;file system&gt;             &lt;mount point&gt;  &lt;type&gt;  &lt;options&gt;  &lt;dump&gt;  &lt;pass&gt;
UUID=EC97-73E1                            /boot/efi      vfat    defaults,noatime 0 2
UUID=112e02fc-dd9b-419a-a575-bc79354c86ab /              btrfs   subvol=/@,defaults,noatime,compress=zstd 0 0
UUID=112e02fc-dd9b-419a-a575-bc79354c86ab /home          btrfs   subvol=/@home,defaults,noatime,compress=zstd 0 0
UUID=112e02fc-dd9b-419a-a575-bc79354c86ab /var/cache     btrfs   subvol=/@cache,defaults,noatime,compress=zstd 0 0
UUID=112e02fc-dd9b-419a-a575-bc79354c86ab /var/log       btrfs   subvol=/@log,defaults,noatime,compress=zstd 0 0
UUID=b479a7af-fa4d-4bb8-98df-2ab4ae7a9b78 swap           swap    defaults   0 0
tmpfs                                     /tmp           tmpfs   defaults,noatime,mode=1777 0 0
</code></pre>
<p>ssd, noatime, space_cache, commit=120, compress=zstd, discard=async, nodatacow, and autodefrag are the optimizations that I know of. As you can see from my <code>fstab</code> above, I’m using defaults, noatime, and compression=zstd already for the btrfs volumes. Calamares also created swap, vfat, and tmpfs volumes, but I do not know if I need/should have to add optimizations to them as well or if the optimizations are meant for btrfs only.</p>
<p>I’ve got an SSD so I’ve already enabled the SSD Trim timer via <code>systemctl enable fstrim.timer</code>, so I’m wondering if I should/need to add the ssd optimization option to my btrfs as well or if that’s some sort of overkill I’m not sure so feel free to clarify anything for me.</p>
<p>I understand a lot of this may be subjective and depend on the user, I’m just looking for practical options to consider, keeping things lean, smooth, and fast; if something is a good idea or good practice, I’d like to enable it. If something is not really needed or won’t notice any difference (or causes decrease in performance for example), then I can take it or leave it is my philosophy.</p>
<p>At the very least I’m probably going to want to add sdd and space_cache, but I’m wondering how many of these optimizations I should/need to really add, so I’d appreciate any thoughtful guidance into the matter and thanks for taking the time to read and reply, any responses are always appreciated very much.</p>

<img loading="lazy" alt="" width="24" height="24" src="https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/sradjoker/48/64224_2.png" class="avatar"> sradjoker:</div>
<blockquote>
<p>Is there a way to modify the zstd compression level after setting it during the install?</p>
</blockquote>
</aside>
<p>You can change the compression rate on new data by changing the mount options in fstab.  For existing data you can <code>btrfs filesystem defrag</code> but be aware that will literally decompress and recompress the data so it will be time consuming if you have a lot of data.</p>
<aside class="quote no-group" data-username="sradjoker" data-post="4" data-topic="27025">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/sradjoker/48/64224_2.png" class="avatar"> sradjoker:</div>
<blockquote>
<p>I think that the default level is 3. What level do you recommend?</p>
</blockquote>
</aside>
<p>It depends on the speed of cpu and your storage.  The faster the cpu, the more compression you can support.  On modern CPUs, I use the default zstd. When CPU cycles are at a premium, I use zstd:1 or lzo</p>
<aside class="quote no-group" data-username="sradjoker" data-post="4" data-topic="27025">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.endeavouros.com/user_avatar/forum.endeavouros.com/sradjoker/48/64224_2.png" class="avatar"> sradjoker:</div>
<blockquote>
<p>What about the commit=120 option?</p>
</blockquote>
</aside>
<p>That is the interval at which data is written to the disk.  Personally, I would not be comfortable setting it as high as 120.  That is 2 minutes.  I usually leave it at the default of 30 seconds.  Of course, it is up to your use case what is appropriate for you.</p>
            </div>

<p>I have <code>discard=async</code> among the mount options for my subvolumes. Do I need to remove that if I run fstrim manually or with the service?</p>

</aside>
<blockquote>
<p><strong>Note:</strong> There is no need to enable continuous TRIM if you run <code>fstrim</code> periodically. If you want to use TRIM, use either periodic TRIM or continuous TRIM.</p>
</blockquote>
<blockquote>
<p><strong>Note:</strong> Continuous TRIM is not the most preferred way to issue TRIM commands among the Linux community. For example, Ubuntu enables periodic TRIM by default <a href="https://askubuntu.com/questions/1034169/is-trim-enabled-on-my-ubuntu-18-04-installation" rel="noopener nofollow ugc">[7]</a>, Debian does not recommend using <a href="https://wiki.debian.org/SSDOptimization#Mounting_SSD_filesystems" rel="noopener nofollow ugc">continuous TRIM</a> and Red Hat recommends using periodic TRIM over using continuous TRIM if feasible <a href="https://web.archive.org/web/20160917183831/https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/7/html/Storage_Administration_Guide/ch02s04.html" rel="noopener nofollow ugc">[8]</a>.<br>
<a href="https://wiki.archlinux.org/title/Solid_state_drive#Periodic_TRIM" rel="noopener nofollow ugc">https://wiki.archlinux.org/title/Solid_state_drive#Periodic_TRIM</a></p>
</blockquote>

              <p>I know that BTRFS is slightly different when it comes to defrag.<br>

<blockquote>
<p>Or is there another benefit from running it that I’m currently not aware of?</p>
</blockquote>
</aside>
<p>The filesystem will become fragmented over time decreasing performance. On an HDD the decrease in performance can be significant over time. This is a bigger issue with btrfs than traditional filesystems because fragmentation is a side effect of btrfs’s CoW implementation.</p>
<p>On SSDs, the same thing can happen although the performance degradation is much less because of the nature of an SSD.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>Btrfs defrag brings some potential drawbacks that you should be aware of:</p><aside class="onebox allowlistedgeneric" data-onebox-src="https://linuxhint.com/defragment-btrfs-filesystem/">
  <header class="source">
      <img src="https://forum.endeavouros.com/uploads/default/original/3X/0/f/0fca514658687c09250ca3b96f26da7bf6a2c42a.png" class="site-icon" data-dominant-color="472A30" width="32" height="32">

      <a href="https://linuxhint.com/defragment-btrfs-filesystem/" target="_blank" rel="noopener nofollow ugc">linuxhint.com</a>
  </header>

  <article class="onebox-body">
    <div class="aspect-image" style="--aspect-ratio:495/268;"><img src="https://forum.endeavouros.com/uploads/default/original/3X/6/2/62177d231ebf2b3181736c158c5d1d1d1fb8feaf.jpeg" class="thumbnail" data-dominant-color="E0E0E0" width="495" height="268"></div>

<h3><a href="https://linuxhint.com/defragment-btrfs-filesystem/" target="_blank" rel="noopener nofollow ugc">How to Defragment a Btrfs Filesystem</a></h3>

  <p>To solve the problem of large file fragmentation, it is necessary to defragment the Btrfs filesystem every once in a while. This article shows you how to defragment the Btrfs filesystem.</p>


  </article>

  <div class="onebox-metadata">
    
    
  </div>

  <div style="clear: both"></div>
</aside>

<blockquote>
<ol>
<li>Defragmenting files move Btrfs data extents and attempt to align them, one after the other. So, the Copy-on-Write links between the copies of the file breaks. This will increase redundant data extents, as well as the disk usage of a Btrfs filesystem that was previously saved by sharing data extents between identical (or nearly identical) copies of the file.</li>
<li>If a Btrfs subvolume has multiple snapshots, defragmenting the subvolume will break the Copy-on-Write links between the subvolume and the snapshots. This will increase disk usage of a Btrfs filesystem.</li>
<li>If you are using the Btrfs filesystem for large databases or virtual machine images (for storing VM data/disks), defragmenting the filesystem will also negatively impact the performance of the filesystem.</li>
</ol>
</blockquote>
            </div>
