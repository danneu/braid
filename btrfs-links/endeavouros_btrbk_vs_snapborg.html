        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_48405&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:489509,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;falke\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/f/bbce88/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-30T14:12:04.117Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHello,\\u003c/p\\u003e\\n\\u003cp\\u003eI hope to find some specialists on this question here, maybe \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/dalto\\\&quot;\\u003e@dalto\\u003c/a\\u003e for having already mentioned it?\\u003c/p\\u003e\\n\\u003cp\\u003eI’m looking into an external backup system for my btrfs volumes. I’ve already tried btrbk, which gives me satisfaction, but I’ve also seen snapborg (I use borgbackup via vorta elsewhere, so I’m very satisfied).\\u003c/p\\u003e\\n\\u003cp\\u003eMy question concerns snapborg. What exactly does snapborg do compared to btrbk? It copies sub-volumes in a btrfs backup or not (because when I mount my backup, I don’t see my sub-volume, which I call @, but only the tree @ contains), whereas btrbk copies the sub-volume in read-only mode to the external media.\\u003c/p\\u003e\\n\\u003cp\\u003eSo I’m wondering: what’s the advantage of using snapborg over btrbk?\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eSpace saving due to deduplication, compression, incremental backup or not at all? Does restoration involve creating an empty sub-volume into which you just copy the tree structure (in which case it takes longer than recovering a backup with the send-receive option, moreover a simple rsync can do that …)?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003ethe advantage of keeping the contents of the sub-volume on a Borg repository external to the disk?\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003ea convenient backup solution revolving around a single snapper software rather than a multiplication of tools, snapper for one use, btrbk for another (e.g. backup of subvolumes on external media? ).\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e… so far, not really convinced by snapborg, because of these grey areas\\u003c/p\\u003e\\n\\u003cp\\u003ethanks to those who can help in my choice.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:10,\&quot;updated_at\&quot;:\&quot;2023-11-30T14:36:53.170Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1829,\&quot;reads\&quot;:68,\&quot;readers_count\&quot;:67,\&quot;score\&quot;:9123.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:48405,\&quot;topic_slug\&quot;:\&quot;btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:9466,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly/48405/1\&quot;,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:1}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:1,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:489512,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;dalto\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.endeavouros.com/dalto/{size}/5577_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-11-30T14:23:54.998Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI have actually never heard of snapborg.  However, I just took a look at that and it looks pretty cool.\\u003c/p\\u003e\\n\\u003cp\\u003eI will have to try it out sometime to see how well it works but it looks like it lets you take your snapper snapshots into borg selectively.\\u003c/p\\u003e\\n\\u003cp\\u003eThe advantages of this over a purely btrfs solution are that btrfs snapshots live inside the btrfs filesystem.  You can replicate them to another disk or remote machine but those still must be btrfs.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the other hand, borg is filesystem agnostic.  You can store borg backups anywhere.  You could even replicate them to a cloud storage location if you wanted to.\\u003c/p\\u003e\\n\\u003cp\\u003eThat being said, you could achieve the same thing by simply doing borg backups of your data directly.  This tool just lets you use your snapshots as the source and shares some config with snapper.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;falke\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;48405\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/letter_avatar_proxy/v4/letter/f/bbce88/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e falke:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eSpace saving due to deduplication, compression, incremental backup or not at all?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eBtrfs snapshot replication also has these same benefits.  If you are already replicating your snapshots to a remote target, I don’t see much benefit here.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;falke\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;48405\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/letter_avatar_proxy/v4/letter/f/bbce88/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e falke:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ethe advantage of keeping the contents of the sub-volume on a Borg repository external to the disk?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYeah, if you aren’t replicating your snapshots, this is a huge advantage.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;falke\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;48405\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.endeavouros.com/letter_avatar_proxy/v4/letter/f/bbce88/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e falke:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ea convenient backup solution revolving around a single snapper software rather than a multiplication of tools,\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes, this seems to be the primary advantage.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:10,\&quot;updated_at\&quot;:\&quot;2023-11-30T14:23:54.998Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:37,\&quot;reads\&quot;:58,\&quot;readers_count\&quot;:57,\&quot;score\&quot;:216.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:48405,\&quot;topic_slug\&quot;:\&quot;btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:822,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly/48405/2\&quot \&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:9767,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly/48405/3\&quot;,\&quot;reactions\&quot;:[],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:489732,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;falke\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/f/bbce88/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-01T11:35:56.290Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHello,\\u003c/p\\u003e\\n\\u003cp\\u003eI’m not even able to exple restore my system after saving the subvolume in borg.\\u003c/p\\u003e\\n\\u003cp\\u003ei even rotted my system :-), fortunately a good btrbk backup on usb key has fortunately restored everything intact in a few minutes (btrfs send-receive, then a new snapshot of the backup once on my system). Incidentally, I’ve seen that you shouldn’t play around with changing the properties of a snaphot, and that it’s not a good practice (e.g. for incremental snapshots, where you have to identify the last parant ie btrbk).\\u003c/p\\u003e\\n\\u003cp\\u003eSo the question remains, how do you restore from snapborg?\\u003c/p\\u003e\\n\\u003cp\\u003eI’d imagine, for example, by mounting the backup anywhere:\\u003c/p\\u003e\\n\\u003cp\\u003ee.g. /home/falke/office/mounting_backup\\u003c/p\\u003e\\n\\u003cp\\u003eand also mount the system (let assumed \\u003cspan class=\\\&quot;mention\\\&quot;\\u003e@endevour\\u003c/span\\u003e) sub-vo ;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:822,\&quot;username\&quot;:\&quot;dalto\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.endeavouros.com/dalto/{size}/5577_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:9466,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly/48405/6\&quot;,\&quot;reactions\&quot;:[],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:489764,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;BluishHumility\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.endeavouros.com/bluishhumility/{size}/70412_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-01T13:56:20.066Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI think it is intended to be used in addition to a “normal” snapshotting routine. You could, for example, have \\u003ccode\\u003esnapborg\\u003c/code\\u003e backups that capture more snapshot history than your timeline retention settings are configured to save. Maybe you keep two monthly snapshots on the local disk, but the Borg device keeps 24 for example.\\u003c/p\\u003e\\n\\u003cp\\u003eWith this kind of setup, almost always the “normal” snapshots\\\&quot; will be more appropriate for snapshot restoration. The Borg stuff would be useful for situations like “Oh I had that one file a couple months ago”, or “Let me see how I used to have this config set up last year”. Whole hog restoration is still possible, but in most cases it would be easier and better to use the snapshots on the disk for that.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003esnapborg\\u003c/code\\u003e has an issue open for this if you want to chime in with your opinion or ideas:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox githubissue\\\&quot; data-onebox-src=\\\&quot;https://github.com/enzingerm/snapborg/issues/16\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://github.com/enzingerm/snapborg/issues/16\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003egithub.com/enzingerm/snapborg\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;github-row\\\&quot;\\u003e\\n  \\u003cdiv class=\\\&quot;github-icon-container\\\&quot; title=\\\&quot;Issue\\\&quot;\\u003e\\n\\t  \\u003csvg width=\\\&quot;60\\\&quot; height=\\\&quot;60\\\&quot; class=\\\&quot;github-icon\\\&quot; viewBox=\\\&quot;0 0 14 16\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cpath fill-rule=\\\&quot;evenodd\\\&quot; d=\\\&quot;M7 2.3c3.14 0 5.7 2.56 5.7 5.7s-2.56 5.7-5.7 5.7A5.71 5.71 0 0 1 1.3 8c0-3.14 2.56-5.7 5.7-5.7zM7 1C3.14 1 0 4.14 0 8s3.14 7 7 7 7-3.14 7-7-3.14-7-7-7zm1 3H6v5h2V4zm0 6H6v2h2v-2z\\\&quot;\\u003e\\u003c/path\\u003e\\u003c/svg\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-info-container\\\&quot;\\u003e\\n    \\u003ch4\\u003e\\n      \\u003ca href=\\\&quot;https://github.com/enzingerm/snapborg/issues/16\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003eEasy restore\\u003c/a\\u003e\\n    \\u003c/h4\\u003e\\n\\n    \\u003cdiv class=\\\&quot;github-info\\\&quot;\\u003e\\n      \\u003cdiv class=\\\&quot;date\\\&quot;\\u003e\\n        opened \\u003cspan class=\\\&quot;discourse-local-date\\\&quot; data-format=\\\&quot;ll\\\&quot; data-date=\\\&quot;2021-11-05\\\&quot; data-time=\\\&quot;08:38:17\\\&quot; data-timezone=\\\&quot;UTC\\\&quot;\\u003e08:38AM - 05 Nov 21 UTC\\u003c/span\\u003e\\n      \\u003c/div\\u003e\\n\\n\\n      \\u003cdiv class=\\\&quot;user\\\&quot;\\u003e\\n        \\u003ca href=\\\&quot;https://github.com/jrabinow\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003e\\n          \\u003cimg alt=\\\&quot;jrabinow\\\&quot; src=\\\&quot;https://avatars.githubusercontent.com/u/5642686?v=4\\\&quot; class=\\\&quot;onebox-avatar-inline\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\n          jrabinow\\n        \\u003c/a\\u003e\\n      \\u003c/div\\u003e\\n    \\u003c/div\\u003e\\n\\n    \\u003cdiv class=\\\&quot;labels\\\&quot;\\u003e\\n    \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n\\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-row\\\&quot;\\u003e\\n    \\u003cp class=\\\&quot;github-body-container\\\&quot;\\u003eOnce the snapshot is safely backed up in borg, how does one restore it? Can we m\\u003cspan class=\\\&quot;show-more-container\\\&quot;\\u003e\\u003ca href=\\\&quot;\\\&quot; rel=\\\&quot;noopener\\\&quot; class=\\\&quot;show-more\\\&quot;\\u003e…\\u003c/a\\u003e\\u003c/span\\u003e\\u003cspan class=\\\&quot;excerpt hidden\\\&quot;\\u003eake it easier with something like `snapborg restore $SNAPPER_CONFIG_NAME $BACKUP_NAME`?\\u003c/span\\u003e\\u003c/p\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003ePersonally I agree with the author’s comment \\u003ca href=\\\&quot;https://github.com/enzingerm/snapborg/issues/16#issuecomment-1468838705\\\&quot;\\u003ehere\\u003c/a\\u003e:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI think adding an automated restore functionality would be quite complicated and dangerous to implement. But maybe adding a wrapper around commands like \\u003ccode\\u003eborg mount\\u003c/code\\u003e or \\u003ccode\\u003eborg extract\\u003c/code\\u003e could be provided. However, I’m not sure what the benefits of that would be over doing something like\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003eborg list \\u0026lt;borg_repo\\u0026gt;\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003echoose an archive/snapshot to restore from\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003eborg mount ...\\u003c/code\\u003e or \\u003ccode\\u003eborg extract ...\\u003c/code\\u003e this exact archive\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eIt seems pretty easy to use as-is.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:10,\&quot;updated_at\&quot;:\&quot;2023-12-01T13:56:20.066Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:16,\&quot;reads\&quot;:30,\&quot;readers_count\&quot;:29,\&quot;score\&quot;:101.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:48405,\&quot;topic_slug\&quot;:\&quot;btrfs-backup-btrbk-vs-snapborg-what-does-snapborg-exactly\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&qu quot;},{\\\&quot;native_name\\\&quot;:\\\&quot;简体中文\\\&quot;,\\\&quot;value\\\&quot;:\\\&quot;zh_CN\\\&quot;,\\\&quot;name\\\&quot;:\\\&quot;languages.zh_CN.name\\\&quot;},{\\\&quot;native_name\\\&quot;:\\\&quot;繁體中文\\\&quot;,\\\&quot;value\\\&quot;:\\\&quot;zh_TW\\\&quot;,\\\&quot;name\\\&quot;:\\\&quot;languages.zh_TW.name\\\&quot;}]\&quot;,\&quot;available_content_localization_locales\&quot;:[],\&quot;require_invite_code\&quot;:false,\&quot;site_logo_url\&quot;:\&quot;https://forum.endeavouros.com/uploads/default/original/3X/f/c/fc9ba8de3555c4e06d357c8eba28f4de93c9a5a5.svg\&quot;,\&quot;site_logo_small_url\&quot;:\&quot;https://forum.endeavouros.com/uploads/default/original/2X/9/9ea52f9fd5ef8e609e593c362d61a36295f48be8.png\&quot;,\&quot;site_mobile_logo_url\&quot;:\&quot;https://forum.endeavouros.com/uploads/default/original/3X/f/c/fc9ba8de3555c4e06d357c8eba28f4de93c9a5a5.svg\&quot;,\&quot;site_favicon_url\&quot;:\&quot;https://forum.endeavouros.com/uploads/default/optimized/2X/a/a3b3daed6670a7d6372892921f899ecedf34c443_2_32x32.png\&quot;,\&quot;site_logo_dark_url\&quot;:\&quot;https://forum.endeavouros.com/uploads/default/original/3X/8/d/8d0d00f918d77203bc3786a7877b6d2561a08525.svg\&quot;,\&quot;site_logo_small_dark_url\&quot;:\&quot;\&quot;,\&quot;site_mobile_logo_dark_url\&quot;:\&quot;https://forum.endeavouros.com/uploads/default/original/3X/8/d/8d0d00f918d77203bc3786a7877b6d2561a08525.svg\&quot;}&quot;,&quot;themeSiteSettingOverrides&quot;:&quot;{\&quot;enable_welcome_banner\&quot;:true,\&quot;search_experience\&quot;:\&quot;search_field\&quot;}&quot;,&quot;customHTML&quot;:&quot;{\&quot;top\&quot;:\&quot;\&quot;,\&quot;footer\&quot;:\&quot;\&quot;}&quot;,&quot;banner&quot;:&quot;{\&quot;html\&quot;:\&quot;\u003cp\u003eImportant announcement on the Archlinux mailing list:\\u003C/p\u003e\\n\u003cblockquote\u003e\\n\u003cp\u003eWith \u003ccode\u003e20250613.12fe085f-5\\u003C/code\u003e, we split our firmware into several vendor-focused packages. \u003ccode\u003elinux-firmware\\u003C/code\u003e is now an empty package depending on our default set of firmware.\\u003C/p\u003e\\n\u003cp\u003eUnfortunately, this coincided with upstream reorganizing the symlink layout of the NVIDIA firmware, resulting in a situation that Pacman cannot handle. When attempting to upgrade from \u003ccode\u003e20250508.788aadc8-2\\u003C/code\u003e or earlier, you will see the following errors:\\u003C/p\u003e\\n\u003cpre\u003e\u003ccode\u003elinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad103 exists in filesystem\\nlinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad104 exists in filesystem\\nlinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad106 exists in filesystem\\nlinux-firmware-nvidia: /usr/lib/firmware/nvidia/ad107 exists in filesystem\\n\\u003C/code\u003e\\u003C/pre\u003e\\n\u003cp\u003eTo progress with the system upgrade, first remove \u003ccode\u003elinux-firmware\\u003C/code\u003e, then reinstall it as part of the upgrade:\\u003C/p\u003e\\n\u003cpre\u003e\u003ccode\u003e# pacman -Rdd linux-firmware\\n# pacman -Syu linux-firmware\\n\\u003C/code\u003e\\u003C/pre\u003e\\n\u003cp\u003eURL: \u003ca href=\\\&quot;https://archlinux.org/news/linux-firmware-2025061312fe085f-5-upgrade-requires-manual-intervention/\\\&quot;\u003ehttps://archlinux.org/news/linux-firmware-2025061312fe085f-5-upgrade-requires-manual-intervention/\\u003C/a\u003e\\u003C/p\u003e\\n\\u003C/blockquote\u003e\\n\u003cp\u003eUpdate with care!\\u003C/p\u003e\&quot;,\&quot;key\&quot;:72761,\&quot;url\&quot;:\&quot;https://forum.endeavouros.com/t/linux-firmware-20250613-12fe085f-5-upgrade-requires-manual-intervention/72761\&quot;}&quot;,&quot;customEmoji&quot;:&quot;[{\&quot;name\&quot;:\&quot;enos\&quot;,\&quot;url\&quot;:\&quot;/uploads/default/original/2X/3/36f51695b46b047f7673b2859d14bd85d94d064c.png\&quot;,\&quot;group\&quot;:\&quot;default\&quot;,\&quot;created_by\&quot;:\&quot;system\&quot;},{\&quot;name\&quot;:\&quot;enos_flag\&quot;,\&quot;url\&quot;:\&quot;/uploads/default/original/2X/d/da1c3efb10bca2645590acfa5cccf7c38b2d6dcc.png\&quot;,\&quot;group\&quot;:\&quot;default\&quot;,\&quot;created_by\&quot;:\&quot;system\&quot;},{\&quot;name\&quot;:\&quot;penguin_face\&quot;,\&quot;url\&quot;:\&quot;/uploads/default/original/2X/d/d1e358b7cb7fd54b2de0473297ade8e5540cfc75.png\&quot;,\&quot;group\&quot;:\&quot;default\&quot;,\&quot;created_by\&quot;:\&quot;system\&quot;},{\&quot;name\&quot;:\&quot;rocketa\&quot;,\&quot;url\&quot;:\&quot;/uploads/default/original/2X/c/c85f0ab175044bc95cb5a40a94d0f14f91939e56.png\&quot;,\&quot;group\&quot;:\&quot;default\&quot;,\&quot;created_by\&quot;:\&quot;system\&quot;},{\&quot;name\&quot;:\&quot;rocketa_purple\&quot;,\&quot;url\&quot;:\&quot;/uploads/default/original/2X/2/225bc6c8d2dd5b8c050c8843a5a921d9e1ae4ee9.png\&quot;,\&quot;group\&quot;:\&quot;default\&quot;,\&quot;created_by\&quot;:\&quot;system\&quot;}]&quot;,&quot;isReadOnly&quot;:&quot;false&quot;,&quot;isStaffWritesOnly&quot;:&quot;false&quot;,&quot;activatedThemes&quot;:&quot;{\&quot;16\&quot;:\&quot;Countries Tooltip\&quot;,\&quot;15\&quot;:\&quot;Header submenus\&quot;,\&quot;-2\&quot;:\&quot;Horizon\&quot;}&quot;,&quot;upcomingChanges&quot;:&quot;{\&quot;chat_pinned_messages\&quot;:false,\&quot;enable_auto_grid_images\&quot;:false,\&quot;enable_custom_splash_screen\&quot;:false,\&quot;enable_form_templates\&quot;:false,\&quot;enable_simplified_category_creation\&quot;:false,\&quot;floating_dismiss_topics_on_mobile\&quot;:false,\&quot;impersonate_without_logout\&quot;:false,\&quot;modernize_foundation_theme\&quot;:false,\&quot;rename_faq_to_guidelines\&quot;:false,\&quot;reporting_improvements\&quot;:false}&quot;}"></div>

            <div class='post' itemprop='text'>
              <p>Hello,</p>
<p>I hope to find some specialists on this question here, maybe <a class="mention" href="/u/dalto">@dalto</a> for having already mentioned it?</p>
<p>I’m looking into an external backup system for my btrfs volumes. I’ve already tried btrbk, which gives me satisfaction, but I’ve also seen snapborg (I use borgbackup via vorta elsewhere, so I’m very satisfied).</p>
<p>My question concerns snapborg. What exactly does snapborg do compared to btrbk? It copies sub-volumes in a btrfs backup or not (because when I mount my backup, I don’t see my sub-volume, which I call @, but only the tree @ contains), whereas btrbk copies the sub-volume in read-only mode to the external media.</p>
<p>So I’m wondering: what’s the advantage of using snapborg over btrbk?</p>
<ul>
<li>
<p>Space saving due to deduplication, compression, incremental backup or not at all? Does restoration involve creating an empty sub-volume into which you just copy the tree structure (in which case it takes longer than recovering a backup with the send-receive option, moreover a simple rsync can do that …)?</p>
</li>
<li>
<p>the advantage of keeping the contents of the sub-volume on a Borg repository external to the disk?</p>
</li>
<li>
<p>a convenient backup solution revolving around a single snapper software rather than a multiplication of tools, snapper for one use, btrbk for another (e.g. backup of subvolumes on external media? ).</p>
</li>
</ul>
<p>… so far, not really convinced by snapborg, because of these grey areas</p>
<p>thanks to those who can help in my choice.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>I have actually never heard of snapborg.  However, I just took a look at that and it looks pretty cool.</p>
<p>I will have to try it out sometime to see how well it works but it looks like it lets you take your snapper snapshots into borg selectively.</p>
<p>The advantages of this over a purely btrfs solution are that btrfs snapshots live inside the btrfs filesystem.  You can replicate them to another disk or remote machine but those still must be btrfs.</p>
<p>On the other hand, borg is filesystem agnostic.  You can store borg backups anywhere.  You could even replicate them to a cloud storage location if you wanted to.</p>
<p>That being said, you could achieve the same thing by simply doing borg backups of your data directly.  This tool just lets you use your snapshots as the source and shares some config with snapper.</p>

              <p>Hello,</p>
<p>I’m not even able to exple restore my system after saving the subvolume in borg.</p>
<p>i even rotted my system :-), fortunately a good btrbk backup on usb key has fortunately restored everything intact in a few minutes (btrfs send-receive, then a new snapshot of the backup once on my system). Incidentally, I’ve seen that you shouldn’t play around with changing the properties of a snaphot, and that it’s not a good practice (e.g. for incremental snapshots, where you have to identify the last parant ie btrbk).</p>
<p>So the question remains, how do you restore from snapborg?</p>
<p>I’d imagine, for example, by mounting the backup anywhere:</p>
<p>e.g. /home/falke/office/mounting_backup</p>
<p>and also mount the system (let assumed <span class="mention">@endevour</span>) sub-volume created empty</p>
<p>sudo mount /dev/sda2 -o subvol=@endeavour /home/falke/Bureau/restore_backup</p>
<p>then paste all mount point files under /home/falke/Bureau/restore_backup and finally unmount all previous mountages.</p>

            <div class='post' itemprop='text'>
              <p>I think it is intended to be used in addition to a “normal” snapshotting routine. You could, for example, have <code>snapborg</code> backups that capture more snapshot history than your timeline retention settings are configured to save. Maybe you keep two monthly snapshots on the local disk, but the Borg device keeps 24 for example.</p>
<p>With this kind of setup, almost always the “normal” snapshots" will be more appropriate for snapshot restoration. The Borg stuff would be useful for situations like “Oh I had that one file a couple months ago”, or “Let me see how I used to have this config set up last year”. Whole hog restoration is still possible, but in most cases it would be easier and better to use the snapshots on the disk for that.</p>
<p><code>snapborg</code> has an issue open for this if you want to chime in with your opinion or ideas:</p>

  <div class="github-row">
    <p class="github-body-container">Once the snapshot is safely backed up in borg, how does one restore it? Can we m<span class="show-more-container"><a href="" rel="noopener" class="show-more">…</a></span><span class="excerpt hidden">ake it easier with something like `snapborg restore $SNAPPER_CONFIG_NAME $BACKUP_NAME`?</span></p>

  </div>

  <div style="clear: both"></div>
</aside>

<p>Personally I agree with the author’s comment <a href="https://github.com/enzingerm/snapborg/issues/16#issuecomment-1468838705">here</a>:</p>
<blockquote>
<p>I think adding an automated restore functionality would be quite complicated and dangerous to implement. But maybe adding a wrapper around commands like <code>borg mount</code> or <code>borg extract</code> could be provided. However, I’m not sure what the benefits of that would be over doing something like</p>
<ul>
<li><code>borg list &lt;borg_repo&gt;</code></li>
<li>choose an archive/snapshot to restore from</li>
<li><code>borg mount ...</code> or <code>borg extract ...</code> this exact archive</li>
</ul>
</blockquote>
<p>It seems pretty easy to use as-is.</p>
