        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_175759&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:1250432,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-13T11:18:57.629Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003etl;dr: I have set up a LUKS-encrypted Btrfs RAID 1 (in a VM), but can’t get it to boot when I detach one (virtual) hard drive. How do I do that?\\u003c/p\\u003e\\n\\u003cp\\u003eMore details:\\u003c/p\\u003e\\n\\u003cp\\u003eOne of my PCs requires redundancy, so I decided to dive into Btrfs and its RAID 1 implementation (in a VM for now). I’m quite new to OpenSUSE and a self-taught Linux user - but generally I manage to solve most problems I come across with some GoogleFu and lots of patience. However, booting into an encrypted Btrfs RAID 1 system with one (of two) hard drives missing is proving to be too tough a nut for me to crack (and I have spent a looooot of time on this, searching this forum, Reddit, search engines, etc.).\\u003c/p\\u003e\\n\\u003cp\\u003eComing from Debian, I must say I love the OpenSUSE installer (as well as many other things). Using the expert partitioner during installation allowed me to set up a Btrfs RAID1 quite easily:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esda1\\u003c/code\\u003e - 0.50GiB - not encrypted - EFI - mount point: \\u003ccode\\u003e/boot/efi\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esda2\\u003c/code\\u003e - 63.50GiB - encrypted - unformatted - unmounted (this becomes the RAID)\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esdb1\\u003c/code\\u003e - 0.50GiB - not encrypted - EFI - umounted (this later becomes an EFI clone)\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esdb2\\u003c/code\\u003e - 63.50GiB - encrypted - unformatted - unmounted (this becomes the RAID)\\u003c/li\\u003e\\n\\u003cli\\u003eto create the Btrfs RAID:\\u003cbr\\u003e\\n– choose Btrfs on the left\\u003cbr\\u003e\\n– “Add Btrfs…”\\u003cbr\\u003e\\n– RAID Level “RAID1”\\u003cbr\\u003e\\n– RAID Level for Metadata “RAID1”\\u003cbr\\u003e\\n– add \\u003ccode\\u003esda2\\u003c/code\\u003e and \\u003ccode\\u003esdb2\\u003c/code\\u003e\\u003cbr\\u003e\\n– Mount Point \\u003ccode\\u003e/\\u003c/code\\u003e\\u003cbr\\u003e\\n– Enable Snapshots\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eSo far so good, the installer finishes, the system boots, encryption works, Btrfs seems to be a RAID1, perfect!\\u003c/p\\u003e\\n\\u003cp\\u003eNow comes the tough part though: simulating a drive failure. I (virtually) detached \\u003ccode\\u003esdb\\u003c/code\\u003e. The system starts, asks for the LUKS password for sda2, then the grub screen, after choosing the first option I briefly get:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003e Booting `openSUSE Tumbleweed&#39;\\n\\nerror: ../../grub-core/disk/cryptodisk.c:1519:no such cryptodisk found, perhaps a\\nneeded disk or cryptodisk module is not loaded.\\nLoading Linux 6.8.6-1-default ...\\nLoading initial ramdisk ...\\n\\nPress any key to continue...\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThe machine then works silently for a while, after which I get:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003eWarning: crypto LUKS UUID 9902[...] not found\\n\\nGenerating \\\&quot;/run/initramfs/rdsosreport.txt\\\&quot;\\n\\nEntering emergency mode. Exit the shell to continue.\\nType \\\&quot;journalctl\\\&quot; to view system logs.\\nYou might want to save \\\&quot;/run/initramfs/rdsosreport.txt\\\&quot; to a USB stick or /boot\\nafter mounting them and attach it to a bug report.\\n\\nGive root password for maintenance\\n(or press Control-D to continue):\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eWhen I press Control-D, I get:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003e[ 902.527613] dracut-initqueue[422]: Warning: Not all disks have been found.\\n[ 902.527689] dracut-initqueue[422]: Warning: You might want to regenerate your initramfs.\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThen nothing else happens.\\u003c/p\\u003e\\n\\u003cp\\u003eSo after a restart, I typed in the admin password to get to a basic shell, where I tried to mount the RAID1 as degraded using this command I found all over the interwebs (I adapted the filepath to \\u003ccode\\u003ecr_root\\u003c/code\\u003e):\\u003cbr\\u003e\\n\\u003ccode\\u003emount -o degraded /dev/mapper/cr_root /mnt\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eUnfortunately, I get:\\u003cbr\\u003e\\n\\u003ccode\\u003emount: /mnt: mount point does not exist\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eSo I created that directory (did I mention I’m feeeeeling my way forward here…):\\u003cbr\\u003e\\n\\u003ccode\\u003emkdir /mnt\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e… and mounted again, this time without error. I took this as success and exited the shell. Unfortunately, I still get the same \\u003ccode\\u003eWarning: Not all disks have been found.\\u003c/code\\u003e as above.\\u003c/p\\u003e\\n\\u003cp\\u003eAfter a restart, I tried a different approach and (after typing in the LUKS password) I pressed “e” in grub, then added \\u003ccode\\u003edegraded\\u003c/code\\u003e to the line that looked appropriate to me:\\u003cbr\\u003e\\n\\u003ccode\\u003elinux      /boot/vmlinuz-6.8.6-1-default root=UUID=2586[...] ${extra_cmdline} splash=silent mitigations=auto quiet security=apparmor degraded\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe system behaves a little differently (but with the same result): I have to type in the LUKS password \\u003cem\\u003ea second time\\u003c/em\\u003e (this time into a text field in the middle of the screen) but ultimately, I end up with the same \\u003ccode\\u003eWarning: crypto LUKS UUID 9902[...] not found\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eMy next attempt was going to be to chroot into the system from a live system, but it’s hard to imagine that’s the only way to boot into a degraded Btrfs RAID. I’m just thinking there \\u003cem\\u003emust\\u003c/em\\u003e be an easier way.\\u003c/p\\u003e\\n\\u003cp\\u003eCan someone please help me?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-13T11:18:57.629Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:772,\&quot;reads\&quot;:35,\&quot;readers_count\&quot;:34,\&quot;score\&quot;:3872.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Dog\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:49150,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-b \&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Flux Capacitor Penguin\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:23014,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250444,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-13T13:29:39.666Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eYes, you are of course right. I thought the same while writing all this up. Sorry, should have done this immediately. But here it is now: \\u003ca href=\\\&quot;https://paste.opensuse.org/pastes/575ea6d1bf2e\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehttps://paste.opensuse.org/pastes/575ea6d1bf2e\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eEdit: It looks like I can’t edit the original post? That’s a shame, I was going to add the link there. Or am I misunderstanding the interface here?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-13T13:31:19.763Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:31,\&quot;readers_count\&quot;:30,\&quot;score\&quot;:21.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Dog\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://paste.opensuse.org/pastes/575ea6d1bf2e\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;openSUSE Paste\&quot;,\&quot;clicks\&quot;:11}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;arvidjaar\&quot;,\&quot;name\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/8491ac/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:49150,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/3\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250485,\&quot;name\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;username\&quot;:\&quot;arvidjaar\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/8491ac/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-13T18:28:35.763Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ccode\\u003edracut\\u003c/code\\u003e knows nothing about btrfs RAID1 and simply has fixed requirement for the devices that are part of btrfs. Once you are past this, you get next problem - systemd will not attempt to mount filesystem until all devices are present. And only when you are past systemd does \\u003ccode\\u003edegraded\\u003c/code\\u003e option become relevant. But \\u003ccode\\u003edegraded\\u003c/code\\u003e option in the past resulted in broken RAID1 (data written in this state would be written in \\u003ccode\\u003esingle\\u003c/code\\u003e profile instead if RAID1); I do not know whether it has been fixed. So \\u003ccode\\u003edegraded\\u003c/code\\u003e as default option was highly discouraged.\\u003c/p\\u003e\\n\\u003cp\\u003eThe problem of multidevice btrfs vs. systemd is really really old and it can be solved neither in btrfs nor in systemd with their current architecture. Apparently so far nobody was motivated enough to design and implement a solution. You may have more luck with MD RAID1 which should handle the missing piece a bit better.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-13T18:28:35.763Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:3,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:24,\&quot;reads\&quot;:27,\&quot;readers_count\&quot;:26,\&quot;score\&quot;:135.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Flux Capacitor Penguin\&quot;,\&quot;title_is_group\&quot;:false,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:23014,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250567,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-14T10:05:09.480Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThank you, this is really helpful! It connects a few dots I stumbled upon but did not know how to put together.\\u003c/p\\u003e\\n\\u003cp\\u003eFrom my understanding, the \\u003ccode\\u003edegraded\\u003c/code\\u003e option is really only a temporary measure until the damaged drive can be replaced. At that point one needs to rebalance and the RAID1 should continue functioning properly. I’m happy to be corrected about this if I’m wrong, of course.\\u003c/p\\u003e\\n\\u003cp\\u003eSo the question remains how to boot into an encrypted Btrfs RAID1 with one hard drive missing. Am I correct in assuming I need to chroot into the system from a live system and fix a few things? My GoogleFu and some AI are telling me that initramfs needs to be rebuilt and the GRUB configuration updated with the \\u003ccode\\u003edegraded\\u003c/code\\u003e flag?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-14T10:05:09.480Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:25,\&quot;readers_count\&quot;:24,\&quot;score\&quot;:10.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Dog\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;arvidjaar\&quot;,\&quot;name\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/8491ac/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;act \&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250682,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-14T18:42:29.250Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI have spent a good few hours experimenting with this now and would be thankful for some help, since I’m obviously very stuck. Here’s what I did:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eboot into live environment\\u003c/li\\u003e\\n\\u003cli\\u003edecrypt the one remaining decrypted drive: \\u003ccode\\u003esudo cryptsetup luksOpen /dev/sda2 cr_root\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003emount the Btrfs filesystem as \\u003ccode\\u003edegraded\\u003c/code\\u003e: \\u003ccode\\u003esudo mount -o degraded /dev/mapper/cr_root /mnt\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003emount additional folders:\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esudo mount --bind /dev /mnt/dev\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esudo mount --bind /proc /mnt/proc\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esudo mount --bind /sys /mnt/sys\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esudo mount --bind /run /mnt/run\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e\\u003ccode\\u003esudo mount --bind /var /mnt/var\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003col start=\\\&quot;5\\\&quot;\\u003e\\n\\u003cli\\u003echroot into the system: \\u003ccode\\u003esudo chroot /mnt\\u003c/code\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003erebuild initramfs: `dracut -f --regenerate-all\\u003c/li\\u003e\\n\\u003cli\\u003eedit GRUB configuration by adding the \\u003ccode\\u003edegraded\\u003c/code\\u003e flag:\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003enano /etc/default/grub\\u003c/li\\u003e\\n\\u003cli\\u003eadd \\u003ccode\\u003edegraded\\u003c/code\\u003e to end of appropriate line, like so: `GRUB_CMDLINE_LINUX_DEFAULT=“ degraded”\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003col start=\\\&quot;8\\\&quot;\\u003e\\n\\u003cli\\u003eupdate GRUB configuration: grub2-mkconfig -o /boot/grub2/grub.cfg`\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eHere my luck ended. I received this error message (I hope I wrote it down correctly):\\u003cbr\\u003e\\n\\u003ccode\\u003egrub2-mkconfig /usr/sbin/grub-probe: error: failed to get canonical path of \\u003c/code\\u003e&#39;`\\u003c/p\\u003e\\n\\u003cp\\u003eI thought maybe I could now boot into grub and then append \\u003ccode\\u003edegraded\\u003c/code\\u003e via pressing “e”. But this results in the error message:\\u003cbr\\u003e\\n\\u003ccode\\u003eInitramfs unpacking failed: invalid magic at start of compressed archive\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThen I found this article (\\u003ca href=\\\&quot;https://en.opensuse.org/SDB:BTRFS#How_to_manually_re-install_grub_on_opensuse/btrfs\\\&quot; class=\\\&quot;inline-onebox\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eSDB:BTRFS - openSUSE Wiki\\u003c/a\\u003e), followed it as best I can to mount the various Btrfs subvolumes. But in the end, I could not chroot into the system, and instead received:\\u003cbr\\u003e\\n\\u003ccode\\u003echroot: failed to run command ‘/bin/bash’: No such file or directory\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eI obviously buggered up my system now. Could anybody help me along?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-14T18:42:29.250Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&qu ot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;susedog\\\&quot; data-post=\\\&quot;8\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/s/c67d28/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e susedog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003esudo mount --bind /sys /mnt/sys\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eNot directly related, but it should be \\u003ccode\\u003e--rbind\\u003c/code\\u003e, not \\u003ccode\\u003e--bind\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;susedog\\\&quot; data-post=\\\&quot;8\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/s/c67d28/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e susedog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003egrub2-mkconfig /usr/sbin/grub-probe: error: failed to get canonical path of \\u003c/code\\u003e&#39;`\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eEducated guess - \\u003ccode\\u003egrub2-probe\\u003c/code\\u003e collects devices that are part of btrfs and it fails to find missing device.\\u003c/p\\u003e\\n\\u003cp\\u003eIt is still not clear what you are trying to do. The subject says “boot into a degraded btrfs”, but in reality you attempt to change configuration in degraded state. It is much more ambitious.\\u003c/p\\u003e\\n\\u003cp\\u003eIf your intention is to permanently ignore missing device, then just remove this device from btrfs.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003ebtrfs device remove ...\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-15T05:18:45.868Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:8,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:20,\&quot;readers_count\&quot;:19,\&quot;score\&quot;:19.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Flux Capacitor Penguin\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:23014,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/9\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250790,\&quot;name\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;username\&quot;:\&quot;arvidjaar\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/8491ac/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-15T11:51:30.537Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;arvidjaar\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/a/8491ac/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e arvidjaar:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eBut \\u003ccode\\u003edegraded\\u003c/code\\u003e option in the past resulted in broken RAID1 (data written in this state would be written in \\u003ccode\\u003esingle\\u003c/code\\u003e profile instead if RAID1); I do not know whether it has been fixed.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt is not\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003etw:~ # btrfs filesystem usage -T /mnt\\nOverall:\\n    Device size:\\t\\t   2.00GiB\\n    Device allocated:\\t\\t 761.50MiB\\n    Device unallocated:\\t\\t   1.26GiB\\n    Device missing:\\t\\t   1.00GiB\\n    Device slack:\\t\\t     0.00B\\n    Used:\\t\\t\\t 202.75MiB\\n    Free (estimated):\\t\\t   1.29GiB\\t(min: 917.87MiB)\\n    Free (statfs, df):\\t\\t 406.50MiB\\n    Data ratio:\\t\\t\\t      1.23\\n    Metadata ratio:\\t\\t      2.00\\n    Global reserve:\\t\\t   5.50MiB\\t(used: 0.00B)\\n    Multiple profiles:\\t\\t       yes\\t(data)\\n\\n            Data      Data      Metadata  System                            \\nId Path     single    RAID1     RAID1     RAID1    Unallocated Total   Slack\\n-- -------- --------- --------- --------- -------- ----------- ------- -----\\n 1 missing          - 102.38MiB 102.38MiB  8.00MiB   811.25MiB 1.00GiB     -\\n 2 /dev/sdb 336.00MiB 102.38MiB 102.38MiB  8.00MiB   475.25MiB 1.00GiB     -\\n-- -------- --------- --------- --------- -------- ----------- ------- -----\\n   Total    336.00MiB 102.38MiB 102.38MiB  8.00MiB     1.26GiB 2.00GiB 0.00B\\n   Used     198.00MiB   2.00MiB 368.00KiB 16.00KiB                          \\ntw:~ # \\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThe problem is, running for a prolonged time you create data with only a single copy and this data will not be automatically converted to RAID1 once you add missing device back. So you lose redundancy without any notification. And it is much more worse. If you now add this missing device back, btrfs silently incorporates it, but its content is out of sync with the surviving piece, leading to\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003e[   95.202650] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 22052864 have 0\\n[   95.219280] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 22052864 (dev /dev/sdb sector 43072)\\n[   95.225950] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 22056960 (dev /dev/sdb sector 43080)\\n[   95.231284] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 22061056 (dev /dev/sdb sector 43088)\\n[   95.242598] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 22065152 (dev /dev/sdb sector 43096)\\n[   95.245943] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 31326208 have 0\\n[   95.259339] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 31326208 (dev /dev/sdb sector 61184)\\n[   95.265933] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 31330304 (dev /dev/sdb sector 61192)\\n[   95.270363] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 31334400 (dev /dev/sdb sector 61200)\\n[   95.282624] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 31338496 (dev /dev/sdb sector 61208)\\n[   95.288428] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 31342592 have 0\\n[   95.292599] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 31342592 (dev /dev/sdb sector 61216)\\n[   95.302751] [ T2350] BTRFS info (device sdc): read error corrected: ino 0 off 31346688 (dev /dev/sdb sector 61224)\\n[   95.319271] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 31260672 have 0\\n[   95.345957] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 31358976 have 0\\n[   95.375956] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 30932992 have 0\\n[   95.532649] [  T387] BTRFS error (device sdc): bad tree block start, mirror 1 want 31293440 have 0\\ntw:~ # \\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eYes, btrfs managed to notice the mismatch, but it should not have allowed this device into filesystem in the first place. And of course single profile remained single, nothing changed.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003e            Data      Data      Metadata  System                            \\nId Path     single    RAID1     RAID1     RAID1    Unallocated Total   Slack\\n-- -------- --------- --------- --------- -------- ----------- ------- -----\\n 1 /dev/sdb         - 102.38MiB 102.38MiB  8.00MiB   811.25MiB 1.00GiB     -\\n 2 /dev/sdc 336.00MiB 102.38MiB 102.38MiB  8.00MiB   475.25MiB 1.00GiB     -\\n-- -------- --------- --------- --------- -------- ----------- ------- -----\\n   Total    336.00MiB 102.38MiB 102.38MiB  8.00MiB     1.26GiB 2.00GiB 0.00B\\n   Used     198.00MiB   2.00MiB 368.00KiB 16.00KiB                          \\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eSo, sorry - btrfs multi-device is by far not a replacement for a true RAID (be it hardware or software). For this reason I do not consider the problem of booting with degraded system btrfs RAID1 to be of any importance. It is simply not there yet.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:10,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-15T11:51:30.537Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:3,\&quot;reads\&quot;:21,\&quot;readers_count\&quot;:20,\&quot;score\&quot;:24.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Flux Capacitor Penguin\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:23014,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/10\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250916,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-15T21:14:29.622Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eWow thank you for taking the time to look into this more!\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;arvidjaar\\\&quot; data-post=\\\&quot;9\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/a/8491ac/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e arvidjaar:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIt is still not clear what you are trying to do.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eOh no, that’s of course a problem. Let me try and state it more precisely: I want to figure out how to boot into an encrypted Btrfs RAID1 system where one of two hard drives is defective/offline, to be able to use the system for a few days until a replacement drive arrives, at which point that drive should be added to the RAID1 to achieve redundancy again.\\u003c/p\\u003e\\n\\u003cp\\u003eAll my attempts I have described above are the various approaches I have found online to achieve this. If they are misguided or too ambitious, then this is due to the fact that I don’t know better. I am thankful for all better advice.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;arvidjaar\\\&quot; data-post=\\\&quot;10\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/a/8491ac/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e arvidjaar:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eThe problem is, running for a prolonged time you create data with only a single copy and this data will not be automatically converted to RAID1 once you add missing device back. So you lose redundancy without any notification. And it is much more worse. If you now add this missing device back, btrfs silently incorporates it, but its content is out of sync with the surviving piece\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eFrom my understanding, a \\u003ccode\\u003ebtrfs balance\\u003c/code\\u003e should fix these issues, shouldn’t it? In fact, from what I read I gathered that this is exactly the required procedure after the RAID was in a degraded state. You balance it to incorporate the single profile data.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;arvidjaar\\\&quot; data-post=\\\&quot;10\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/a/8491ac/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e arvidjaar:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eSo, sorry - btrfs multi-device is by far not a replacement for a true RAID (be it hardware or software). For this reason I do not consider the problem of booting with degraded system btrfs RAID1 to be of any importance. It is simply not there yet.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI read up on this as best I could before starting my own experiments and read pretty much everywhere that RAID1 is now considered stable and recommended (as opposed to RAID5 or 6). With the caveat that it’s a little unintuitive to boot into the system and that the system needs to be rebalanced after a drive replacement and/or degraded state. Remembering to balance in the rare case that it’s required - I can live with that. Normally I can also live with it being unintuitive - but in this case, as you can tell, I seem to have hit my limit. Which is very disappointing, but also challenging, which is why I have spent more time on it.\\u003c/p\\u003e\\n\\u003cp\\u003eI you have any suggestions on what else I could try, I’d be very grateful for them.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:11,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-15T21:14:29.622Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:2,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:18,\&quot;readers_count\&quot;:17,\&quot;score\&quot;:18.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Dog\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:49150,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/11\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1250948,\&quot;name\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;username\&quot;:\&quot;arvidjaar\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/8491ac/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-16T05:30:21.992Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;susedog\\\&quot; data-post=\\\&quot;11\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/s/c67d28/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e susedog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI want to figure out how to boot into an encrypted Btrfs RAID1 system where one of two hard drives is defective/offline\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eUnattended boot is near to impossible today. Manual boot - stop in initrd and remove missing device from btrfs.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;susedog\\\&quot; data-post=\\\&quot;11\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/s/c67d28/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e susedog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ea \\u003ccode\\u003ebtrfs balance\\u003c/code\\u003e should fix these issues, shouldn’t it?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes, as long as you are using the correct invocation. Even then it requires extra space to run so it may fail where traditional RAID is expected to succeed.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;susedog\\\&quot; data-post=\\\&quot;11\\\&quot; data-topic=\\\&quot;175759\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forums.opensuse.org/letter_avatar_proxy/v4/letter/s/c67d28/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e susedog:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eread pretty much everywhere that RAID1 is now considered stable and recommended\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt may be stable from btrfs development point of view, but integration into operating system is beyond the scope of btrfs development. Pragmatic answer - do not reboot with missing disk. Wait until disk is ready for replacement, shut down, replace the disk, boot (and notice, that for a system device you may need to install bootloader on this disk which is already beyond the scope of btrfs). If you want more comfortable handling known from using a real RAID1 (unattended boot with missing disk, automatic resilvering after disk replacement) - use real RAID1. Or step in and implement this for btrfs.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:12,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-16T05:30:43.039Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:11,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:17,\&quot;readers_count\&quot;:16,\&quot;score\&quot;:8.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Flux Capacitor Penguin\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:23014,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/12\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1251090,\&quot;name\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;username\&quot;:\&quot;arvidjaar\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/a/8491ac/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-16T19:14:36.885Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI gave it a try. It just confirmed that it is unusable as a real life solution.\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eIt starts with grub. grub is configured to access its \\u003ccode\\u003e/boot/grub2\\u003c/code\\u003e on btrfs using \\u003cstrong\\u003eone\\u003c/strong\\u003e device (grub does not have any notation to reference multi-device filesystem at all. It takes one device as reference and internally scans others if needed, but the reference must exist). To mitigate it, \\u003ccode\\u003egrub2-install\\u003c/code\\u003e must configure grub2 images differently on each disk, each image must reference the copy located on the same disk.\\u003c/li\\u003e\\n\\u003cli\\u003egrub stops in menu because it fails to configure the second encrypted device, but continues after some timeout. This can be worked around by editing menu commands - \\u003cem\\u003eif\\u003c/em\\u003e you know the correct UUID to delete …\\u003c/li\\u003e\\n\\u003cli\\u003eOf course, dracut stops waiting for the non-existent device. This is internal initque loop which is statically configured when initrd is created. After some time dracut enters emergency shell where it is possible to remove the hook script.\\u003c/li\\u003e\\n\\u003cli\\u003eBut then you hit systemd dependencies - it waits for each device in \\u003ccode\\u003e/etc/crypttab\\u003c/code\\u003e. It can be worked around by passing \\u003ccode\\u003erd.luks.uuid=\\u003c/code\\u003e option on kernel command line … if you know the correct UUID of course.\\u003c/li\\u003e\\n\\u003cli\\u003eNext is btrfs. systemd will not attempt to mount btrfs unless all devices are present. This can be worked around by removing the corresponding rule from udev btrfs rules … in advance. It may be possible to do in initrd, but by default there is no editor included.\\u003c/li\\u003e\\n\\u003cli\\u003eOnce you are past this, of course next is btrfs itself which will not mount degraded filesystem with \\u003ccode\\u003e-o degraded\\u003c/code\\u003e option. Could be worked around using \\u003ccode\\u003erootflags\\u003c/code\\u003e on kernel command line.\\u003c/li\\u003e\\n\\u003cli\\u003eFinally after switching to the real root you hit again systemd waiting for the second encrypted device. Fortunately, with timeout (by default).\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eSo, if you prepare in advance udev rules:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003e--- /usr/lib/udev/rules.d/64-btrfs.rules\\t2024-06-06 16:18:30.000000000 +0300\\n+++ /etc/udev/rules.d/64-btrfs.rules\\t2024-06-16 21:41:32.843751221 +0300\\n@@ -9,7 +9,7 @@ ENV{SYSTEMD_READY}==\\\&quot;0\\\&quot;, GOTO=\\\&quot;btrfs_end\\n IMPORT{builtin}=\\\&quot;btrfs ready $devnode\\\&quot;\\n \\n # mark the device as not ready to be used by the system\\n-ENV{ID_BTRFS_READY}==\\\&quot;0\\\&quot;, ENV{SYSTEMD_READY}=\\\&quot;0\\\&quot;\\n+#ENV{ID_BTRFS_READY}==\\\&quot;0\\\&quot;, ENV{SYSTEMD_READY}=\\\&quot;0\\\&quot;\\n \\n # reconsider pending devices in case when multidevice volume awaits\\n ENV{ID_BTRFS_READY}==\\\&quot;1\\\&quot;, RUN+=\\\&quot;/usr/bin/udevadm trigger -s block -p ID_BTRFS_READY=0\\\&quot;\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eand kernel command line (it is easier to delete than to type the whole UUID)\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003eGRUB_CMDLINE_LINUX_DEFAULT=\\\&quot;splash=silent video=1280x960 security=apparmor mitigations=off plymouth.enable=0 rd.luks.uuid=53d7f53e-3005-4caf-96ac-1469f8f0faab rd.luks.uuid=b1c90f03-9f4f-4db1-a055-38e522f326a9\\\&quot;\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eand of course add \\u003ccode\\u003erootflags=degraded\\u003c/code\\u003e to the kernel command line - you will have exactly 50% chance to boot. Because grub2 will boot only if you happen to lose “the right” disk. You will still be dropped into dracut emergency shell where you can remove \\u003ccode\\u003e/var/lib/dracut/hooks/initqueue/finished/90-crypt.sh\\u003c/code\\u003e, exit and after waiting another 90 seconds land in the booted system.\\u003c/p\\u003e\\n\\u003cp\\u003eGiven the grub problem I do not see any point in all this.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:13,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-16T19:14:36.885Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:17,\&quot;readers_count\&quot;:16,\&quot;score\&quot;:43.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:175759,\&quot;topic_slug\&quot;:\&quot;how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1\&quot;,\&quot;display_username\&quot;:\&quot;Andrei Borzenkov\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Flux Capacitor Penguin\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:23014,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759/13\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:false},{\&quot;id\&quot;:1251202,\&quot;name\&quot;:\&quot;Dog\&quot;,\&quot;username\&quot;:\&quot;susedog\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/s/c67d28/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2024-06-17T12:24:47.308Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eAgain, wow, thanks for engaging with this so thoroughly! It clearly looks like my quest is doomed and I shall abandon it. So sad.\\u003c/p\\u003e\\n\\u003cp\\u003eMaybe most people using a Btrfs RAID1 use it not for their boot drive but for additional drives - as far as I can follow your critique, a non-boot-drive-RAID1 should not have any of these problems? Otherwise I don’t understand how the Internet can be so full of people writing about their Btrfs RAID1, including instructions on what to do in case of a drive failure.\\u003c/p\\u003e\\n\\u003cp\\u003eI assume the issues you write about are not related to using encryption, but general issues, right? Also, these issues should be the same on all distros, nut just OpenSUSE?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:14,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-06-17T12:24:47.308Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:13,\&quot;quote_count\&quot;:0,\&quot;in           <div id='post_1'  class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/susedog'><span itemprop='name'>susedog</span></a>
                
              </span>

                <link itemprop="mainEntityOfPage" href="https://forums.opensuse.org/t/how-do-i-boot-into-a-degraded-luks-encrypted-btrfs-raid-1/175759">


              <span class="crawler-post-infos">
                  <time  datetime='2024-06-13T11:18:57Z' class='post-time'>
                    June 13, 2024, 11:18am
                  </time>
                  <meta itemprop='dateModified' content='2024-06-13T11:18:57Z'>
              <span itemprop='position'>1</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>tl;dr: I have set up a LUKS-encrypted Btrfs RAID 1 (in a VM), but can’t get it to boot when I detach one (virtual) hard drive. How do I do that?</p>
<p>More details:</p>
<p>One of my PCs requires redundancy, so I decided to dive into Btrfs and its RAID 1 implementation (in a VM for now). I’m quite new to OpenSUSE and a self-taught Linux user - but generally I manage to solve most problems I come across with some GoogleFu and lots of patience. However, booting into an encrypted Btrfs RAID 1 system with one (of two) hard drives missing is proving to be too tough a nut for me to crack (and I have spent a looooot of time on this, searching this forum, Reddit, search engines, etc.).</p>
<p>Coming from Debian, I must say I love the OpenSUSE installer (as well as many other things). Using the expert partitioner during installation allowed me to set up a Btrfs RAID1 quite easily:</p>
<ul>
<li><code>sda1</code> - 0.50GiB - not encrypted - EFI - mount point: <code>/boot/efi</code></li>
<li><code>sda2</code> - 63.50GiB - encrypted - unformatted - unmounted (this becomes the RAID)</li>
<li><code>sdb1</code> - 0.50GiB - not encrypted - EFI - umounted (this later becomes an EFI clone)</li>
<li><code>sdb2</code> - 63.50GiB - encrypted - unformatted - unmounted (this becomes the RAID)</li>
<li>to create the Btrfs RAID:<br>
– choose Btrfs on the left<br>
– “Add Btrfs…”<br>
– RAID Level “RAID1”<br>
– RAID Level for Metadata “RAID1”<br>
– add <code>sda2</code> and <code>sdb2</code><br>
– Mount Point <code>/</code><br>
– Enable Snapshots</li>
</ul>
<p>So far so good, the installer finishes, the system boots, encryption works, Btrfs seems to be a RAID1, perfect!</p>
<p>Now comes the tough part though: simulating a drive failure. I (virtually) detached <code>sdb</code>. The system starts, asks for the LUKS password for sda2, then the grub screen, after choosing the first option I briefly get:</p>
<pre><code class="lang-plaintext"> Booting `openSUSE Tumbleweed'

error: ../../grub-core/disk/cryptodisk.c:1519:no such cryptodisk found, perhaps a
needed disk or cryptodisk module is not loaded.
Loading Linux 6.8.6-1-default ...
Loading initial ramdisk ...

Press any key to continue...
</code></pre>
<p>The machine then works silently for a while, after which I get:</p>
<pre><code class="lang-plaintext">Warning: crypto LUKS UUID 9902[...] not found

Generating "/run/initramfs/rdsosreport.txt"

Entering emergency mode. Exit the shell to continue.
Type "journalctl" to view system logs.
You might want to save "/run/initramfs/rdsosreport.txt" to a USB stick or /boot
after mounting them and attach it to a bug report.

Give root password for maintenance
(or press Control-D to continue):
</code></pre>
<p>When I press Control-D, I get:</p>
<pre><code class="lang-plaintext">[ 902.527613] dracut-initqueue[422]: Warning: Not all disks have been found.
[ 902.527689] dracut-initqueue[422]: Warning: You might want to regenerate your initramfs.
</code></pre>
<p>Then nothing else happens.</p>
<p>So after a restart, I typed in the admin password to get to a basic shell, where I tried to mount the RAID1 as degraded using this command I found all over the interwebs (I adapted the filepath to <code>cr_root</code>):<br>
<code>mount -o degraded /dev/mapper/cr_root /mnt</code></p>
<p>Unfortunately, I get:<br>
<code>mount: /mnt: mount point does not exist</code></p>
<p>So I created that directory (did I mention I’m feeeeeling my way forward here…):<br>
<code>mkdir /mnt</code></p>
<p>… and mounted again, this time without error. I took this as success and exited the shell. Unfortunately, I still get the same <code>Warning: Not all disks have been found.</code> as above.</p>
<p>After a restart, I tried a different approach and (after typing in the LUKS password) I pressed “e” in grub, then added <code>degraded</code> to the line that looked appropriate to me:<br>
<code>linux      /boot/vmlinuz-6.8.6-1-default root=UUID=2586[...] ${extra_cmdline} splash=silent mitigations=auto quiet security=apparmor degraded</code></p>
<p>The system behaves a little differently (but with the same result): I have to type in the LUKS password <em>a second time</em> (this time into a text field in the middle of the screen) but ultimately, I end up with the same <code>Warning: crypto LUKS UUID 9902[...] not found</code>.</p>
<p>My next attempt was going to be to chroot into the system from a live system, but it’s hard to imagine that’s the only way to boot into a degraded Btrfs RAID. I’m just thinking there <em>must</em> be an easier way.</p>
<p>Can someone please help me?</p>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-06-13T13:29:39Z' class='post-time'>

                  </time>

              </span>

            <div class='post' itemprop='text'>
              <p>Yes, you are of course right. I thought the same while writing all this up. Sorry, should have done this immediately. But here it is now: <a href="https://paste.opensuse.org/pastes/575ea6d1bf2e" rel="noopener nofollow ugc">https://paste.opensuse.org/pastes/575ea6d1bf2e</a></p>
<p>Edit: It looks like I can’t edit the original post? That’s a shame, I was going to add the link there. Or am I misunderstanding the interface here?</p>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>

          <div id='post_4' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/arvidjaar'><span itemprop='name'>arvidjaar</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-06-13T18:28:35Z' class='post-time'>
                    June 13, 2024,  6:28pm
                  </time>
                  <meta itemprop='dateModified' content='2024-06-13T18:28:35Z'>
              <span itemprop='position'>4</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p><code>dracut</code> knows nothing about btrfs RAID1 and simply has fixed requirement for the devices that are part of btrfs. Once you are past this, you get next problem - systemd will not attempt to mount filesystem until all devices are present. And only when you are past systemd does <code>degraded</code> option become relevant. But <code>degraded</code> option in the past resulted in broken RAID1 (data written in this state would be written in <code>single</code> profile instead if RAID1); I do not know whether it has been fixed. So <code>degraded</code> as default option was highly discouraged.</p>
<p>The problem of multidevice btrfs vs. systemd is really really old and it can be solved neither in btrfs nor in systemd with their current architecture. Apparently so far nobody was motivated enough to design and implement a solution. You may have more luck with MD RAID1 which should handle the missing piece a bit better.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>I have spent a good few hours experimenting with this now and would be thankful for some help, since I’m obviously very stuck. Here’s what I did:</p>
<ol>
<li>boot into live environment</li>
<li>decrypt the one remaining decrypted drive: <code>sudo cryptsetup luksOpen /dev/sda2 cr_root</code></li>
<li>mount the Btrfs filesystem as <code>degraded</code>: <code>sudo mount -o degraded /dev/mapper/cr_root /mnt</code></li>
<li>mount additional folders:</li>
</ol>
<ul>
<li><code>sudo mount --bind /dev /mnt/dev</code></li>
<li><code>sudo mount --bind /proc /mnt/proc</code></li>
<li><code>sudo mount --bind /sys /mnt/sys</code></li>
<li><code>sudo mount --bind /run /mnt/run</code></li>
<li><code>sudo mount --bind /var /mnt/var</code></li>
</ul>
<ol start="5">
<li>chroot into the system: <code>sudo chroot /mnt</code></li>
<li>rebuild initramfs: `dracut -f --regenerate-all</li>
<li>edit GRUB configuration by adding the <code>degraded</code> flag:</li>
</ol>
<ul>
<li>nano /etc/default/grub</li>
<li>add <code>degraded</code> to end of appropriate line, like so: `GRUB_CMDLINE_LINUX_DEFAULT=“ degraded”</li>
</ul>
<ol start="8">
<li>update GRUB configuration: grub2-mkconfig -o /boot/grub2/grub.cfg`</li>
</ol>
<p>Here my luck ended. I received this error message (I hope I wrote it down correctly):<br>
<code>grub2-mkconfig /usr/sbin/grub-probe: error: failed to get canonical path of </code>'`</p>
<p>I thought maybe I could now boot into grub and then append <code>degraded</code> via pressing “e”. But this results in the error message:<br>
<code>Initramfs unpacking failed: invalid magic at start of compressed archive</code></p>
<p>Then I found this article (<a href="https://en.opensuse.org/SDB:BTRFS#How_to_manually_re-install_grub_on_opensuse/btrfs" class="inline-onebox" rel="noopener nofollow ugc">SDB:BTRFS - openSUSE Wiki</a>), followed it as best I can to mount the various Btrfs subvolumes. But in the end, I could not chroot into the system, and instead received:<br>
<code>chroot: failed to run command ‘/bin/bash’: No such file or directory</code></p>
<p>I obviously buggered up my system now. Could anybody help me along?</p>

<p>It is not</p>
<pre><code class="lang-plaintext">tw:~ # btrfs filesystem usage -T /mnt

<p>The problem is, running for a prolonged time you create data with only a single copy and this data will not be automatically converted to RAID1 once you add missing device back. So you lose redundancy without any notification. And it is much more worse. If you now add this missing device back, btrfs silently incorporates it, but its content is out of sync with the surviving piece, leading to</p>

<p>So, sorry - btrfs multi-device is by far not a replacement for a true RAID (be it hardware or software). For this reason I do not consider the problem of booting with degraded system btrfs RAID1 to be of any importance. It is simply not there yet.</p>

              <p>Wow thank you for taking the time to look into this more!</p>
<aside class="quote no-group" data-username="arvidjaar" data-post="9" data-topic="175759">
<div class="title">

<blockquote>
<p>It is still not clear what you are trying to do.</p>
</blockquote>
</aside>
<p>Oh no, that’s of course a problem. Let me try and state it more precisely: I want to figure out how to boot into an encrypted Btrfs RAID1 system where one of two hard drives is defective/offline, to be able to use the system for a few days until a replacement drive arrives, at which point that drive should be added to the RAID1 to achieve redundancy again.</p>
<p>All my attempts I have described above are the various approaches I have found online to achieve this. If they are misguided or too ambitious, then this is due to the fact that I don’t know better. I am thankful for all better advice.</p>
<aside class="quote no-group" data-username="arvidjaar" data-post="10" data-topic="175759">

<blockquote>
<p>The problem is, running for a prolonged time you create data with only a single copy and this data will not be automatically converted to RAID1 once you add missing device back. So you lose redundancy without any notification. And it is much more worse. If you now add this missing device back, btrfs silently incorporates it, but its content is out of sync with the surviving piece</p>
</blockquote>
</aside>
<p>From my understanding, a <code>btrfs balance</code> should fix these issues, shouldn’t it? In fact, from what I read I gathered that this is exactly the required procedure after the RAID was in a degraded state. You balance it to incorporate the single profile data.</p>
<aside class="quote no-group" data-username="arvidjaar" data-post="10" data-topic="175759">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forums.opensuse.org/letter_avatar_proxy/v4/letter/a/8491ac/48.png" class="avatar"> arvidjaar:</div>
<blockquote>
<p>So, sorry - btrfs multi-device is by far not a replacement for a true RAID (be it hardware or software). For this reason I do not consider the problem of booting with degraded system btrfs RAID1 to be of any importance. It is simply not there yet.</p>
</blockquote>
</aside>
<p>I read up on this as best I could before starting my own experiments and read pretty much everywhere that RAID1 is now considered stable and recommended (as opposed to RAID5 or 6). With the caveat that it’s a little unintuitive to boot into the system and that the system needs to be rebalanced after a drive replacement and/or degraded state. Remembering to balance in the rare case that it’s required - I can live with that. Normally I can also live with it being unintuitive - but in this case, as you can tell, I seem to have hit my limit. Which is very disappointing, but also challenging, which is why I have spent more time on it.</p>
<p>I you have any suggestions on what else I could try, I’d be very grateful for them.</p>

<img loading="lazy" alt="" width="24" height="24" src="https://forums.opensuse.org/letter_avatar_proxy/v4/letter/s/c67d28/48.png" class="avatar"> susedog:</div>
<blockquote>
<p>read pretty much everywhere that RAID1 is now considered stable and recommended</p>
</blockquote>
</aside>
<p>It may be stable from btrfs development point of view, but integration into operating system is beyond the scope of btrfs development. Pragmatic answer - do not reboot with missing disk. Wait until disk is ready for replacement, shut down, replace the disk, boot (and notice, that for a system device you may need to install bootloader on this disk which is already beyond the scope of btrfs). If you want more comfortable handling known from using a real RAID1 (unattended boot with missing disk, automatic resilvering after disk replacement) - use real RAID1. Or step in and implement this for btrfs.</p>
            </div>

          <div id='post_13' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/arvidjaar'><span itemprop='name'>arvidjaar</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-06-16T19:14:36Z' class='post-time'>
                    June 16, 2024,  7:14pm
                  </time>
                  <meta itemprop='dateModified' content='2024-06-16T19:14:36Z'>
              <span itemprop='position'>13</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>I gave it a try. It just confirmed that it is unusable as a real life solution.</p>
<ol>
<li>It starts with grub. grub is configured to access its <code>/boot/grub2</code> on btrfs using <strong>one</strong> device (grub does not have any notation to reference multi-device filesystem at all. It takes one device as reference and internally scans others if needed, but the reference must exist). To mitigate it, <code>grub2-install</code> must configure grub2 images differently on each disk, each image must reference the copy located on the same disk.</li>
<li>grub stops in menu because it fails to configure the second encrypted device, but continues after some timeout. This can be worked around by editing menu commands - <em>if</em> you know the correct UUID to delete …</li>
<li>Of course, dracut stops waiting for the non-existent device. This is internal initque loop which is statically configured when initrd is created. After some time dracut enters emergency shell where it is possible to remove the hook script.</li>
<li>But then you hit systemd dependencies - it waits for each device in <code>/etc/crypttab</code>. It can be worked around by passing <code>rd.luks.uuid=</code> option on kernel command line … if you know the correct UUID of course.</li>
<li>Next is btrfs. systemd will not attempt to mount btrfs unless all devices are present. This can be worked around by removing the corresponding rule from udev btrfs rules … in advance. It may be possible to do in initrd, but by default there is no editor included.</li>
<li>Once you are past this, of course next is btrfs itself which will not mount degraded filesystem with <code>-o degraded</code> option. Could be worked around using <code>rootflags</code> on kernel command line.</li>
<li>Finally after switching to the real root you hit again systemd waiting for the second encrypted device. Fortunately, with timeout (by default).</li>
</ol>
<p>So, if you prepare in advance udev rules:</p>
<pre><code class="lang-plaintext">--- /usr/lib/udev/rules.d/64-btrfs.rules	2024-06-06 16:18:30.000000000 +0300
+++ /etc/udev/rules.d/64-btrfs.rules	2024-06-16 21:41:32.843751221 +0300
@@ -9,7 +9,7 @@ ENV{SYSTEMD_READY}=="0", GOTO="btrfs_end
 IMPORT{builtin}="btrfs ready $devnode"
 
 # mark the device as not ready to be used by the system
-ENV{ID_BTRFS_READY}=="0", ENV{SYSTEMD_READY}="0"
+#ENV{ID_BTRFS_READY}=="0", ENV{SYSTEMD_READY}="0"
 
 # reconsider pending devices in case when multidevice volume awaits
 ENV{ID_BTRFS_READY}=="1", RUN+="/usr/bin/udevadm trigger -s block -p ID_BTRFS_READY=0"
</code></pre>
<p>and kernel command line (it is easier to delete than to type the whole UUID)</p>
<pre><code class="lang-plaintext">GRUB_CMDLINE_LINUX_DEFAULT="splash=silent video=1280x960 security=apparmor mitigations=off plymouth.enable=0 rd.luks.uuid=53d7f53e-3005-4caf-96ac-1469f8f0faab rd.luks.uuid=b1c90f03-9f4f-4db1-a055-38e522f326a9"
</code></pre>
<p>and of course add <code>rootflags=degraded</code> to the kernel command line - you will have exactly 50% chance to boot. Because grub2 will boot only if you happen to lose “the right” disk. You will still be dropped into dracut emergency shell where you can remove <code>/var/lib/dracut/hooks/initqueue/finished/90-crypt.sh</code>, exit and after waiting another 90 seconds land in the booted system.</p>
<p>Given the grub problem I do not see any point in all this.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>Again, wow, thanks for engaging with this so thoroughly! It clearly looks like my quest is doomed and I shall abandon it. So sad.</p>
<p>Maybe most people using a Btrfs RAID1 use it not for their boot drive but for additional drives - as far as I can follow your critique, a non-boot-drive-RAID1 should not have any of these problems? Otherwise I don’t understand how the Internet can be so full of people writing about their Btrfs RAID1, including instructions on what to do in case of a drive failure.</p>
<p>I assume the issues you write about are not related to using encryption, but general issues, right? Also, these issues should be the same on all distros, nut just OpenSUSE?</p>
            </div>
