        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_59735&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:198825,\&quot;name\&quot;:\&quot;West\&quot;,\&quot;username\&quot;:\&quot;wildwestrom\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/wildwestrom/{size}/16154_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-03T05:39:28.772Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHello all. I’m making this thread so I can possibly help others trying to do the same sort of configuration. Usually I just use the calamares installer and call it a day, but this time I don’t want to make any compromises. I tried to piece together what I need to create this from the NixOS and Arch Linux wikis.\\u003c/p\\u003e\\n\\u003cp\\u003eTo start, I will explain each step I took on my live USB.\\u003c/p\\u003e\\n\\u003cp\\u003eI first deleted all existing partitions and created new ones with \\u003ccode\\u003egparted\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\&quot;console\\\&quot;\\u003e\\u003ccode class=\\\&quot;lang-console\\\&quot;\\u003e[nixos@nixos:~]$ lsblk\\nNAME        MAJ:MIN RM   SIZE RO TYPE MOUNTPOINTS\\nloop0         7:0    0   2.3G  1 loop /nix/.ro-store\\nsda           8:0    1   7.3G  0 disk \\n├─sda1        8:1    1   7.2G  0 part \\n│ └─ventoy  254:0    0   2.4G  1 dm   /iso\\n└─sda2        8:2    1    32M  0 part \\nnvme0n1     259:0    0 931.5G  0 disk \\n├─nvme0n1p1 259:1    0   512M  0 part \\n└─nvme0n1p2 259:2    0   931G  0 part\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eI then did the following as root.\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\&quot;sh\\\&quot;\\u003e\\u003ccode class=\\\&quot;lang-sh\\\&quot;\\u003e# creating the encrypted partition\\ncryptsetup luksFormat /dev/nvme0n1p2\\ncryptsetup open /dev/nvme0n1p2 cryptlvm\\n\\n# LVM setup\\npvcreate /dev/mapper/cryptlvm\\nvgcreate vg /dev/mapper/cryptlvm\\n\\n# I have 32GB of RAM, so my swap should be just as big\\nlvcreate -L 32G -n swap vg\\nlvcreate -l 100%FREE -n root vg\\n\\nmkfs.fat -F 32 /dev/nvme0n1p1\\n\\nmkdir -p /mnt\\nmkswap /dev/mapper/vg-swap\\n\\nmkfs.btrfs /dev/mapper/vg-root\\nbtrfs subvolume create /mnt/root\\nbtrfs subvolume create /mnt/home\\nbtrfs subvolume create /mnt/nix\\n\\numount /mnt\\n\\nmount -o compress=zstd,subvol=root /dev/mapper/vg-root /mnt\\nmkdir /mnt/{home,nix}\\nmount -o compress=zstd,subvol=home /dev/mapper/vg-root /mnt/home\\nmount -o compress=zstd,noatime,subvol=nix /dev/mapper/vg-root /mnt/nix\\nmkdir /mnt/boot\\nmount /dev/nvme0n1p1 /mnt/boot\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eNow that seemed like everything I had to do on the command line, and the rest would have to go into my Nix config. Thus I tried to do \\u003ccode\\u003enixos-generate-config --root /mnt\\u003c/code\\u003e. Here is the result of that. What’s wrong here? Did I miss some steps?\\u003c/p\\u003e\\n\\u003cp\\u003eFor one thing, I don’t see the place LUKS is supposed to unlock my hard drive.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003econfiguration.nix\\u003c/code\\u003e:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e# Edit this configuration file to define what should be installed on\\n# your system. Help is available in the configuration.nix(5) man page, on\\n# https://search.nixos.org/options and in the NixOS manual (`nixos-help`).\\n\\n{ config, lib, pkgs, ... }:\\n\\n{\\n  imports =\\n    [ # Include the results of the hardware scan.\\n      ./hardware-configuration.nix\\n    ];\\n\\n  # Use the systemd-boot EFI boot loader.\\n  boot.loader.systemd-boot.enable = true;\\n  boot.loader.efi.canTouchEfiVariables = true;\\n\\n  # networking.hostName = \\\&quot;nixos\\\&quot;; # Define your hostname.\\n  # Pick only one of the below networking options.\\n  # networking.wireless.enable = true;  # Enables wireless support via wpa_supplicant.\\n  # networking.networkmanager.enable = true;  # Easiest to use and most distros use this by default.\\n\\n  # Set your time zone.\\n  # time.timeZone = \\\&quot;Europe/Amsterdam\\\&quot;;\\n\\n  # Configure network proxy if necessary\\n  # networking.proxy.default = \\\&quot;http://user:password@proxy:port/\\\&quot;;\\n  # networking.proxy.noProxy = \\\&quot;127.0.0.1,localhost,internal.domain\\\&quot;;\\n\\n  # Select internationalisation properties.\\n  # i18n.defaultLocale = \\\&quot;en_US.UTF-8\\\&quot;;\\n  # console = {\\n  #   font = \\\&quot;Lat2-Terminus16\\\&quot;;\\n  #   keyMap = \\\&quot;us\\\&quot;;\\n  #   useXkbConfig = true; # use xkb.options in tty.\\n  # };\\n\\n  # Enable the X11 windowing system.\\n  services.xserver.enable = true;\\n\\n\\n  # Enable the GNOME Desktop Environment.\\n  services.xserver.displayManager.gdm.enable = true;\\n  services.xserver.desktopManager.gnome.enable = true;\\n  \\n\\n  # Configure keymap in X11\\n  # services.xserver.xkb.layout = \\\&quot;us\\\&quot;;\\n  # services.xserver.xkb.options = \\\&quot;eurosign:e,caps:escape\\\&quot;;\\n\\n  # Enable CUPS to print documents.\\n  # services.printing.enable = true;\\n\\n  # Enable sound.\\n  # hardware.pulseaudio.enable = true;\\n  # OR\\n  # services.pipewire = {\\n  #   enable = true;\\n  #   pulse.enable = true;\\n  # };\\n\\n  # Enable touchpad support (enabled default in most desktopManager).\\n  # services.libinput.enable = true;\\n\\n  # Define a user account. Don&#39;t forget to set a password with ‘passwd’.\\n  # users.users.alice = {\\n  #   isNormalUser = true;\\n  #   extraGroups = [ \\\&quot;wheel\\\&quot; ]; # Enable ‘sudo’ for the user.\\n  #   packages = with pkgs; [\\n  #     tree\\n  #   ];\\n  # };\\n\\n  # programs.firefox.enable = true;\\n\\n  # List packages installed in system profile. To search, run:\\n  # $ nix search wget\\n  # environment.systemPackages = with pkgs; [\\n  #   vim # Do not forget to add an editor to edit configuration.nix! The Nano editor is also installed by default.\\n  #   wget\\n  # ];\\n\\n  # Some programs need SUID wrappers, can be configured further or are\\n  # started in user sessions.\\n  # programs.mtr.enable = true;\\n  # programs.gnupg.agent = {\\n  #   enable = true;\\n  #   enableSSHSupport = true;\\n  # };\\n\\n  # List services that you want to enable:\\n\\n  # Enable the OpenSSH daemon.\\n  # services.openssh.enable = true;\\n\\n  # Open ports in the firewall.\\n  # networking.firewall.allowedTCPPorts = [ ... ];\\n  # networking.firewall.allowedUDPPorts = [ ... ];\\n  # Or disable the firewall altogether.\\n  # networking.firewall.enable = false;\\n\\n  # Copy the NixOS configuration file and link it from the resulting system\\n  # (/run/current-system/configuration.nix). This is useful in case you\\n  # accidentally delete configuration.nix.\\n  # system.copySystemConfiguration = true;\\n\\n  # This option defines the first version of NixOS you have installed on this particular machine,\\n  # and is used to maintain compatibility with application data (e.g. databases) created on older NixOS versions.\\n  #\\n  # Most users should NEVER change this value after the initial install, for any reason,\\n  # even if you&#39;ve upgraded your system to a new NixOS release.\\n  #\\n  # This value does NOT affect the Nixpkgs version your packages and OS are pulled from,\\n  # so changing it will NOT upgrade your system - see https://nixos.org/manual/nixos/stable/#sec-upgrading for how\\n  # to actually do that.\\n  #\\n  # This value being lower than the current NixOS release does NOT mean your system is\\n  # out of date, out of support, or vulnerable.\\n  #\\n  # Do NOT change this value unless you have manually inspected all the changes it would make to your configuration,\\n  # and migrated your data accordingly.\\n  #\\n  # For more information, see `man configuration.nix` or https://nixos.org/manual/nixos/stable/options#opt-system.stateVersion .\\n  system.stateVersion = \\\&quot;24.11\\\&quot;; # Did you read the comment?\\n\\n}\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003ehardware-configuration.nix\\u003c/code\\u003e:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e# Do not modify this file!  It was generated by ‘nixos-generate-config’\\n# and may be overwritten by future invocations.  Please make changes\\n# to /etc/nixos/configuration.nix instead.\\n{ config, lib, pkgs, modulesPath, ... }:\\n\\n{\\n  imports =\\n    [ (modulesPath + \\\&quot;/installer/scan/not-detected.nix\\\&quot;)\\n    ];\\n\\n  boot.initrd.availableKernelModules = [ \\\&quot;nvme\\\&quot; \\\&quot;xhci_pci\\\&quot; \\\&quot;thunderbolt\\\&quot; \\\&quot;usb_storage\\\&quot; \\\&quot;usbhid\\\&quot; \\\&quot;sd_mod\\\&quot; ];\\n  boot.initrd.kernelModules = [ \\\&quot;dm-snapshot\\\&quot; ];\\n  boot.kernelModules = [ \\\&quot;kvm-amd\\\&quot; ];\\n  boot.extraModulePackages = [ ];\\n\\n  fileSystems.\\\&quot;/\\\&quot; =\\n    { device = \\\&quot;/dev/disk/by-uuid/7ea32639-ffba-4283-af2f-880b95f8e856\\\&quot;;\\n      fsType = \\\&quot;btrfs\\\&quot;;\\n      options = [ \\\&quot;subvol=root\\\&quot; ];\\n    };\\n\\n  fileSystems.\\\&quot;/home\\\&quot; =\\n    { device = \\\&quot;/dev/disk/by-uuid/7ea32639-ffba-4283-af2f-880b95f8e856\\\&quot;;\\n      fsType = \\\&quot;btrfs\\\&quot;;\\n      options = [ \\\&quot;subvol=home\\\&quot; ];\\n    };\\n\\n  fileSystems.\\\&quot;/nix\\\&quot; =\\n    { device = \\\&quot;/dev/disk/by-uuid/7ea32639-ffba-4283-af2f-880b95f8e856\\\&quot;;\\n      fsType = \\\&quot;btrfs\\\&quot;;\\n      options = [ \\\&quot;subvol=nix\\\&quot; ];\\n    };\\n\\n  fileSystems.\\\&quot;/boot\\\&quot; =\\n    { device = \\\&quot;/dev/disk/by-uuid/253D-AA2B\\\&quot;;\\n      fsType = \\\&quot;vfat\\\&quot;;\\n      options = [ \\\&quot;fmask=0022\\\&quot; \\\&quot;dmask=0022\\\&quot; ];\\n    };\\n\\n  swapDevices = [ ];\\n\\n  # Enables DHCP on each ethernet and wireless interface. In case of scripted networking\\n  # (the default) this is the recommended approach. When using systemd-networkd it&#39;s\\n  # still possible to use this option, but it&#39;s recommended to use it in conjunction\\n  # with explicit per-interface declarations with `networking.interfaces.\\u0026lt;interface\\u0026gt;.useDHCP`.\\n  networking.useDHCP = lib.mkDefault true;\\n  # networking.interfaces.wlp1s0.useDHCP = lib.mkDefault true;\\n\\n  nixpkgs.hostPlatform = lib.mkDefault \\\&quot;x86_64-linux\\\&quot;;\\n  hardware.cpu.amd.updateMicrocode = lib.mkDefault config.hardware.enableRedistributableFirmware;\\n}\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-03T05:54:02.313Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:3734,\&quot;reads\&quot;:151,\&quot;readers_count\&quot;:150,\&quot;score\&quot;:18505.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;West\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:11429,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/1\&quot;,\&quot;event\&quot;:null,\&quot;calendar_details\&quot;:[],\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:198826,\&quot;name\&quot;:\&quot;Desgranges Arnaud\&quot;,\&quot;username\&quot;:\&quot;noximus237\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/noximus237/{size}/11900_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-03T05:59:43.043Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eFor the tpm part you’ll need :\\u003c/p\\u003e\\n\\u003cp\\u003eboot.initrd.systemd.enableTpm2 = true;\\u003cbr\\u003e\\nboot.initrd.luks.devices.root = {\\u003cbr\\u003e\\ndevice = “/dev/disk/by-partuuid/$myPARTUUID”;\\u003cbr\\u003e\\n};\\u003cbr\\u003e\\nsecurity.tpm2.enable = true;\\u003c/p\\u003e\\n\\u003cp\\u003euse systemd-enroll utility to register tpm keys in a luks slot\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-03T05:59:43.043Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:22,\&quot;reads\&quot;:125,\&quot;readers_count\&quot;:124,\&quot;score\&quot;:154.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;Desgranges Arnaud\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:3413,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/2\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:198827,\&quot;name\&quot;:\&quot;West\&quot;,\&quot;username\&quot;:\&quot;wildwestrom\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/wildwestrom/{size}/16154_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-03T06:32:12.362Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI made the changes you suggested to the initrd.\\u003c/p\\u003e\\n\\u003cp\\u003eLeaving this for others, I made a mistake when making the boot partition.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003eFile system \\\&quot;/dev/nvme0n1p1\\\&quot; has wrong type for an EFI System Partition (ESP).\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eTo attempt to fix:\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\&quot;sh\\\&quot;\\u003e\\u003ccode class=\\\&quot;lang-sh\\\&quot;\\u003eumount /mnt/boot\\ncfdisk /dev/nvme0n1 # change to ESP partition, I just had fat32.\\nmkfs.fat -F 32 /dev/nvme0n1p1\\nmount /dev/nvme0n1p1 /mnt/boot\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eMake sure you change the UUID of the boot partition!\\u003c/p\\u003e\\n\\u003cp\\u003eRunning \\u003ccode\\u003enixos-install\\u003c/code\\u003e now yields:\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\&quot;console\\\&quot;\\u003e\\u003ccode class=\\\&quot;lang-console\\\&quot;\\u003e[root@nixos:/mnt]# nixos-install\\ncopying channel...\\nbuilding the configuration in /mnt/etc/nixos/configuration.nix...\\n/nix/store/ndlg17m34nawicnrny2kchra1mzygvww-nixos-system-nixos-24.11.713895.666e1b3f09c2\\ninstalling the boot loader...\\nsetting up /etc...\\nCreated \\\&quot;/boot/EFI\\\&quot;.\\nCreated \\\&quot;/boot/EFI/systemd\\\&quot;.\\nCreated \\\&quot;/boot/EFI/BOOT\\\&quot;.\\nCreated \\\&quot;/boot/loader\\\&quot;.\\nCreated \\\&quot;/boot/loader/entries\\\&quot;.\\nCreated \\\&quot;/boot/EFI/Linux\\\&quot;.\\nCopied \\\&quot;/nix/store/xv7q10lk4lxfax7naj3b63aj2pyjv9gb-systemd-256.10/lib/systemd/boot/efi/systemd-bootx64.efi\\\&quot; to \\\&quot;/boot/EFI/systemd/systemd-bootx64.efi\\\&quot;.\\nCopied \\\&quot;/nix/store/xv7q10lk4lxfax7naj3b63aj2pyjv9gb-systemd-256.10/lib/systemd/boot/efi/systemd-bootx64.efi\\\&quot; to \\\&quot;/boot/EFI/BOOT/BOOTX64.EFI\\\&quot;.\\n⚠️ Mount point &#39;/boot&#39; which backs the random seed file is world accessible, which is a security hole! ⚠️\\n⚠️ Random seed file &#39;/boot/loader/.#bootctlrandom-seed29b32b775ec3aec8&#39; is world accessible, which is a security hole! ⚠️\\nRandom seed file /boot/loader/random-seed successfully written (32 bytes).\\nCreated EFI boot entry \\\&quot;Linux Boot Manager\\\&quot;.\\nsetting up /etc...\\nsetting up /etc...\\nsetting root password...\\nNew password: \\nPassword change has been aborted.\\npasswd: Permission denied\\npasswd: password unchanged\\nSetting a root password failed with the above printed error.\\nYou can set the root password manually by executing `nixos-enter --root &#39;/mnt&#39;` and then running `passwd` in the shell of the new system.\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eI figured I couldn’t ignore these warnings, so what to do now?\\u003c/p\\u003e\\n\\u003cp\\u003eAccording to here (\\u003ca href=\\\&quot;https://discourse.nixos.org/t/nixos-install-with-custom-flake-results-in-boot-being-world-accessible/34555/6\\\&quot; class=\\\&quot;inline-onebox\\\&quot;\\u003eNixos-install with custom flake results in /boot being world accessible - #6 by NovaViper\\u003c/a\\u003e), I need to set permissions differently.\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\&quot;diff\\\&quot;\\u003e\\u003ccode class=\\\&quot;lang-diff\\\&quot;\\u003e  fileSystems.\\\&quot;/boot\\\&quot; = {\\n      device = \\\&quot;${bootPart}\\\&quot;;\\n      fsType = \\\&quot;vfat\\\&quot;;\\n-      options = [ \\\&quot;fmask=0022\\\&quot; \\\&quot;dmask=0022\\\&quot; ];\\n+     options = [ \\\&quot;umask=0077\\\&quot; ]\\\&quot;;\\n    };\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThis however didn’t make the warning go away. Reading further it says I can just ignore the warning.\\u003c/p\\u003e\\n\\u003cp\\u003eLooks like booting up worked without any issue. I just had to log in and add a password to my user account.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eOne problem I’m having is that vesktop screen sharing doesn’t work. It seems like it’s falling back to X11-based screensharing because I can capture any xwayland window.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-03T14:33:26.462Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:154,\&quot;reads\&quot;:124,\&quot;readers_count\&quot;:123,\&quot;score\&quot;:799.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;West\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:6,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://discourse.nixos.org/t/nixos-install-with-custom-flake-results-in-boot-being-world-accessible/34555/6\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Nixos-install with custom flake results in /boot being world accessible\&quot;,\&quot;clicks\&quot;:4}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:11429,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/3\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:198900,\&quot;name\&quot;:\&quot;Will Fancher\&quot;,\&quot;username\&quot;:\&quot;ElvishJerricco\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/elvishjerricco/{size}/984_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-03T14:53:03.599Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eSeems like there might be a bug where \\u003ccode\\u003enixos-generate-config\\u003c/code\\u003e isn’t picking up your LUKS device, so you’ll need to set \\u003ccode\\u003eboot.initrd.luks.devices\\u003c/code\\u003e manually, as \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/noximus237\\\&quot;\\u003e@noximus237\\u003c/a\\u003e showed.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;wildwestrom\\\&quot; data-post=\\\&quot;3\\\&quot; data-topic=\\\&quot;59735\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/wildwestrom/48/16154_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e wildwestrom:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eAccording to here (\\u003ca href=\\\&quot;https://discourse.nixos.org/t/nixos-install-with-custom-flake-results-in-boot-being-world-accessible/34555/6\\\&quot;\\u003eNixos-install with custom flake results in /boot being world accessible - #6 by NovaViper\\u003c/a\\u003e), I need to set permissions differently.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e  fileSystems.\\\&quot;/boot\\\&quot; = {\\n      device = \\\&quot;${bootPart}\\\&quot;;\\n      fsType = \\\&quot;vfat\\\&quot;;\\n-      options = [ \\\&quot;fmask=0022\\\&quot; \\\&quot;dmask=0022\\\&quot; ];\\n+     options = [ \\\&quot;umask=0077\\\&quot; ]\\\&quot;;\\n    };\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThis however didn’t make the warning go away. Reading further it says I can just ignore the warning.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eWhen you mount the ESP, you need to do so with \\u003ccode\\u003emount -o umask=0077 ...\\u003c/code\\u003e, or else it gets the default which is \\u003ccode\\u003e0022\\u003c/code\\u003e, which is then translated by linux into the pairing of \\u003ccode\\u003efmask\\u003c/code\\u003e and \\u003ccode\\u003edmask\\u003c/code\\u003e settings. Then, \\u003ccode\\u003enixos-generate-config\\u003c/code\\u003e knows that, because of the warning you’re getting, the \\u003ccode\\u003efmask\\u003c/code\\u003e and \\u003ccode\\u003edmask\\u003c/code\\u003e options need to be preserved in the generated \\u003ccode\\u003ehardware-configuration.nix\\u003c/code\\u003e, so it just copies in whatever value you mounted it with. All this is to say, \\u003ccode\\u003enixos-generate-config\\u003c/code\\u003e generated the wrong thing, and you’re now getting warnings, because you need to have it mounted with \\u003ccode\\u003e-o umask=0077\\u003c/code\\u003e in the first place.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;noximus237\\\&quot; data-post=\\\&quot;2\\\&quot; data-topic=\\\&quot;59735\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://discourse.nixos.org/user_avatar/discourse.nixos.org/noximus237/48/11900_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e noximus237:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eboot.initrd.systemd.enableTpm2 = true;\\u003cbr\\u003e\\nboot.initrd.luks.devices.root = {\\u003cbr\\u003e\\ndevice = “/dev/disk/by-partuuid/$myPARTUUID”;\\u003cbr\\u003e\\n};\\u003cbr\\u003e\\nsecurity.tpm2.enable = true;\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eSo, \\u003ccode\\u003eboot.initrd.systemd.enableTpm2\\u003c/code\\u003e has been renamed to \\u003ccode\\u003eboot.initrd.systemd.tpm2.enable\\u003c/code\\u003e, and it’s enabled by default. But, it’s only relevant if you use \\u003ccode\\u003eboot.initrd.systemd.enable = true;\\u003c/code\\u003e, which \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/wildwestrom\\\&quot;\\u003e@wildwestrom\\u003c/a\\u003e has not done yet. But yes, you’ll need \\u003ccode\\u003eboot.initrd.systemd.enable = true;\\u003c/code\\u003e if you intend to unlock the disk using the TPM2.\\u003c/p\\u003e\\n\\u003cp\\u003eAlso \\u003ccode\\u003esecurity.tpm2.enable\\u003c/code\\u003e is something very different and not relevant for just unlocking the root disk.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-03T14:53:03.599Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:2,\&quot;incoming_link_count\&quot;:51,\&quot;reads\&quot;:99,\&quot;readers_count\&quot;:98,\&quot;score\&quot;:289.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;Will Fancher\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:146,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:4,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/4\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:198902,\&quot;name\&quot;:\&quot;Will Fancher\&quot;,\&quot;username\&quot;:\&quot;ElvishJerricco\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/elvishjerricco/{size}/984_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-03T14:56:05.708Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI will also add, it is \\u003cem\\u003epossible\\u003c/em\\u003e to do TPM2 unlocking securely, but it’s difficult and you’ll probably get it wrong if you don’t know what you’re doing. \\u003ca href=\\\&quot;https://oddlama.org/blog/bypassing-disk-encryption-with-tpm2-unlock/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eHere’s an article about some of the ways it can go wrong\\u003c/a\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-03T14:56:05.708Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:2,\&quot;reads\&quot;:84,\&quot;readers_count\&quot;:83,\&quot;score\&quot;:26.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;Will Fancher\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\ lly so I’m not open to the various exploits out there.\\u003c/p\\u003e\\n\\u003cp\\u003eI also tested suspend to disk with \\u003ccode\\u003esystemctl hibernate\\u003c/code\\u003e and it seemed to work without any issue. It halted, the screen turned off, and when I hit the power button again in the morning and after putting in my LUKS password it started right up where I left off.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-04T08:07:58.905Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:83,\&quot;readers_count\&quot;:82,\&quot;score\&quot;:46.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;West\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:146,\&quot;username\&quot;:\&quot;ElvishJerricco\&quot;,\&quot;name\&quot;:\&quot;Will Fancher\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/elvishjerricco/{size}/984_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:11429,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_delet y_to_post_number\&quot;:10,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:15,\&quot;reads\&quot;:63,\&quot;readers_count\&quot;:62,\&quot;score\&quot;:87.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;Gytis Ivaskevicius\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:11429,\&quot;username\&quot;:\&quot;wildwestrom\&quot;,\&quot;name\&quot;:\&quot;West\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/wildwestrom/{size}/16154_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2947,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/11\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:199360,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Torinthiel\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8dc957/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-05T19:58:41.866Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eOne thing you might consider doing is using \\u003ca href=\\\&quot;https://github.com/nix-community/disko\\\&quot;\\u003edisko\\u003c/a\\u003e.\\u003cbr\\u003e\\nIt handles partitioning, but also almost all of your stack. There are examples (that double as tests) of luks + btrfs + subvolumes, luks + lvm, so it’s trivial to work out the whole stack (done that, sans tpm2). hibernate goes as a one-liner (at least using swap partition on said lvm). It also doubles as the filesystem part of hardware-config.nix. No idea if it handles tpm though. But, if you want to follow \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/gytis-ivaskevicius\\\&quot;\\u003e@gytis-ivaskevicius\\u003c/a\\u003e advice and pursue zfs, it’s supported.\\u003c/p\\u003e\\n\\u003cp\\u003eThe good parts: you don’t have to create partitions etc by yourself, disko handles luks + lvm + btrfs pretty well.\\u003c/p\\u003e\\n\\u003cp\\u003eThe bad parts: you need to use flakes (hey, that’s less scary than it sounds). And it doesn’t handle \\u003cem\\u003echanges\\u003c/em\\u003e in partitions well. It’ll probably work if you change the description, reconfigure partitions, luks, lvm \\u0026amp; btrfs yourself and just stick with using it as filesystem config reference, it should work. But normally it can only wipe your drive \\u0026amp; recreate partitions.\\u003c/p\\u003e\\n\\u003cp\\u003eAs I’ve said above, I have a setup like this, the only difference with yours is that I use password-based luks (sorry, what’s the point of using luks if it decrypts automatically). I’m not ready to share it (have to get rid of some secrets), but I might be able to help if you need it.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:12,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-05T19:58:41.866Z\&quot;,\&quot; null},{\&quot;id\&quot;:199373,\&quot;name\&quot;:\&quot;Gytis Ivaskevicius\&quot;,\&quot;username\&quot;:\&quot;gytis-ivaskevicius\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/gytis-ivaskevicius/{size}/3333_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-05T20:49:36.685Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eFirst thought:\\u003cbr\\u003e\\nOh right! disko project exists, why arent I’m using it?\\u003c/p\\u003e\\n\\u003cp\\u003eSecond thought:\\u003cbr\\u003e\\nOh right! It seems to require a large config file that I need to learn\\u003c/p\\u003e\\n\\u003cp\\u003eAnyways, I will look into it as well. Probably about time\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:13,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-05T20:49:36.685Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:12,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:60,\&quot;readers_count\&quot;:59,\&quot;score\&quot;:67.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;Gytis Ivaskevicius\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:17180,\&quot;username\&quot;:\&quot;Torinthiel\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8dc957/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:2947,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/13\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:199374,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Torinthiel\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8dc957/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2025-02-05T21:01:45.589Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThe documentation is lacking IMHO.\\u003cbr\\u003e\\nThere’s no autogenerated options configuration, most probably because the structure itself is recursive (hey, you can have lvm within luks or the other way round, or even lvm within luks within lvm if you’re insane enough).\\u003cbr\\u003e\\nBut the source and examples are relatively readable for me and, assuming you have a mental image of what you want to achieve, it’s rather simple to get this into configuration.\\u003c/p\\u003e\\n\\u003cp\\u003eAnd there’s also nothing really \\u003cem\\u003enew\\u003c/em\\u003e you put in that config. The script made by OP for creating luks container, LVs and stuff would translate directly into that, the only issue would be where to put what.\\u003c/p\\u003e\\n\\u003cp\\u003eMy setup (3 partitions, luks on one of them containing lvm with swap and btrfs with 9 subvolumes) is exactly 113 lines excluding comments and empty ones. I could probably make it shorter and less repeatable with a lambda that’d generate stuff, but I’m to lazy for that now.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:14,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2025-02-05T21:04:47.968Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:13,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:22,\&quot;reads\&quot;:61,\&quot;readers_count\&quot;:60,\&quot;score\&quot;:122.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:2947,\&quot;username\&quot;:\&quot;gytis-ivaskevicius\&quot;,\&quot;name\&quot;:\&quot;Gytis Ivaskevicius\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/gytis-ivaskevicius/{size}/3333_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:17180,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk/59735/14\&quot;,\&quot;event\&quot;:null,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:245280,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;maxyw\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/maxyw/{size}/32880_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2026-01-02T10:29:37.675Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eOne really important thing to mention here is that ZFS doesn’t really support hibernation at all on NixOS, at the very real risk of data corruption. So, at least for hibernation, it won’t work. Also, ZFS is actually generally considered more complicated than btrfs. While it can technically perform the functions of LUKS (ZFS supports encrypting your data) and LVM (ZFS manages logical volumes), you would still have to learn just as much information, you would just be configuring these extra features in ZFS instead.\\u003c/p\\u003e\\n\\u003cp\\u003eI also would personally never recommend using a script for ZFS, especially not this one - refer to line 1 of the script:\\u003c/p\\u003e\\n\\u003cpre data-code-wrap=\\\&quot;bash\\\&quot;\\u003e\\u003ccode class=\\\&quot;lang-bash\\\&quot;\\u003eexport DRIVE=nvme1n1\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThe script is clearly targeting that specific github user’s hardware, and drive names like nvme1 are not consistent at all - your own post uses nvme0 instead, so this script would fail for you in multiple ways without changes. In that case, you’re better off just understanding what’s going on and doing it yourself anyways, especially since you are only installing your file system once, at OS install.\\u003c/p\\u003e\\n\\u003cp\\u003eYou could try to use disko if you really wanted the formatting to be done automatically but again this is only really useful to people who \\u003cem\\u003eneed\\u003c/em\\u003e to automate the installation of a bunch of systems/servers, if you’re just doing it for one PC, disko is actually much more complex and invites the possibility of an auto-generated misconfiguration deleting your valuable personal data.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:15,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:15,\&quot;updated_at\&quot;:\&quot;2026-01-02T10:29:37.675Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:10,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:24,\&quot;readers_count\&quot;:23,\&quot;score\&quot;:34.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:59735,\&quot;topic_slug\&quot;:\&quot;install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-support-for-suspend-to-disk\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:11429,\&quot;username\&quot;:\&quot;wildwestrom\&quot;,\&quot;name\&quot;:\&quot;West\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discourse.nixos.org/wildwestrom/{size}/16154_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:18889,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/install-nixos-with-btrfs-lvm-on-luks-using-tpm2-to-start-up-with-supp               <p>Hello all. I’m making this thread so I can possibly help others trying to do the same sort of configuration. Usually I just use the calamares installer and call it a day, but this time I don’t want to make any compromises. I tried to piece together what I need to create this from the NixOS and Arch Linux wikis.</p>
<p>To start, I will explain each step I took on my live USB.</p>
<p>I first deleted all existing partitions and created new ones with <code>gparted</code>.</p>
<pre data-code-wrap="console"><code class="lang-console">[nixos@nixos:~]$ lsblk
NAME        MAJ:MIN RM   SIZE RO TYPE MOUNTPOINTS
loop0         7:0    0   2.3G  1 loop /nix/.ro-store
sda           8:0    1   7.3G  0 disk 
├─sda1        8:1    1   7.2G  0 part 
│ └─ventoy  254:0    0   2.4G  1 dm   /iso
└─sda2        8:2    1    32M  0 part 
nvme0n1     259:0    0 931.5G  0 disk 
├─nvme0n1p1 259:1    0   512M  0 part 
└─nvme0n1p2 259:2    0   931G  0 part
</code></pre>
<p>I then did the following as root.</p>
<pre data-code-wrap="sh"><code class="lang-sh"># creating the encrypted partition
cryptsetup luksFormat /dev/nvme0n1p2
cryptsetup open /dev/nvme0n1p2 cryptlvm

# LVM setup
pvcreate /dev/mapper/cryptlvm
vgcreate vg /dev/mapper/cryptlvm

# I have 32GB of RAM, so my swap should be just as big
lvcreate -L 32G -n swap vg
lvcreate -l 100%FREE -n root vg

mkfs.fat -F 32 /dev/nvme0n1p1

mkdir -p /mnt
mkswap /dev/mapper/vg-swap

mkfs.btrfs /dev/mapper/vg-root
btrfs subvolume create /mnt/root
btrfs subvolume create /mnt/home
btrfs subvolume create /mnt/nix

umount /mnt

mount -o compress=zstd,subvol=root /dev/mapper/vg-root /mnt
mkdir /mnt/{home,nix}
mount -o compress=zstd,subvol=home /dev/mapper/vg-root /mnt/home
mount -o compress=zstd,noatime,subvol=nix /dev/mapper/vg-root /mnt/nix
mkdir /mnt/boot
mount /dev/nvme0n1p1 /mnt/boot
</code></pre>
<p>Now that seemed like everything I had to do on the command line, and the rest would have to go into my Nix config. Thus I tried to do <code>nixos-generate-config --root /mnt</code>. Here is the result of that. What’s wrong here? Did I miss some steps?</p>
<p>For one thing, I don’t see the place LUKS is supposed to unlock my hard drive.</p>

            <div class='post' itemprop='text'>
              <p>I made the changes you suggested to the initrd.</p>
<p>Leaving this for others, I made a mistake when making the boot partition.</p>
<pre><code class="lang-auto">File system "/dev/nvme0n1p1" has wrong type for an EFI System Partition (ESP).

<p>To attempt to fix:</p>
<pre data-code-wrap="sh"><code class="lang-sh">umount /mnt/boot
cfdisk /dev/nvme0n1 # change to ESP partition, I just had fat32.
mkfs.fat -F 32 /dev/nvme0n1p1
mount /dev/nvme0n1p1 /mnt/boot
</code></pre>
<p>Make sure you change the UUID of the boot partition!</p>
<p>Running <code>nixos-install</code> now yields:</p>
<pre data-code-wrap="console"><code class="lang-console">[root@nixos:/mnt]# nixos-install

<p>I figured I couldn’t ignore these warnings, so what to do now?</p>
<p>According to here (<a href="https://discourse.nixos.org/t/nixos-install-with-custom-flake-results-in-boot-being-world-accessible/34555/6" class="inline-onebox">Nixos-install with custom flake results in /boot being world accessible - #6 by NovaViper</a>), I need to set permissions differently.</p>
<pre data-code-wrap="diff"><code class="lang-diff">  fileSystems."/boot" = {
      device = "${bootPart}";

-      options = [ "fmask=0022" "dmask=0022" ];
+     options = [ "umask=0077" ]";
    };
</code></pre>
<p>This however didn’t make the warning go away. Reading further it says I can just ignore the warning.</p>
<p>Looks like booting up worked without any issue. I just had to log in and add a password to my user account.</p>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-02-03T14:53:03Z' class='post-time'>

              </span>

            <div class='post' itemprop='text'>
              <p>Seems like there might be a bug where <code>nixos-generate-config</code> isn’t picking up your LUKS device, so you’ll need to set <code>boot.initrd.luks.devices</code> manually, as <a class="mention" href="/u/noximus237">@noximus237</a> showed.</p>
<aside class="quote no-group" data-username="wildwestrom" data-post="3" data-topic="59735">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/wildwestrom/48/16154_2.png" class="avatar"> wildwestrom:</div>
<blockquote>
<p>According to here (<a href="https://discourse.nixos.org/t/nixos-install-with-custom-flake-results-in-boot-being-world-accessible/34555/6">Nixos-install with custom flake results in /boot being world accessible - #6 by NovaViper</a>), I need to set permissions differently.</p>
<pre><code class="lang-auto">  fileSystems."/boot" = {
      device = "${bootPart}";
      fsType = "vfat";
-      options = [ "fmask=0022" "dmask=0022" ];
+     options = [ "umask=0077" ]";
    };
</code></pre>
<p>This however didn’t make the warning go away. Reading further it says I can just ignore the warning.</p>
</blockquote>
</aside>
<p>When you mount the ESP, you need to do so with <code>mount -o umask=0077 ...</code>, or else it gets the default which is <code>0022</code>, which is then translated by linux into the pairing of <code>fmask</code> and <code>dmask</code> settings. Then, <code>nixos-generate-config</code> knows that, because of the warning you’re getting, the <code>fmask</code> and <code>dmask</code> options need to be preserved in the generated <code>hardware-configuration.nix</code>, so it just copies in whatever value you mounted it with. All this is to say, <code>nixos-generate-config</code> generated the wrong thing, and you’re now getting warnings, because you need to have it mounted with <code>-o umask=0077</code> in the first place.</p>
<aside class="quote no-group" data-username="noximus237" data-post="2" data-topic="59735">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://discourse.nixos.org/user_avatar/discourse.nixos.org/noximus237/48/11900_2.png" class="avatar"> noximus237:</div>
<blockquote>
<p>boot.initrd.systemd.enableTpm2 = true;<br>
boot.initrd.luks.devices.root = {<br>
device = “/dev/disk/by-partuuid/$myPARTUUID”;<br>
};<br>
security.tpm2.enable = true;</p>
</blockquote>
</aside>
<p>So, <code>boot.initrd.systemd.enableTpm2</code> has been renamed to <code>boot.initrd.systemd.tpm2.enable</code>, and it’s enabled by default. But, it’s only relevant if you use <code>boot.initrd.systemd.enable = true;</code>, which <a class="mention" href="/u/wildwestrom">@wildwestrom</a> has not done yet. But yes, you’ll need <code>boot.initrd.systemd.enable = true;</code> if you intend to unlock the disk using the TPM2.</p>
<p>Also <code>security.tpm2.enable</code> is something very different and not relevant for just unlocking the root disk.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>One thing you might consider doing is using <a href="https://github.com/nix-community/disko">disko</a>.<br>
It handles partitioning, but also almost all of your stack. There are examples (that double as tests) of luks + btrfs + subvolumes, luks + lvm, so it’s trivial to work out the whole stack (done that, sans tpm2). hibernate goes as a one-liner (at least using swap partition on said lvm). It also doubles as the filesystem part of hardware-config.nix. No idea if it handles tpm though. But, if you want to follow <a class="mention" href="/u/gytis-ivaskevicius">@gytis-ivaskevicius</a> advice and pursue zfs, it’s supported.</p>
<p>The good parts: you don’t have to create partitions etc by yourself, disko handles luks + lvm + btrfs pretty well.</p>
<p>The bad parts: you need to use flakes (hey, that’s less scary than it sounds). And it doesn’t handle <em>changes</em> in partitions well. It’ll probably work if you change the description, reconfigure partitions, luks, lvm &amp; btrfs yourself and just stick with using it as filesystem config reference, it should work. But normally it can only wipe your drive &amp; recreate partitions.</p>
<p>As I’ve said above, I have a setup like this, the only difference with yours is that I use password-based luks (sorry, what’s the point of using luks if it decrypts automatically). I’m not ready to share it (have to get rid of some secrets), but I might be able to help if you need it.</p>
            </div>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-02-05T20:49:36Z' class='post-time'>

              <p>First thought:<br>

          <div id='post_14' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discourse.nixos.org/u/Torinthiel'><span itemprop='name'>Torinthiel</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2025-02-05T21:01:45Z' class='post-time'>
                    February 5, 2025,  9:01pm
                  </time>
                  <meta itemprop='dateModified' content='2025-02-05T21:04:47Z'>
              <span itemprop='position'>14</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>The documentation is lacking IMHO.<br>
There’s no autogenerated options configuration, most probably because the structure itself is recursive (hey, you can have lvm within luks or the other way round, or even lvm within luks within lvm if you’re insane enough).<br>
But the source and examples are relatively readable for me and, assuming you have a mental image of what you want to achieve, it’s rather simple to get this into configuration.</p>
<p>And there’s also nothing really <em>new</em> you put in that config. The script made by OP for creating luks container, LVs and stuff would translate directly into that, the only issue would be where to put what.</p>
<p>My setup (3 partitions, luks on one of them containing lvm with swap and btrfs with 9 subvolumes) is exactly 113 lines excluding comments and empty ones. I could probably make it shorter and less repeatable with a lambda that’d generate stuff, but I’m to lazy for that now.</p>
            </div>

          <div id='post_15' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discourse.nixos.org/u/maxyw'><span itemprop='name'>maxyw</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2026-01-02T10:29:37Z' class='post-time'>
                    January 2, 2026, 10:29am
                  </time>
                  <meta itemprop='dateModified' content='2026-01-02T10:29:37Z'>
              <span itemprop='position'>15</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>One really important thing to mention here is that ZFS doesn’t really support hibernation at all on NixOS, at the very real risk of data corruption. So, at least for hibernation, it won’t work. Also, ZFS is actually generally considered more complicated than btrfs. While it can technically perform the functions of LUKS (ZFS supports encrypting your data) and LVM (ZFS manages logical volumes), you would still have to learn just as much information, you would just be configuring these extra features in ZFS instead.</p>
<p>I also would personally never recommend using a script for ZFS, especially not this one - refer to line 1 of the script:</p>
<pre data-code-wrap="bash"><code class="lang-bash">export DRIVE=nvme1n1
</code></pre>
<p>The script is clearly targeting that specific github user’s hardware, and drive names like nvme1 are not consistent at all - your own post uses nvme0 instead, so this script would fail for you in multiple ways without changes. In that case, you’re better off just understanding what’s going on and doing it yourself anyways, especially since you are only installing your file system once, at OS install.</p>
<p>You could try to use disko if you really wanted the formatting to be done automatically but again this is only really useful to people who <em>need</em> to automate the installation of a bunch of systems/servers, if you’re just doing it for one PC, disko is actually much more complex and invites the possibility of an auto-generated misconfiguration deleting your valuable personal data.</p>
            </div>
