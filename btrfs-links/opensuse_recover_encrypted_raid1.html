both the Btrfs RAID disks (\\u003ccode\\u003esda\\u003c/code\\u003e and \\u003ccode\\u003esdb\\u003c/code\\u003e) must be unlocked:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003ecr_nvme-eui.00000000000000016479a7716f0000f7-part2  UUID=4834839d-7933-4294-acff-3fa6f5e22909  none  x-initrd.attach\\nsda UUID=0ae86c72-564c-41d1-9333-eedfe64c84ea none x-initrd.attach\\nsdb UUID=031c7ad8-0776-4601-b774-bc396c6298e1 none x-initrd.attach\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eI’ve found adding \\u003ccode\\u003ex-initrd.attach\\u003c/code\\u003e useful even for encrypted USB drives as otherwise systemd attempts to close them prior to unmounting the fs during shutdown. Add \\u003ccode\\u003enofail\\u003c/code\\u003e option in \\u003ccode\\u003ecrypttab\\u003c/code\\u003e and \\u003ccode\\u003efstab\\u003c/code\\u003e entries if these are external drives or you do not want the boot to fail due to them.\\u003c/p\\u003e\\n\\u003cp\\u003eTo test:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003e# reload to let systemd pick up on updated crypttab entries\\nsudo systemctl daemon-reload\\n# use systemd to open the encrypted volumes\\nsudo systemctl start systemd-cryptsetup@sda.service\\nsudo systemctl start systemd-cryptsetup@sdb.service\\n# mount btrfs raid volume after uncommenting the line in fstab\\nsudo mount -av\\n\\u003c/code\\u003e\\u003c/pre\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2024-03-26T09:10:55.914Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:8,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:4,\&quot;reads\&quot;:21,\&quot;readers_count\&quot;:20,\&quot;score\&quot;:29.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:173496,\&quot;topic_slug\&quot;:\&quot;how-to-recover-encrypted-btrfs-raid1\&quot;,\&quot;display_username\&quot;:\&quo             <div class='post' itemprop='text'>
              <p>Hi!<br>
I installed openSUSE on a new disk and made a backup of /home but I forgot about my LUKS encrypted BTRFS RAID1 disks.<br>
How can I add them back to my new installed system? I can unlock them with the passphrase and btrfs can see them but how can I have them to automount and decrypt at start-up like they used to?</p>
<p>Thanks.</p>
            </div>

<blockquote>
<p>how can I have them to automount and decrypt at start-up</p>
</blockquote>
</aside>
<p>Add them to <code>/etc/crypttab</code> and <code>/etc/fstab</code>.</p>

                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/pavinjoseph'><span itemprop='name'>pavinjoseph</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-03-25T07:15:34Z' class='post-time'>
                    March 25, 2024,  7:15am

              <span itemprop='position'>7</span>

            <div class='post' itemprop='text'>
              <p><code>crypttab</code> is not user-readable.<br>
But generally a good concept to keep in mind, though I wouldn’t worry about it when working with filesystems, most of them are not user programs.</p>

          <div id='post_9' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/pavinjoseph'><span itemprop='name'>pavinjoseph</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-03-26T09:10:55Z' class='post-time'>

              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>In <code>/etc/crypttab</code>, both the Btrfs RAID disks (<code>sda</code> and <code>sdb</code>) must be unlocked:</p>
<pre><code class="lang-plaintext">cr_nvme-eui.00000000000000016479a7716f0000f7-part2  UUID=4834839d-7933-4294-acff-3fa6f5e22909  none  x-initrd.attach
sda UUID=0ae86c72-564c-41d1-9333-eedfe64c84ea none x-initrd.attach
sdb UUID=031c7ad8-0776-4601-b774-bc396c6298e1 none x-initrd.attach
</code></pre>
<p>I’ve found adding <code>x-initrd.attach</code> useful even for encrypted USB drives as otherwise systemd attempts to close them prior to unmounting the fs during shutdown. Add <code>nofail</code> option in <code>crypttab</code> and <code>fstab</code> entries if these are external drives or you do not want the boot to fail due to them.</p>
<p>To test:</p>
<pre><code class="lang-plaintext"># reload to let systemd pick up on updated crypttab entries
sudo systemctl daemon-reload
# use systemd to open the encrypted volumes
sudo systemctl start systemd-cryptsetup@sda.service
sudo systemctl start systemd-cryptsetup@sdb.service
# mount btrfs raid volume after uncommenting the line in fstab
sudo mount -av
</code></pre>
            </div>

                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/lavadrop'><span itemprop='name'>lavadrop</span></a>

            <div class='post' itemprop='text'>
              <p>Thanks <a class="mention" href="/u/pavinjoseph">@pavinjoseph</a> it worked, except for this error when running cryptsetup:</p>
<pre><code class="lang-plaintext">Job for systemd-cryptsetup@sdb.service failed because the control process exited with error code.
See "systemctl status systemd-cryptsetup@sdb.service" and "journalctl -xeu systemd-cryptsetup@sdb.service" for details.
</code></pre>
<pre><code class="lang-plaintext"> systemd-cryptsetup@sdb.service - Cryptography Setup for sdb

     Active: failed (Result: exit-code) since Tue 2024-03-26 10:24:34 CST; 5min&gt;

          <div id='post_11' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forums.opensuse.org/u/pavinjoseph'><span itemprop='name'>pavinjoseph</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-03-26T17:53:46Z' class='post-time'>
                    March 26, 2024,  5:53pm
                  </time>
                  <meta itemprop='dateModified' content='2024-03-26T17:53:46Z'>
              <span itemprop='position'>11</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>It’s better to name the encrypted device as something other than <code>sda</code> or <code>sdb</code> as those names are given to the disks by the system and could change after the next reboot, leading to some confusion. It would be already quite confusing as the disk /dev/sda and /dev/mapper/sda both existing!</p>
<p>Try this in <code>/etc/crypttab</code>:</p>
<pre><code class="lang-plaintext">raid_disk1 UUID=0ae86c72-564c-41d1-9333-eedfe64c84ea none x-initrd.attach
raid_disk2 UUID=031c7ad8-0776-4601-b774-bc396c6298e1 none x-initrd.attach
</code></pre>
<pre><code class="lang-plaintext">sudo systemctl daemon-reload
sudo systemctl start systemd-cryptsetup@raid_disk1.service
sudo systemctl start systemd-cryptsetup@raid_disk2.service
</code></pre>
<p>Did systemd ask you for the encrypted volume’s password when starting it? Perhaps it only supports key files.<br>
If there are errors, please show the output of:</p>
<pre><code class="lang-plaintext">sudo journalctl --no-pager -eu  systemd-cryptsetup@raid_disk1.service
</code></pre>
