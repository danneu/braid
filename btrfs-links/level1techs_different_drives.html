 and I’m trying to find out how do I mount both the RAID block device and subvolumes.  Do I keep the current setup?\\u003c/p\\u003e\\n\\u003cp\\u003eIn my case:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e## IronWolf Pro 20TB\\nUUID=a7afdaf6-9b3e-4e00-adcf-1d50bbc2e515       /media/DATA/SHARED      btrfs   defaults,subvol=@media  0       2\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eI read in this \\u003ca href=\\\&quot;https://archive.kernel.org/oldwiki/btrfs.wiki.kernel.org/index.php/Using_Btrfs_with_Multiple_Devices.html#Registration_in_.2Fetc.2Ffstab\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eolder doc\\u003c/a\\u003e that they put \\u003ccode\\u003e/dev/sdb\\u003c/code\\u003e in there, but what if I change mobos?  How should the RAID device be mounted or is it outdated?\\u003c/p\\u003e\\n\\u003cp\\u003eOther articles, like \\u003ca href=\\\&quot;https://www.cyberciti.biz/faq/linux-btrfs-fstab-entry-to-mount-filesystem-at-startup/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ethis\\u003c/a\\u003e seems to just mention mounting it normally, which makes me think I can leave it as is when RAID 1 is up and running.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:16,\&quot;updated_at\&quot;:\&quot;2024-07-13T22:59:56.450Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:17,\&quot;reads\&quot;:66,\&quot;readers_count\&quot;:65,\&quot;score\&quot;:103.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:213184,\&quot;topic_slug\&quot;:\&quot;is-there-a-downside-of-using-raid-1-on-btrfs-with-2-different-but-same-size-drives\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;               </span>

                <link itemprop="mainEntityOfPage" href="https://forum.level1techs.com/t/is-there-a-downside-of-using-raid-1-on-btrfs-with-2-different-but-same-size-drives/213184">


              <span class="crawler-post-infos">
                  <time  datetime='2024-07-13T22:16:18Z' class='post-time'>

              <span itemprop='position'>1</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>I have a 20TB IronWolf Pro on my NAS, and I found a 20TB WD Red Pro on sale.</p>
<p>Is there something I need to be aware of with that setup?</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="0" />

          </div>
          <div id='post_2' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/quilt'><span itemprop='name'>quilt</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-07-13T22:26:25Z' class='post-time'>
                    July 13, 2024, 10:26pm
                  </time>
                  <meta itemprop='dateModified' content='2024-07-13T22:26:25Z'>
              <span itemprop='position'>2</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>I don’t believe so, of course performance will be determined by the slower of the two drives.</p>
<p>Btrfs raid1 does not really do ‘mirroring’, it will simply ensure to store each block twice on separate disks.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>

          <div id='post_3' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/YamiYukiSenpai'><span itemprop='name'>YamiYukiSenpai</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-07-13T22:40:25Z' class='post-time'>
                    July 13, 2024, 10:40pm

            <div class='post' itemprop='text'>
              <aside class="quote no-group" data-username="quilt" data-post="2" data-topic="213184">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/letter_avatar_proxy/v4/letter/q/97f17d/48.png" class="avatar"> quilt:</div>
<blockquote>
<p>Btrfs raid1 does not really do ‘mirroring’, it will simply ensure to store each block twice on separate disks.</p>
</blockquote>
</aside>
<p>it should still allow read speeds to increase and help with redundancy in case 1 of them fails, right?</p>
<p>Also, I’m reading <a href="https://btrfs.readthedocs.io/en/latest/Volume-management.html#add-new-device" rel="noopener nofollow ugc">the docs</a>, and I’m trying to find out how do I mount both the RAID block device and subvolumes.  Do I keep the current setup?</p>
<p>In my case:</p>
<pre><code class="lang-auto">## IronWolf Pro 20TB
UUID=a7afdaf6-9b3e-4e00-adcf-1d50bbc2e515       /media/DATA/SHARED      btrfs   defaults,subvol=@media  0       2
</code></pre>
<p>I read in this <a href="https://archive.kernel.org/oldwiki/btrfs.wiki.kernel.org/index.php/Using_Btrfs_with_Multiple_Devices.html#Registration_in_.2Fetc.2Ffstab" rel="noopener nofollow ugc">older doc</a> that they put <code>/dev/sdb</code> in there, but what if I change mobos?  How should the RAID device be mounted or is it outdated?</p>
<p>Other articles, like <a href="https://www.cyberciti.biz/faq/linux-btrfs-fstab-entry-to-mount-filesystem-at-startup/" rel="noopener nofollow ugc">this</a> seems to just mention mounting it normally, which makes me think I can leave it as is when RAID 1 is up and running.</p>
            </div>

              <aside class="quote no-group" data-username="YamiYukiSenpai" data-post="1" data-topic="213184">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/yamiyukisenpai/48/416740_2.png" class="avatar"> YamiYukiSenpai:</div>
<blockquote>
<p>Is there something I need to be aware of with that setup?</p>
</blockquote>
</aside>
<p>I would say it is your best chance of the drives not failing from natural causes at the same time <img src="https://forum.level1techs.com/images/emoji/twitter/wink.png?v=12" title=":wink:" class="emoji" alt=":wink:" loading="lazy" width="20" height="20"></p>
<p>My new system will run Toshiba, Seagate and WD along side.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="3" />

          </div>
          <div id='post_5' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/quilt'><span itemprop='name'>quilt</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2024-07-14T03:07:45Z' class='post-time'>
                    July 14, 2024,  3:07am
                  </time>
                  <meta itemprop='dateModified' content='2024-07-14T11:53:20Z'>
              <span itemprop='position'>5</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Yes, the mounting should still work the same. Since you mount using uuid, there is no chance of issues changing ports/mobo/… since none of that changes the uuid.</p>
<p>I assume you will add the second drive to the existing btrfs filesystem (btrfs device add)? In that case mounting stays the same, since the second drive will be part of the same already existing fs.</p>
<p>For the same reason though one should take care cloning btrfs partitions or disks, since there can be uuid collisions then with bad consequences (btrfs gets confused over which device is which).</p>
<p>I’m not sure what you mean by mounting „block device“ though. In btrfs any mount is mounting a subvolume. (The root subvolume with id 5 also being a subvolume)</p>
            </div>

              <aside class="quote no-group" data-username="quilt" data-post="5" data-topic="213184">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.level1techs.com/letter_avatar_proxy/v4/letter/q/97f17d/48.png" class="avatar"> quilt:</div>
<blockquote>
<p>I’m not sure what you mean by mounting „block device“ though. In btrfs any mount is mounting a subvolume. (The root subvolume with is 5 also being a subvolume)</p>
</blockquote>
</aside>
<p>I may have been confusing it as this was in the guide:</p>
<blockquote>
<p>Registration in /etc/fstab</p>
<p>If you don’t have an initrd, or your initrd doesn’t perform a btrfs device scan, you can still mount a multi-volume btrfs filesystem by passing all the devices in the filesystem explicitly to the mount command. A suitable /etc/fstab entry would be:</p>
<p>/dev/sdb     /mnt    btrfs    device=/dev/sdb,device=/dev/sdc,device=/dev/sdd,device=/dev/sde    0 0</p>

            <div class='post' itemprop='text'>
              <p>I have 14 bay RAID6 btrfs array that I’m using for years now and it has 8x SG NAS/IronWolf + 6x WD Red that I got for free. It plows. In matter of fact some of those drives are connected over SATA II and some over SATA III. So it’s full mishmash of everything. And btrfs works just fine.</p>
<p>In fact btrfs is also just fine with different devices that are NOT the same size. I have another RAID6 btrfs array made of external usb WD Elements drives (it’s offsite ultra-disaster recovery doomsday backup of backup of backup storage) and it has mixed sizes of devices and it still uses them as much as it can.</p>
<p>There’s actually calculator that will tell you how btrfs is gonna behave when you load it with different sized devices. It’s really neat. Basically it will create smaller RAIDs internally and performance will slowly degrade with filling up array, as the more full it will be the fewer devices will hold stripes xD</p>
<p>This is my setup:</p>
<p><a href="https://carfax.org.uk/btrfs-usage/?c=1&amp;slo=1&amp;shi=100&amp;p=2&amp;dg=1&amp;d=8000&amp;d=8000&amp;d=8000&amp;d=8000&amp;d=6000&amp;d=6000&amp;d=5000" class="onebox" target="_blank" rel="noopener nofollow ugc">https://carfax.org.uk/btrfs-usage/?c=1&amp;slo=1&amp;shi=100&amp;p=2&amp;dg=1&amp;d=8000&amp;d=8000&amp;d=8000&amp;d=8000&amp;d=6000&amp;d=6000&amp;d=5000</a></p>

            <div class='post' itemprop='text'>
              <p>Mixing a 20TB Seagate IronWolf Pro with a 20TB WD Red Pro in your NAS should work fine since both drives are built for NAS environments. However, you may notice slight differences in performance due to firmware variations, especially if they’re part of the same RAID array. Keep an eye on heat and vibration levels, as different models can behave differently. Most modern RAID systems can handle mixed brands, but identical drives may perform better in some cases. Also, be aware that warranty and support will vary between Seagate and WD. If these points aren’t an issue, your setup should work without problems.</p>
            </div>
