        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_74941&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:174434,\&quot;name\&quot;:\&quot;Jan Vlug\&quot;,\&quot;username\&quot;:\&quot;janvlug\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/j/294172/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-04-16T15:46:04.114Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI have a Fedora 33 with issues on the BTRFS file system.\\u003c/p\\u003e\\n\\u003cp\\u003eWhen I do dnf update, the disk reports to be full:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e# dnf update\\n[Errno 28] No space left on device: &#39;/var/cache/dnf/metadata_lock.pid&#39;\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eWhen I do df, it reports enough space:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e# df -h\\nFilesystem      Size  Used Avail Use% Mounted on\\ndevtmpfs        7.8G     0  7.8G   0% /dev\\ntmpfs           7.8G  4.6M  7.8G   1% /dev/shm\\ntmpfs           3.2G  1.9M  3.2G   1% /run\\n/dev/dm-1       216G  177G   39G  83% /\\ntmpfs           7.8G  1.2M  7.8G   1% /tmp\\n/dev/dm-1       216G  177G   39G  83% /home\\n/dev/sda1       477M  207M  241M  47% /boot\\ntmpfs           1.6G  496K  1.6G   1% /run/user/1000\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eBut note that /dev/dm-1 is mounted on both / and /home\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e# mount | grep /home\\n/dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1 on /home type btrfs (rw,relatime,seclabel,compress=zstd:1,ssd,space_cache,subvolid=258,subvol=/home)\\n# mount | grep \\\&quot;on / \\\&quot;\\n/dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1 on / type btrfs (rw,relatime,seclabel,compress=zstd:1,ssd,space_cache,subvolid=257,subvol=/root)\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eAnd BTRFS also gives a warning about multiple block group profiles:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e# btrfs filesystem df /home\\nData, single: total=209.24GiB, used=170.95GiB\\nSystem, DUP: total=8.00MiB, used=48.00KiB\\nSystem, single: total=4.00MiB, used=0.00B\\nMetadata, DUP: total=3.00GiB, used=2.56GiB\\nMetadata, single: total=8.00MiB, used=0.00B\\nGlobalReserve, single: total=451.16MiB, used=32.00KiB\\nWARNING: Multiple block group profiles detected, see &#39;man btrfs(5)&#39;.\\nWARNING:   Metadata: single, dup\\nWARNING:   System: single, dup\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eIn /etc/fstab I have:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003eUUID=d7b908f7-49fb-41a0-8c1f-69f62f3001a1 /                       btrfs   subvol=root,compress=zstd:1,x-systemd.device-timeout=0 0 0\\nUUID=dde3d3f6-9350-420f-b0ac-964ed556bf09 /boot                   ext4    defaults        1 2\\nUUID=d7b908f7-49fb-41a0-8c1f-69f62f3001a1 /home                   btrfs   subvol=home,compress=zstd:1,x-systemd.device-timeout=0 0 0\\n/dev/mapper/luks-d53b5c50-2ac1-4800-aa17-a326b88144c1 swap                    swap    defaults,x-systemd.device-timeout=0 0 0\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eActually, I do not understand all of this, nor what is the root case of dnf reporting that there is no disk space left. Do you have any suggestions?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2023-06-22T20:44:29.232Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10820,\&quot;reads\&quot;:106,\&quot;readers_count\&quot;:105,\&quot;score\&quot;:54061.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:74941,\&quot;topic_slug\&quot;:\&quot;btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles\&quot;,\&quot;display_username\&quot;:\&quot;Jan Vlug\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://discussion.fedoraproject.org/t/disk-space-does-not-grow-despite-large-files-having-been-deleted/93860/2\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;Disk space does not grow despite large files having been deleted\&quot;,\&quot;clicks\&quot;:5}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:592,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles/74941/1\&quot;,\&quot;event\&quot;:null,\&quot;calendar_details\&quot;:[],\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:1}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:1,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:99143,\&quot;name\&quot;:\&quot;Chris Murphy\&quot;,\&quot;username\&quot;:\&quot;chrismurphy\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/c/afea85/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-04-16T18:36:38.550Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eFirst post the resuts from the following commands:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003euname -r\\nbtrfs version\\nsudo btrfs filesystem usage /\\ncd /sys/fs/btrfs/d7b908f7-49fb-41a0-8c1f-69f62f3001a1\\ngrep -R . allocation/\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThat’ll get us debugging info to see why you’re getting a no space left error. It might be a bug. But if we try to “fix” it with a work around, it clobbers all the state information needed to debug it.\\u003c/p\\u003e\\n\\u003cp\\u003eThe mixed block group error is not serious but can be fixed with the following:\\u003cbr\\u003e\\n\\u003ccode\\u003esudo btrfs balance start -mconvert=dup,soft /\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eSee if that alone fixes the dnf error. Let me know either way. If it doesn’t fix it, try this:\\u003cbr\\u003e\\n\\u003ccode\\u003esudo btrfs balance start -dusage=5 /\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAnd also let me know if that does or doesn’t fix it. Thanks!\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2021-04-16T18:36:38.550Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:134,\&quot;reads\&quot;:91,\&quot;readers_count\&quot;:90,\&quot;score\&quot;:763.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:74941,\&quot;topic_slug\&quot;:\&quot;btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles\&quot;,\&quot;display_username\&quot;:\&quot;Chris Murphy\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:184,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles/74941/2\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:3}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:3,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:205967,\&quot;name\&quot;:\&quot;Jan Vlug\&quot;,\&quot;username\&quot;:\&quot;janvlug\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/j/294172/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-04-17T09:01:11.787Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThanks Chris,\\u003c/p\\u003e\\n\\u003cp\\u003eBefore I read your reply, I solved the problem. What I did is that I removed a few large files to create more space. After that, I could do the btrfs balance command. The problems of no disk space occurred when compressing the btrfs following these instructions at \\u003ca href=\\\&quot;https://fedoramagazine.org/fedora-workstation-34-feature-focus-btrfs-transparent-compression/\\\&quot;\\u003efedora magazine\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003eI looked back in my terminal to find some information of the issue before it was resolved:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e$ sudo btrfs fi df /\\nData, single: total=209.24GiB, used=170.99GiB\\nSystem, DUP: total=8.00MiB, used=48.00KiB\\nSystem, single: total=4.00MiB, used=0.00B\\nMetadata, DUP: total=3.00GiB, used=2.56GiB\\nMetadata, single: total=8.00MiB, used=0.00B\\nGlobalReserve, single: total=451.16MiB, used=0.00B\\nWARNING: Multiple block group profiles detected, see &#39;man btrfs(5)&#39;.\\nWARNING:   Metadata: single, dup\\nWARNING:   System: single, dup\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eAfter that I deleted some large files, I could do:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e# btrfs balance start -musage=0 /\\nDone, had to relocate 1 out of 219 chunks\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eFrom that point on I could proceed with balancing, compressing and converting the btrfs system further.\\u003c/p\\u003e\\n\\u003cp\\u003eSo I converted to only the “single” policy for the data and “dup” for the metadata. This could also only be done after that some disk space was freed up. The system that I use has been in use for several years, and has been very full at some times.\\u003cbr\\u003e\\nAnyway, I’m happy that there has been no data loss. And I gained many GB of space by using the btrfs compression.\\u003c/p\\u003e\\n\\u003cp\\u003eThe current state is now:\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode\\u003e# btrfs filesystem usage /\\nOverall:\\n    Device size:\\t\\t 215.27GiB\\n    Device allocated:\\t\\t 215.27GiB\\n    Device unallocated:\\t\\t   1.00MiB\\n    Device missing:\\t\\t     0.00B\\n    Used:\\t\\t\\t 132.80GiB\\n    Free (estimated):\\t\\t  81.50GiB\\t(min: 81.50GiB)\\n    Free (statfs, df):\\t\\t  81.50GiB\\n    Data ratio:\\t\\t\\t      1.00\\n    Metadata ratio:\\t\\t      2.00\\n    Global reserve:\\t\\t 451.72MiB\\t(used: 0.00B)\\n    Multiple profiles:\\t\\t        no\\n\\nData,single: Size:209.24GiB, Used:127.74GiB (61.05%)\\n   /dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1\\t 209.24GiB\\n\\nMetadata,DUP: Size:3.00GiB, Used:2.53GiB (84.19%)\\n   /dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1\\t   6.01GiB\\n\\nSystem,DUP: Size:8.00MiB, Used:48.00KiB (0.59%)\\n   /dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1\\t  16.00MiB\\n\\nUnallocated:\\n   /dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1\\t   1.00MiB\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2023-03-03T18:14:58.073Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:203,\&quot;reads\&quot;:90,\&quot;readers_count\&quot;:89,\&quot;score\&quot;:1043.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:74941,\&quot;topic_slug\&quot;:\&quot;btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles\&quot;,\&quot;display_username\&quot;:\&quot;Jan Vlug\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://fedoramagazine.org/fedora-workstation-34-feature-focus-btrfs-transparent-compression/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Fedora Workstation 34 feature focus: Btrfs transparent compression - Fedora Magazine\&quot;,\&quot;clicks\&quot;:40}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:592,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:\&quot;Ownership transferred\&quot;,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles/74941/3\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:85255,\&quot;name\&quot;:\&quot;Ivan Tomica\&quot;,\&quot;username\&quot;:\&quot;masteroman\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discussion.fedoraproject.org/masteroman/{size}/4813_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-04-17T10:59:32.189Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;janvlug\\\&quot; data-post=\\\&quot;3\\\&quot; data-topic=\\\&quot;74941\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://avatars.discourse-cdn.com/v4/letter/j/294172/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e janvlug:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003eOverall:\\n    Device size:\\t\\t 215.27GiB\\n    Device allocated:\\t\\t 215.27GiB\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eFrom this, I’d say you most definitely did reach full usage of the filesystem.\\u003c/p\\u003e\\n\\u003cp\\u003eBe aware that when working with BTRFS, standard utilities such as \\u003ccode\\u003edf\\u003c/code\\u003e might lie to you a bit \\u003cimg src=\\\&quot;https://emoji.discourse-cdn.com/twitter/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e Most accurate way to analyze is to look at BTRFS statistics. Especially allocation and Free section.\\u003c/p\\u003e\\n\\u003cp\\u003eAlthough not really important, I see that you could benefit from running rebalance, just in case some other data section (metadata for example) needs to allocate additional chunk, it has spare space in unallocated section.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2023-03-08T22:30:17.900Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:3,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:48,\&quot;reads\&quot;:77,\&quot;readers_count\&quot;:76,\&quot;score\&quot;:345.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:74941,\&quot;topic_slug\&quot;:\&quot;btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles\&quot;,\&quot;display_username\&quot;:\&quot;Ivan Tomica\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:9100,\&quot;username\&quot;:\&quot;jbs4115\&quot;,\&quot;name\&quot;:\&quot;John B Spence\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/j/3c6eb4/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:4}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:3093,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles/74941/4\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;count\&quot;:4}],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:4,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:170228,\&quot;name\&quot;:\&quot;Chris Murphy\&quot;,\&quot;username\&quot;:\&quot;chrismurphy\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/c/afea85/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-04-17T20:50:17.118Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;janvlug\\\&quot; data-post=\\\&quot;3\\\&quot; data-topic=\\\&quot;74941\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://avatars.discourse-cdn.com/v4/letter/j/294172/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e janvlug:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e    Device size:\\t\\t 215.27GiB\\n    Device allocated:\\t\\t 215.27GiB\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThis means Btrfs has allocated all the space to either data or metadata block groups. It does this on-demand, thereby ensuring the data/metadata ratio is reflected in the allocation. As long as the ratio stays the same (basically the same usage pattern as in, types of files) then it’s ok. But if the usage pattern changes enough, then the existing allocation might be suboptimal and lead to premature out of space. For example…\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group quote-modified\\\&quot; data-username=\\\&quot;janvlug\\\&quot; data-post=\\\&quot;3\\\&quot; data-topic=\\\&quot;74941\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://avatars.discourse-cdn.com/v4/letter/j/294172/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e janvlug:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003eData,single: Size:209.24GiB, Used:127.74GiB (61.05%)\\nMetadata,DUP: Size:3.00GiB, Used:2.53GiB (84.19%)\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eMetadata block groups are more full than data block groups. If the future allocation becomes more metadata demanding, metadata block groups will become full before data block groups. If either block group type becomes full, the file system is “out of space” even if there’s unused space in the other block group type.\\u003c/p\\u003e\\n\\u003cp\\u003eOrdinarily the data to metadata usage ratio doesn’t change much. Also, btrfs tends to slightly bias allocation of block groups to metadata type. But this logic can be thwarted by manual balance that balances more metadata block groups, relative to data block groups. This happens simply because there are far fewer metadata block groups.\\u003c/p\\u003e\\n\\u003cp\\u003eThe general rule of thumb is “don’t balance metadata”. The only time to fully balance metadata is when also fully balancing data: e.g. conversions between profiles; and following ‘btrfs-convert’ from another file system format. Yes, you could just do a full balance, but this is kindof an expensive operation, by reading all blocks and rewriting them out elsewhere. It doesn’t hurt anything other than just being expensive. So you’ll read a lot of advice like “just balance the file system” as a sort of sledgehammer to fix everything.\\u003c/p\\u003e\\n\\u003cp\\u003eIn your case, you could just leave it alone but it actually does look to me like the metadata to data ratio has changed over time, or possibly metadata block groups were more fully balanced, while data blocks were only partially balanced (or not at all). Therefore I expect you’ll hit premature out of space again at some point.\\u003c/p\\u003e\\n\\u003cp\\u003eAbout the simplest one size fits all for your case given the above?\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003esudo btrfs balance start -dusage=30 /\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThere’s a nifty tool “btrfs-balance-least-used” in \\u003ca href=\\\&quot;https://github.com/knorrie/python-btrfs\\\&quot;\\u003epython-btrfs\\u003c/a\\u003e that balances the most empty data block groups first. So it ends up going faster to achieve the same result. You can use that, or you can get an approximate equivalent by starting with -dusage=1, moving up by 1 until you get to -dusage=5, then increment by 5 until you get to -dusage=30. For your file system this might save a minute or two. If it were a huge file system it could save hours.\\u003c/p\\u003e\\n\\u003cp\\u003eNext you can post \\u003ccode\\u003ebtrfs fi us /\\u003c/code\\u003e again and we’ll see how that looks and if it’s worth doing more. The tools right now are definitely so granular and rudimentary that it is easy for users to get into splitting hairs over what values and strategies to use, which is why you see so much varied advice in this area.\\u003c/p\\u003e\\n\\u003cp\\u003eSo as for the future does this imply you need some regular maintenance? Probably not but maybe. I personally would just chock it up to one of the explanations I’ve already given, do the above balance, then forget about it. But it’s a completely reasonable opinion to say, “look, i’d rather not run into this again, is there some script i can run to avoid it? i hate file bugs!”\\u003c/p\\u003e\\n\\u003cp\\u003eAnswer is yes. You can install the btrfsmaintenance package (in Fedora repos), and enable the \\u003cstrong\\u003ebtrfs-balance.timer\\u003c/strong\\u003e - voila!\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2023-03-08T22:41:33.263Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:204,\&quot;reads\&quot;:75,\&quot;readers_count\&quot;:74,\&quot;score\&quot;:1115.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:74941,\&quot;topic_slug\&quot;:\&quot;btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles\&quot;,\&quot;display_username\&quot;:\&quot;Chris Murphy\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/knorrie/python-btrfs\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;GitHub - knorrie/python-btrfs: Python Btrfs module\&quot;,\&quot;clicks\&quot;:22}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:5}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:184,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles/74941/5\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[{\&quot;id\&quot;:\&quot;heart\&quot;,\&quot;type\&quot;:\&quot;emoji\&quot;,\&quot;coun ot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:207058,\&quot;name\&quot;:\&quot;Ben\&quot;,\&quot;username\&quot;:\&quot;huben\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/discussion.fedoraproject.org/huben/{size}/7796_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-10-25T20:30:11.583Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eA problem with the inodes I come across mostly was like this:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eA process is creating new files every new second, all with size 0, but with a new name and new meta information like timestamps and such.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eNow the files accumulate by time, don’t actually consume space but each file has a corresponding inode storing said meta information.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003ethe file system hat a fixed amount of inodes, so sooner or later they all were consumed.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eThe file system reported to be full.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m not so deep in btrfs, but wouldn’t something similar possible?\\u003c/p\\u003e\\n\\u003cp\\u003eIt may not have a fixed amount of inodes, but it still stores meta information in dynamically created inodes, or did I understand that wrong?\\u003c/p\\u003e\\n\\u003cp\\u003eGiven each file system has a fixed number of blocks, what would happen if that runs full?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:11,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2023-03-08T08:05:51.162Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:10,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count vel\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:\&quot;Ownership transferred\&quot;,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;mentioned_users\&quot;:[],\&quot;post_url\&quot;:\&quot;/t/btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles/74941/13\&quot;,\&quot;event\&quot;:null,\&quot;reactions\&quot;:[],\&quot;current_user_reaction\&quot;:null,\&quot;reaction_users_count\&quot;:0,\&quot;current_user_used_main_reaction\&quot;:false,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:197775,\&quot;name\&quot;:\&quot;Chris Murphy\&quot;,\&quot;username\&quot;:\&quot;chrismurphy\&quot;,\&quot;avatar_template\&quot;:\&quot;https://avatars.discourse-cdn.com/v4/letter/c/afea85/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2021-10-27T15:39:36.391Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eDo this:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003emount -o remount,enospc_debug /\\nbtrfs balance start -dlimit=1 /\\ndmesg | grep -i btrfs\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eI’ll file a rhbz and include all the information so far, it really shouldn’t get stuck like this. Next see if any of these work:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003ebtrfs balance start -dusage=0 /\\nbtrfs balance start -dusage=1 /\\nbtrfs balance start -dusage=5 /\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIf \\u003ccode\\u003e0\\u003c/code\\u003e doesn’t work, the next two won’t either. It \\u003cem\\u003eis\\u003c/em\\u003e still possible to fix this, but you’ll need some physical drive space you can spare, either on this drive or a USB stick. It can be a small (10G or so) empty partition. Chances are even 1G would do it.\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003ebtrfs device add /dev/sdXY /\\nbtrfs balance start -dusage=0 /\\nbtrfs balance start -dlimit=5 /\\nbtrfs device remove /dev/sdXY /\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIt’s really important once you start the above that you keep the 2nd device you’re adding available for the entire duration until the \\u003ccode\\u003eremove\\u003c/code\\u003e command returns to a prompt. Part of the file system will be temporarily relocated to that 2nd device, so if it goes missing for any reason, the file system will end up broken. I don’t recommend using a ram disk of any kind for this, because should there be a power failure or a reboot needed, the ramdisk contents go away of course and now that part of the file system is simply gone and not recoverable. Whereas with a USB stick or other drive partition, it’ll survive a reboot.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:14,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:18,\&quot;updated_at\&quot;:\&quot;2023-03-08T08:02:01.114Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:13,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:103,\&quot;reads\&quot;:55,\&quot;readers_count\&quot;:54,\&quot;score\&quot;:546.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:74941,\&quot;topic_slug\&quot;:\&quot;btrfs-problems-no-space-left-on-device-but-there-is-enough-multiple-block-group-profiles\&quot;,\&quot;display_username\&quot;:\&quot;Chris Murphy\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title here we collect and organize suggested Common Issues. When they’re in good shape, we publish them to the main Common Issues category.\&quot;,\&quot;description_excerpt\&quot;:\&quot;If you know of a problem in a Fedora Linux release which affects a lot of people in a serious way, you’ve come to the right place! This category is where we collect and organize suggested Common Issues. When they’re in good shape, we publish them to the main \\u003ca class=\\\&quot;hashtag-cooked\\\&quot; href=\\\&quot;/c/ask/common-issues/82\\\&quot; data-type=\\\&quot;category\\\&quot; data-slug=\\\&quot;common-issues\\\&quot; data-id=\\\&quot;82\\\&quot; data-ref=\\\&quot;ask:common-issues\\\&quot;\\u003e\\u003cspan class=\\\&quot;hashtag-icon-placeholder\\\&quot;\\u003e\\u003c/span\\u003eCommon Issues\\u003c/span\\u003e\\u003c/a\\u003e category.\&quot;,\&quot;topic_url\&quot;:\&quot;/t/about-the-proposed-common-issues-category/69491\&quot;,\&quot;read_restricted\&quot;:false,\&quot;permission\&quot;:null,\&quot;parent_category_id\&quot;:82,\&quot;notification_level\&quot;:0,\&quot;topic_template\&quot;:\&quot;\\u003c!--\\nThis is NOT a place to report bugs. If you want to discuss a problem with other Fedora users, select the \\\&quot;Ask Fedora\\\&quot; category (without any subcategory) in the drop-down list above. Or close (discard) this draft and open a new topic in here:\\nhttps://discussion.fedoraproject.org/c/ask\\nIf you want to report a bug to Fedora package maintainers, follow this guide:\\nhttps://docs.fedoraproject.org/en-US/quick-docs/bugzilla-file-a-bug/\\n\\nThis category is for proposing a new Common Issue. Read about Common Issues here:\\nhttps://discussion.fedoraproject.org/t/about-the-common-issues-category/74711\\nand detailed instructions on proposing here:\\nhttps://discussion.fedoraproject.org/t/about-the-proposed-common-issues-category/69491\\n\\nIf you really intend to propose a new Common Issue documenting a problem that&#39;s serious and affects a lot of people, please fill out the template below. Look at other published Common Issues and write your description in the same style:\\nhttps://discussion.fedoraproject.org/c/ask/common-issues/\\n--\\u003e\\n\\n\\u003c!-- Please give the topic a succinct title which describes the issue and which will be easy to search for. Also, attach some meaningful tags. --\\u003e\\n\\nProblem\\n-------\\n\\u003c!-- Describe briefly how the problem appears to a user, in simple terms. Attach screenshots, if it helps to illustrate the issue. --\\u003e\\n\\nCause\\n-----\\n\\u003c!-- If we know what causes the issue, describe that in a few lines, without getting deeply technical. Link to other posts explaining technical details if it seems useful. --\\u003e\\n\\nNot yet known.\\n\\nRelated Issues\\n--------------\\n\\u003c!-- Replace both instances of NNNN with the bugzilla bug ID in the Bugzilla line below. If there are more than one related bug, put each one to a separate line.  Please make sure that there&#39;s always either a RH Bugzilla report or an upstream tracker report (below), because that&#39;s essential to get the problem fixed. --\\u003e\\nBugzilla report: [#NNNN](https://bugzilla.redhat.com/NNNN)\\n\\n\\u003c!-- If there are upstream trackers covering this issue, you could link them here too. You may also want to link to related discussions on Ask Fedora. You can also link to similar problems that are NOT this one. --\\u003e\\n\\n\\nWorkarounds \\u003c!-- When the issue is solved, change this to \\\&quot;Solution\\\&quot;, remove the workaround text, and mark a reply, below, with that solution. --\\u003e\\n-----------\\n\\n\\u003c!-- If there are steps users can take to mitigate the problem, list those here. --\\u003e\\n\\nNone yet.\\n\&quot;,\&quot;has_children\&quot;:false,\&quot;subcategory_count\&quot;:null,\&quot;sort_order\&quot;:\&quot;created\&quot;,\&quot;sort_ascending\&quot;:false,\&quot;show_subcategory_list\&quot;:false,\&quot;num_featured_topics\&quot;:3,\&quot;de               <span class="crawler-post-infos">
                  <time  datetime='2021-04-16T15:46:04Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>I have a Fedora 33 with issues on the BTRFS file system.</p>
<p>When I do dnf update, the disk reports to be full:</p>
<blockquote>
<pre><code># dnf update
[Errno 28] No space left on device: '/var/cache/dnf/metadata_lock.pid'
</code></pre>
</blockquote>
<p>When I do df, it reports enough space:</p>
<blockquote>
<pre><code># df -h
Filesystem      Size  Used Avail Use% Mounted on
devtmpfs        7.8G     0  7.8G   0% /dev
tmpfs           7.8G  4.6M  7.8G   1% /dev/shm
tmpfs           3.2G  1.9M  3.2G   1% /run
/dev/dm-1       216G  177G   39G  83% /
tmpfs           7.8G  1.2M  7.8G   1% /tmp
/dev/dm-1       216G  177G   39G  83% /home
/dev/sda1       477M  207M  241M  47% /boot
tmpfs           1.6G  496K  1.6G   1% /run/user/1000
</code></pre>
</blockquote>
<p>But note that /dev/dm-1 is mounted on both / and /home</p>
<blockquote>
<pre><code># mount | grep /home
/dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1 on /home type btrfs (rw,relatime,seclabel,compress=zstd:1,ssd,space_cache,subvolid=258,subvol=/home)
# mount | grep "on / "
/dev/mapper/luks-e5fbe4ab-0ae9-4428-87c0-5c98b5acadd1 on / type btrfs (rw,relatime,seclabel,compress=zstd:1,ssd,space_cache,subvolid=257,subvol=/root)
</code></pre>
</blockquote>
<p>And BTRFS also gives a warning about multiple block group profiles:</p>
<blockquote>
<pre><code># btrfs filesystem df /home
Data, single: total=209.24GiB, used=170.95GiB
System, DUP: total=8.00MiB, used=48.00KiB
System, single: total=4.00MiB, used=0.00B
Metadata, DUP: total=3.00GiB, used=2.56GiB
Metadata, single: total=8.00MiB, used=0.00B
GlobalReserve, single: total=451.16MiB, used=32.00KiB
WARNING: Multiple block group profiles detected, see 'man btrfs(5)'.
WARNING:   Metadata: single, dup
WARNING:   System: single, dup
</code></pre>
</blockquote>
<p>In /etc/fstab I have:</p>
<blockquote>
<pre><code>UUID=d7b908f7-49fb-41a0-8c1f-69f62f3001a1 /                       btrfs   subvol=root,compress=zstd:1,x-systemd.device-timeout=0 0 0
UUID=dde3d3f6-9350-420f-b0ac-964ed556bf09 /boot                   ext4    defaults        1 2
UUID=d7b908f7-49fb-41a0-8c1f-69f62f3001a1 /home                   btrfs   subvol=home,compress=zstd:1,x-systemd.device-timeout=0 0 0
/dev/mapper/luks-d53b5c50-2ac1-4800-aa17-a326b88144c1 swap                    swap    defaults,x-systemd.device-timeout=0 0 0
</code></pre>
</blockquote>
<p>Actually, I do not understand all of this, nor what is the root case of dnf reporting that there is no disk space left. Do you have any suggestions?</p>

          <div id='post_2' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discussion.fedoraproject.org/u/chrismurphy'><span itemprop='name'>chrismurphy</span></a>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2021-04-16T18:36:38Z' class='post-time'>
                    April 16, 2021,  6:36pm
                  </time>

              </span>

            <div class='post' itemprop='text'>
              <p>First post the resuts from the following commands:</p>
<pre><code class="lang-auto">uname -r
btrfs version
sudo btrfs filesystem usage /
cd /sys/fs/btrfs/d7b908f7-49fb-41a0-8c1f-69f62f3001a1
grep -R . allocation/
</code></pre>
<p>That’ll get us debugging info to see why you’re getting a no space left error. It might be a bug. But if we try to “fix” it with a work around, it clobbers all the state information needed to debug it.</p>
<p>The mixed block group error is not serious but can be fixed with the following:<br>
<code>sudo btrfs balance start -mconvert=dup,soft /</code></p>
<p>See if that alone fixes the dnf error. Let me know either way. If it doesn’t fix it, try this:<br>
<code>sudo btrfs balance start -dusage=5 /</code></p>
<p>And also let me know if that does or doesn’t fix it. Thanks!</p>
            </div>

          <div id='post_3' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>

              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://discussion.fedoraproject.org/u/janvlug'><span itemprop='name'>janvlug</span></a>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2021-04-17T09:01:11Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>Thanks Chris,</p>
<p>Before I read your reply, I solved the problem. What I did is that I removed a few large files to create more space. After that, I could do the btrfs balance command. The problems of no disk space occurred when compressing the btrfs following these instructions at <a href="https://fedoramagazine.org/fedora-workstation-34-feature-focus-btrfs-transparent-compression/">fedora magazine</a>.</p>
<p>I looked back in my terminal to find some information of the issue before it was resolved:</p>
<blockquote>
<pre><code>$ sudo btrfs fi df /
Data, single: total=209.24GiB, used=170.99GiB
System, DUP: total=8.00MiB, used=48.00KiB
System, single: total=4.00MiB, used=0.00B
Metadata, DUP: total=3.00GiB, used=2.56GiB
Metadata, single: total=8.00MiB, used=0.00B
GlobalReserve, single: total=451.16MiB, used=0.00B
WARNING: Multiple block group profiles detected, see 'man btrfs(5)'.
WARNING:   Metadata: single, dup
WARNING:   System: single, dup
</code></pre>
</blockquote>
<p>After that I deleted some large files, I could do:</p>
<blockquote>
<pre><code># btrfs balance start -musage=0 /
Done, had to relocate 1 out of 219 chunks
</code></pre>
</blockquote>
<p>From that point on I could proceed with balancing, compressing and converting the btrfs system further.</p>
<p>So I converted to only the “single” policy for the data and “dup” for the metadata. This could also only be done after that some disk space was freed up. The system that I use has been in use for several years, and has been very full at some times.<br>
Anyway, I’m happy that there has been no data loss. And I gained many GB of space by using the btrfs compression.</p>
<p>The current state is now:</p>
<blockquote>
<pre><code># btrfs filesystem usage /
Overall:
    Device size:		 215.27GiB
    Device allocated:		 215.27GiB
    Device unallocated:		   1.00MiB
    Device missing:		     0.00B
    Used:			 132.80GiB
    Free (estimated):		  81.50GiB	(min: 81.50GiB)
    Free (statfs, df):		  81.50GiB
    Data ratio:			      1.00
    Metadata ratio:		      2.00
    Global reserve:		 451.72MiB	(used: 0.00B)

<p>From this, I’d say you most definitely did reach full usage of the filesystem.</p>
<p>Be aware that when working with BTRFS, standard utilities such as <code>df</code> might lie to you a bit <img src="https://emoji.discourse-cdn.com/twitter/slight_smile.png?v=12" title=":slight_smile:" class="emoji" alt=":slight_smile:" loading="lazy" width="20" height="20"> Most accurate way to analyze is to look at BTRFS statistics. Especially allocation and Free section.</p>
<p>Although not really important, I see that you could benefit from running rebalance, just in case some other data section (metadata for example) needs to allocate additional chunk, it has spare space in unallocated section.</p>

              <aside class="quote no-group" data-username="janvlug" data-post="3" data-topic="74941">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://avatars.discourse-cdn.com/v4/letter/j/294172/48.png" class="avatar"> janvlug:</div>
<blockquote>
<pre><code class="lang-auto">    Device size:		 215.27GiB
    Device allocated:		 215.27GiB
</code></pre>
</blockquote>
</aside>
<p>This means Btrfs has allocated all the space to either data or metadata block groups. It does this on-demand, thereby ensuring the data/metadata ratio is reflected in the allocation. As long as the ratio stays the same (basically the same usage pattern as in, types of files) then it’s ok. But if the usage pattern changes enough, then the existing allocation might be suboptimal and lead to premature out of space. For example…</p>
<aside class="quote no-group quote-modified" data-username="janvlug" data-post="3" data-topic="74941">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://avatars.discourse-cdn.com/v4/letter/j/294172/48.png" class="avatar"> janvlug:</div>
<blockquote>
<pre><code class="lang-auto">Data,single: Size:209.24GiB, Used:127.74GiB (61.05%)
Metadata,DUP: Size:3.00GiB, Used:2.53GiB (84.19%)
</code></pre>
</blockquote>
</aside>
<p>Metadata block groups are more full than data block groups. If the future allocation becomes more metadata demanding, metadata block groups will become full before data block groups. If either block group type becomes full, the file system is “out of space” even if there’s unused space in the other block group type.</p>
<p>Ordinarily the data to metadata usage ratio doesn’t change much. Also, btrfs tends to slightly bias allocation of block groups to metadata type. But this logic can be thwarted by manual balance that balances more metadata block groups, relative to data block groups. This happens simply because there are far fewer metadata block groups.</p>
<p>The general rule of thumb is “don’t balance metadata”. The only time to fully balance metadata is when also fully balancing data: e.g. conversions between profiles; and following ‘btrfs-convert’ from another file system format. Yes, you could just do a full balance, but this is kindof an expensive operation, by reading all blocks and rewriting them out elsewhere. It doesn’t hurt anything other than just being expensive. So you’ll read a lot of advice like “just balance the file system” as a sort of sledgehammer to fix everything.</p>
<p>In your case, you could just leave it alone but it actually does look to me like the metadata to data ratio has changed over time, or possibly metadata block groups were more fully balanced, while data blocks were only partially balanced (or not at all). Therefore I expect you’ll hit premature out of space again at some point.</p>
<p>About the simplest one size fits all for your case given the above?</p>
<p><code>sudo btrfs balance start -dusage=30 /</code></p>
<p>There’s a nifty tool “btrfs-balance-least-used” in <a href="https://github.com/knorrie/python-btrfs">python-btrfs</a> that balances the most empty data block groups first. So it ends up going faster to achieve the same result. You can use that, or you can get an approximate equivalent by starting with -dusage=1, moving up by 1 until you get to -dusage=5, then increment by 5 until you get to -dusage=30. For your file system this might save a minute or two. If it were a huge file system it could save hours.</p>
<p>Next you can post <code>btrfs fi us /</code> again and we’ll see how that looks and if it’s worth doing more. The tools right now are definitely so granular and rudimentary that it is easy for users to get into splitting hairs over what values and strategies to use, which is why you see so much varied advice in this area.</p>
<p>So as for the future does this imply you need some regular maintenance? Probably not but maybe. I personally would just chock it up to one of the explanations I’ve already given, do the above balance, then forget about it. But it’s a completely reasonable opinion to say, “look, i’d rather not run into this again, is there some script i can run to avoid it? i hate file bugs!”</p>
<p>Answer is yes. You can install the btrfsmaintenance package (in Fedora repos), and enable the <strong>btrfs-balance.timer</strong> - voila!</p>

              <p>I suggest doing <code>btrfs balance start -dlimit=5 /</code> which will free up enough data block groups, turning their space back into unallocated space. And then unallocated can be turned into one or more metadata block groups, which is where I suspect Btrfs is getting stuck. It looks like it’s overcommiting metadata and it can’t create another metadata block group because all the space is in use for other data or metadata.</p>

            <div class='post' itemprop='text'>
              <p>A problem with the inodes I come across mostly was like this:</p>
<ul>
<li>
<p>A process is creating new files every new second, all with size 0, but with a new name and new meta information like timestamps and such.</p>
</li>
<li>
<p>Now the files accumulate by time, don’t actually consume space but each file has a corresponding inode storing said meta information.</p>
</li>
<li>
<p>the file system hat a fixed amount of inodes, so sooner or later they all were consumed.</p>
</li>
</ul>
<p>The file system reported to be full.</p>
<p>I’m not so deep in btrfs, but wouldn’t something similar possible?</p>
<p>It may not have a fixed amount of inodes, but it still stores meta information in dynamically created inodes, or did I understand that wrong?</p>
<p>Given each file system has a fixed number of blocks, what would happen if that runs full?</p>

              <span class="crawler-post-infos">

            <div class='post' itemprop='text'>
              <p>Do this:</p>
<pre><code class="lang-auto">mount -o remount,enospc_debug /
btrfs balance start -dlimit=1 /
dmesg | grep -i btrfs
</code></pre>
<p>I’ll file a rhbz and include all the information so far, it really shouldn’t get stuck like this. Next see if any of these work:</p>
<pre><code class="lang-auto">btrfs balance start -dusage=0 /
btrfs balance start -dusage=1 /
btrfs balance start -dusage=5 /
</code></pre>
<p>If <code>0</code> doesn’t work, the next two won’t either. It <em>is</em> still possible to fix this, but you’ll need some physical drive space you can spare, either on this drive or a USB stick. It can be a small (10G or so) empty partition. Chances are even 1G would do it.</p>
<pre><code class="lang-auto">btrfs device add /dev/sdXY /
btrfs balance start -dusage=0 /
btrfs balance start -dlimit=5 /
btrfs device remove /dev/sdXY /
</code></pre>
<p>It’s really important once you start the above that you keep the 2nd device you’re adding available for the entire duration until the <code>remove</code> command returns to a prompt. Part of the file system will be temporarily relocated to that 2nd device, so if it goes missing for any reason, the file system will end up broken. I don’t recommend using a ram disk of any kind for this, because should there be a power failure or a reboot needed, the ramdisk contents go away of course and now that part of the file system is simply gone and not recoverable. Whereas with a USB stick or other drive partition, it’ll survive a reboot.</p>
            </div>

              <p>Looks much better now.</p>
<p>I filed the following bug: <a href="https://bugzilla.redhat.com/show_bug.cgi?id=2017895" class="inline-onebox">2017895 – btrfs: 74% used, dnf reports no space left on device</a></p>
<p><code>-dusage=30</code> filter means “only balance data block groups that have up to 30% usage” And I think that’s adequate. Generally speaking you don’t need to balance metadata or system block groups. It might be that it’s balancing the same block group over and over, as it remains just under 30% used, so I would ignore it.</p>
