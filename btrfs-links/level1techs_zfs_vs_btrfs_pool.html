<blockquote>
<p>For a striped mirror setup (I’m guessing the same as a raid 10) would that be that also be beneficial for read/write performance, or would I be mainly getting gains in resiliency?</p>
</blockquote>
</aside>
<p>You get 4x the reads and 2x the writes. If you go with 2x disks in RAID1, you get 2x the read, resiliency and no write increase. If you got with 2x disks in RAID0, you get 2x read and 2x rights. Combine them and you get 4x reads and 2x writes and resiliency.</p>

<p>Would you say ZFS would be applicable for this use case?</p>

</aside>
<p>It’s just a very good file system, nothing else. How you use it matters more. But it does have nice features, like compression, which basically means free storage. Use zstd.</p>
<p>Besides the L2ARC (which is just caching), I am not aware of any option for tiered storage, which would be more useful.</p>
<p>In your config, I would do the spinning rust for data and make a separate pool from the SSDs and place the OS boot vdrives there. Well, I’d be using ZFS, so I’d just make a FS for each, like I already do:</p>
<pre><code class="lang-auto">$ zfs list
NAME                                 USED  AVAIL     REFER  MOUNTPOINT
sgiw                                 144G  8.83T       96K  none
sgiw/kvm                             144G  8.83T       96K  none
zroot                                772G   150G       96K  none

zroot/kvm                            751G   150G       96K  none
zroot/lxd                            960K   150G       96K  legacy
</code></pre>
<p>zroot is my root mirror for my system, on which I put the OS drives and sgiw is my spinning rust. I cut out the cruft from the output, I got like 30 lines, I wanted to keep it short. Under zroot/kvm, I have my OS file systems, under sgiw/kvm, I have their data drives. As you can see, I currently have more stuff on zroot than sgiw, but that’s going to change.</p>

              <p>The metadata special devices is basically the place where things like the file system tree is, so you can do an <code>ls</code> or <code>find</code> or similar commands that involve browsing the pool as if you were on a SSD array. Anything can benefit from it. Sure, you get exponentially more benefit if you have a lot of users that would normally slow the spinning rust down with tons of parallel file lookup, but anyone can benefit from it.</p>

</aside>
<p>This is my suggestion. And do a second RAID1 pool with the 970 evos, use that for OS boot drives and the RAID-10 for data.</p>
<p>No need for L2ARC either, you are not going to benefit much from it.</p>
<p>Dare I say that the L2ARC is more dependent on having tons of users than the special device, caching on a storage with &lt;20 users doesn’t make a big difference, since people will just move to browsing other stuff. And again, I have experience with more underpowered hardware running a lot more crap on them, people nowadays are really overspec-ing their systems. If OP didn’t already have the TR 1920x, I would have recommended he buy a 5600X.</p>

            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/risk'><span itemprop='name'>risk</span></a>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-09-13T05:28:14Z' class='post-time'>
                    September 13, 2022,  5:28am
                  </time>

            <div class='post' itemprop='text'>
              <p>Your mom is really cool <img src="https://forum.level1techs.com/images/emoji/twitter/sunglasses.png?v=12" title=":sunglasses:" class="emoji" alt=":sunglasses:" loading="lazy" width="20" height="20"></p>
<p>Here’s a ZFS recipe:</p>
<p>Partition manually.</p>
<p>Partition the EVOs using GPT.</p>
<p>First partition will be your md mirrored /boot (give it 1G of space before starting next partition, but you may be limited to 512M in size), second partition from 1G+ should use LUKS.<br>
When you’re luks formatting, make sure you pick version 2 of luks and make sure you pick 4k physical sector, round the gpt partition size to 1M size by typing in the size manually.</p>
<p>On the luks partitions on the EVOs, bring up LVM physical volumes - you’ll use this for mirrored ZIL, L2ARC and special metadata device.</p>
<hr>
<p>On spinning rust add a single gpt partition, leave first 10G empty on each drive, round partition size to 1G. put LUKS on with 4K sector size, bring up a pool with a pair of mirror vdevs, use large record sizes, try 16M.</p>
<p>Take some space from each of your EVO PVs for ZIL (16G is fine), make this mirrored.</p>
<p>Take some EVO space for special metadata device (basically for your OS and file directory stuff). e.g. 512G each, make this mirrored.</p>
<p>Take some space for L2ARC, e.g. 256G from each of the EVOs.</p>
<hr>
<p>Because you used LVM on your EVOs you can grow/shrink L2ARC size and grow metadata vdevs as your needs grow.</p>
<p>Because you used LUKS, you can mail your drive to NSA without formatting it once it starts throwing bad blocks or once it starts making weird noises.</p>
<hr>
<p>Before doing any of the formatting on HDDs (not on SSD) run badblocks tool, it’ll take a few days.</p>
<hr>
<p>I wouldn’t mess with ZFS encryption … too new, and how do you unlock disks on boot?</p>
<p>Oh, and do back up the LUKS keys, on a piece of paper somewhere. You can have multiple keys on each volume and one of the keys can be a passphrase. You can unlock all 6 disks on boot using the same passphrase that you type in once… And you can e.g. have a USB flash drive for unlocking maybe if you want to reboot unattended.</p>
<hr>
<p>On your zpool, separate the dataset for bulk storage for movies from backups, from your OS dataset(s).</p>
            </div>

            <div class='post' itemprop='text'>
              <p>From the little testing I’ve done with BTRFS I’ve been a little disappointed with its read performance, especially when more than one thing is doing IO. It’s worth mentioning that ZFS will get improved read performance with a mirror, but BTRFS doesn’t (I think technically it can but only when you have multiple processes doing IO).</p>
<p>With the above said, I do use a BTRFS “RAID1” in my main linux desktop, and it works well enough as a separate storage pool. I’ve also rebuilt it through multiple disks, so it is reliable enough.</p>
<p><a class="mention" href="/u/hulkstern">@Hulkstern</a></p>
<p>For situations like this I think the best way forward is to simply try both options. Setup a ZFS mirror with two drives, and a BTRFS “RAID1” with the other two drives. See which option you prefer. I’d also deploy the new ZFS pool separately to your current root pool, then it’s more portable between systems.</p>
<p>I’ll also mention that using an SSD cache can be very hit and miss, it depends on what you’re using it for. ZFS especially has 3 types of SSD caches that do very specific things. And in generaly RAM will act as a read/write cache and is usually good enough. So another vote for a separate SSD pool.</p>
            </div>
