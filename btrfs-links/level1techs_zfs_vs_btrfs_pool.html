        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_188789&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:3556783,\&quot;username\&quot;:\&quot;Hulkstern\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/hulkstern/{size}/275520_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-12T22:22:41.111Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHello, I’m not terribly experienced posting to forums, so please let me know if I should post this in another section or if I should format this differently.\\u003c/p\\u003e\\n\\u003cp\\u003eAllow me to set the scene.\\u003cbr\\u003e\\nWhile not being busy as a college student, I have been working on a server I like to call TR-Server that I have been pouring my time into recently. Getting into hosting my own web servers and nextcloud instance via Docker, Hosting several Minecraft servers at a time for my friends and family, A super basic plex media server, and other small related tasks like constantly running mcoverviewer to generate maps of my minecraft servers you can view in the browser, and a self-written discord bot or two for my friends. Very general purpose, doing a little bit of everything (as I’m sure I’ll add more).\\u003c/p\\u003e\\n\\u003cp\\u003eMy current Hardware setup is as follows:\\u003cbr\\u003e\\n\\u003cstrong\\u003eOS:\\u003c/strong\\u003e Ubuntu 20.04LTS\\u003cbr\\u003e\\n\\u003cstrong\\u003eCPU:\\u003c/strong\\u003e AMD Threadripper 1920x\\u003cbr\\u003e\\n\\u003cstrong\\u003eRAM:\\u003c/strong\\u003e Corsair Vengence 4x16gb DDR4 2400 Mhz (I think cl14?)\\u003cbr\\u003e\\n\\u003cstrong\\u003eMoBo:\\u003c/strong\\u003e Asrock Fatal1ty X399 Professional Gaming (It’s a terrible name I know)\\u003cbr\\u003e\\n\\u003cstrong\\u003eBoot Disk:\\u003c/strong\\u003e SAMSUNG MZVLB512HAJQ \\u003cem\\u003e(512GB)\\u003c/em\\u003e\\u003cbr\\u003e\\n\\u003cstrong\\u003eData Disk:\\u003c/strong\\u003e INTEL SSDPEKNW010T8 \\u003cem\\u003e(1TB)\\u003c/em\\u003e\\u003cbr\\u003e\\n\\u003cstrong\\u003eGPU:\\u003c/strong\\u003e AMD RX 460 2GB (Just for video out)\\u003c/p\\u003e\\n\\u003cp\\u003eRecently my mother gave me a wonderful birthday gift of:\\u003cbr\\u003e\\n4X ST14000NM001G-2KJ103 (14TB)\\u003cbr\\u003e\\nAnd as a birthday treat for myself I got:\\u003cbr\\u003e\\n2X Samsung 970 EVO Plus (1TB)\\u003c/p\\u003e\\n\\u003cp\\u003eI’m really excited for the things I could do with this hardware, but I don’t want to rush it as I don’t want to deal with the headache of migrating many TB of data when I realize a few weeks down the line I screwed up and should have gone with another setup.\\u003c/p\\u003e\\n\\u003cp\\u003eTo get to the point.\\u003cbr\\u003e\\nI want to add a general storage pool to my server. Essentially, I would like to store all my docker containers, Minecraft servers, CDN files on this storage pool and if possible have it cache commonly accessed files on the SSDs. That way I could, for example, not have to manually move Minecraft servers that are no longer in use, to and from a fast SSD and slower storage array. Considering the large amount of storage space I’d also be interested in the possibility of setting up one or two SMB shares to store some large media (mainly shadowplay recordings) without having to deal with the overhead of Nextcloud.\\u003c/p\\u003e\\n\\u003cp\\u003eMy main issue is that I can’t seem to figure out if I should go with btrfs or if I should stick to ZFS. ZFS seems a lot more mature, and would allow me to make the most of the storage I have with a raidz1 setup. While btrfs seems much more integrated with the Linux kernel and much more flexible in terms of expansion in the long term but not as stable in raid5/6 setups.\\u003c/p\\u003e\\n\\u003cp\\u003eAlso it’s not clear to me if I made the right choice purchasing two Samsung 970 EVO Plus drives (planned on doing mirrored for redundancy on the cache) since most of the utilities around btrfs or zfs seem to either not be able to take advantage of multiple “cache” drives or aren’t intended to work like a traditional cache at all.\\u003c/p\\u003e\\n\\u003cp\\u003eAll and all I’m not sure what I should do.\\u003cbr\\u003e\\nShould I return the Samsung drives and invest in more ram instead?\\u003cbr\\u003e\\nShould I give up on the notion of trying to have my cake and eat it too with this array?\\u003cbr\\u003e\\nShould Valve release half life 3 already?\\u003c/p\\u003e\\n\\u003cp\\u003eThank you for any advice you’d be willing to give.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-12T22:22:41.111Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7439,\&quot;reads\&quot;:133,\&quot;readers_count\&quot;:132,\&quot;score\&quot;:37181.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.level1techs.com/t/looking-for-guidance-on-how-i-should-structure-my-containers-apps/201113\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;Looking for guidance on how I should structure my containers/apps\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:128125,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/1\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null,\&quot;can_vote\&quot;:false},{\&quot;id\&quot;:3556797,\&quot;username\&quot;:\&quot;Dutch_Master\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/dutch_master/{size}/283159_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-12T23:05:36.982Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI don’t see anything in your requirements that mandate the use of either ZFS or BTRFS. You can set up your system traditionally, using JFS or XFS, LVM and/or RAID (1, 5 or 6 is your call), using bcache and bcachefs for the SSD cache, but you’d give up on the slick (almost-fool-proof) GUI of solutions like TrueNAS or Unraid.\\u003c/p\\u003e\\n\\u003cp\\u003eIMO your Mom’s b’day gift would be better suited in a separate NAS, build with low(er) spec hardware. Find yourself an old PC case (PSU included!) with at least 6 HDD bays, a decent AMD 500 series mainboard, a Ryzen 5 4600G (6c/12t) and 2x 8GB of RAM and you’re off. Doesn’t have to look pretty, just be functional \\u003cimg src=\\\&quot;https://forum.level1techs.com/images/emoji/twitter/wink.png?v=12\\\&quot; title=\\\&quot;:wink:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:wink:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-12T23:05:36.982Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:32,\&quot;reads\&quot;:119,\&quot;readers_count\&quot;:118,\&quot;score\&quot;:203.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:128890,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556798,\&quot;username\&quot;:\&quot;Hulkstern\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/hulkstern/{size}/275520_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-12T23:15:12.281Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eAh I forgot to communicate a few details that are pertinent.\\u003c/p\\u003e\\n\\u003cp\\u003eI guess there isn’t a huge compelling reason I wanted to go with zfs or btrfs, I guess I was super interested in the technology (though snapshotting seemed super interesting for when I inevitable cock something up and want to roll back the changes I just made to my docker containers).\\u003c/p\\u003e\\n\\u003cp\\u003eAlso, I’m not so sure about a seperate computer for the storage. This is system actually used to be running unraid before I got frustrated with it and wanted to move back to Debian/Ubuntu. I guess I found the gui too limiting and the native environment too alien to feel comfortable. This was on top of having abysmal CPU performance when running VMs.\\u003cbr\\u003e\\nI’m also a bit space constrained, hence why I seem to have all my eggs in one basket, running everything on one system.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-12T23:15:12.281Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:54,\&quot;reads\&quot;:115,\&quot;readers_count\&quot;:114,\&quot;score\&quot;:293.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:128890,\&quot;username\&quot;:\&quot;Dutch_Master\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/dutch_master/{size}/283159_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:128125,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/3\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556815,\&quot;username\&quot;:\&quot;Cheetobandit\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/cheetobandit/{size}/387588_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T00:35:13.335Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eIt is almost universally agreed upon at this point that there is no point in using BTRFS. Wendell has mentioned in many videos that ZFS simply has far more engineer hours poured into it and this has resulted in a more efficient and reliable filesystem in every regard. Also it is possible to stripe NVMEs for a cache drive, I have never heard of anyone mirroring them. Even if it is possible there is no point. RAID1 is usually employed for redundancy as it only gives a minor read bonus and no write bonus. Stripe offers both and if an L2ARC fails you will never lose data. It is not like a cache metadata drive that will kill the whole pool if it fails or a regular vdev stripe that will lose all data if one drive fails. A striped L2ARC will also provide double the capacity of a mirrored one. And with a 4 drive setup you could implement a RAID-Z1 for a total capacity of 42TB but I would actually recommend a striped mirror. (The RAID-Z equivalent of a RAID10). This will allow you to survive a single drive failure and a 67% chance of surviving a 2 drive failure. While it will cost you 14TB of usable capacity this vdev arrangement will be much faster and slightly more resilient. Keep in mind the ZFS compression will let you get more out of the pool than even that 28TB theoretical limit with basically no processing overhead. If you are using VMs and docker containers with an L2ARC the bottleneck will definitely be your rust drives. Of course up to you what you prefer your fault tolerance and storage capacity to be. Those enterprise drives are known to be very reliable. ZFS has great backup features also so you can ZFS send to a separate location either in the cloud or a different NAS for offsite if you’re that worried about failure. Also a SLOG NVME will speed up a lot of your docker, KVM, and NFS performance since synchronous writes get written to your rust twice without it. Your motherboard has 64 PCI-E lanes so there is room for expansion for whatever you have the physical space for. Kind of ramble-y but those are my suggestions. Last note: if you’re really feeling brave you could actually install root on ZFS but this is very complicated and not for the faint of heart. Just something fun to maybe look into later.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T01:36:32.721Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:46,\&quot;reads\&quot;:108,\&quot;readers_count\&quot;:107,\&quot;score\&quot;:301.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:4,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:126225,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556828,\&quot;username\&quot;:\&quot;Hulkstern\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/hulkstern/{size}/275520_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T01:08:53.381Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group quote-modified\\\&quot; data-username=\\\&quot;Cheetobandit\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/cheetobandit/48/387588_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Cheetobandit:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWhile it will cost you 14TB of usable capacity this vdev arrangement will be much faster. Keep in mind the ZFS compression will let you get more out of the pool than even that 28TB theoretical limit with basically no processing overhead.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eWhile I definitely like the idea of keeping more storage if possible, I’m definitely willing to accept the trade off if I get some better performance out of the pool/ For a striped mirror setup (I’m guessing the same as a raid 10) would that be that also be beneficial for read/write performance, or would I be mainly getting gains in resiliency?\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Cheetobandit\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/cheetobandit/48/387588_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Cheetobandit:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eAlso it is possible to stripe NVMEs for a cache drive, I have never heard of anyone mirroring them. Even if it is possible there is no point\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eAs to the SLOG and L2ARC setup. Could I use both NVME drives striped together for both? Or would it be better to use one drive for L2ARC and one Drive for SLOG?\\u003c/p\\u003e\\n\\u003cp\\u003eAlso, to touch on something \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/dutch_master\\\&quot;\\u003e@Dutch_Master\\u003c/a\\u003e said. Would you say ZFS would be applicable for this use case? I won’t lie I hadn’t put much thought into whether or I should or shouldn’t use ZFS, just that I wanted to.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T01:11:11.705Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:28,\&quot;reads\&quot;:90,\&quot;readers_count\&quot;:89,\&quot;score\&quot;:168.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:128125,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/5\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556834,\&quot;username\&quot;:\&quot;Cheetobandit\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/cheetobandit/{size}/387588_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T01:20:57.169Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Hulkstern\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;188789\\\&quot; data-full=\\\&quot;true\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Hulkstern:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWhile I definitely like the idea of keeping more storage if possible, I’m definitely willing to accept the trade off if I get some better performance out of the pool/ For a striped mirror setup (I’m guessing the same as a raid 10) would that be that also be beneficial for read/write performance, or would I be mainly getting gains in resiliency?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes this will guarantee recovery of a 1 drive failure and a 67% chance of recovery with a 2 drive failure whereas RAIDZ1 only guarantees survival of 1 drive failure period. It will cost you 14TB capacity but will allow for much faster read and write. If you would rather have more space that is a personal call and up to you. Here are some charts to help you make your decision. (RAIDZ1 is the same as RAID5 and RAID10 is the striped mirror)\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://helmundwalter.de/blog/raid5-vs-raid10-performance-benchmark-mdadm/\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eRAID5 vs Raid10 Performance Benchmark MDADM – Helm \\u0026amp; Walter IT-Solutions (helmundwalter.de)\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://www.diffen.com/difference/RAID-5-vs-RAID-10#:~:text=accessible%20during%20recovery.-,Performance,the%20overhead%20of%20calculating%20parity.\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eRAID 5 vs RAID 10 - Difference and Comparison | Diffen\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Hulkstern\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Hulkstern:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eAs to the SLOG and L2ARC setup. Could I use both NVME drives striped together for both? Or would it be better to use one drive for L2ARC and one Drive for SLOG?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIf you lose a SLOG you will lose only the last 5 seconds or so of data. If you were running a high transaction business off the pool this would be an issue and you would need power-loss protection drives in mirrors but any other use case you don’t need that. And any of those drives are very big for SLOGs. You could get away with the smallest NVME you can find or even partition one of yours although that is kind of complicated. SLOGs actually only speed up sync writes anyway so many forget about that part for now altogether.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Hulkstern\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Hulkstern:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eAlso, to touch on something \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/dutch_master\\\&quot;\\u003e@Dutch_Master\\u003c/a\\u003e said. Would you say ZFS would be applicable for this use case? I won’t lie I hadn’t put much thought into whether or I should or shouldn’t use ZFS, just that I wanted to.\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes, I think this sounds like a great use case. You will be getting redundancy, speed bonuses, compression, and most importantly a very valuable learning exercise. ZFS will be with us for a very long time and is absolutely worth learning. You will gain a lot from it both now and in the future. You have a nice system that can really take advantage of it.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T01:35:14.618Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:5,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:49,\&quot;reads\&quot;:85,\&quot;readers_count\&quot;:84,\&quot;score\&quot;:267.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://helmundwalter.de/blog/raid5-vs-raid10-performance-benchmark-mdadm/\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:18},{\&quot;url\&quot;:\&quot;https://www.diffen.com/difference/RAID-5-vs-RAID-10#:~:text=accessible%20during%20recovery.-,Performance,the%20overhead%20of%20calculating%20parity.\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;RAID 5 vs RAID 10 - Difference and Comparison | Diffen\&quot;,\&quot;clicks\&quot;:9}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:126225,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/6\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556846,\&quot;username\&quot;:\&quot;ThatGuyB\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/thatguyb/{size}/512513_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T01:37:18.849Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThe question should be put like this:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eQ: Can you run ZFS?\\u003c/li\\u003e\\n\\u003cli\\u003eA1: Yes\\u003c/li\\u003e\\n\\u003cli\\u003eThen run ZFS\\u003c/li\\u003e\\n\\u003cli\\u003eA2: No\\u003c/li\\u003e\\n\\u003cli\\u003eThen run BTRFS*\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e*Unless you want to run anything above RAID mirror, then run md.\\u003c/p\\u003e\\n\\u003cp\\u003eI never heard a single person besides the not-Linux Linus being happy with Unraid. Most people use it for a while, then drop off from it. Besides people like me, I never heard people complain about Proxmox. Proxmox is a good choice and is more used in the enterprise than unraid. And you can control it via CLI, you’re not limited to the GUI. Ubuntu is fine too, but even less preferable than proxmox (the later is running actual debian).\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eFor the storage, I don’t know how you’d configure your pool, but I agree with Dutch_Master, getting a second PC that runs on peanuts and using that as a NAS would be preferable. I wouldn’t go as far as getting a 6 bay one, just one with 4 bays and 2 or 3 nvme drives should do. You can run TrueNAS Core or Ubuntu on it (or Proxmox).\\u003c/p\\u003e\\n\\u003cp\\u003eAnyway, I would put those 4 drives in stripped mirrors and if your motherboard supports it, up the RAM. Your motherboard has 8 slots, so I would buy another kit of 4 sticks. ZFS can deal with the caching in L1Arc with its RAM.\\u003c/p\\u003e\\n\\u003cp\\u003eI would not make an L2ARC, you are not really going to need that much capacity for caching reads. What I would do if I had the space to add the additional disks, would be to add a metadata special device:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote quote-modified\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;159954\\\&quot;\\u003e\\n  \\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n    \\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/wendell/48/88205_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;quote-title__text-content\\\&quot;\\u003e\\n      \\u003ca href=\\\&quot;https://forum.level1techs.com/t/zfs-metadata-special-device-z/159954\\\&quot;\\u003eZFS Metadata Special Device: Z\\u003c/a\\u003e \\u003ca class=\\\&quot;badge-category__wrapper \\\&quot; href=\\\&quot;/c/l1techs/video-articles/163\\\&quot;\\u003e\\u003cspan data-category-id=\\\&quot;163\\\&quot; style=\\\&quot;--category-badge-color: #36BDC7; --category-badge-text-color: #FFFFFF; --parent-category-badge-color: #36BDC7;\\\&quot; data-parent-category-id=\\\&quot;85\\\&quot; data-drop-close=\\\&quot;true\\\&quot; class=\\\&quot;badge-category --style-square --has-parent\\\&quot; title=\\\&quot;Place for official L1 video-related essays, supplemental threads, and guides.\\\&quot;\\u003e\\u003cspan class=\\\&quot;badge-category__name\\\&quot;\\u003eL1 Articles \\u0026amp; Video-related\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n    \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    \\u003ca name=\\\&quot;introduction-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#introduction-1\\\&quot;\\u003e\\u003c/a\\u003eIntroduction\\nZFS Allocation Classes: It isn’t storage tiers or caching, but gosh darn it, you can really REALLY speed up your zfs pool. \\nFrom the manual: \\nSpecial Allocation Class \\nThe allocations in the special class are dedicated to specific block types. By default this includes all metadata, the indirect blocks of user data, and any deduplicatio…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eThis basically functions like an index for the entirety of the pool, so ZFS doesn’t have to spin the rust to find stuff, it knows each file’s exact locations, so it should improve access times.\\u003c/p\\u003e\\n\\u003cp\\u003eI would not go for a SLOG either. I ran a Samba server on a core 2 duo with 8 GB of RAM on 2x (md) RAID1 pools for 70 people. Later I moved to a Celeron dual core HP ProLiant MicroServer gen8 (because that core 2 duo was running on borrowed time) with the same amount of RAM (only DDR3 this time), with newer drives in RAID10 (still md). Do you think minecraft will really benefit from all the caching and stuff? I highly doubt it, unless you got a few TB of data that are being accessed frequently. I don’t think minecraft can benefit from a large l2arc IMO.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Hulkstern\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Hulkstern:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003estriped mirror setup (I’m guessing the same as a raid 10)\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eCorrect.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Hulkstern\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Hulkstern:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eFor a striped mirror setup (I’m guessing the same as a raid 10) would that be that also be beneficial for read/write performance, or would I be mainly getting gains in resiliency?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYou get 4x the reads and 2x the writes. If you go with 2x disks in RAID1, you get 2x the read, resiliency and no write increase. If you got with 2x disks in RAID0, you get 2x read and 2x rights. Combine them and you get 4x reads and 2x writes and resiliency.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Hulkstern\\\&quot; data-post=\\\&quot;5\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Hulkstern:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eWould you say ZFS would be applicable for this use case?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eIt’s just a very good file system, nothing else. How you use it matters more. But it does have nice features, like compression, which basically means free storage. Use zstd.\\u003c/p\\u003e\\n\\u003cp\\u003eBesides the L2ARC (which is just caching), I am not aware of any option for tiered storage, which would be more useful.\\u003c/p\\u003e\\n\\u003cp\\u003eIn your config, I would do the spinning rust for data and make a separate pool from the SSDs and place the OS boot vdrives there. Well, I’d be using ZFS, so I’d just make a FS for each, like I already do:\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e$ zfs list\\nNAME                                 USED  AVAIL     REFER  MOUNTPOINT\\nsgiw                                 144G  8.83T       96K  none\\nsgiw/kvm                             144G  8.83T       96K  none\\nzroot                                772G   150G       96K  none\\nzroot/ROOT                          19.6G   150G       96K  none\\nzroot/kvm                            751G   150G       96K  none\\nzroot/lxd                            960K   150G       96K  legacy\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003ezroot is my root mirror for my system, on which I put the OS drives and sgiw is my spinning rust. I cut out the cruft from the output, I got like 30 lines, I wanted to keep it short. Under zroot/kvm, I have my OS file systems, under sgiw/kvm, I have their data drives. As you can see, I currently have more stuff on zroot than sgiw, but that’s going to change.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Cheetobandit\\\&quot; data-post=\\\&quot;6\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/cheetobandit/48/387588_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Cheetobandit:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eSLOGs actually only speed up sync writes anyway so many forget about that\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003e^ This. Really no point in having a ZIL.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T01:37:18.849Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:2,\&quot;incoming_link_count\&quot;:107,\&quot;reads\&quot;:82,\&quot;readers_count\&quot;:81,\&quot;score\&quot;:571.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.level1techs.com/t/zfs-metadata-special-device-z/159954\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;ZFS Metadata Special Device: Z\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Reliable\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:119138,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/7\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556850,\&quot;username\&quot;:\&quot;Cheetobandit\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/cheetobandit/{size}/387588_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T01:44:34.453Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;ZFS Metadata Special Device: Z\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;159954\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003ca href=\\\&quot;https://forum.level1techs.com/t/zfs-metadata-special-device-z/159954/1\\\&quot;\\u003eZFS Metadata Special Device: Z\\u003c/a\\u003e\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIntroduction ZFS Allocation Classes\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThat is an excellent write-up by Wendell that I have read many times but I think the last thing this kid needs is a metadata drive. Those are really only useful on large pools with TONS of different files and folders. Usually company-wide NFS shares or something. Definitely not a workstation/homelab for a single user. That will make the entire pool much more fragile as well.\\u003c/p\\u003e\\n\\u003cp\\u003eSorry if we overwhelmed you with all this pedantic jargon. Go without the SLOG and metadata and all that just do RAID-10 with striped L2ARC and start from there is my suggestion.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T01:47:49.811Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:7,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:27,\&quot;reads\&quot;:74,\&quot;readers_count\&quot;:73,\&quot;score\&quot;:169.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:3,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.level1techs.com/t/zfs-metadata-special-device-z/159954\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;ZFS Metadata Special Device: Z\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:119138,\&quot;username\&quot;:\&quot;ThatGuyB\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/thatguyb/{size}/512513_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:126225,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/8\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556856,\&quot;username\&quot;:\&quot;ThatGuyB\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/thatguyb/{size}/512513_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T02:04:08.957Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThe metadata special devices is basically the place where things like the file system tree is, so you can do an \\u003ccode\\u003els\\u003c/code\\u003e or \\u003ccode\\u003efind\\u003c/code\\u003e or similar commands that involve browsing the pool as if you were on a SSD array. Anything can benefit from it. Sure, you get exponentially more benefit if you have a lot of users that would normally slow the spinning rust down with tons of parallel file lookup, but anyone can benefit from it.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;Cheetobandit\\\&quot; data-post=\\\&quot;8\\\&quot; data-topic=\\\&quot;188789\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/cheetobandit/48/387588_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e Cheetobandit:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003ejust do RAID-10\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eThis is my suggestion. And do a second RAID1 pool with the 970 evos, use that for OS boot drives and the RAID-10 for data.\\u003c/p\\u003e\\n\\u003cp\\u003eNo need for L2ARC either, you are not going to benefit much from it.\\u003c/p\\u003e\\n\\u003cp\\u003eDare I say that the L2ARC is more dependent on having tons of users than the special device, caching on a storage with \\u0026lt;20 users doesn’t make a big difference, since people will just move to browsing other stuff. And again, I have experience with more underpowered hardware running a lot more crap on them, people nowadays are really overspec-ing their systems. If OP didn’t already have the TR 1920x, I would have recommended he buy a 5600X.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T02:04:08.957Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:8,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:21,\&quot;reads\&quot;:74,\&quot;readers_count\&quot;:73,\&quot;score\&quot;:124.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Reliable\&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:119138,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/9\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556883,\&quot;username\&quot;:\&quot;risk\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/risk/{size}/40564_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T05:28:14.344Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eYour mom is really cool \\u003cimg src=\\\&quot;https://forum.level1techs.com/images/emoji/twitter/sunglasses.png?v=12\\\&quot; title=\\\&quot;:sunglasses:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:sunglasses:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eHere’s a ZFS recipe:\\u003c/p\\u003e\\n\\u003cp\\u003ePartition manually.\\u003c/p\\u003e\\n\\u003cp\\u003ePartition the EVOs using GPT.\\u003c/p\\u003e\\n\\u003cp\\u003eFirst partition will be your md mirrored /boot (give it 1G of space before starting next partition, but you may be limited to 512M in size), second partition from 1G+ should use LUKS.\\u003cbr\\u003e\\nWhen you’re luks formatting, make sure you pick version 2 of luks and make sure you pick 4k physical sector, round the gpt partition size to 1M size by typing in the size manually.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the luks partitions on the EVOs, bring up LVM physical volumes - you’ll use this for mirrored ZIL, L2ARC and special metadata device.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eOn spinning rust add a single gpt partition, leave first 10G empty on each drive, round partition size to 1G. put LUKS on with 4K sector size, bring up a pool with a pair of mirror vdevs, use large record sizes, try 16M.\\u003c/p\\u003e\\n\\u003cp\\u003eTake some space from each of your EVO PVs for ZIL (16G is fine), make this mirrored.\\u003c/p\\u003e\\n\\u003cp\\u003eTake some EVO space for special metadata device (basically for your OS and file directory stuff). e.g. 512G each, make this mirrored.\\u003c/p\\u003e\\n\\u003cp\\u003eTake some space for L2ARC, e.g. 256G from each of the EVOs.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eBecause you used LVM on your EVOs you can grow/shrink L2ARC size and grow metadata vdevs as your needs grow.\\u003c/p\\u003e\\n\\u003cp\\u003eBecause you used LUKS, you can mail your drive to NSA without formatting it once it starts throwing bad blocks or once it starts making weird noises.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eBefore doing any of the formatting on HDDs (not on SSD) run badblocks tool, it’ll take a few days.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eI wouldn’t mess with ZFS encryption … too new, and how do you unlock disks on boot?\\u003c/p\\u003e\\n\\u003cp\\u003eOh, and do back up the LUKS keys, on a piece of paper somewhere. You can have multiple keys on each volume and one of the keys can be a passphrase. You can unlock all 6 disks on boot using the same passphrase that you type in once… And you can e.g. have a USB flash drive for unlocking maybe if you want to reboot unattended.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eOn your zpool, separate the dataset for bulk storage for movies from backups, from your OS dataset(s).\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:10,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T05:32:32.970Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:9,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:27,\&quot;reads\&quot;:71,\&quot;readers_count\&quot;:70,\&quot;score\&quot;:199.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:119138,\&quot;username\&quot;:\&quot;ThatGuyB\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/thatguyb/{size}/512513_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:107866,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/10\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3556976,\&quot;username\&quot;:\&quot;thro\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/22d042/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-13T13:40:31.895Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI’ll add my “me too” to picking ZFS vs BTRFS.\\u003c/p\\u003e\\n\\u003cp\\u003eMy only suggestion would be to read up on it properly before diving headfirst into it.\\u003c/p\\u003e\\n\\u003cp\\u003eZFS can do amazing stuff. You can also screw your self properly with it if you do stupid things without reading the docs first.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:11,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-13T13:40:31.895Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:8,\&quot;reads\&quot;:62,\&quot;readers_count\&quot;:61,\&quot;score\&quot;:82.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:118612,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/11\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3558147,\&quot;username\&quot;:\&quot;cowphrase\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/c/b77776/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-09-16T05:08:14.687Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eFrom the little testing I’ve done with BTRFS I’ve been a little disappointed with its read performance, especially when more than one thing is doing IO. It’s worth mentioning that ZFS will get improved read performance with a mirror, but BTRFS doesn’t (I think technically it can but only when you have multiple processes doing IO).\\u003c/p\\u003e\\n\\u003cp\\u003eWith the above said, I do use a BTRFS “RAID1” in my main linux desktop, and it works well enough as a separate storage pool. I’ve also rebuilt it through multiple disks, so it is reliable enough.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/hulkstern\\\&quot;\\u003e@Hulkstern\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eFor situations like this I think the best way forward is to simply try both options. Setup a ZFS mirror with two drives, and a BTRFS “RAID1” with the other two drives. See which option you prefer. I’d also deploy the new ZFS pool separately to your current root pool, then it’s more portable between systems.\\u003c/p\\u003e\\n\\u003cp\\u003eI’ll also mention that using an SSD cache can be very hit and miss, it depends on what you’re using it for. ZFS especially has 3 types of SSD caches that do very specific things. And in generaly RAM will act as a read/write cache and is usually good enough. So another vote for a separate SSD pool.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:12,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2022-09-16T05:08:14.687Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:19,\&quot;reads\&quot;:61,\&quot;readers_count\&quot;:60,\&quot;score\&quot;:122.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:188789,\&quot;topic_slug\&quot;:\&quot;torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:135921,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789/12\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3558611,\&quot;username\&quot;:\&quot;thro\&quot;,\&quot;avatar_template\&quot;:\&                 <link itemprop="mainEntityOfPage" href="https://forum.level1techs.com/t/torn-between-zfs-and-btrfs-for-a-new-general-purpose-storage-pool-need-advice/188789">


              <span class="crawler-post-infos">
                  <time  datetime='2022-09-12T22:22:41Z' class='post-time'>
                    September 12, 2022, 10:22pm

              </span>

            <div class='post' itemprop='text'>
              <p>Hello, I’m not terribly experienced posting to forums, so please let me know if I should post this in another section or if I should format this differently.</p>
<p>Allow me to set the scene.<br>
While not being busy as a college student, I have been working on a server I like to call TR-Server that I have been pouring my time into recently. Getting into hosting my own web servers and nextcloud instance via Docker, Hosting several Minecraft servers at a time for my friends and family, A super basic plex media server, and other small related tasks like constantly running mcoverviewer to generate maps of my minecraft servers you can view in the browser, and a self-written discord bot or two for my friends. Very general purpose, doing a little bit of everything (as I’m sure I’ll add more).</p>
<p>My current Hardware setup is as follows:<br>
<strong>OS:</strong> Ubuntu 20.04LTS<br>
<strong>CPU:</strong> AMD Threadripper 1920x<br>
<strong>RAM:</strong> Corsair Vengence 4x16gb DDR4 2400 Mhz (I think cl14?)<br>
<strong>MoBo:</strong> Asrock Fatal1ty X399 Professional Gaming (It’s a terrible name I know)<br>
<strong>Boot Disk:</strong> SAMSUNG MZVLB512HAJQ <em>(512GB)</em><br>
<strong>Data Disk:</strong> INTEL SSDPEKNW010T8 <em>(1TB)</em><br>
<strong>GPU:</strong> AMD RX 460 2GB (Just for video out)</p>
<p>Recently my mother gave me a wonderful birthday gift of:<br>
4X ST14000NM001G-2KJ103 (14TB)<br>
And as a birthday treat for myself I got:<br>
2X Samsung 970 EVO Plus (1TB)</p>
<p>I’m really excited for the things I could do with this hardware, but I don’t want to rush it as I don’t want to deal with the headache of migrating many TB of data when I realize a few weeks down the line I screwed up and should have gone with another setup.</p>
<p>To get to the point.<br>
I want to add a general storage pool to my server. Essentially, I would like to store all my docker containers, Minecraft servers, CDN files on this storage pool and if possible have it cache commonly accessed files on the SSDs. That way I could, for example, not have to manually move Minecraft servers that are no longer in use, to and from a fast SSD and slower storage array. Considering the large amount of storage space I’d also be interested in the possibility of setting up one or two SMB shares to store some large media (mainly shadowplay recordings) without having to deal with the overhead of Nextcloud.</p>
<p>My main issue is that I can’t seem to figure out if I should go with btrfs or if I should stick to ZFS. ZFS seems a lot more mature, and would allow me to make the most of the storage I have with a raidz1 setup. While btrfs seems much more integrated with the Linux kernel and much more flexible in terms of expansion in the long term but not as stable in raid5/6 setups.</p>
<p>Also it’s not clear to me if I made the right choice purchasing two Samsung 970 EVO Plus drives (planned on doing mirrored for redundancy on the cache) since most of the utilities around btrfs or zfs seem to either not be able to take advantage of multiple “cache” drives or aren’t intended to work like a traditional cache at all.</p>
<p>All and all I’m not sure what I should do.<br>
Should I return the Samsung drives and invest in more ram instead?<br>
Should I give up on the notion of trying to have my cake and eat it too with this array?<br>
Should Valve release half life 3 already?</p>
<p>Thank you for any advice you’d be willing to give.</p>
            </div>

          <div id='post_2' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/Dutch_Master'><span itemprop='name'>Dutch_Master</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-09-12T23:05:36Z' class='post-time'>
                    September 12, 2022, 11:05pm
                  </time>
                  <meta itemprop='dateModified' content='2022-09-12T23:05:36Z'>
              <span itemprop='position'>2</span>
              </span>

            <div class='post' itemprop='text'>
              <p>I don’t see anything in your requirements that mandate the use of either ZFS or BTRFS. You can set up your system traditionally, using JFS or XFS, LVM and/or RAID (1, 5 or 6 is your call), using bcache and bcachefs for the SSD cache, but you’d give up on the slick (almost-fool-proof) GUI of solutions like TrueNAS or Unraid.</p>
<p>IMO your Mom’s b’day gift would be better suited in a separate NAS, build with low(er) spec hardware. Find yourself an old PC case (PSU included!) with at least 6 HDD bays, a decent AMD 500 series mainboard, a Ryzen 5 4600G (6c/12t) and 2x 8GB of RAM and you’re off. Doesn’t have to look pretty, just be functional <img src="https://forum.level1techs.com/images/emoji/twitter/wink.png?v=12" title=":wink:" class="emoji" alt=":wink:" loading="lazy" width="20" height="20"></p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>

          </div>
          <div id='post_3' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/Hulkstern'><span itemprop='name'>Hulkstern</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-09-12T23:15:12Z' class='post-time'>
                    September 12, 2022, 11:15pm
                  </time>
                  <meta itemprop='dateModified' content='2022-09-12T23:15:12Z'>
              <span itemprop='position'>3</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Ah I forgot to communicate a few details that are pertinent.</p>
<p>I guess there isn’t a huge compelling reason I wanted to go with zfs or btrfs, I guess I was super interested in the technology (though snapshotting seemed super interesting for when I inevitable cock something up and want to roll back the changes I just made to my docker containers).</p>
<p>Also, I’m not so sure about a seperate computer for the storage. This is system actually used to be running unraid before I got frustrated with it and wanted to move back to Debian/Ubuntu. I guess I found the gui too limiting and the native environment too alien to feel comfortable. This was on top of having abysmal CPU performance when running VMs.<br>
I’m also a bit space constrained, hence why I seem to have all my eggs in one basket, running everything on one system.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="0" />

          <div id='post_4' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/Cheetobandit'><span itemprop='name'>Cheetobandit</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-09-13T00:35:13Z' class='post-time'>
                    September 13, 2022, 12:35am
                  </time>
                  <meta itemprop='dateModified' content='2022-09-13T01:36:32Z'>
              <span itemprop='position'>4</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>It is almost universally agreed upon at this point that there is no point in using BTRFS. Wendell has mentioned in many videos that ZFS simply has far more engineer hours poured into it and this has resulted in a more efficient and reliable filesystem in every regard. Also it is possible to stripe NVMEs for a cache drive, I have never heard of anyone mirroring them. Even if it is possible there is no point. RAID1 is usually employed for redundancy as it only gives a minor read bonus and no write bonus. Stripe offers both and if an L2ARC fails you will never lose data. It is not like a cache metadata drive that will kill the whole pool if it fails or a regular vdev stripe that will lose all data if one drive fails. A striped L2ARC will also provide double the capacity of a mirrored one. And with a 4 drive setup you could implement a RAID-Z1 for a total capacity of 42TB but I would actually recommend a striped mirror. (The RAID-Z equivalent of a RAID10). This will allow you to survive a single drive failure and a 67% chance of surviving a 2 drive failure. While it will cost you 14TB of usable capacity this vdev arrangement will be much faster and slightly more resilient. Keep in mind the ZFS compression will let you get more out of the pool than even that 28TB theoretical limit with basically no processing overhead. If you are using VMs and docker containers with an L2ARC the bottleneck will definitely be your rust drives. Of course up to you what you prefer your fault tolerance and storage capacity to be. Those enterprise drives are known to be very reliable. ZFS has great backup features also so you can ZFS send to a separate location either in the cloud or a different NAS for offsite if you’re that worried about failure. Also a SLOG NVME will speed up a lot of your docker, KVM, and NFS performance since synchronous writes get written to your rust twice without it. Your motherboard has 64 PCI-E lanes so there is room for expansion for whatever you have the physical space for. Kind of ramble-y but those are my suggestions. Last note: if you’re really feeling brave you could actually install root on ZFS but this is very complicated and not for the faint of heart. Just something fun to maybe look into later.</p>
            </div>

          <div id='post_5' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/Hulkstern'><span itemprop='name'>Hulkstern</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-09-13T01:08:53Z' class='post-time'>
                    September 13, 2022,  1:08am
                  </time>
                  <meta itemprop='dateModified' content='2022-09-13T01:11:01Z'>

            <div class='post' itemprop='text'>
              <aside class="quote no-group quote-modified" data-username="Cheetobandit" data-post="4" data-topic="188789">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/cheetobandit/48/387588_2.png" class="avatar"> Cheetobandit:</div>
<blockquote>
<p>While it will cost you 14TB of usable capacity this vdev arrangement will be much faster. Keep in mind the ZFS compression will let you get more out of the pool than even that 28TB theoretical limit with basically no processing overhead.</p>
</blockquote>
</aside>
<p>While I definitely like the idea of keeping more storage if possible, I’m definitely willing to accept the trade off if I get some better performance out of the pool/ For a striped mirror setup (I’m guessing the same as a raid 10) would that be that also be beneficial for read/write performance, or would I be mainly getting gains in resiliency?</p>

              <aside class="quote no-group" data-username="Hulkstern" data-post="5" data-topic="188789" data-full="true">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png" class="avatar"> Hulkstern:</div>
<blockquote>
<p>While I definitely like the idea of keeping more storage if possible, I’m definitely willing to accept the trade off if I get some better performance out of the pool/ For a striped mirror setup (I’m guessing the same as a raid 10) would that be that also be beneficial for read/write performance, or would I be mainly getting gains in resiliency?</p>
</blockquote>
</aside>
<p>Yes this will guarantee recovery of a 1 drive failure and a 67% chance of recovery with a 2 drive failure whereas RAIDZ1 only guarantees survival of 1 drive failure period. It will cost you 14TB capacity but will allow for much faster read and write. If you would rather have more space that is a personal call and up to you. Here are some charts to help you make your decision. (RAIDZ1 is the same as RAID5 and RAID10 is the striped mirror)</p>
<p><a href="https://helmundwalter.de/blog/raid5-vs-raid10-performance-benchmark-mdadm/" rel="noopener nofollow ugc">RAID5 vs Raid10 Performance Benchmark MDADM – Helm &amp; Walter IT-Solutions (helmundwalter.de)</a></p>
<p><a href="https://www.diffen.com/difference/RAID-5-vs-RAID-10#:~:text=accessible%20during%20recovery.-,Performance,the%20overhead%20of%20calculating%20parity." rel="noopener nofollow ugc">RAID 5 vs RAID 10 - Difference and Comparison | Diffen</a></p>
<aside class="quote no-group" data-username="Hulkstern" data-post="5" data-topic="188789">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/hulkstern/48/275520_2.png" class="avatar"> Hulkstern:</div>
<blockquote>
<p>As to the SLOG and L2ARC setup. Could I use both NVME drives striped together for both? Or would it be better to use one drive for L2ARC and one Drive for SLOG?</p>
</blockquote>
</aside>
<p>If you lose a SLOG you will lose only the last 5 seconds or so of data. If you were running a high transaction business off the pool this would be an issue and you would need power-loss protection drives in mirrors but any other use case you don’t need that. And any of those drives are very big for SLOGs. You could get away with the smallest NVME you can find or even partition one of yours although that is kind of complicated. SLOGs actually only speed up sync writes anyway so many forget about that part for now altogether.</p>
<aside class="quote no-group" data-username="Hulkstern" data-post="5" data-topic="188789">

<blockquote>
<p>Also, to touch on something <a class="mention" href="/u/dutch_master">@Dutch_Master</a> said. Would you say ZFS would be applicable for this use case? I won’t lie I hadn’t put much thought into whether or I should or shouldn’t use ZFS, just that I wanted to.</p>
</blockquote>
</aside>
<p>Yes, I think this sounds like a great use case. You will be getting redundancy, speed bonuses, compression, and most importantly a very valuable learning exercise. ZFS will be with us for a very long time and is absolutely worth learning. You will gain a lot from it both now and in the future. You have a nice system that can really take advantage of it.</p>

                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/ThatGuyB'><span itemprop='name'>ThatGuyB</span></a>

              <span class="crawler-post-infos">

              </span>

            <div class='post' itemprop='text'>
              <p>The question should be put like this:</p>
<ul>
<li>Q: Can you run ZFS?</li>
<li>A1: Yes</li>
<li>Then run ZFS</li>
<li>A2: No</li>
<li>Then run BTRFS*</li>
</ul>
<p>*Unless you want to run anything above RAID mirror, then run md.</p>
<p>I never heard a single person besides the not-Linux Linus being happy with Unraid. Most people use it for a while, then drop off from it. Besides people like me, I never heard people complain about Proxmox. Proxmox is a good choice and is more used in the enterprise than unraid. And you can control it via CLI, you’re not limited to the GUI. Ubuntu is fine too, but even less preferable than proxmox (the later is running actual debian).</p>
<hr>
<p>For the storage, I don’t know how you’d configure your pool, but I agree with Dutch_Master, getting a second PC that runs on peanuts and using that as a NAS would be preferable. I wouldn’t go as far as getting a 6 bay one, just one with 4 bays and 2 or 3 nvme drives should do. You can run TrueNAS Core or Ubuntu on it (or Proxmox).</p>
<p>Anyway, I would put those 4 drives in stripped mirrors and if your motherboard supports it, up the RAM. Your motherboard has 8 slots, so I would buy another kit of 4 sticks. ZFS can deal with the caching in L1Arc with its RAM.</p>
<p>I would not make an L2ARC, you are not really going to need that much capacity for caching reads. What I would do if I had the space to add the additional disks, would be to add a metadata special device:</p>
<aside class="quote quote-modified" data-post="1" data-topic="159954">
  <div class="title">
    <div class="quote-controls"></div>
    <img alt="" width="24" height="24" src="https://forum.level1techs.com/user_avatar/forum.level1techs.com/wendell/48/88205_2.png" class="avatar">

    </div>

  <blockquote>
    <a name="introduction-1" class="anchor" href="#introduction-1"></a>Introduction
ZFS Allocation Classes: It isn’t storage tiers or caching, but gosh darn it, you can really REALLY speed up your zfs pool. 
From the manual: 
Special Allocation Class 
The allocations in the special class are dedicated to specific block types. By default this includes all metadata, the indirect blocks of user data, and any deduplicatio…
  </blockquote>
</aside>

<p>This basically functions like an index for the entirety of the pool, so ZFS doesn’t have to spin the rust to find stuff, it knows each file’s exact locations, so it should improve access times.</p>
<p>I would not go for a SLOG either. I ran a Samba server on a core 2 duo with 8 GB of RAM on 2x (md) RAID1 pools for 70 people. Later I moved to a Celeron dual core HP ProLiant MicroServer gen8 (because that core 2 duo was running on borrowed time) with the same amount of RAM (only DDR3 this time), with newer drives in RAID10 (still md). Do you think minecraft will really benefit from all the caching and stuff? I highly doubt it, unless you got a few TB of data that are being accessed frequently. I don’t think minecraft can benefit from a large l2arc IMO.</p>
