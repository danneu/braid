r_avatar/forum.rockstor.com/phillxnet/{size}/15_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2019-04-19T20:05:03.099Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/shocker\\\&quot;\\u003e@shocker\\u003c/a\\u003e Hello again.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shocker\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;5976\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/shocker/48/627_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shocker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eif using different disk sizes will work just fine with BTRFS/Rockstor?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes btrfs can mix and match drive sizes, but it’s efficiency from a drive space usage point of view may vary depending on the btrfs raid level. It works by doing raid at a chunk level, ie a chunk of the drive space, usually 1GB for data, is paired with a chunk on another drive in for example raid1. Thus raid at chunk level and so different sized devices can take part in a raid1 pool as long as they have unallocated space (so appropriately new chunks can be made) or existing raid1 chunks (with free space) active in the pool.\\u003c/p\\u003e\\n\\u003cp\\u003eI can also chip in with a potentially relevant but now fixed in stable Rockstor bug that may affect systems with 27 or more drives: See the referenced issue, originally reported by \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/kingwavy\\\&quot;\\u003e@kingwavy\\u003c/a\\u003e in the following forum thread:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote quote-modified\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;4783\\\&quot;\\u003e\\n  \\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/letter_avatar_proxy/v4/letter/k/7ba0ec/48.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e\\n    \\u003ca href=\\\&quot;https://forum.rockstor.com/t/disk-scan-errors-expected-string-or-buffer/4783\\\&quot;\\u003eDisk Scan errors expected string or buffer\\u003c/a\\u003e \\u003ca class=\\\&quot;badge-category__wrapper \\\&quot; href=\\\&quot;/c/support/21\\\&quot;\\u003e\\u003cspan data-category-id=\\\&quot;21\\\&quot; style=\\\&quot;--category-badge-color: #AB9364; --category-badge-text-color: #FFFFFF;\\\&quot; data-drop-close=\\\&quot;true\\\&quot; class=\\\&quot;badge-category \\\&quot;\\u003e\\u003cspan class=\\\&quot;badge-category__name\\\&quot;\\u003eSupport\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Brief description of the problem\\nCant re-add disks to Rockstor GUI after reinstall. I have 10 disks in a Direct attach storage shelf (Dell MD1220) that will not re-scan into the gui.  Getting the error pasted down below.  I have 10 other disks in the same DAS and they are all fine and detected.  When I do a “btrfs fi list” via cli, the pool shows up with all the correct disks. Just cant get it in the rockstor gui. \\nLabel: ‘SCRATCH’  uuid: a90e6787-1c45-46d6-a2ba-41017a17c1d5 \\nTotal devices 10 FS…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eIssue:\\u003c/p\\u003e\\u003caside class=\\\&quot;onebox githubissue\\\&quot; data-onebox-src=\\\&quot;https://github.com/rockstor/rockstor-core/issues/1925\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot; me=\\\&quot;12:16:25\\\&quot; data-timezone=\\\&quot;UTC\\\&quot;\\u003e12:16PM - 16 Jul 18 UTC\\u003c/span\\u003e\\n        \\u003c/div\\u003e\\n\\n      \\u003cdiv class=\\\&quot;user\\\&quot;\\u003e\\n        \\u003ca href=\\\&quot;https://github.com/phillxnet\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003e\\n          \\u003cimg alt=\\\&quot;phillxnet\\\&quot; src=\\\&quot;https://forum.rockstor.com/uploads/default/original/2X/8/8375db6301c454e02c1ab6c65c0358977ab9ecfb.jpg\\\&quot; class=\\\&quot;onebox-avatar-inline\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot; data-dominant-color=\\\&quot;7D6755\\\&quot;\\u003e\\n          phillxnet\\n        \\u003c/a\\u003e\\n      \\u003c/div\\u003e\\n    \\u003c/div\\u003e\\n\\n    \\u003cdiv class=\\\&quot;labels\\\&quot;\\u003e\\n    \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n\\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-row\\\&quot;\\u003e\\n    \\u003cp class=\\\&quot;github-body-container\\\&quot;\\u003eThanks to forum member kingwavy in the following form thread for highlighting th\\u003cspan class=\\\&quot;show-more-container\\\&quot;\\u003e\\u003ca href=\\\&quot;\\\&quot; rel=\\\&quot;noopener\\\&quot; class=\\\&quot;show-more\\\&quot;\\u003e…\\u003c/a\\u003e\\u003c/span\\u003e\\u003cspan class=\\\&quot;excerpt hidden\\\&quot;\\u003eis bug. On initial inspection of the reported data, drive names of the form sdab, sdac, when the same system has a system drive of the more common sda# type name, are being incorrectly identified as system drives. This is currently thought to be the trigger for an incompatible serial=none response from scan_disks() that is then surfaced by scan_disks() caller _update_disk_state():\\n```\\nFile “/opt/rockstor/src/rockstor/storageadmin/views/disk.py”, line 342, in _update_disk_state\\nif (re.match(‘fake-serial-’, do.serial) is not None) or (\\nFile “/usr/lib64/python2.7/re.py”, line 137, in match\\nreturn _compile(pattern, flags).match(string)\\nTypeError: expected string or buffer\\n```\\nWith kingwavy&#39;s assistance the incorrect labelling of root was identified via debug logging thus:\\n\\n```\\nm = Disk(name=&#39;sdaf&#39;, model=&#39;PERC H710&#39;, serial=&#39;fake-serial-0b606a7b-c7fa-4cf0-9e7a-c8dcc70d4034&#39;, size=976748544, transport=None, vendor=&#39;DELL&#39;, hctl=&#39;0:2:0:0&#39;, type=&#39;disk&#39;, fstype=&#39;btrfs&#39;, label=&#39;SCRATCH&#39;, uuid=&#39;a90e6787-1c45-46d6-a2ba-41017a17c1d5&#39;, parted=False, root=True, partitions={}) \\n\\n[14/May/2018 13:21:21] DEBUG [system.osi:478] disks item = Disk(name=&#39;sdag&#39;, model=None, serial=&#39;fake-serial-2a01338a-d494-40ef-80d9-ba2888bfde5f&#39;, size=976748544, transport=None, vendor=None, hctl=None, type=&#39;disk&#39;, fstype=&#39;btrfs&#39;, label=&#39;SCRATCH&#39;, uuid=&#39;a90e6787-1c45-46d6-a2ba-41017a17c1d5&#39;, parted=False, root=True, partitions={}) \\n\\n[14/May/2018 13:21:21] DEBUG [system.osi:478] disks item = Disk(name=&#39;sdae&#39;, model=None, serial=&#39;fake-serial-288f98c5-e108-4ca4-b1e0-fd4a791e7ea5&#39;, size=234461593, transport=None, vendor=None, hctl=None, type=&#39;disk&#39;, fstype=&#39;btrfs&#39;, label=&#39;INTEL_SSD&#39;, uuid=&#39;a504bf03-0299-4648-8a95-c91aba291de8&#39;, parted=False, root=True, partitions={}) \\n```\\nie multiple additional \\\&quot;root=True\\\&quot; attributions and a suspected consequent erroneous &#39;fake-serial-...&#39; attribution: ie relevant lsblk:\\n\\nNAME=\\\&quot;sdae\\\&quot; MODEL=\\\&quot;INTEL SSDSC2KW24\\\&quot; SERIAL=\\\&quot;CVLT6153072G240CGN\\\&quot; SIZE=\\\&quot;223.6G\\\&quot; TRAN=\\\&quot;sas\\\&quot; VENDOR=\\\&quot;ATA \\\&quot; HCTL=\\\&quot;1:0:17:0\\\&quot; TYPE=\\\&quot;disk\\\&quot; FSTYPE=\\\&quot;btrfs\\\&quot; LABEL=\\\&quot;INTEL_SSD\\\&quot; UUID=\\\&quot;a504bf03-0299-4648-8a95-c91aba291de8\\\&quot;\\n\\nHowever the system drive in this trigger system is still identified correctly:\\n```\\n[14/May/2018 13:21:21] DEBUG [system.osi:478] disks item = Disk(name=&#39;sda3&#39;, model=&#39;PERC H710&#39;, serial=&#39;6848f690e936450018b7c3a11330997b&#39;, size=277558067, transport=None, vendor=&#39;DELL&#39;, hctl=&#39;0:2:0:0&#39;, type=&#39;part&#39;, fstype=&#39;btrfs&#39;, label=&#39;rockstor_rockstor&#39;, uuid=&#39;7f7acdd7-493e-4bb5-b801-b7b7dc289535&#39;, parted=True, root=True, partitions={}) \\n```\\n\\nIt is noteworthy that the &#39;sdab&#39; drive (presumably list order related) is the victim of _update_disk_state() bug with \\\&quot;serial=none\\\&quot;:\\n```\\n[14/May/2018 13:21:21] DEBUG [system.osi:478] disks item = Disk(name=&#39;sdab&#39;, model=None, serial=None, size=976748544, transport=None, vendor=None, hctl=None, type=&#39;disk&#39;, fstype=&#39;btrfs&#39;, label=&#39;SCRATCH&#39;, uuid=&#39;a90e6787-1c45-46d6-a2ba-41017a17c1d5&#39;, parted=False, root=True, partitions={}) \\n```\\nwhen the serial is again plainly available (via default and initial lsblk call):\\n```\\nNAME=\\\&quot;sdab\\\&quot; MODEL=\\\&quot;ST91000640SS  \\\&quot; SERIAL=\\\&quot;5000c50063041947\\\&quot; SIZE=\\\&quot;931.5G\\\&quot; TRAN=\\\&quot;sas\\\&quot; VENDOR=\\\&quot;SEAGATE \\\&quot; HCTL=\\\&quot;1:0:14:0\\\&quot; TYPE=\\\&quot;disk\\\&quot; FSTYPE=\\\&quot;btrfs\\\&quot; LABEL=\\\&quot;SCRATCH\\\&quot; UUID=\\\&quot;a90e6787-1c45-46d6-a2ba-41017a17c1d5\\\&quot;\\n\\n```\\nAlso tangentially relevant is root_disk()&#39;s inflexibility re matching only sda and not sdab type drive names, though this is not currently thought to be a trigger in this issue.\\n\\nPlease reference / update the following forum thread with this issues progress / resolution:\\nhttps://forum.rockstor.com/t/disk-scan-errors-expected-string-or-buffer/4783\\u003c/span\\u003e\\u003c/p\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eand the pull request that fixed it:\\u003c/p\\u003e\\u003caside class=\\\&quot;onebox githubpullrequest\\\&quot; data-onebox-src=\\\&quot;https://github.com/rockstor/rockstor-core/pull/1946\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/1946\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003egithub.com/rockstor/rockstor-core\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;github-row\\\&quot; data-github-private-repo=\\\&quot;false\\\&quot;\\u003e\\n\\n\\n\\n    \\u003cdiv class=\\\&quot;github-icon-container\\\&quot; title=\\\&quot;Pull Request\\\&quot;\\u003e\\n      \\u003csvg width=\\\&quot;60\\\&quot; height=\\\&quot;60\\\&quot; class=\\\&quot;github-icon\\\&quot; viewBox=\\\&quot;0 0 12 16\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cpath fill-rule=\\\&quot;evenodd\\\&quot; d=\\\&quot;M11 11.28V5c-.03-.78-.34-1.47-.94-2.06C9.46 2.35 8.78 2.03 8 2H7V0L4 3l3 3V4h1c.27.02.48.11.69.31.21.2.3.42.31.69v6.28A1.993 1.993 0 0 0 10 15a1.993 1.993 0 0 0 1-3.72zm-1 2.92c-.66 0-1.2-.55-1.2-1.2 0-.65.55-1.2 1.2-1.2.65 0 1.2.55 1.2 1.2 0 .65-.55 1.2-1.2 1.2zM4 3c0-1.11-.89-2-2-2a1.993 1.993 0 0 0-1 3.72v6.56A1.993 1.993 0 0 0 2 15a1.993 1.993 0 0 0 1-3.72V4.72c.59-.34 1-.98 1-1.72zm-.8 10c0 .66-.55 1.2-1.2 1.2-.65 0-1.2-.55-1.2-1.2 0-.65.55-1.2 1.2-1.2.65 0 1.2.55 1.2 1.2zM2 4.2C1.34 4.2.8 3.65.8 3c0-.65.55-1.2 1.2-1.2.65 0 1.2.55 1.2 1.2 0 .65-.55 1.2-1.2 1.2z\\\&quot;\\u003e\\u003c/path\\u003e\\u003c/svg\\u003e\\n    \\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-info-container\\\&quot;\\u003e\\n\\n\\n\\n      \\u003ch4\\u003e\\n        \\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/1946\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003edisk serial=none or fake-serial re sda[a-z] dev names. Fixes #1925\\u003c/a\\u003e\\n      \\u003c/h4\\u003e\\n\\n    \\u003cdiv class=\\\&quot;branches\\\&quot;\\u003e\\n      \\u003ccode\\u003erockstor:master\\u003c/code\\u003e ← \\u003ccode\\u003ephillxnet:1925_disk_serial=none_or_fake-serial_re_sda(a-z)_dev_names\\u003c/code\\u003e\\n    \\u003c/div\\u003e\\n\\n      \\u003cdiv class=\\\&quot;github-info\\\&quot;\\u003e\\n        \\u003cdiv class=\\\&quot;date\\\&quot;\\u003e\\n          opened \\u003cspan class=\\\&quot;discourse-local-date\\\&quot; data-format=\\\&quot;ll\\\&quot; data-date=\\\&quot;2018-07-11\\\&quot; data-time=\\\&quot;18:32:54\\\&quot; data-timezone=\\\&quot;UTC\\\&quot;\\u003e06:32PM - 11 Jul 18 UTC\\u003c/span\\u003e\\n        \\u003c/div\\u003e\\n\\n        \\u003cdiv class=\\\&quot;user\\\&quot;\\u003e\\n          \\u003ca href=\\\&quot;https://github.com/phillxnet\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003e\\n            \\u003cimg alt=\\\&quot;phillxnet\\\&quot; src=\\\&quot;https://forum.rockstor.com/uploads/default/original/2X/8/8375db6301c454e02c1ab6c65c0358977ab9ecfb.jpg\\\&quot; class=\\\&quot;onebox-avatar-inline\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot; data-dominant-color=\\\&quot;7D6755\\\&quot;\\u003e\\n            phillxnet\\n          \\u003c/a\\u003e\\n        \\u003c/div\\u003e\\n\\n        \\u003cdiv class=\\\&quot;lines\\\&quot; title=\\\&quot;1 commits changed 2 files with 1088 additions and 18 deletions\\\&quot;\\u003e\\n          \\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/1946/files\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003e\\n            \\u003cspan class=\\\&quot;added\\\&quot;\\u003e+1088\\u003c/span\\u003e\\n            \\u003cspan class=\\\&quot;removed\\\&quot;\\u003e-18\\u003c/span\\u003e\\n          \\u003c/a\\u003e\\n        \\u003c/div\\u003e\\n      \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n\\u003c/div\\u003e\\n\\n  \\u003cdiv class=\\\&quot;github-row\\\&quot;\\u003e\\n    \\u003cp class=\\\&quot;github-body-container\\\&quot;\\u003eOn systems with 27 or more disks named sd* where the system/root is also install\\u003cspan class=\\\&quot;show-more-container\\\&quot;\\u003e\\u003ca href=\\\&quot;https://github.com/rockstor/rockstor-core/pull/1946\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot; class=\\\&quot;show-more\\\&quot;\\u003e…\\u003c/a\\u003e\\u003c/span\\u003e\\u003cspan class=\\\&quot;excerpt hidden\\\&quot;\\u003eed on sda ie sda3 and where the 27th and subsequent disks are named sdaa, sdab etc and are also btrfs formatted; a regex based serial propagation bug (from base device to partition) in scan_disks() resulted in the first listed (by lsblk) sda[a-z] device receiving a serial=none attribution and the second and all subsequent listed sda[a-z] devices receiving an erroneous fake-serial attribution. All affected devices would also have empty (or incorrectly inherited from sda) model, transport, vendor, and hctl attributions. This resulted in an inability for the system to update the disk state as the abstracted disk info from the corrupt parsing of attached disk state caused an exception: \\\&quot;TypeError: expected string or buffer\\\&quot;.\\n\\nNote that all affected disks (sda[a-z]) were also miss attributed as root=True in the erroneous abstract data produced by scan_disks()\\n\\nSummary\\n\\n1. Add scan_disks() test mode to enable repeatable fake-serial- tests.\\n2. Establish unit tests to reproduce the above issue, as reported (36 disk system) and as a minimum artificial drive subset.\\n3. Establish unit tests to identify current correct behaviour for system disk on LUKS, mdraid, and bios mdraid; as well as btrfs in partition and data disk on bios mdraid behaviour.\\n4. Fix overly broad regex to identify system disk partitions, if any: ie improve system disk partition match mechanism.\\n5. Fix system disk LUKS, mdraid, bios mdraid regressions as a result of (4).\\n6. Address pre-existing TODO: re mdraid info via model info on non system disks; as part of the fix for (5).\\n\\nFixes #1925 \\nand, by way of duplication:\\nFixes #1834 (\\\&quot;disk serial is null\\\&quot;)\\n\\n@schakrava Ready for review.\\n\\nTesting:\\nThe reported issue was reproduced via unit testing based on the reporter&#39;s 36 disk system. An abstract of the minimum drive count thought to be able to reproduce the issue was also produced. Further unit tests were constructed for regression testing during the fix development.\\n```\\n./bin/test --settings=test-settings -v 3 -p test_osi*\\n```\\nwith the relevant scan_disks() related results, post pr, as follows:\\n```\\n...\\ntest_scan_disks_27_plus_disks_regression_issue (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_btrfs_in_partition (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_dell_perk_h710_md1220_36_disks (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_intel_bios_raid_data_disk (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_intel_bios_raid_sys_disk (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_luks_on_bcache (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_luks_sys_disk (system.tests.test_osi.OSITests) ... ok\\ntest_scan_disks_mdraid_sys_disk (system.tests.test_osi.OSITests) ... ok\\n\\n----------------------------------------------------------------------\\nRan 11 tests in 0.020s\\n\\nOK\\n```\\nThe Intel bios raid related unit tests were developed using appropriately configured hardware.\\nAnd all bcache related test data (LUKS on bcache) assumed the udev rules detailed at:\\nhttps://forum.rockstor.com/t/bcache-developers-notes/2762\\n\\nThanks to forum member kingwavy for their cooperation and their contributing the report and the command outputs used to construct the initial unit test reproducer.\\u003c/span\\u003e\\u003c/p\\u003e\\n  \\u003c/div\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eAnd from the pull request we have the following summary of the issue:\\u003c/p\\u003e\\n\\u003cp\\u003e“On systems with 27 or more disks named sd* where the system/root is also installed on sda ie sda3 and where the 27th and subsequent disks are named sdaa, sdab etc and are also btrfs formatted; a regex based serial propagation bug (from base device to partition) in scan_disks() resulted in the first listed (by lsblk) sda[a-z] device receiving a serial=none attribution and the second and all subsequent listed sda[a-z] devices receiving an erroneous fake-serial attribution.”\\u003c/p\\u003e\\n\\u003cp\\u003eThe fix landed in stable channel updates version 3.9.2-31 around July 2018.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shocker\\\&quot; data-post=\\\&quot;1\\\&quot; data-topic=\\\&quot;5976\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/shocker/48/627_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shocker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eIs this safe?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eI would say not really as it’s raid6, but as long as you are using a non parity raid (ie non 5 or 6) then you should be good. I.e. Raid 1 or 10 would be a better choice, but we have quite a few reports of ‘working’ parity raid systems but I’d make sure to have a UPS arrangement and one that has been tested to shut the system down in the even of a power loss. But this of course does not protect the pool from a kernel issue. You will also probably find that you have to disable quotas for reasonable performance, again this is currently a stable channel only feature.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you get this setup done some pics might be nice \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eHope that helps.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2023-04-13T17:51:39.151Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:95,\&quot;reads\&quot;:34,\&quot;readers_count\&quot;:33,\&quot;score\&quot;:491.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:5976,\&quot;topic_slug\&quot;:\&quot;multi-device-btrfs-filesystem-with-disk-of-different-size\&quot;,\&quot;display_username\&quot;:\&quot;Philip Guyton\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/rockstor/rockstor-core/issues/1925\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;disk serial=none or fake-serial re sda[a-z] dev names · Issue #1925 · rockstor/rockstor-core · GitHub\&quot;,\&quot;clicks\&quot;:5},{\&quot;url\&quot;:\&quot;https://github.com/rockstor/rockstor-core/pull/1946\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;disk serial=none or fake-serial re sda[a-z] dev names. Fixes #1925 by phillxnet · Pull Request #1946 · rockstor/rockstor-core · GitHub\&quot;,\&quot;clicks\&quot;:2},{\&quot;url\&quot;:\&quot;https://forum.rockstor.com/t/disk-scan-errors-expected-string-or-buffer/4783\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Disk Scan errors expected string or buffer\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:true,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:1196,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/multi-device-btrfs-filesystem-with-disk-of-different-size/5976/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:17494,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;shocker\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/shocker/{size}/627_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2019-04-19T21:45:35.068Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThank you for this feedback! \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e\\u003cbr\\u003e\\nLet met add some clarity on my existing setup:\\u003cbr\\u003e\\nI’m using rockstor for the latest 4 years without any issues with 15 HDD’s HGST of 8TB each in Raid6 mode. In my setup I already have UPS, Generator, etc and I didn’t had any issue so far \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e\\u003cbr\\u003e\\nAs currently I’m running out of disk space I’m planning to add extra HDD’s as my system handles 60 devices. For now I was planning to add extra 15 HDD’s but with 14 TB as it’s a better deal with price/tb then hdd’s with 8TB. My question is if I expand my existing raid6 with the extra hdd’s that I want to buy it will be stable considering that the new one’s are 14TB instead of existing one’s with 8TB? Or it will be safer to buy the same hard drives of 8TB just to be in the safe side \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e for this system I have no backup nor DRP in place, just trusting the Rockstor environment that will do the job \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2019-04-19T21:45:35.068Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:22,\&quot;reads\&quot;:28,\&quot;readers_count\&quot;:27,\&quot;score\&quot;:115.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:5976,\&quot;topic_slug\&quot;:\&quot;multi-device-btrfs-filesystem-with-disk-of-different-size\&quot;,\&quot;display_username\&quot;:\&quo rum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e but now I’m more confused \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/stuck_out_tongue.png?v=9\\\&quot; title=\\\&quot;:stuck_out_tongue:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:stuck_out_tongue:\\\&quot;\\u003e\\u003cbr\\u003e\\nNot sure if it will be easier to mix HDD’s in the same array or create a new one (I would like to mix). It will be interesting if someone else tried that and can share his experience \\u003cimg src=\\\&quot;https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2019-08-20T16:38:46.230Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:3,\&quot;reads\&quot;:23,\&quot;readers_count\&quot;:22,\&quot;score\&quot;:19.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:5976,\&quot;topic_slug\&quot;:\&quot;multi-device-btrfs-filesystem-with-disk-of-different-size\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1824,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/multi-device-btrfs-filesystem-with-disk-of-different-size/5976/8\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:18490,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Flox\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.rockstor.com/flox/{size}/510_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2019-08-20T16:57:03.883Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHi \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/shocker\\\&quot;\\u003e@shocker\\u003c/a\\u003e,\\u003c/p\\u003e\\n\\u003cp\\u003eI simply wanted to chip in on your question related to quotas:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;shocker\\\&quot; data-post=\\\&quot;4\\\&quot; data-topic=\\\&quot;5976\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/shocker/48/627_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e shocker:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI’m with the stable channel, disabling quotas is a gui feature? Or need to change it in fstab?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eYes, it is a GUI feature, that you can find on the \\u003cem\\u003ePools\\u003c/em\\u003e list page, as well as on each pool’s detail page. You can turn them ON or OFF directly from there. See the screenshots provided by \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/phillxnet\\\&quot;\\u003e@phillxnet\\u003c/a\\u003e in the link below:\\u003c/p\\u003e\\u003caside class=\\\&quot;quote quote-modified\\\&quot; data-post=\\\&quot;2\\\&quot; data-topic=\\\&quot;5950\\\&quot;\\u003e\\n  \\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n    \\u003cimg loading=\\\&quot;lazy\\\&quot; alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.rockstor.com/user_avatar/forum.rockstor.com/phillxnet/48/15_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e\\n    \\u003ca href=\\\&quot;https://forum.rockstor.com/t/painfully-slow-rebalance-raid-conversion/5950/2\\\&quot;\\u003ePainfully slow rebalance/RAID conversion\\u003c/a\\u003e \\u003ca class=\\\&quot;badge-category__wrapper \\\&quot; href=\\\&quot;/c/btrfs-linux-nas-rockstor-matters/14\\\&quot;\\u003e\\u003cspan data-category-id=\\\&quot;14\\\&quot; style=\\\&quot;--category-badge-color: #25AAE2; --category-badge-text-color: #FFFFFF;\\\&quot; data-drop-close=\\\&quot;true\\\&quot; class=\\\&quot;badge-category \\\&quot;\\u003e\\u003cspan class=\\\&quot;badge-category__name\\\&quot;\\u003eBTRFS\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/noggin\\\&quot;\\u003e@Noggin\\u003c/a\\u003e Hello again. \\n\\nPretty much yes, especially the raid 5/6 variants can be extra slow. Also note that the btrfs parity raid levels of 5 and 6 are not generally recommended for production use. Though I expect you know this already. \\nThe main slow down in almost all cases is quotas and if you are running any more recent stable subscription you can disable quotas. But all our current testing variants (now older) will suffer Web-UI breakage if quotas are disabled. Quotas disabled state will rem…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eHope this helps,\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:9,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:14,\&quot;updated_at\&quot;:\&quot;2023-04-13T17:52:37.034Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:16,\&quot;reads\&quot;:23,\&quot;readers_count\&quot;:22,\&quot;score\&quot;:89.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:5976,\&quot;topic_slug\&quot;:\&quot;multi-device-btrfs-filesystem-with-disk-of-different-size\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.rockstor.com/t/painfully-slow-rebalance-raid-conversion/5950/2\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Painfully slow rebalance/RAID conversion\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:true,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:1721,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/multi-device-btrfs-filesystem-with-disk-of-different-size               <p>Hello,<br>
Reading the BTRFS documentation <a href="https://btrfs.wiki.kernel.org/index.php/Using_Btrfs_with_Multiple_Devices#Current_status" rel="nofollow noopener">https://btrfs.wiki.kernel.org/index.php/Using_Btrfs_with_Multiple_Devices#Current_status</a> I’ve understood that this is possible but got confused a little confused <img src="https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9" title=":slight_smile:" class="emoji" alt=":slight_smile:"></p>
<p>If anyone used this scenario can confirm if using different disk sizes will work just fine with BTRFS/Rockstor?</p>
<p>I have 15 HGST 8TB HDD’s with BTRFS Raid6 and I want to add another 15 HGST 14TB HDD’s into the existing BTRFS Raid6 partition. What will be the best approach of doing this? Is this safe?</p>
<p>Thanks</p>

              <p><a class="mention" href="/u/shocker">@shocker</a> Hello again.</p>
<aside class="quote no-group" data-username="shocker" data-post="1" data-topic="5976">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/shocker/48/627_2.png" class="avatar"> shocker:</div>
<blockquote>
<p>if using different disk sizes will work just fine with BTRFS/Rockstor?</p>
</blockquote>
</aside>
<p>Yes btrfs can mix and match drive sizes, but it’s efficiency from a drive space usage point of view may vary depending on the btrfs raid level. It works by doing raid at a chunk level, ie a chunk of the drive space, usually 1GB for data, is paired with a chunk on another drive in for example raid1. Thus raid at chunk level and so different sized devices can take part in a raid1 pool as long as they have unallocated space (so appropriately new chunks can be made) or existing raid1 chunks (with free space) active in the pool.</p>
<p>I can also chip in with a potentially relevant but now fixed in stable Rockstor bug that may affect systems with 27 or more drives: See the referenced issue, originally reported by <a class="mention" href="/u/kingwavy">@kingwavy</a> in the following forum thread:</p>

Label: ‘SCRATCH’  uuid: a90e6787-1c45-46d6-a2ba-41017a17c1d5 
Total devices 10 FS…

    <p class="github-body-container">Thanks to forum member kingwavy in the following form thread for highlighting th<span class="show-more-container"><a href="" rel="noopener" class="show-more">…</a></span><span class="excerpt hidden">is bug. On initial inspection of the reported data, drive names of the form sdab, sdac, when the same system has a system drive of the more common sda# type name, are being incorrectly identified as system drives. This is currently thought to be the trigger for an incompatible serial=none response from scan_disks() that is then surfaced by scan_disks() caller _update_disk_state():
```

return _compile(pattern, flags).match(string)
TypeError: expected string or buffer

    <p class="github-body-container">On systems with 27 or more disks named sd* where the system/root is also install<span class="show-more-container"><a href="https://github.com/rockstor/rockstor-core/pull/1946" target="_blank" rel="noopener" class="show-more">…</a></span><span class="excerpt hidden">ed on sda ie sda3 and where the 27th and subsequent disks are named sdaa, sdab etc and are also btrfs formatted; a regex based serial propagation bug (from base device to partition) in scan_disks() resulted in the first listed (by lsblk) sda[a-z] device receiving a serial=none attribution and the second and all subsequent listed sda[a-z] devices receiving an erroneous fake-serial attribution. All affected devices would also have empty (or incorrectly inherited from sda) model, transport, vendor, and hctl attributions. This resulted in an inability for the system to update the disk state as the abstracted disk info from the corrupt parsing of attached disk state caused an exception: "TypeError: expected string or buffer".

Note that all affected disks (sda[a-z]) were also miss attributed as root=True in the erroneous abstract data produced by scan_disks()

Summary

1. Add scan_disks() test mode to enable repeatable fake-serial- tests.
2. Establish unit tests to reproduce the above issue, as reported (36 disk system) and as a minimum artificial drive subset.
3. Establish unit tests to identify current correct behaviour for system disk on LUKS, mdraid, and bios mdraid; as well as btrfs in partition and data disk on bios mdraid behaviour.
4. Fix overly broad regex to identify system disk partitions, if any: ie improve system disk partition match mechanism.
5. Fix system disk LUKS, mdraid, bios mdraid regressions as a result of (4).
6. Address pre-existing TODO: re mdraid info via model info on non system disks; as part of the fix for (5).

Fixes #1925 
and, by way of duplication:
Fixes #1834 ("disk serial is null")

@schakrava Ready for review.

<p>And from the pull request we have the following summary of the issue:</p>
<p>“On systems with 27 or more disks named sd* where the system/root is also installed on sda ie sda3 and where the 27th and subsequent disks are named sdaa, sdab etc and are also btrfs formatted; a regex based serial propagation bug (from base device to partition) in scan_disks() resulted in the first listed (by lsblk) sda[a-z] device receiving a serial=none attribution and the second and all subsequent listed sda[a-z] devices receiving an erroneous fake-serial attribution.”</p>
<p>The fix landed in stable channel updates version 3.9.2-31 around July 2018.</p>

            <div class='post' itemprop='text'>
              <p>Hi <a class="mention" href="/u/shocker">@shocker</a>,</p>
<p>I simply wanted to chip in on your question related to quotas:</p>
<aside class="quote no-group" data-username="shocker" data-post="4" data-topic="5976">
<div class="title">
<div class="quote-controls"></div>
<img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/shocker/48/627_2.png" class="avatar"> shocker:</div>
<blockquote>
<p>I’m with the stable channel, disabling quotas is a gui feature? Or need to change it in fstab?</p>
</blockquote>
</aside>
<p>Yes, it is a GUI feature, that you can find on the <em>Pools</em> list page, as well as on each pool’s detail page. You can turn them ON or OFF directly from there. See the screenshots provided by <a class="mention" href="/u/phillxnet">@phillxnet</a> in the link below:</p><aside class="quote quote-modified" data-post="2" data-topic="5950">
  <div class="title">
    <div class="quote-controls"></div>
    <img loading="lazy" alt="" width="24" height="24" src="https://forum.rockstor.com/user_avatar/forum.rockstor.com/phillxnet/48/15_2.png" class="avatar">
    <a href="https://forum.rockstor.com/t/painfully-slow-rebalance-raid-conversion/5950/2">Painfully slow rebalance/RAID conversion</a> <a class="badge-category__wrapper " href="/c/btrfs-linux-nas-rockstor-matters/14"><span data-category-id="14" style="--category-badge-color: #25AAE2; --category-badge-text-color: #FFFFFF;" data-drop-close="true" class="badge-category "><span class="badge-category__name">BTRFS</span></span></a>
  </div>
  <blockquote>
    <a class="mention" href="/u/noggin">@Noggin</a> Hello again. 

Pretty much yes, especially the raid 5/6 variants can be extra slow. Also note that the btrfs parity raid levels of 5 and 6 are not generally recommended for production use. Though I expect you know this already. 
The main slow down in almost all cases is quotas and if you are running any more recent stable subscription you can disable quotas. But all our current testing variants (now older) will suffer Web-UI breakage if quotas are disabled. Quotas disabled state will rem…
  </blockquote>
</aside>

<p>Hope this helps,</p>

              <p>Thank you for this! Just disabled quotas! I didn’t had any performance issues till now but if this is a burst, why not? <img src="https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9" title=":slight_smile:" class="emoji" alt=":slight_smile:"> Cheers!</p>

              <span class="crawler-post-infos">

            <div class='post' itemprop='text'>
              <p>Just upgraded my system with new shiny 14TB drives. I have added them to my existing pool with 8TB drivers and everything is working just fine. There is no capacity loss. As of now the filesystem is balancing, after is done I’ll share the performance results.</p>
<p>Cheers</p>

          <div id='post_12' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.rockstor.com/u/shocker'><span itemprop='name'>shocker</span></a>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2019-11-16T19:13:51Z' class='post-time'>
                    November 16, 2019,  7:13pm
                  </time>
                  <meta itemprop='dateModified' content='2019-11-16T19:13:51Z'>
              <span itemprop='position'>12</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Balancing was crazy slow and the filesystem was freezing from time to time.<br>
Even that the quotas are off, I have paused the balance and restarted the server. Seems that balance status has been reseted and I need to start over. Even with balance off I had delays on listing the folders (from time to time a basic “ls” is taking 10 seconds to list the dir). Checking the system I have found that I forgot to change the status for the new drives to no spin down and APM 254. I will start over with the balance now <img src="https://forum.rockstor.com/images/emoji/twitter/slight_smile.png?v=9" title=":slight_smile:" class="emoji" alt=":slight_smile:">v Read is now on ~560 MB/s before the upgrade was at ~900-1000 MB/s but this might be due to my non-balanced system.</p>
<p>As of now drivers with 8/14tb parity looks like this:<br>
size 7.28TiB used 6.12TiB path /dev/sdv<br>
size 12.73TiB used 2.88TiB path /dev/sdb</p>
