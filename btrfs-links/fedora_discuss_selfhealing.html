3eBTRFS as default filesystem was a bad idea\\u003c/a\\u003e\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eOut of curiosity I’d like to ask whether it is currently possible to use the installer for Fedora Workstation to set up this kind of redundant disk configuration with btrfs? Or does that require post-installation command-line magic?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eMaybe.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you want a system that will boot unattended following a device failure, nope. As far as I know, only CoreOS might be able to do this, and that’s because of the EFI System partition.\\u003c/p\\u003e\\n\\u003cp\\u003eWe need one on every member device to boot the system. And we can’t depend on raid1 for it. It needs to be sync’d. There was an idea that CoreOS/bootupd would update multiple ESPs to achieve this functionality. I don’t know the status.\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox githubrepo\\\&quot; data-onebox-src=\\\&quot;https://github.com/coreos/bootupd\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://github.com/coreos/bootupd\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003egithub.com\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cdiv class=\\\&quot;github-row\\\&quot; data-github-private-repo=\\\&quot;false\\\&quot;\\u003e\\n  \\u003cimg width=\\\&quot;690\\\&quot; height=\\\&quot;344\\\&quot; src=\\\&quot;https://us1.discourse-cdn.com/fedoraproject/optimized/3X/2/2/22ef5a5e2dad9477ce01ec8f90ca95bb0c005ad4_2_690x344.png\\\&quot; class=\\\&quot;thumbnail\\\&quot; data-dominant-color=\\\&quot;F3F3F3\\\&quot;\\u003e\\n\\n  \\u003ch3\\u003e\\u003ca href=\\\&quot;https://github.com/coreos/bootupd\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener\\\&quot;\\u003eGitHub - coreos/bootupd: Bootloader updater\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n    \\u003cp\\u003e\\u003cspan class=\\\&quot;github-repo-description\\\&quot;\\u003eBootloader updater\\u003c/span\\u003e\\u003c/p\\u003e\\n\\u003c/div\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eLet’s assume the ESP is synced. And /boot is on ext4 on mdadm raid1, therefore we can still boot.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat’s next? Mounting rootfs.\\u003c/p\\u003e\\n\\u003cp\\u003eWhat we think of as mdadm handling degraded boots is actually not mdadm at all, but dracut. It implements a countdown timer waiting for all member devices to appear (or not) so that there isn’t even an attempted mount of an incomplete array for quite a long time. I think it’s 3 minutes.\\u003c/p\\u003e\\n\\u003cp\\u003eThis dracut code is mdadm specific. Btrfs doesn’t have an equivalent mode of operation like mdadm. It has a \\u003ccode\\u003edegraded\\u003c/code\\u003e mount option instead. It might be true handling degraded btrfs mounts is better suited for systemd than dracut. I’m not sure. In any case, that’s a good chunk of work.\\u003c/p\\u003e\\n\\u003cp\\u003eThere are also missing pieces in Btrfs itself. And it turns out that’s partly why there’s a degraded mount option:  To effectively compel a user/admin to investigate the problem, and deliberately ensure degraded mount is what’s needed - rather than depending on an internal or automated logic. That logic doesn’t presently exist.\\u003c/p\\u003e\\n\\u003cp\\u003eSo if the behavior you want or need is unattended degraded boot, this is already difficult but pretty much a no go with Btrfs at present.\\u003c/p\\u003e\\n\\u003cp\\u003eIf your goal is error detection and correction of all metadata and data, to achieve full self healing. Yes, that exists today and it’s stable using Btrfs raid1, raid1c3, raid1c4, and raid10.\\u003c/p\\u003e\\n\\u003cp\\u003eYou don’t even need to install it with raid1 from the outset, way you can do it after the fact.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ccode\\u003eman btrfs device\\u003c/code\\u003e shows the usage:\\u003cbr\\u003e\\n\\u003ccode\\u003ebtrfs device add [-Kf] \\u0026lt;device\\u0026gt; [\\u0026lt;device\\u0026gt;...] \\u0026lt;path\\u0026gt;\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eWhere \\u003ccode\\u003e\\u0026lt;device\\u0026gt;\\u003c/code\\u003e will be the devfs path to the block device (device and partition) you want to add to the btrfs filesystem mounted at \\u003ccode\\u003e\\u0026lt;path\\u0026gt;\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003cp\\u003ee.g. \\u003ccode\\u003e/dev/sdb1\\u003c/code\\u003e is the unformatted block device I want to add, and the Btrfs is mounted at \\u003ccode\\u003e/\\u003c/code\\u003e\\u003c/p\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-plaintext\\\&quot;\\u003ebtrfs dev add /dev/sdb1 /\\nbtrfs balance start -dconvert=raid1 -mconvert=raid1 /\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThat’s it.\\u003c/p\\u003e\\n\\u003cp\\u003eOK there’s a few more steps that are good ideas. You’d want to check there’s enough unallocated space on drive A to create the new raid1 chunks. You might need to migrate some data chunks from drive A to drive B to make enough space for this. You might prefer to split the conversion, first make metadata redundant and then go back and make the data redundant.\\u003c/p\\u003e\\n\\u003cp\\u003eThere might be device size considerations. If you’re adding a partition of identical size to the first, no problem. That is so simple you can ignore it. However, Btrfs lets you add devices that are smaller or larger. You can do raid1 on three drives of different sizes. It’s useful to understand how the allocation works in order to understand how this is possible and what it means when a device fails. You kinda have to practice disaster recovery. If your first real disaster is unpracticed, it’s possible to panic and make mistakes.\\u003c/p\\u003e\\n\\u003cp\\u003eBtrfs does not do raid like mdadm or LVM or hardware raid. The devices are not mirrored. The block groups are. These are typically 1 GiB in size and are a contiguous group of extents. This is fundamental to Btrfs design. It’s how logical addresses are mapped to physical devices and offsets. It’s how balance works. Including converting between profiles on your live running system.\\u003c/p\\u003e\\n\\u003cp\\u003eApplication requests file blocks on Btrfs. Btrfs looks up the file in file tree which contains its logical address. It looks in the chunk tree to convert logical address to physical:  what device, chunk and offset. File data is read from those blocks on that device.\\u003c/p\\u003e\\n\\u003cp\\u003eOops! A checksum error is detected! So you get some scary messages about this, because it will try more than once. The scary messages will point to a specific device, root (subvolume ID), inode,  offset, and size. What was expected and what was found for the checksum.\\u003c/p\\u003e\\n\\u003cp\\u003eBtrfs then looks at the other physical device and offset for the 2nd copy, verifies checksum, OK it’s good. That good data passes to user space, and that good data overwrites the bad data fixing it up. And we get more scary looking messages indicating whether it was fixed up or all the copes are bad.\\u003c/p\\u003e\\n\\u003cp\\u003eSimilar process works for metadata and data. here are no errors reported to user space at all. Unless all copies are bad, in which case kernel sends EIO to the application for the requested block.\\u003c/p\\u003e\\n\\u003cp\\u003eBad data is never handed over to user space in normal operation.\\u003c/p\\u003e\\n\\u003cp\\u003eSo that’s the gist of self-healing today on Btrfs.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:1,\&quot;updated_at\&quot;:\&quot;2025-08-16T16:03:44.823Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:681,\&quot;reads\&quot;:34,\&quot;readers_count\&quot;:33,\&quot;score\&quot;:3361.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:162343,\&quot;topic_slug\&quot;:\&quot;btrfs-raid1-for-fully-self-healing-usage\&quot;,\&quot;display_username\&quot;:\&quot;Chris Murphy\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://discussion.fedoraproject.org/t/btrfs-as-default-filesystem-was-a-bad-idea/161431/72\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;BTRFS as default filesystem was a bad idea\&quot;,\&quot;clicks\&quot;:20},{\&quot;url\&quot;:\&quot;https://github.com/coreos/bootupd\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;GitHub - coreos/bootupd: Bootloader updater\&quot;,\&quot;clicks\&quot;:5},{\&quot;url\&quot;:\&quot;https://discussion.fedoraproject.org/t/btrfs-as-default-filesystem-was-a-bad-idea/161431/91\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;BTRFS as default filesystem was a bad idea\&quot;,\&quot;clicks\&quot;:7}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:184,\& rious way, you’ve come to the right place! This category is where we collect and organize suggested Common Issues. When they’re in good shape, we publish them to the main \\u003ca class=\\\&quot;hashtag-cooked\\\&quot; href=\\\&quot;/c/ask/common-issues/82\\\&quot; data-type=\\\&quot;category\\\&quot; data-slug=\\\&quot;common-issues\\\&quot; data-id=\\\&quot;82\\\&quot; data-ref=\\\&quot;ask:common-issues\\\&quot;\\u003e\\u003cspan class=\\\&quot;hashtag-icon-placeholder\\\&quot;\\u003e\\u003c/span\\u003eCommon Issues\\u003c/span\\u003e\\u003c/a\\u003e category.\&quot;,\&quot;topic_url\&quot;:\&quot;/t/about-the-proposed-common-issues-category/69491\&quot;,\&quot;read_restricted\&quot;:false,\&quot;permission\&quot;:null,\&quot;parent_category_id\&quot;:82,\&quot;notification_level\&quot;:0,\&quot;topic_template\&quot;:\&quot;\\u003c!--\\nThis is NOT a place to report bugs. If you want to discuss a problem with other Fedora users, select the \\\&quot;Ask Fedora\\\&quot; category (without any subcategory) in the drop-down list above. Or close (discard) this draft and open a new topic in here:\\nhttps://discussion.fedoraproject.org/c/ask\\nIf you want to report a bug to Fedora package maintainers, follow this guide:\\nhttps://docs.fedoraproject.org/en-US/quick-docs/bugzilla-file-a-bug/\\n\\nThis category is for proposing a new Common Issue. Read about Common Issues here:\\nhttps://discussion.fedoraproject.org/t/about-the-common-issues-category/74711\\nand detailed instructions on proposing here:\\nhttps://discussion.fedoraproject.org/t/about-the-proposed-common-issues-category/69491\\n\\nIf you really intend to propose a new Common Issue documenting a problem that&#39;s serious and affects a lot of people, please fill out the template below. Look at other published Common Issues and write your description in the same style:\\nhttps://discussion.fedoraproject.org/c/ask/common-issues/\\n--\\u003e\\n\\n\\u003c!-- Please give the topic a succinct title which describes the issue and which will be easy to search for. Also, attach some meaningful tags. --\\u003e\\n\\nProblem\\n-------\\n\\u003c!-- Describe briefly how the problem appears to a user, in simple terms. Attach screenshots, if it helps to illustrate the issue. --\\u003e\\n\\nCause\\n-----\\n\\u003c!-- If we know what causes the issue, describe that in a few lines, without getting deeply technical. Link to other posts explaining technical details if it seems useful. --\\u003e\\n\\nNot yet known.\\n\\nRelated Issues\\n--------------\\n\\u003c!-- Replace both instances of NNNN with the bugzilla bug ID in the Bugzilla line below. If there are more than one related bug, put each one to a separate line.  Please make sure that there&#39;s always either a RH Bugzilla report or an upstream tracker report (below), because that&#39;s essential to get the problem fixed. --\\u003e\\nBugzilla report: [#NNNN](https://bugzilla.redhat.com/NNNN)\\n\\n\\u003c!-- If there are upstream trackers covering this issue, you could link them here too. You may also want to link to related discussions on Ask Fedora. You can also link to similar problems that are NOT this one. --\\u003e\\n\\n\\nWorkarounds \\u003c!-- When the issue is solved, change this to \\\&quot;Solution\\\&quot;, remove the workaround text, and mark a reply, below, with that solution. --\\u003e\\n-----------\\n\\n\\u003c!-- If there are steps users can take to mitigate the problem, list those here. --\\u003e\\n\\nNone yet.\\n\&quot;,\&quot;has_children\&quot;:false,\&quot;subcategory_count\&quot;:null,\&quot;sort_order\&quot;:\&quot;created\&quot;,\&quot;sort_ascending\&quot;:false,\&quot;show_subcategory_list\&quot;:false,\&quot;num_featured_topics\&quot;:3,\&quot;default_view\&quot;:\&quot;latest\&quot;,\&quot;subcategory_list_style\&quot;:\&quot;rows_with_featured_topics\&quot;,\&quot;default_top_period\&quot;:\&quot;quarterly\&quot;,\&quot;default_list_filter\&quot;:\&quot;all\&quot;,\&quot;minimum_required_tags\&quot;:0,\&quot;                 <link itemprop="mainEntityOfPage" href="https://discussion.fedoraproject.org/t/btrfs-raid1-for-fully-self-healing-usage/162343">

                <link itemprop="image" href="https://us1.discourse-cdn.com/fedoraproject/original/3X/2/2/22ef5a5e2dad9477ce01ec8f90ca95bb0c005ad4.png">

              <span class="crawler-post-infos">
                  <time  datetime='2025-08-15T19:59:51Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>Continuing the discussion from <a href="https://discussion.fedoraproject.org/t/btrfs-as-default-filesystem-was-a-bad-idea/161431/72">BTRFS as default filesystem was a bad idea</a>:</p>
<p><a class="hashtag-cooked" href="/tag/btrfs" data-type="tag" data-slug="btrfs" data-id="870" data-style-type="icon" data-icon="tag"><span class="hashtag-icon-placeholder"><svg class="fa d-icon d-icon-square-full svg-icon svg-node"><use href="#square-full"></use></svg></span><span>btrfs</span></a></p>
<aside class="quote no-group" data-username="mattipulkkinen" data-post="72" data-topic="161431" data-full="true">
<div class="title">
<div class="quote-controls"></div>
<img alt="" width="24" height="24" src="https://avatars.discourse-cdn.com/v4/letter/m/294172/48.png" class="avatar"><a href="https://discussion.fedoraproject.org/t/btrfs-as-default-filesystem-was-a-bad-idea/161431/72">BTRFS as default filesystem was a bad idea</a></div>
<blockquote>
<p>Out of curiosity I’d like to ask whether it is currently possible to use the installer for Fedora Workstation to set up this kind of redundant disk configuration with btrfs? Or does that require post-installation command-line magic?</p>
</blockquote>
</aside>
<p>Maybe.</p>
<p>If you want a system that will boot unattended following a device failure, nope. As far as I know, only CoreOS might be able to do this, and that’s because of the EFI System partition.</p>
<p>We need one on every member device to boot the system. And we can’t depend on raid1 for it. It needs to be sync’d. There was an idea that CoreOS/bootupd would update multiple ESPs to achieve this functionality. I don’t know the status.</p>
<aside class="onebox githubrepo" data-onebox-src="https://github.com/coreos/bootupd">
  <header class="source">

      <a href="https://github.com/coreos/bootupd" target="_blank" rel="noopener">github.com</a>
  </header>

  <article class="onebox-body">
    <div class="github-row" data-github-private-repo="false">
  <img width="690" height="344" src="https://us1.discourse-cdn.com/fedoraproject/optimized/3X/2/2/22ef5a5e2dad9477ce01ec8f90ca95bb0c005ad4_2_690x344.png" class="thumbnail" data-dominant-color="F3F3F3">

  <h3><a href="https://github.com/coreos/bootupd" target="_blank" rel="noopener">GitHub - coreos/bootupd: Bootloader updater</a></h3>

    <p><span class="github-repo-description">Bootloader updater</span></p>
</div>

  </article>

  <div class="onebox-metadata">
    
    
  </div>

  <div style="clear: both"></div>
</aside>

<p>Let’s assume the ESP is synced. And /boot is on ext4 on mdadm raid1, therefore we can still boot.</p>
<p>What’s next? Mounting rootfs.</p>
<p>What we think of as mdadm handling degraded boots is actually not mdadm at all, but dracut. It implements a countdown timer waiting for all member devices to appear (or not) so that there isn’t even an attempted mount of an incomplete array for quite a long time. I think it’s 3 minutes.</p>
<p>This dracut code is mdadm specific. Btrfs doesn’t have an equivalent mode of operation like mdadm. It has a <code>degraded</code> mount option instead. It might be true handling degraded btrfs mounts is better suited for systemd than dracut. I’m not sure. In any case, that’s a good chunk of work.</p>
<p>There are also missing pieces in Btrfs itself. And it turns out that’s partly why there’s a degraded mount option:  To effectively compel a user/admin to investigate the problem, and deliberately ensure degraded mount is what’s needed - rather than depending on an internal or automated logic. That logic doesn’t presently exist.</p>
<p>So if the behavior you want or need is unattended degraded boot, this is already difficult but pretty much a no go with Btrfs at present.</p>
<p>If your goal is error detection and correction of all metadata and data, to achieve full self healing. Yes, that exists today and it’s stable using Btrfs raid1, raid1c3, raid1c4, and raid10.</p>
<p>You don’t even need to install it with raid1 from the outset, way you can do it after the fact.</p>
<p><code>man btrfs device</code> shows the usage:<br>
<code>btrfs device add [-Kf] &lt;device&gt; [&lt;device&gt;...] &lt;path&gt;</code></p>
<p>Where <code>&lt;device&gt;</code> will be the devfs path to the block device (device and partition) you want to add to the btrfs filesystem mounted at <code>&lt;path&gt;</code>.</p>
<p>e.g. <code>/dev/sdb1</code> is the unformatted block device I want to add, and the Btrfs is mounted at <code>/</code></p>
<pre><code class="lang-plaintext">btrfs dev add /dev/sdb1 /
btrfs balance start -dconvert=raid1 -mconvert=raid1 /
</code></pre>
<p>That’s it.</p>
<p>OK there’s a few more steps that are good ideas. You’d want to check there’s enough unallocated space on drive A to create the new raid1 chunks. You might need to migrate some data chunks from drive A to drive B to make enough space for this. You might prefer to split the conversion, first make metadata redundant and then go back and make the data redundant.</p>
<p>There might be device size considerations. If you’re adding a partition of identical size to the first, no problem. That is so simple you can ignore it. However, Btrfs lets you add devices that are smaller or larger. You can do raid1 on three drives of different sizes. It’s useful to understand how the allocation works in order to understand how this is possible and what it means when a device fails. You kinda have to practice disaster recovery. If your first real disaster is unpracticed, it’s possible to panic and make mistakes.</p>
<p>Btrfs does not do raid like mdadm or LVM or hardware raid. The devices are not mirrored. The block groups are. These are typically 1 GiB in size and are a contiguous group of extents. This is fundamental to Btrfs design. It’s how logical addresses are mapped to physical devices and offsets. It’s how balance works. Including converting between profiles on your live running system.</p>
<p>Application requests file blocks on Btrfs. Btrfs looks up the file in file tree which contains its logical address. It looks in the chunk tree to convert logical address to physical:  what device, chunk and offset. File data is read from those blocks on that device.</p>
<p>Oops! A checksum error is detected! So you get some scary messages about this, because it will try more than once. The scary messages will point to a specific device, root (subvolume ID), inode,  offset, and size. What was expected and what was found for the checksum.</p>
<p>Btrfs then looks at the other physical device and offset for the 2nd copy, verifies checksum, OK it’s good. That good data passes to user space, and that good data overwrites the bad data fixing it up. And we get more scary looking messages indicating whether it was fixed up or all the copes are bad.</p>
<p>Similar process works for metadata and data. here are no errors reported to user space at all. Unless all copies are bad, in which case kernel sends EIO to the application for the requested block.</p>
<p>Bad data is never handed over to user space in normal operation.</p>
<p>So that’s the gist of self-healing today on Btrfs.</p>
