        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_204194&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:3735148,\&quot;username\&quot;:\&quot;SomeDudeInAZ\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/somedudeinaz/{size}/516244_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-05T19:44:39.087Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eSince I moved my office back home I’m getting buried in USB drives. And rather than buying more and more usb portable things, I’d rather just set up a server and be done with it. Then I’ll setup offsite backups next\\u003c/p\\u003e\\n\\u003cp\\u003eSo I’m building a \\u003cstrong\\u003ebackup server\\u003c/strong\\u003e. It won’t even be on most of the time. I’ll turn it on, run a backup of the systems I have, and then turn it off. Run a scrub periodically and be done with it. The OS for the server will be on a separate drive than the raid array (no root-on-raid).\\u003c/p\\u003e\\n\\u003cp\\u003eMy initial thought, was slap a copy of debian on it, mdadm raid 5 or 6 and done. But then I was able to snag me some 20TB exos drives; and I’d expect the recovery time (if needed) to take forever…\\u003c/p\\u003e\\n\\u003cp\\u003eTruenas and ZFS just seems like overkill, especially since I won’t actually be working off the nas. But from what I’ve seen, if using zfs, truenas is the best way to do it (rather than install zfs on debian).\\u003c/p\\u003e\\n\\u003cp\\u003eObviously mdadm raid is always an option.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the btrfs side, (and yes I \\u003cem\\u003ecould\\u003c/em\\u003e install btrfs over mdadm, but why? I don’t really see an advantage over ext4) it appears that native raid56 should still be avoided? I’m still kinda fuzzy in understanding what they mean in their docs though. From what I can see the “unstable” stuff mostly applies to “zoned” raid - whatever that is.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://btrfs.readthedocs.io/en/latest/ch-volume-management-intro.html\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehttps://btrfs.readthedocs.io/en/latest/ch-volume-management-intro.html\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\&quot;https://btrfs.readthedocs.io/en/latest/btrfs-man5.html#raid56-status-and-recommended-practices\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003ehttps://btrfs.readthedocs.io/en/latest/btrfs-man5.html#raid56-status-and-recommended-practices\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eYou can see the confusion in that I’m having an issue even formulating a coherent/discrete  question.\\u003c/p\\u003e\\n\\u003cp\\u003eIt \\u003cem\\u003eappears\\u003c/em\\u003e that btrfs is currently best suited for a raid 0, 1, or 10 and zfs for parity style raid 5/6. Am I reading things correctly?\\u003c/p\\u003e\\n\\u003cp\\u003eDepending on what happens in the future I don’t expect shrinking the array. If anything expanding. And it looks like both btrfs and zfs will do that when they are running the raid, rather than mdadm.\\u003c/p\\u003e\\n\\u003cp\\u003eAny other advice/wisdom? Thanks.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-05T19:50:04.203Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7034,\&quot;reads\&quot;:120,\&quot;readers_count\&quot;:119,\&quot;score\&quot;:34959.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot te hole since it’s not hard to compute where the parity block needs to land but IDK.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-06T00:04:47.265Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:104,\&quot;readers_count\&quot;:103,\&quot;score\&quot;:55.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:127456,\&quot;username\&quot;:\&quot;blooper98\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/b/e8c25b/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:127090,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3735261,\&quot;username\&quot;:\&quot;Marten\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/marten/{size}/527260_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-06T00:03:52.711Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eIve used raid 1 with BTRFS for nearly a decade… No complaints…at the moment .\\u003cbr\\u003e\\nTotal devices 5 FS bytes used 15.74TiB\\u003cbr\\u003e\\ndevid    1 size 7.28TiB used 5.08TiB path /dev/sdf\\u003cbr\\u003e\\ndevid    4 size 5.46TiB used 3.43TiB path /dev/sdc\\u003cbr\\u003e\\ndevid    6 size 10.91TiB used 9.23TiB path /dev/sdb\\u003cbr\\u003e\\ndevid    7 size 9.10TiB used 7.51TiB path /dev/sda\\u003cbr\\u003e\\ndevid    8 size 10.91TiB used 9.38TiB path /dev/sde\\u003c/p\\u003e\\n\\u003cp\\u003eEven with random drives.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-06T00:03:52.711Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:14,\&quot;reads\&quot;:99,\&quot;readers_count\&quot;:98,\&quot;score\&quot;:104.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:\&quot;Patrons\&quot;,\&quot;flair_name\&quot;:\&quot;Patrons\&quot;,\&quot;flair_url\&quot;:\&quot;square-check\&quot;,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:\&quot;0cc\&quot;,\&quot;flair_group_id\&quot;:43,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.level1techs.com/t/need-guidance-around-setting-up-drives-with-ability-to-handle-bit-rot-without-needing-a-parity-drive-if-possible/232946/44\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:true,\&quot;title\&quot;:\&quot;Need guidance around setting up drives with ability to handle \\\&quot;bit rot\\\&quot; without needing a parity drive if possible\&quot;,\&quot;clicks\&quot;:2}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:62733,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/5\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3735270,\&quot;username\&quot;:\&quot;aodix\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/aodix/{size}/105676_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-06T00:47:25.836Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI know this is going to sound very vanilla on this site but I just rebuilt my media server like a week ago and went with Proxmox with qty (6) used 6TB HGST drives in RADIZ2 for 24TB of usable space…I then created an SMB share directly from Proxmox and share it to my VMs.  Some folks would pass individual disks or pass an HBA card through to a VM, that would have worked, too, but this was easy for me and gives me some freedom, and the performance losses of SMB are inconsequential for my use case.\\u003cbr\\u003e\\nAs for expansion, I MAY add in another RAIDZ1 array for qty(3) 4TB disks and if I do then I will use MergerFS to combine those two ZFS pools into one virtual pool in Proxmox and then share that MergerFS through SMB. The nice thing there is my clients won’t care - theyll just see that the pool is bigger (or smaller) one day. MergerFS is great.\\u003cbr\\u003e\\nAnyway probably not what you’re looking for but I thought I’d share what worked for me.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-06T00:47:25.836Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:26,\&quot;reads\&quot;:94,\&quot;readers_count\&quot;:93,\&quot;score\&quot;:168.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:115476,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/7\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3735303,\&quot;username\&quot;:\&quot;blooper98\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/b/e8c25b/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-06T02:13:55.334Z\&quot;,\&quot;coo \\&quot;quote-title__text-content\\\&quot;\\u003e\\n      \\u003ca href=\\\&quot;https://forum.level1techs.com/t/small-debian-nas-btrfs-wip/167894\\\&quot;\\u003eSmall Debian NAS [btrfs] [WIP]\\u003c/a\\u003e \\u003ca class=\\\&quot;badge-category__wrapper \\\&quot; href=\\\&quot;/c/wiki/128\\\&quot;\\u003e\\u003cspan data-category-id=\\\&quot;128\\\&quot; style=\\\&quot;--category-badge-color: #AB9364; --category-badge-text-color: #FFFFFF;\\\&quot; data-drop-close=\\\&quot;true\\\&quot; class=\\\&quot;badge-category --style-square \\\&quot; title=\\\&quot;Our Forum Wiki Experiment.\\\&quot;\\u003e\\u003cspan class=\\\&quot;badge-category__name\\\&quot;\\u003eWikis \\u0026amp; How-to Guides\\u003c/span\\u003e\\u003c/span\\u003e\\u003c/a\\u003e\\n    \\u003c/div\\u003e\\n  \\u003c/div\\u003e\\n  \\u003cblockquote\\u003e\\n    Instructions on installing and settings up Debian NAS\\nThese are instructions that can teach you to install a Debian system on a NAS. \\nI’m using Windows Hyper-V for testing this out. If you’re not using Windows, \\nit should be relatively easy to follow along on some other OS. \\nI’ll be installing onto a single disk, using: “password” as the password \\n…\\n  \\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003e… needs some updates, but all the broad strokes stuff should still be fine.\\u003c/p\\u003e\\n\\u003cp\\u003ePractice setting it up in a VM, because why not, … and go from there.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m auto updating in the background both my NAS and my router, that are both based on that setup, they’re on the testing track, and I’m not going to lie, about once a year it won’t reboot and I need to come in with a flash stick and fix something.\\u003c/p\\u003e\\n\\u003cp\\u003eHaven’t lost data with btrfs since .. about 2015 iirc.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eI also have another jumble of very large drives, running mergerfs, snapraid and samba. It’s a very very surprisingly good working setup for lots of media and archival storage and secondary backups. Adding a drive and rebalancing using rsync of all things is a bizarre experience, … but it works.\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cp\\u003eHow many drives do you have?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:12,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-06T18:30:33.013Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:17,\&quot;reads\&quot;:72,\&quot;readers_count\&quot;:71,\&quot;score\&quot;:104.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.level1techs.com/t/small-debian-nas-btrfs-wip/167894\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Small Debian NAS [btrfs] [WIP]\&quot;,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:107866,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/12\&quot;,\&quo ff\&quot;:false,\&quot;user_id\&quot;:62733,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/15\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3735640,\&quot;username\&quot;:\&quot;xradeon\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/xradeon/{size}/267371_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-06T23:59:45.872Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eIn Unraid when you create a “pool” (what used to be the “cache” drive is now just a generic pool since you can create more than one) it will use BTRFS by default, however, you can change it to ZFS if you wish. The normal array drives I think use XFS by default.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:16,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-07T00:00:02.847Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:15,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:58,\&quot;readers_count\&quot;:57,\&quot;score\&quot;:61.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:62733,\&quot;username\&quot;:\&quot;Marten\&quot;,\&quot;name\&quot;:\&quot;Marten B\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/marten/{size}/527260_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:127090,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/16\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3735655,\&quot;username\&quot;:\&quot;quilt\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/q/97f17d/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-07T01:16:20.962Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003caside class=\\\&quot;quote no-group\\\&quot; data-username=\\\&quot;SomeDudeInAZ\\\&quot; data-post=\\\&quot;11\\\&quot; data-topic=\\\&quot;204194\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;title\\\&quot;\\u003e\\n\\u003cdiv class=\\\&quot;quote-controls\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003cimg alt=\\\&quot;\\\&quot; width=\\\&quot;24\\\&quot; height=\\\&quot;24\\\&quot; src=\\\&quot;https://forum.level1techs.com/user_avatar/forum.level1techs.com/somedudeinaz/48/516244_2.png\\\&quot; class=\\\&quot;avatar\\\&quot;\\u003e SomeDudeInAZ:\\u003c/div\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003egiven how it does raid 1 - where apparently things are mirrored on different drives (??) rather than across all of them?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003c/aside\\u003e\\n\\u003cp\\u003eBTRFS RAID 1 simply stores each block twice on different drives. On which drive exactly is kind of random. RAID 10 does the same, while striping across the other drives.\\u003c/p\\u003e\\n\\u003cp\\u003eSo when using RAID 1 on btrfs you don’t have your disks ‚mirrored‘. No two disks have to hold the exact same data. But since each block is guaranteed to be duplicated across two disks you can lose one disk and still be safe.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:17,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-07T01:16:20.962Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:11,\&quot;quote_count\&quot;:1,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:56,\&quot;readers_count\&quot;:55,\&quot;score\&quot;:51.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:140482,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/17\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3736725,\&quot;username\&quot;:\&quot;SomeDudeInAZ\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/somedudeinaz/{size}/516244_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-09T20:00:24.822Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThanks for that, because I was still trying to wrap my head around btrfs raid 1.  Good explaination.\\u003c/p\\u003e\\n\\u003cp\\u003eAs for this project, my grandiose plans have had to change somewhat. Buying the hardware to set up a server and maybe splurging on a few more drives (despite the credit-card interest…) will have to be put on hold.\\u003c/p\\u003e\\n\\u003cp\\u003eOn the plus side, my \\u003cstrong\\u003eshiny new\\u003c/strong\\u003e water heater / water softener / water filter all look really nice and happy in my garage.\\u003c/p\\u003e\\n\\u003cp\\u003eAh, the many joys of home ownership…\\u003c/p\\u003e\\n\\u003cp\\u003eSo the new plan is…\\u003c/p\\u003e\\n\\u003cp\\u003eTake my 4 drives, install them in my desktop (4 sata ports avail) and set them up as btrfs raid 10.\\u003c/p\\u003e\\n\\u003cp\\u003eThen, since I already have one of these:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox allowlistedgeneric\\\&quot; data-onebox-src=\\\&quot;https://oyendigital.com/hard-drives/store/3R5-EB3.html\\\&quot;\\u003e\\n  \\u003cheader class=\\\&quot;source\\\&quot;\\u003e\\n\\n      \\u003ca href=\\\&quot;https://oyendigital.com/hard-drives/store/3R5-EB3.html\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eOyen Digital\\u003c/a\\u003e\\n  \\u003c/header\\u003e\\n\\n  \\u003carticle class=\\\&quot;onebox-body\\\&quot;\\u003e\\n    \\u003cimg src=\\\&quot;https://forum.level1techs.com/uploads/default/optimized/4X/9/e/7/9e7fde06b6117fa149b514c9ee4b687664a5426e_2_550x550.jpeg\\\&quot; class=\\\&quot;thumbnail onebox-avatar\\\&quot; width=\\\&quot;550\\\&quot; height=\\\&quot;550\\\&quot; srcset=\\\&quot;https://forum.level1techs.com/uploads/default/optimized/4X/9/e/7/9e7fde06b6117fa149b514c9ee4b687664a5426e_2_550x550.jpeg, https://forum.level1techs.com/uploads/default/optimized/4X/9/e/7/9e7fde06b6117fa149b514c9ee4b687664a5426e_2_825x825.jpeg 1.5x, https://forum.level1techs.com/uploads/default/optimized/4X/9/e/7/9e7fde06b6117fa149b514c9ee4b687664a5426e_2_1100x1100.jpeg 2x\\\&quot; data-dominant-color=\\\&quot;ACACAD\\\&quot;\\u003e\\n\\n\\u003ch3\\u003e\\u003ca href=\\\&quot;https://oyendigital.com/hard-drives/store/3R5-EB3.html\\\&quot; target=\\\&quot;_blank\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eMobius 5-Bay FW800, eSATA, USB 3.0 RAID System\\u003c/a\\u003e\\u003c/h3\\u003e\\n\\n  \\u003cp\\u003eCheck out the deal on Mobius 5-Bay FW800, eSATA, USB 3.0 RAID System at Oyen Digital\\u003c/p\\u003e\\n\\n  \\u003cp\\u003e\\n    \\u003cspan class=\\\&quot;label1\\\&quot;\\u003ePrice: USD 0\\u003c/span\\u003e\\n  \\u003c/p\\u003e\\n\\n  \\u003c/article\\u003e\\n\\n  \\u003cdiv class=\\\&quot;onebox-metadata\\\&quot;\\u003e\\n    \\n    \\n  \\u003c/div\\u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\\n\\u003cp\\u003eI’ll move them over to there. and can do my future backups that way. Leaving everything on the mobius set up as jbod shouldn’t break anything raid-wise. Hell, in my experience it doesn’t even change the mount points for the drives.\\u003c/p\\u003e\\n\\u003cp\\u003eThis allows me to swap the drives out keeping the “relative safety” of a disconnected system in case of a random powersupply fryup.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-09T20:00:24.822Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:17,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:11,\&quot;reads\&quot;:52,\&quot;readers_count\&quot;:51,\&quot;score\&quot;:65.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://oyendigital.com/hard-drives/store/3R5-EB3.html\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Oyen Digital: Mobius 5-Bay FW800, eSATA, USB 3.0 RAID System\&quot;,\&quot;clicks\&quot;:6}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:140482,\&quot;username\&quot;:\&quot;quilt\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/q/97f17d/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:132630,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/18\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3746872,\&quot;username\&quot;:\&quot;lapsio\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/lapsio/{size}/157890_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-31T06:23:33.813Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eSorry for necrobump but I’d just like to mention that I’m using BTRFS RAID6 since the very first release (kernel 4.6 around 2016 I believe? maybe earlier) and I did loose array only once and it was with old, fatally flawed implementation (I did not loose any data though, it just started flipping to read-only mode and I had to build new one and migrate data). It started as 3 bay RAID5 and then I kept rebalancing it over and over and over again to 14 bay now (14x2TB). Ability of btrfs to freely change RAID profiles and extend RAID is amazing, afaik ZFS only recently added this functionality.\\u003c/p\\u003e\\n\\u003cp\\u003ePerformance is okay, I’m getting around 800 MB/s read over 10G connection to NAS but I’m using LUKS and reading 14 encrypted drives at once is quite taxing, CPU gets hammered pretty hard.\\u003c/p\\u003e\\n\\u003cp\\u003eRAID56 in btrfs is fine. Devs are really careful with wording because there was fatal flaw that could trash your array while doing scrub in old implementation (I believe my lost array was affected by this issue, what’s worse it was unfixable for existing arrays, you had to make new filesystem because there was no in-place disk format data conversion implemented) and not many people use it so they play it very safe. Btrfs really struggles with reputation of unreliable over complicated thing so they really try to focus on stability and raid56 doesn’t help them with that.\\u003c/p\\u003e\\n\\u003cp\\u003eBut I’m using btrfs exclusively everywhere since kernel 3.x back in like 2013 or something and I did not loose any data (though I did loose few filesystem on laptops because back in the early days it really didn’t like kernel panics and dirty shutdowns, now it’s much better tho). I also use btrfs at work on servers that we use in production in big companies as integrators. And it’s fine.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:19,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-31T06:25:41.327Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:24,\&quot;reads\&quot;:51,\&quot;readers_count\&quot;:50,\&quot;score\&quot;:165.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:119246,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:false,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/btrfs-raid-confusion/204194/19\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:3747272,\&quot;username\&quot;:\&quot;twin_savage\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.level1techs.com/twin_savage/{size}/402343_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2023-12-31T22:55:07.494Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eimo BTRFS native Raid 6 is a complete nogo and I would strongly discourage raid 5 use. However BTRFS on top of mdadm 5/6 is serviceable.\\u003cbr\\u003e\\nThese are the main issues currently affecting the reliability of BTRFS raid 5/6 in my eyes:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eBTRFS raid5/6 scrub performance makes it unsafe, taking weeks when it should take \\u0026lt;24 hours because of how it is implemented\\u003c/strong\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003ePower failure or kernel panics will still corrupt metadata if on raid 5/6; supposedly a metadata journal is going to eventually be implemented to help with this issue but it hasn’t been developed yet as I understand\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eBTRFS ENOSPC issues still persist\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eRAID write hole still exists (to be fair mdadm also suffers from this)\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eincorrect dev stats output misleading users to what drives are failing-- I’m not 100% sure this is still an issue with the most recent build\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\&quot;,\&quot;post_number\&quot;:20,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:32,\&quot;updated_at\&quot;:\&quot;2023-12-31T22:55:07.494Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:19,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:15,\&quot;reads\&quot;:46,\&quot;readers_count\&quot;:45,\&quot;score\&quot;:94.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:204194,\&quot;topic_slug\&quot;:\&quot;btrfs-raid-confusion\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://forum.               <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.level1techs.com/u/SomeDudeInAZ'><span itemprop='name'>SomeDudeInAZ</span></a>

                <link itemprop="mainEntityOfPage" href="https://forum.level1techs.com/t/btrfs-raid-confusion/204194">


              <span class="crawler-post-infos">
                  <time  datetime='2023-12-05T19:44:39Z' class='post-time'>
                    December 5, 2023,  7:44pm
                  </time>
                  <meta itemprop='dateModified' content='2023-12-05T19:50:04Z'>
              <span itemprop='position'>1</span>
              </span>

            <div class='post' itemprop='text'>
              <p>Since I moved my office back home I’m getting buried in USB drives. And rather than buying more and more usb portable things, I’d rather just set up a server and be done with it. Then I’ll setup offsite backups next</p>
<p>So I’m building a <strong>backup server</strong>. It won’t even be on most of the time. I’ll turn it on, run a backup of the systems I have, and then turn it off. Run a scrub periodically and be done with it. The OS for the server will be on a separate drive than the raid array (no root-on-raid).</p>
<p>My initial thought, was slap a copy of debian on it, mdadm raid 5 or 6 and done. But then I was able to snag me some 20TB exos drives; and I’d expect the recovery time (if needed) to take forever…</p>
<p>Truenas and ZFS just seems like overkill, especially since I won’t actually be working off the nas. But from what I’ve seen, if using zfs, truenas is the best way to do it (rather than install zfs on debian).</p>
<p>Obviously mdadm raid is always an option.</p>
<p>On the btrfs side, (and yes I <em>could</em> install btrfs over mdadm, but why? I don’t really see an advantage over ext4) it appears that native raid56 should still be avoided? I’m still kinda fuzzy in understanding what they mean in their docs though. From what I can see the “unstable” stuff mostly applies to “zoned” raid - whatever that is.</p>
<p><a href="https://btrfs.readthedocs.io/en/latest/ch-volume-management-intro.html" rel="noopener nofollow ugc">https://btrfs.readthedocs.io/en/latest/ch-volume-management-intro.html</a></p>
<p><a href="https://btrfs.readthedocs.io/en/latest/btrfs-man5.html#raid56-status-and-recommended-practices" rel="noopener nofollow ugc">https://btrfs.readthedocs.io/en/latest/btrfs-man5.html#raid56-status-and-recommended-practices</a></p>
<p>You can see the confusion in that I’m having an issue even formulating a coherent/discrete  question.</p>
<p>It <em>appears</em> that btrfs is currently best suited for a raid 0, 1, or 10 and zfs for parity style raid 5/6. Am I reading things correctly?</p>
<p>Depending on what happens in the future I don’t expect shrinking the array. If anything expanding. And it looks like both btrfs and zfs will do that when they are running the raid, rather than mdadm.</p>
<p>Any other advice/wisdom? Thanks.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>btrfs is great but <a href="https://btrfs.readthedocs.io/en/latest/btrfs-man5.html#raid56-status-and-recommended-practices" rel="noopener nofollow ugc">“The RAID56 … <strong>should not be used in production, only for evaluation or testing</strong>.”</a></p>
<p>Truenas is probably perfect for you but also consider</p>
<ul>
<li><a href="https://www.openmediavault.org/" rel="noopener nofollow ugc">Open media vault</a></li>
<li><a href="https://ansible-nas.io/" rel="noopener nofollow ugc">ansible nas</a></li>
<li><a href="https://perfectmediaserver.com/" rel="noopener nofollow ugc">perfect media server</a></li>
<li>hardware vendor like synology, qnap, terramaster</li>
<li>proprietary software like unraid</li>
</ul>

              <p>I know this is going to sound very vanilla on this site but I just rebuilt my media server like a week ago and went with Proxmox with qty (6) used 6TB HGST drives in RADIZ2 for 24TB of usable space…I then created an SMB share directly from Proxmox and share it to my VMs.  Some folks would pass individual disks or pass an HBA card through to a VM, that would have worked, too, but this was easy for me and gives me some freedom, and the performance losses of SMB are inconsequential for my use case.<br>
As for expansion, I MAY add in another RAIDZ1 array for qty(3) 4TB disks and if I do then I will use MergerFS to combine those two ZFS pools into one virtual pool in Proxmox and then share that MergerFS through SMB. The nice thing there is my clients won’t care - theyll just see that the pool is bigger (or smaller) one day. MergerFS is great.<br>
Anyway probably not what you’re looking for but I thought I’d share what worked for me.</p>

<blockquote>
<p>given how it does raid 1 - where apparently things are mirrored on different drives (??) rather than across all of them?</p>

</aside>
<p>BTRFS RAID 1 simply stores each block twice on different drives. On which drive exactly is kind of random. RAID 10 does the same, while striping across the other drives.</p>
<p>So when using RAID 1 on btrfs you don’t have your disks ‚mirrored‘. No two disks have to hold the exact same data. But since each block is guaranteed to be duplicated across two disks you can lose one disk and still be safe.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>Sorry for necrobump but I’d just like to mention that I’m using BTRFS RAID6 since the very first release (kernel 4.6 around 2016 I believe? maybe earlier) and I did loose array only once and it was with old, fatally flawed implementation (I did not loose any data though, it just started flipping to read-only mode and I had to build new one and migrate data). It started as 3 bay RAID5 and then I kept rebalancing it over and over and over again to 14 bay now (14x2TB). Ability of btrfs to freely change RAID profiles and extend RAID is amazing, afaik ZFS only recently added this functionality.</p>
<p>Performance is okay, I’m getting around 800 MB/s read over 10G connection to NAS but I’m using LUKS and reading 14 encrypted drives at once is quite taxing, CPU gets hammered pretty hard.</p>
<p>RAID56 in btrfs is fine. Devs are really careful with wording because there was fatal flaw that could trash your array while doing scrub in old implementation (I believe my lost array was affected by this issue, what’s worse it was unfixable for existing arrays, you had to make new filesystem because there was no in-place disk format data conversion implemented) and not many people use it so they play it very safe. Btrfs really struggles with reputation of unreliable over complicated thing so they really try to focus on stability and raid56 doesn’t help them with that.</p>
<p>But I’m using btrfs exclusively everywhere since kernel 3.x back in like 2013 or something and I did not loose any data (though I did loose few filesystem on laptops because back in the early days it really didn’t like kernel panics and dirty shutdowns, now it’s much better tho). I also use btrfs at work on servers that we use in production in big companies as integrators. And it’s fine.</p>
            </div>

            <div class='post' itemprop='text'>
              <p>imo BTRFS native Raid 6 is a complete nogo and I would strongly discourage raid 5 use. However BTRFS on top of mdadm 5/6 is serviceable.<br>
These are the main issues currently affecting the reliability of BTRFS raid 5/6 in my eyes:</p>
<ul>
<li>
<p><strong>BTRFS raid5/6 scrub performance makes it unsafe, taking weeks when it should take &lt;24 hours because of how it is implemented</strong></p>
</li>
<li>
<p>Power failure or kernel panics will still corrupt metadata if on raid 5/6; supposedly a metadata journal is going to eventually be implemented to help with this issue but it hasn’t been developed yet as I understand</p>
</li>
<li>
<p>BTRFS ENOSPC issues still persist</p>
</li>
<li>
<p>RAID write hole still exists (to be fair mdadm also suffers from this)</p>
</li>
<li>
<p>incorrect dev stats output misleading users to what drives are failing-- I’m not 100% sure this is still an issue with the most recent build</p>
</li>
</ul>
